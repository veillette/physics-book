<title id="title">Relativistic momentum versus speed</title>
<desc id="desc">Relativistic momentum p_rel = γmu versus speed u from 0 to the speed of light c. The momentum stays small at low speeds, rises steeply above about 0.8c, and grows without limit as u approaches c, shown by a dashed vertical line.</desc>
