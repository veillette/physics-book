<title id="title">Range of a projectile on level ground</title>
<desc id="desc">(a) At 45°, launch speeds of 30, 40 and 50 m/s give ranges of 91.8 m, 163 m and 255 m. (b) At 50 m/s, launch angles of 15° and 75° both give a range of 128 m, and 45° gives the maximum range of 255 m.</desc>
