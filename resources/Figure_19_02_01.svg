<svg xmlns="http://www.w3.org/2000/svg" width="470" height="800" viewBox="0 0 470 800" role="img" aria-labelledby="title desc">
<title id="title">Uniform field between parallel conducting plates</title>
<desc id="desc">Two vertical plates a distance d apart. Plate A on the left is positive and plate B on the right is negative, with potential difference ΔV = V_AB between them. Evenly spaced field lines E run straight from A to B and bow outward at the top and bottom ends. A charge q moved from A to B has work W = qV_AB done on it by the field, and the field strength is E = V_AB/d.</desc>
