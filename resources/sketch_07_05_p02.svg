<text x="250" y="90.25" font-family="'Times New Roman', Times, serif" font-size="15" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="italic">b</tspan><tspan font-style="normal">)  </tspan><tspan font-style="italic">h</tspan><tspan font-style="normal"> = 22.0 </tspan><tspan font-style="normal">m</tspan></text>
