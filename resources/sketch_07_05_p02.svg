<line x1="380" y1="142.75" x2="530" y2="142.75" stroke="#8d6e63" stroke-width="2.2"/>
<path d="M 194 250 A 44 44 0 0 0 189.88 231.4" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="round"/>
