<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the car coasting up the hill</title>
<desc id="desc">A hill rises at 2.5° (drawn steeper for clarity). A vertical +y axis (up) has y = 0 at the starting point. A tilted +x axis points up the hill, the direction of motion. The car starts with v_i = 110 km/h = 30.6 m/s and coasts until it stops (v = 0) at height h: 47.6 m without friction (a), 22.0 m in reality (b), after d = 504 m along the slope. Friction f points down the slope (−x).</desc>
