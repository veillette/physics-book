<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img" aria-labelledby="title desc">
<title id="title">The middle ear’s lever system</title>
<desc id="desc">Pressure P1 on the eardrum, of area A1, produces a force F1 = P1A1 on the hammer. The hammer, anvil and stirrup act as a lever pivoted at the top and at the joint between the anvil and the stirrup, so the force F2 delivered by the stirrup to the oval window is larger than F1. The oval window’s area A2 is much smaller than the eardrum’s, so the pressure it creates in the inner ear, P2 = F2/A2, is larger than P1: since F2 &gt; F1 and A2 &lt; A1, P2 &gt; P1.</desc>
