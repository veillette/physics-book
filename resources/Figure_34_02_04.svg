<svg xmlns="http://www.w3.org/2000/svg" width="875" height="415" viewBox="0 0 875 415" role="img" aria-labelledby="title desc">
<title id="title">Black hole with an accretion disk</title>
<desc id="desc">A black hole pulls matter from a companion star. The matter spirals in through a hot accretion disk around the hole, where it emits X-rays, and some is ejected in two narrow jets along the disk’s axis.</desc>
