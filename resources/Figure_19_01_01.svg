<svg xmlns="http://www.w3.org/2000/svg" width="700" height="770" viewBox="0 0 700 770" role="img" aria-labelledby="title desc">
<title id="title">A charge accelerated by an electric field, compared with a mass rolling downhill</title>
<desc id="desc">Top: a positive charge +q starts at point A near a positively charged plate on the left and is pushed by the uniform field, drawn as blue field lines running right, toward point B at a hole in the negatively charged plate on the right. The electric potential energy it loses becomes kinetic energy: ΔPE_elec = ΔKE. Bottom: a mass m rolling down a grassy slope converts gravitational potential energy to kinetic energy in the same way: ΔPE_grav = ΔKE.</desc>
