<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-labelledby="title desc">
<title id="title">Vector diagram of the forces on the head</title>
<desc id="desc">Axes with +x to the right (toward the face) and +y up. All three forces act through the center of mass: the weight W = 50 N along −y; the muscle force F_M = 60 N at 33° below +x; and the unknown vertebral force F_V, up and to the left at an unknown angle θ above the −x axis.</desc>
<rect width="560" height="320" fill="#ffffff"/>
<line x1="60" y1="170" x2="391" y2="170" stroke="#555555" stroke-width="1.5"/>
<polygon points="400,170 390,174 390,166" fill="#555555"/>
<text x="416" y="175.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="416" y="191.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">toward</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">the</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">face</tspan><tspan font-style="normal">)</tspan></text>
<line x1="230" y1="300" x2="230" y2="49" stroke="#555555" stroke-width="1.5"/>
<polygon points="230,40 234,50 226,50" fill="#555555"/>
<text x="230" y="29.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="244" y="28.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">up</tspan><tspan font-style="normal">)</tspan></text>
<line x1="230" y1="170" x2="230" y2="238.4" stroke="#b03a2e" stroke-width="3"/>
<polygon points="230,250 224.96,237.4 235.04,237.4" fill="#b03a2e"/>
<text x="230" y="270.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">W</tspan><tspan font-style="normal"> = 50 </tspan><tspan font-style="normal">N</tspan></text>
<line x1="230" y1="170" x2="312.53" y2="223.59" stroke="#b03a2e" stroke-width="3"/>
<polygon points="322.25,229.91 308.94,227.27 314.43,218.82" fill="#b03a2e"/>
<text x="333.16" y="243.68" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">M</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 60 </tspan><tspan font-style="normal">N</tspan></text>
<line x1="230" y1="170" x2="167.57" y2="67.33" stroke="#c0675e" stroke-width="2.2" stroke-dasharray="6 4"/>
<polygon points="162.46,58.92 171.8,65.93 164.39,70.44" fill="#c0675e"/>
<text x="155.71" y="51" font-family="'Times New Roman', Times, serif" font-size="14" fill="#c0675e" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-size="9.8" dy="3.92"><tspan font-style="normal">V</tspan></tspan><tspan dy="-3.92">​</tspan><tspan font-style="normal"> = ?</tspan></text>
<circle cx="230" cy="170" r="6" fill="#1f3a5f"/>
<path d="M 275.29 199.41 A 54 54 0 0 0 284 170" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="round"/>
<text x="300.95" y="196.27" font-family="'Times New Roman', Times, serif" font-size="15" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">33°</tspan></text>
<path d="M 207.14 132.4 A 44 44 0 0 0 186 170" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="round"/>
<text x="177.7" y="145.84" font-family="'Times New Roman', Times, serif" font-size="15" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">θ</tspan></text>
</svg>
