<rect x="195" y="285" width="48" height="83" rx="8" fill="#8b959d" stroke="#56616b" stroke-width="2"/>
<rect x="70" y="363" width="300" height="16" rx="6" fill="#c7ced3" stroke="#56616b" stroke-width="2"/>
<rect x="72" y="355" width="65" height="32" rx="8" fill="#dcb878" stroke="#a7803d" stroke-width="2"/>
<circle cx="220" cy="205" r="119" fill="#c7ced3" stroke="#56616b" stroke-width="2.5"/>
<circle cx="220" cy="205" r="105" fill="#edf2df" stroke="#7d8c65" stroke-width="2"/>
<circle cx="220" cy="205" r="97" fill="none" stroke="#a6b58a" stroke-width="1.5"/>
<circle cx="220" cy="205" r="89" fill="none" stroke="#a6b58a" stroke-width="1.5"/>
<circle cx="220" cy="205" r="81" fill="none" stroke="#a6b58a" stroke-width="1.5"/>
<line x1="220" y1="205" x2="150" y2="244" stroke="#56616b" stroke-width="12" stroke-linecap="round"/>
<ellipse cx="150" cy="244" rx="13" ry="22" fill="#dcb878" stroke="#a7803d" stroke-width="2"/>
<circle cx="220" cy="205" r="17" fill="#8b959d" stroke="#56616b" stroke-width="2"/>
<g id="reel-radius">
<line x1="220" y1="205" x2="299.46" y2="149.36" stroke="#333333" stroke-width="2"/>
<polygon points="306.01,144.77 300.7,152.89 296.57,146.99" fill="#333333"/>
<text x="286" y="231.4" font-family="'Times New Roman', Times, serif" font-size="24" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">r</tspan><tspan font-style="normal"> = 4.5 </tspan><tspan font-style="normal">cm</tspan></text>
</g>
<g id="reel-rotation">
<path d="M 338.78 288.17 A 145 145 0 0 0 240.18 61.41" fill="none" stroke="#1f77c8" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="250.43" y1="63.23" x2="241.54" y2="61.89" stroke="#1f77c8" stroke-width="2.5"/>
<polygon points="232.64,60.55 243.12,58.08 241.93,66" fill="#1f77c8"/>
</g>
<text x="85" y="63.05" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Reel</tspan></text>
<path d="M 114 62 Q 114.1 95.1 132.16 113.95" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="130.77" y1="112.5" x2="133.96" y2="115.82" stroke="#333333" stroke-width="1.2"/>
<polygon points="137,119 131.7,116.6 134.82,113.61" fill="#333333"/>
<text x="510" y="83.05" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Rotational</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">quantities</tspan></text>
<text x="510" y="120.15" font-family="'Times New Roman', Times, serif" font-size="29" fill="#1f77c8" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">θ</tspan><tspan font-style="normal">, </tspan><tspan font-style="italic">ω</tspan><tspan font-style="normal">, </tspan><tspan font-style="italic">α</tspan></text>
<path d="M 410 120 Q 373.4 141.9 363.87 176.25" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="364.41" y1="174.33" x2="363.18" y2="178.76" stroke="#333333" stroke-width="1.2"/>
<polygon points="362,183 361.36,177.22 365.52,178.37" fill="#333333"/>
<text x="510" y="192.35" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1f77c8" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Counterclockwise</tspan></text>
