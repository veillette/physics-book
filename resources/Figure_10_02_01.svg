<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">Fishing line unwinding from a rotating reel</title>
<desc id="desc">A fishing reel rotates counterclockwise, unwinding line tangentially to the right from a radius r = 4.5 cm. Rotational quantities θ, ω, α describe the reel; linear quantities x, v, a describe the fishing line. The line speed is v = rω.</desc>
