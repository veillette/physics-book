<path d="M 548 270 Q 563.5 287.9 557.51 303.47" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="558.23" y1="301.6" x2="556.58" y2="305.89" stroke="#333333" stroke-width="1.2"/>
<polygon points="555,310 554.92,304.18 558.95,305.74" fill="#333333"/>
<g id="line-motion">
<line x1="425" y1="350" x2="647.3" y2="350" stroke="#5e9e1e" stroke-width="3.5"/>
<polygon points="660,350 646.3,355.48 646.3,344.52" fill="#5e9e1e"/>
</g>
<text x="544" y="392.15" font-family="'Times New Roman', Times, serif" font-size="29" fill="#5e9e1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">x</tspan><tspan font-style="normal">, </tspan><tspan font-style="italic">v</tspan><tspan font-style="normal">, </tspan><tspan font-style="italic">a</tspan></text>
<text x="544" y="431.05" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Linear</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">quantities</tspan></text>
<text x="214" y="432.45" font-family="'Times New Roman', Times, serif" font-size="27" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-style="normal"> = </tspan><tspan font-style="italic">rω</tspan></text>
</svg>
