<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" viewBox="0 0 520 330" role="img" aria-labelledby="title desc">
<title id="title">Vector diagram of the tendon forces on the kneecap</title>
<desc id="desc">Axes with +x to the right and +y up. Both tendon forces on the kneecap have magnitude 1250 N and point to the left (−x side): T_1 toward the quadriceps at 55° above the −x axis, and T_2 toward the lower leg at 75° below the −x axis. Their resultant F points 10° below −x (190° from +x).</desc>
<rect width="520" height="330" fill="#ffffff"/>
<line x1="40" y1="160" x2="471" y2="160" stroke="#555555" stroke-width="1.5"/>
<polygon points="480,160 470,164 470,156" fill="#555555"/>
<text x="496" y="165.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<line x1="330" y1="310" x2="330" y2="29" stroke="#555555" stroke-width="1.5"/>
<polygon points="330,20 334,30 326,30" fill="#555555"/>
<text x="330" y="9.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<line x1="330" y1="160" x2="262.09" y2="63.01" stroke="#b03a2e" stroke-width="3"/>
<polygon points="255.44,53.51 266.79,60.94 258.53,66.72" fill="#b03a2e"/>
<text x="247.98" y="46.82" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">1</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 1250 </tspan><tspan font-style="normal">N</tspan></text>
<line x1="330" y1="160" x2="299.36" y2="274.37" stroke="#b03a2e" stroke-width="3"/>
<polygon points="296.35,285.57 294.75,272.1 304.48,274.7" fill="#b03a2e"/>
<text x="292.99" y="305.66" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">2</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 1250 </tspan><tspan font-style="normal">N</tspan></text>
<line x1="330" y1="160" x2="231.36" y2="177.39" stroke="#c0675e" stroke-width="2.2" stroke-dasharray="6 4"/>
<polygon points="221.67,179.1 231.59,172.95 233.1,181.49" fill="#c0675e"/>
<text x="208.87" y="186.26" font-family="'Times New Roman', Times, serif" font-size="14" fill="#c0675e" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal"> = ?</tspan></text>
<circle cx="330" cy="160" r="6" fill="#1f3a5f"/>
