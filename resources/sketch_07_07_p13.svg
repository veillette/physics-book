<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the car climbing the slope at constant speed</title>
<desc id="desc">A slope rises to the right at 2.00° (drawn steeper for clarity). Tilted axes: +x points up the slope, the direction of motion, and +y perpendicular to the slope. Forces on the car: the driving force F along +x; friction and air resistance f = 600 N along −x; the weight w straight down, with component mg sin θ along −x; and the normal force N along +y. The velocity v = 30.0 m/s along +x is constant, so a = 0.</desc>
