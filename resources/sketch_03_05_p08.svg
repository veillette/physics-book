<svg xmlns="http://www.w3.org/2000/svg" width="360" height="340" viewBox="0 0 360 340" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the heading that makes the ship go due north</title>
<desc id="desc">Axes with +x east and +y north. The ship’s velocity relative to the water, v_s/w = 7.00 m/s, points at unknown angle θ west of north. The current, v_w/E = 1.50 m/s at 40.0° north of east, is drawn from its tip. The sum, v_s/E, must point due north (+y), so its x-component is zero.</desc>
