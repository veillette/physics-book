<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">Water leaking from two holes in a boot</title>
<desc id="desc">A rubber boot filled with water to the top has two leaks at the same height near its sole: Leak 1 at the toe, from which water squirts up and to the right, and Leak 2 at the heel, from which water squirts to the left.</desc>
