<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" aria-labelledby="title desc">
<title id="title">Countersteering initiates a lean before the sustained turn</title>
<desc id="desc">Left, top view with forward x upward and left y to the left: pulling the right grip backward briefly turns the front wheel right and shifts its contact path right, initiating left lean. Right, rear view looking forward: the motorcycle leans left, the road resultant points upward and left through the center of mass, and weight points down. The sustained turn is left after the initial opposite steering input.</desc>
