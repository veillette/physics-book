<polygon points="331.9,66.09 345.41,64.84 342.55,74.51" fill="#5e9e1e"/>
<text x="331.9" y="56.04" font-family="'Times New Roman', Times, serif" font-size="17" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">v<tspan font-size="10.54" font-weight="normal" dx="-9.1" dy="-7.14">→</tspan><tspan dx="-0.6" dy="7.14">​</tspan></tspan></text>
<line x1="422.98" y1="93.12" x2="335.36" y2="135.44" stroke="#c62828" stroke-width="3.5"/>
<polygon points="323.93,140.96 333.88,130.07 338.65,139.94" fill="#c62828"/>
