<svg xmlns="http://www.w3.org/2000/svg" width="620" height="420" viewBox="0 0 620 420" role="img" aria-labelledby="title desc">
<title id="title">Forces on a satellite in an elliptical orbit</title>
<desc id="desc">An elliptical orbit with the planet at one focus; the satellite moves counterclockwise. The only force on the satellite is gravity, pointing toward the planet. At a point where the satellite approaches the planet, the force has a component along the velocity (dashed), so the satellite speeds up. At a point where it moves away, the force has a component opposite the velocity, so it slows down. At the closest and farthest points the force is perpendicular to the velocity and the speed is momentarily neither increasing nor decreasing.</desc>
