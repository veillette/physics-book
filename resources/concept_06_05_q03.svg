<ellipse cx="330" cy="220" rx="220" ry="140" fill="none" stroke="#666666" stroke-width="2"/>
<circle cx="160.29" cy="220" r="16" fill="#1f77c8" stroke="#222222" stroke-width="1.5"/>
<text x="160.29" y="256.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">planet</tspan></text>
