<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" role="img" aria-labelledby="title desc">
<title id="title">Ray diagram for a concave mirror, object beyond the focal point</title>
<desc id="desc">An object of height ho stands a distance do in front of a concave mirror, farther than the focal length f. Ray 1 from its tip approaches parallel to the axis and reflects through the focal point F; ray 2 strikes the center of the mirror and reflects at an equal angle; ray 3 passes through F and reflects parallel to the axis. They meet at the tip of a real, inverted, enlarged image of height hi a distance di in front of the mirror.</desc>
