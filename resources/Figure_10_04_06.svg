<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" role="img" aria-labelledby="title desc">
<title id="title">Soup cans racing down an incline: sliding versus rolling</title>
<desc id="desc">Three equal-mass cans start from rest at the same height h in separate lanes. Can 1 slides without rotating and is farthest downhill, finishing first. Can 2 rolls with thin soup that does not rotate, finishing second. Can 3 rolls with thick soup rotating with the can and finishes third. Clockwise arrows mark rotation only on cans 2 and 3.</desc>
