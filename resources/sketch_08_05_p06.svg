<svg xmlns="http://www.w3.org/2000/svg" width="600" height="290" viewBox="0 0 600 290" role="img" aria-labelledby="title desc">
<title id="title">Sketch of scrap metal dropped into the freight car</title>
<desc id="desc">A horizontal +x axis points in the direction the freight car coasts. Before: the car (30 000 kg) moves at +0.850 m/s, and the scrap (110 000 kg) falls straight down, so its x-velocity is zero. After: the loaded car moves with unknown velocity v_f.</desc>
<rect width="600" height="290" fill="#ffffff"/>
<text x="14" y="30.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">before</tspan></text>
<line x1="40" y1="116" x2="470" y2="116" stroke="#8d6e63" stroke-width="2.2"/>
<polygon points="115,115 205,115 205,85 115,85" fill="#d6e4f0" stroke="#1f3a5f" stroke-width="2"/>
<text x="160" y="140.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">freight</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">car</tspan></text>
<line x1="130" y1="70" x2="178.4" y2="70" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="190,70 177.4,75.04 177.4,64.96" fill="#3f8a1e"/>
<text x="160" y="59.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">car</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = +0.850 </tspan><tspan font-style="normal">m/s</tspan></text>
<polygon points="300,30 380,30 355,60 325,60" fill="#cfd8dc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="400" y="48.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">hopper</tspan></text>
<rect x="332" y="76" width="7" height="7" fill="#7f8c8d"/>
<rect x="346" y="90" width="7" height="7" fill="#7f8c8d"/>
<rect x="338" y="102" width="7" height="7" fill="#7f8c8d"/>
<line x1="368" y1="70" x2="368" y2="92.4" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="368,104 362.96,91.4 373.04,91.4" fill="#3f8a1e"/>
<text x="376" y="91.25" font-family="'Times New Roman', Times, serif" font-size="15" fill="#3f8a1e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="10.5" dy="4.2"><tspan font-style="normal">scrap</tspan><tspan font-style="normal">,</tspan><tspan font-style="normal">x</tspan></tspan><tspan dy="-4.2">​</tspan><tspan font-style="normal"> = 0</tspan></text>
<text x="14" y="156.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">after</tspan></text>
