<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the push-up with torques about the feet</title>
<desc id="desc">The woman’s body is a rigid plank pivoting at her feet. +x points to the right (from feet toward head), +y points up, and counterclockwise torques are positive. Her weight w = 490 N acts down at 0.900 m from the feet, giving a clockwise (negative) torque; the floor pushes up on her hands with F at 1.50 m from the feet, giving a counterclockwise (positive) torque.</desc>
