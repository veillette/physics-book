<title id="title">Two paths from the cabin to the lake with the same displacement</title>
<desc id="desc">From the cabin at the lower left, Path 1 (7.5 km) and Path 2 (8.2 km) wind along different routes to the same spot on the lake at the upper right. A single straight arrow S from the cabin to the lake, 5.0 km long at 40° north of east, is the displacement for both campers.</desc>
