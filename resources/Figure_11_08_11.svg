<svg xmlns="http://www.w3.org/2000/svg" width="660" height="520" viewBox="0 0 660 520" role="img" aria-labelledby="title desc">
<title id="title">Negative pressure in a liquid</title>
<desc id="desc">(a) A piston resting on a liquid in a closed cylinder is pulled up with force F. The liquid, stuck to the piston, is stretched slightly and put under tension, so its absolute pressure is negative: P = −F/A, where A is the piston’s area. (b) Pulled harder with force F′, the liquid separates and a gap opens beneath the piston; this sets an experimental limit on how negative the pressure in the liquid can be.</desc>
<rect width="660" height="520" fill="#ffffff"/>
<rect x="44" y="236" width="242" height="214" fill="#dfe3f3"/>
<polyline points="40,70 40,450 290,450 290,70" fill="none" stroke="#9fd0de" stroke-width="4" stroke-linejoin="round"/>
<rect x="156" y="130" width="18" height="80" fill="#9b86b4" stroke="#5f4f78" stroke-width="1.2"/>
<rect x="44" y="210" width="242" height="26" fill="#7dbb3a" stroke="#4f7f22" stroke-width="1.5"/>
<line x1="165" y1="190" x2="165" y2="119" stroke="#e0245e" stroke-width="5"/>
<polygon points="165,100 173,120 157,120" fill="#e0245e"/>
<text x="185" y="133.4" font-family="'Times New Roman', Times, serif" font-size="24" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">F<tspan font-size="14.88" font-weight="normal" dx="-14.77" dy="-19.68">→</tspan><tspan dx="-0.11" dy="19.68">​</tspan></tspan></text>
<text x="135" y="348.4" font-family="'Times New Roman', Times, serif" font-size="24" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">P</tspan><tspan font-style="normal"> = </tspan></text>
<text x="161" y="328.4" font-family="'Times New Roman', Times, serif" font-size="24" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">−</tspan><tspan font-style="italic">F</tspan></text>
<line x1="141" y1="342" x2="183" y2="342" stroke="#222222" stroke-width="1.6"/>
<text x="161" y="374.4" font-family="'Times New Roman', Times, serif" font-size="24" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">A</tspan></text>
