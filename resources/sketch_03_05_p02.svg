<svg xmlns="http://www.w3.org/2000/svg" width="520" height="190" viewBox="0 0 520 190" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the seagull flying into the wind</title>
<desc id="desc">A +x axis points in the direction the seagull first flies, into the wind. The gull’s velocity relative to the air is +9.00 m/s; the wind’s velocity relative to the Earth is negative (it blows toward −x) with unknown magnitude; the gull’s velocity relative to the Earth is +5.00 m/s (6.00 km in 20.0 min). On the return trip the gull flies toward −x, with the wind.</desc>
