<text x="358" y="35.25" font-family="'Times New Roman', Times, serif" font-size="15" fill="#1f77c8" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">v<tspan font-size="9.3" font-weight="normal" dx="-8.4" dy="-7.8">→</tspan><tspan dx="-0.9" dy="7.8">​</tspan></tspan><tspan font-size="10.5" dy="4.2"><tspan font-style="normal">g</tspan><tspan font-style="normal">/</tspan><tspan font-style="normal">a</tspan></tspan><tspan dy="-4.2">​</tspan><tspan font-style="normal"> = +9.00 </tspan><tspan font-style="normal">m/s</tspan></text>
