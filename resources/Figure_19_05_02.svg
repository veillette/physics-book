<svg xmlns="http://www.w3.org/2000/svg" width="400" height="720" viewBox="0 0 400 720" role="img" aria-labelledby="title desc">
<title id="title">Field lines in a parallel-plate capacitor</title>
<desc id="desc">Two vertical plates connected to a battery: the left plate to the positive terminal, carrying charge +Q, and the right plate to the negative terminal, carrying −Q. Evenly spaced field lines start on the positive charges and end on the negative charges, bowing outward at the ends. The field strength E is proportional to Q.</desc>
