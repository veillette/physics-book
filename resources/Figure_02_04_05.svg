<title id="title">Knowns for the racehorse</title>
<desc id="desc">The acceleration a is unknown and points west. The horse starts at rest (v0 = 0) and ends with vf = −15.0 m/s, pointing west. A compass shows north as +y and east as +x. An animated companion below illustrates the process; its complete static alternative is shown for reduced motion and print.</desc>
