<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">Diffraction through openings of different sizes</title>
<desc id="desc">Straight wavefronts pass through three openings. (a) Through an opening much wider than the wavelength, the wavefronts stay mostly straight and bend only at their edges. (b) Through a smaller opening they bend more. (c) Through an opening about as wide as the wavelength, they spread out as nearly circular waves. Beyond each opening the wavefront is the Huygens envelope: straight across the opening and circular around its edges.</desc>
