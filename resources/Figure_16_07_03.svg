<title id="title">Critically damped and overdamped oscillators</title>
<desc id="desc">Displacement x versus time t for two oscillators released from rest at X0. Curve A, critically damped, returns to equilibrium at x = 0 in the shortest possible time without overshooting. Curve B, overdamped, also returns without overshooting but takes longer.</desc>
