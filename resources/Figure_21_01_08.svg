<circle cx="235" cy="50" r="4.5" fill="#7b1145"/>
<circle cx="235" cy="300" r="4.5" fill="#7b1145"/>
<line x1="110" y1="140" x2="110" y2="120" stroke="#ffffff" stroke-width="7"/>
<line x1="110" y1="155" x2="110" y2="136.5" stroke="#222222" stroke-width="2"/>
<line x1="110" y1="123.5" x2="110" y2="105" stroke="#222222" stroke-width="2"/>
<line x1="94" y1="136.5" x2="126" y2="136.5" stroke="#c62828" stroke-width="5"/>
<line x1="78" y1="123.5" x2="142" y2="123.5" stroke="#c62828" stroke-width="3"/>
<text x="84" y="141.7" font-family="'Times New Roman', Times, serif" font-size="22" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">emf</tspan></text>
<line x1="110" y1="202" x2="110" y2="258" stroke="#ffffff" stroke-width="7"/>
<line x1="110" y1="195" x2="110" y2="202" stroke="#222222" stroke-width="2"/>
<line x1="110" y1="258" x2="110" y2="265" stroke="#222222" stroke-width="2"/>
<polyline points="110,202 99,206.67 121,216 99,225.33 121,234.67 99,244 121,253.33 110,258" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<text x="92" y="237.7" font-family="'Times New Roman', Times, serif" font-size="22" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">r</tspan></text>
<line x1="235" y1="140" x2="235" y2="210" stroke="#ffffff" stroke-width="7"/>
<line x1="235" y1="130" x2="235" y2="140" stroke="#222222" stroke-width="2"/>
