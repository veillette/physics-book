<text x="255" y="183.4" font-family="'Times New Roman', Times, serif" font-size="24" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">R</tspan></text>
<line x1="360" y1="140" x2="360" y2="210" stroke="#ffffff" stroke-width="7"/>
<line x1="360" y1="120" x2="360" y2="140" stroke="#222222" stroke-width="2"/>
<line x1="360" y1="210" x2="360" y2="230" stroke="#222222" stroke-width="2"/>
