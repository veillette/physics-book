<svg xmlns="http://www.w3.org/2000/svg" width="440" height="330" viewBox="0 0 440 330" role="img" aria-labelledby="title desc">
<title id="title">A switch wired in parallel with a resistance</title>
<desc id="desc">A source of emf with internal resistance r on the left. The resistance R and an open switch are connected side by side across the source, so closing the switch would short out R.</desc>
