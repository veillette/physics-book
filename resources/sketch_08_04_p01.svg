<svg xmlns="http://www.w3.org/2000/svg" width="620" height="284" viewBox="0 0 620 284" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the elastic collision of two identical objects</title>
<desc id="desc">A horizontal +x axis points in the direction object 1 moves. Before: object 1 (mass m) moves at +v and object 2 (mass m) is at rest. After: object 1 is at rest and object 2 moves at +v.</desc>
