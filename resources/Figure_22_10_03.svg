<svg xmlns="http://www.w3.org/2000/svg" width="520" height="560" viewBox="0 0 520 560" role="img" aria-labelledby="title desc">
<title id="title">Two current loops on a common axis</title>
<desc id="desc">Two horizontal current loops, one above the other, share a vertical axis drawn as a dashed line. Each carries a current circulating in the same sense, shown by an arrow on the loop. Loops carrying currents exert forces and torques on each other.</desc>
<rect width="520" height="560" fill="#ffffff"/>
<line x1="260" y1="10" x2="260" y2="550" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 5"/>
<defs><linearGradient id="sheet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7f93c9"/><stop offset="0.55" stop-color="#ffffff"/><stop offset="1" stop-color="#7f93c9"/></linearGradient></defs>
<polygon points="40,140 260,80 480,140 260,200" fill="url(#sheet)" fill-opacity="0.85"/>
<ellipse cx="260" cy="140" rx="110" ry="38" fill="none" stroke="#1f8fd1" stroke-width="5"/>
<line x1="276" y1="178" x2="299.08" y2="175.69" stroke="#1f8fd1" stroke-width="5"/>
<polygon points="316,174 298.81,182.96 297.37,168.63" fill="#1f8fd1"/>
<polygon points="40,400 260,340 480,400 260,460" fill="url(#sheet)" fill-opacity="0.85"/>
<ellipse cx="260" cy="400" rx="110" ry="38" fill="none" stroke="#1f8fd1" stroke-width="5"/>
<line x1="276" y1="438" x2="299.08" y2="435.69" stroke="#1f8fd1" stroke-width="5"/>
<polygon points="316,434 298.81,442.96 297.37,428.63" fill="#1f8fd1"/>
</svg>
