<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
<title id="title">A disturbance from a tuning fork moving down a tube closed at one end</title>
<desc id="desc">A tuning fork stands at the open right end of a tube closed at its left end. Its tines spread apart, and the disturbance it creates, shaded, moves to the left down the tube.</desc>
