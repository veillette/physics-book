<svg xmlns="http://www.w3.org/2000/svg" width="620" height="284" viewBox="0 0 620 284" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the passenger stopped by the seat belt</title>
<desc id="desc">A horizontal +x axis points in the direction the car was moving. The passenger starts with v_i = +10 m/s; the seat belt pushes on him along −x. After Δt = 0.26 s he is at rest, v_f = 0.</desc>
<rect width="620" height="284" fill="#ffffff"/>
<line x1="40" y1="86" x2="480" y2="86" stroke="#8d6e63" stroke-width="2.2"/>
<text x="14" y="30.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">initially</tspan></text>
<circle cx="250" cy="77" r="8" fill="#1f3a5f"/>
<text x="250" y="108.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">passenger</tspan></text>
<line x1="215" y1="44" x2="273.4" y2="44" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="285,44 272.4,49.04 272.4,38.96" fill="#3f8a1e"/>
<text x="250" y="31.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">i</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = +10 </tspan><tspan font-style="normal">m/s</tspan></text>
<line x1="242" y1="73" x2="183.6" y2="73" stroke="#b03a2e" stroke-width="3"/>
<polygon points="172,73 184.6,67.96 184.6,78.04" fill="#b03a2e"/>
<text x="207" y="63.25" font-family="'Times New Roman', Times, serif" font-size="15" fill="#b03a2e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-size="10.5" dy="4.2"><tspan font-style="normal">belt</tspan></tspan><tspan dy="-4.2">​</tspan></text>
<line x1="40" y1="198" x2="480" y2="198" stroke="#8d6e63" stroke-width="2.2"/>
<text x="14" y="142.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">after</tspan><tspan font-style="normal"> 0.26 </tspan><tspan font-style="normal">s</tspan></text>
<circle cx="380" cy="189" r="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<text x="380" y="157.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">f</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 0</tspan></text>
<line x1="40" y1="244" x2="460" y2="244" stroke="#555555" stroke-width="1.6"/>
<polygon points="470,244 459,248.4 459,239.6" fill="#555555"/>
<text x="478" y="249.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="478" y="266.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">direction</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">of</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">motion</tspan><tspan font-style="normal">)</tspan></text>
</svg>
