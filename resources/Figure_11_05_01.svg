<svg xmlns="http://www.w3.org/2000/svg" width="620" height="520" viewBox="0 0 620 520" role="img" aria-labelledby="title desc">
<title id="title">A hydraulic system</title>
<desc id="desc">Two fluid-filled cylinders capped with pistons and joined by a tube, the hydraulic line. A downward force F1 on the small left piston, of area A1, creates a pressure P1 that is transmitted undiminished through the fluid, so P1 = P2. On the large right piston, of area A2, it produces a much larger upward force F2.</desc>
