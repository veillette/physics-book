<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img" aria-labelledby="title desc">
<title id="title">Orbital angular momentum and magnetic field</title>
<desc id="desc">An electron e− circles a nucleus in an orbit of radius r, drawn in perspective. As a current loop it produces a magnetic field B_orb along its axis. B_orb points along the same line as the orbital angular momentum L_orb but in the opposite direction, because the electron’s charge is negative.</desc>
