<title id="title">Force multiplication in hydraulic brakes</title>
<desc id="desc">A 100 N pedal force acts at 0.20 m from a pivot. The master-cylinder pushrod acts 0.040 m from the pivot, producing 500 N. Master diameter 0.500 cm and slave diameter 2.50 cm give an area ratio of 25. Each of four identical slave cylinders produces 12500 N under the ideal model.</desc>
