<title id="title">Resistance of mercury near 4.2 K</title>
<desc id="desc">Resistance R of a mercury sample versus temperature T from 4.1 to 4.4 K. Above 4.2 K the resistance is about 0.12 to 0.14 Ω; at 4.2 K it drops abruptly to less than 10^−5 Ω, the superconducting transition.</desc>
