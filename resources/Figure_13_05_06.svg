<title id="title">Liquid–vapor equilibrium at two temperatures</title>
<desc id="desc">Two closed containers of liquid and its vapor, each with a pressure gauge and a thermometer. (a) The rate of vaporization (green arrow up) equals the rate of condensation (purple arrow down). (b) At a higher temperature, the pressure is higher and both rates are larger, but they are still equal.</desc>
