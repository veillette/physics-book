<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" role="img" aria-labelledby="title desc">
<title id="title">Fine structure</title>
<desc id="desc">Two spectral lines that look single at ordinary resolution are each revealed, under magnification, to be a close pair of lines: a doublet. The splitting comes from the interaction of the electron’s intrinsic magnetic field with its orbital magnetic field.</desc>
