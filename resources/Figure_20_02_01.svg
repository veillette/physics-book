<title id="title">A simple electric circuit</title>
<desc id="desc">A battery of voltage V, shown as two parallel red lines with its positive terminal on top, is connected by wires to a resistor R. Current I flows clockwise, out of the positive terminal, through R and back to the negative terminal.</desc>
