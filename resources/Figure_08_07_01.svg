<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="950" viewBox="0 0 1100 950" role="img" aria-labelledby="title desc">
<title id="title">Rocket propulsion and Newton’s third law</title>
<desc id="desc">At time t, the rocket and fuel have mass m and upward Earth-frame velocity v. At t + Δt, the rocket has mass m − Δm and velocity v + Δv; the expelled gas has mass Δm and Earth-frame velocity v − ve, downward in this example. The net external force on the whole rocket-plus-gas system is −mg. The gas pushes the rocket upward with Freac; the rocket pushes the gas downward with Fexpel of the same magnitude. Rocket and gas weights both point downward. Exhaust speed ve is measured relative to the rocket.</desc>
