<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
<title id="title">Space probe separating in flight</title>
<desc id="desc">With no air resistance, gravity bends the trajectory downward. Before separation the probe center of mass lies on the parabola. After separation, two equal-mass fragments lie on opposite sides of their combined center of mass, which continues on the same parabola. Total horizontal momentum remains constant; vertical momentum changes under the downward external force −Mg, with y positive upward.</desc>
