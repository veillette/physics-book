<circle cx="110" cy="170" r="7" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<text x="110" y="196.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f3a5f" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">puck</tspan><tspan font-style="normal"> 1</tspan></text>
