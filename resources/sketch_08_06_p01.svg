<circle cx="260" cy="170" r="7" fill="#1f3a5f"/>
<text x="248" y="196.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">puck</tspan><tspan font-style="normal"> 2 (</tspan><tspan font-style="normal">at</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">rest</tspan><tspan font-style="normal">)</tspan></text>
