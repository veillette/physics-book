<text x="506" y="191.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">incoming</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">direction</tspan><tspan font-style="normal">)</tspan></text>
