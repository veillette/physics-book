<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the two pucks scattering</title>
<desc id="desc">Axes with +x along the incoming puck’s velocity and +y perpendicular to it on the table, origin at the collision point. Before: puck 1 moves at v_1 = 6.00 m/s along +x toward puck 2 at rest. After: puck 1 moves at θ_1 = 30.0° above +x with unknown speed v′_1, and puck 2 moves at θ_2 = −60.0°, that is 60.0° below +x, with unknown speed v′_2.</desc>
