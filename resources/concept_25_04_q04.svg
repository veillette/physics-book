<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" role="img" aria-labelledby="title desc">
<title id="title">How a mirage forms over a hot road</title>
<desc id="desc">Light from the sky travels down at a shallow angle toward a hot road. In each lower, hotter layer the index of refraction is smaller, so the ray bends away from the vertical until it travels horizontally, then curves upward into the observer’s eye. The observer sees an image of the sky below the horizon, on the road, which looks like a pool of water.</desc>
