<svg xmlns="http://www.w3.org/2000/svg" width="710" height="380" viewBox="0 0 710 380" role="img" aria-labelledby="title desc">
<title id="title">Flow rate through a pipe</title>
<desc id="desc">A shaded cylinder of fluid of cross-sectional area A and length d flows past point P in a uniform pipe in time t. The cylinder’s volume is V = Ad and the average velocity is v̄ = d/t, so the flow rate is Q = V/t = Ad/t = Av̄.</desc>
