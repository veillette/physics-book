<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">Specular and diffuse reflection</title>
<desc id="desc">Left: light reflecting from smooth, oily skin; all the surface perpendiculars are parallel, so parallel incoming rays leave parallel and the reflection is a concentrated glare. Right: light reflecting from a layer of powder grains; the perpendiculars point in many directions, so the reflected rays are scattered in all directions and no shine is seen.</desc>
