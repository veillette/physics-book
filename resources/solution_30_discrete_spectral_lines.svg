<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
<title id="title">Energy gaps produce discrete spectral lines</title>
<desc id="desc">Three hydrogen energies are minus 1.51, minus 3.40, and minus 13.60 electron volts. Selected downward transitions from n3 to n2 and n2 to n1 emit photons with 1.89 and 10.20 electron volts. Energy levels use a linear scale; the two selected spectral lines are schematic.</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172b45"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1763a6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad4d12"/></marker></defs>
<rect width="960" height="510" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<text x="480" y="36" font-size="25" fill="#172b45" text-anchor="middle" font-weight="bold">Energy gaps produce discrete spectral lines</text>
<text x="480" y="78" font-size="20" fill="#526176" text-anchor="middle" font-weight="normal">Example: three bound hydrogen levels, with photon energies set by their gaps.</text><path d="M125 142.784L535 142.784" fill="none" stroke="#172b45" stroke-width="3"/><text x="100" y="149.784" font-size="20" fill="#172b45" text-anchor="end" font-weight="normal">n = 3</text><text x="550" y="149.784" font-size="20" fill="#172b45" text-anchor="start" font-weight="normal">-1.51 eV</text><path d="M125 177.56L535 177.56" fill="none" stroke="#172b45" stroke-width="3"/><text x="100" y="184.56" font-size="20" fill="#172b45" text-anchor="end" font-weight="normal">n = 2</text><text x="550" y="184.56" font-size="20" fill="#172b45" text-anchor="start" font-weight="normal">-3.40 eV</text><path d="M125 365.24L535 365.24" fill="none" stroke="#172b45" stroke-width="3"/><text x="100" y="372.24" font-size="20" fill="#172b45" text-anchor="end" font-weight="normal">n = 1</text><text x="550" y="372.24" font-size="20" fill="#172b45" text-anchor="start" font-weight="normal">-13.60 eV</text><path d="M230 147.784L230 170.56" fill="none" stroke="#ad4d12" stroke-width="3" marker-end="url(#orange)"/><text x="244" y="168.172" font-size="18" fill="#ad4d12" text-anchor="start" font-weight="normal">1.89 eV</text><path d="M420 182.56L420 358.24" fill="none" stroke="#1763a6" stroke-width="3" marker-end="url(#blue)"/><text x="434" y="279.4" font-size="18" fill="#1763a6" text-anchor="start" font-weight="normal">10.20 eV</text><text x="795" y="139" font-size="22" fill="#172b45" text-anchor="middle" font-weight="bold">Emission lines</text><path d="M680 370L905 370" fill="none" stroke="#172b45" stroke-width="2" marker-end="url(#ink)"/><path d="M720 335L720 230" fill="none" stroke="#ad4d12" stroke-width="5"/><text x="720" y="400" font-size="19" fill="#172b45" text-anchor="middle" font-weight="normal">1.89</text><path d="M855 335L855 230" fill="none" stroke="#1763a6" stroke-width="5"/><text x="855" y="400" font-size="19" fill="#172b45" text-anchor="middle" font-weight="normal">10.20</text><text x="795" y="438" font-size="19" fill="#172b45" text-anchor="middle" font-weight="normal">Photon energy (eV)</text><text x="795" y="469" font-size="16" fill="#526176" text-anchor="middle" font-weight="normal">Two selected lines; axis schematic</text><text x="330" y="446" font-size="24" fill="#172b45" text-anchor="middle" font-weight="normal">Eγ = Einitial − Efinal = hf</text><text x="330" y="479" font-size="20" fill="#172b45" text-anchor="middle" font-weight="normal">Downward transitions emit photons.</text>
</g>
</svg>
