<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">Reflection transfers twice the incident photon momentum</title>
<desc id="desc">An absorbing surface receives photon momentum p. A perfect mirror reverses photon momentum from plus p to minus p and receives 2p. At normal incidence pressures are I/c and 2I/c.</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172b45"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1763a6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad4d12"/></marker></defs>
<rect width="960" height="480" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<text x="480" y="36" font-size="25" fill="#172b45" text-anchor="middle" font-weight="bold">Reflection transfers twice the incident photon momentum</text>
<text x="480" y="78" font-size="20" fill="#526176" text-anchor="middle" font-weight="normal">Normal incidence; each incident photon has momentum magnitude p = E/c.</text><text x="245" y="126" font-size="23" fill="#172b45" text-anchor="middle" font-weight="bold">Absorbing surface</text><rect x="360" y="150" width="22" height="155" rx="4" fill="#cbd8e4" stroke="none"/><path d="M65 205L345 205" fill="none" stroke="#1763a6" stroke-width="4" marker-end="url(#blue)"/><text x="180" y="185" font-size="20" fill="#1763a6" text-anchor="middle" font-weight="normal">Incoming: +p</text><text x="200" y="275" font-size="21" fill="#172b45" text-anchor="middle" font-weight="normal">Photon absorbed</text><text x="245" y="353" font-size="22" fill="#172b45" text-anchor="middle" font-weight="normal">Surface gains p per photon</text><text x="245" y="396" font-size="25" fill="#172b45" text-anchor="middle" font-weight="normal">Pressure = I/c</text><text x="720" y="126" font-size="23" fill="#172b45" text-anchor="middle" font-weight="bold">Perfectly reflecting surface</text><rect x="835" y="150" width="22" height="155" rx="4" fill="#cbd8e4" stroke="none"/><path d="M540 205L820 205" fill="none" stroke="#1763a6" stroke-width="4" marker-end="url(#blue)"/><text x="655" y="185" font-size="20" fill="#1763a6" text-anchor="middle" font-weight="normal">Incoming: +p</text><path d="M820 265L540 265" fill="none" stroke="#ad4d12" stroke-width="4" marker-end="url(#orange)"/><text x="680" y="296" font-size="20" fill="#ad4d12" text-anchor="middle" font-weight="normal">Outgoing: −p</text><text x="720" y="353" font-size="22" fill="#172b45" text-anchor="middle" font-weight="normal">Surface gains 2p per photon</text><text x="720" y="396" font-size="25" fill="#172b45" text-anchor="middle" font-weight="normal">Pressure = 2I/c</text><text x="480" y="454" font-size="23" fill="#172b45" text-anchor="middle" font-weight="normal">For I ≈ 10³ W/m²: absorption pressure ≈ 3.3 × 10⁻⁶ Pa.</text>
</g>
</svg>
