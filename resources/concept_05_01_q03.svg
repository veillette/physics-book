<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" role="img" aria-labelledby="title desc">
<title id="title">Braking force with a firm or eased pedal</title>
<desc id="desc">Braking-force magnitude in kN versus time in seconds for a 1200 kg car initially moving at 12 m/s. A firm pedal gives 3.6 kN until the car stops at 4 s, then zero. An eased pedal gives 3.6 kN until 2.5 s, then tapers linearly to zero at 5.5 s. Both impulses are 14.4 kN s. No jump to the maximum static-friction limit is assumed.</desc>
