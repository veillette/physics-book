<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Braking force as a car comes to a stop</title>
<desc id="desc">Braking force on the car versus time for two drivers. Firm pedal: while the wheels turn, the brake pads slide on the discs and the force stays at the kinetic value μk N; just as the car stops, the pads stop sliding and grip with static friction, so the force jumps up toward μs N and then drops abruptly to zero, which is felt as a jerk. Eased pedal: the driver lowers the pad force N near the end, so the braking force tapers to a small value before the car stops and the final change is small.</desc>
