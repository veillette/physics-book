<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the head held erect</title>
<desc id="desc">Torques are taken about the atlanto-occipital joint (the origin), with the face to the right. +x points toward the face and +y up, and counterclockwise torques are positive. The weight W = 50 N acts down 2.5 cm in front of the pivot (clockwise torque); the neck muscles pull down with F_m 5.0 cm behind it (counterclockwise torque); the joint pushes up with F_J at the pivot.</desc>
