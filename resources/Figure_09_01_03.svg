<svg xmlns="http://www.w3.org/2000/svg" width="780" height="620" viewBox="0 0 780 620" role="img" aria-labelledby="title desc">
<title id="title">Equal and opposite forces on one line hold a hockey stick in equilibrium</title>
<desc id="desc">A hockey stick lies flat on frictionless ice. Two equal horizontal forces F push on opposite sides of the shaft along the same line of action, so the net force is zero and there is no torque; the stick remains stationary. The free-body diagram shows the two forces F in opposite directions.</desc>
