<svg xmlns="http://www.w3.org/2000/svg" width="620" height="340" viewBox="0 0 620 340" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the nail puller</title>
<desc id="desc">The nail puller pivots where it rests on the board (the origin), with the handle to the left. +x points from the handle toward the claw and +y up, and counterclockwise torques are positive. Your hand pushes down with F_i at l_i = 45 cm from the pivot (counterclockwise torque); the nail pushes down on the claw with F_n at l_o = 1.8 cm on the other side (clockwise torque). The puller in turn pulls up on the nail with F_o = 1250 N.</desc>
