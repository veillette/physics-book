<svg xmlns="http://www.w3.org/2000/svg" width="760" height="874.667" viewBox="0 0 760 874.667" role="img" aria-labelledby="title desc">
<title id="title">Car on a frictionless banked curve</title>
<desc id="desc">The car and road rise to the right by θ. The normal force is perpendicular to the road, tilted left of upward vertical by θ. Its upward component balances weight and its leftward component supplies the centripetal force. An animated companion below illustrates the process; its complete static alternative is shown for reduced motion and print.</desc>
