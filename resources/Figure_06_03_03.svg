<polygon points="326.15,234.39 415.16,198.42 393.18,181.42 330.14,206.89" fill="#c1dce8" stroke="#222222" stroke-width="1.2"/>
<line x1="362.03" y1="195.08" x2="370.65" y2="216.4" stroke="#222222" stroke-width="1.2"/>
<polygon points="324.15,248.13 335.28,243.64 342.02,260.33 330.89,264.82" fill="#f4ad93" stroke="#222222" stroke-width="1"/>
<polygon points="415.01,211.42 426.14,206.93 432.88,223.62 421.76,228.11" fill="#f4ad93" stroke="#222222" stroke-width="1"/>
<polygon points="321.64,273.95 445.88,223.76 448.88,231.17 324.64,281.37" fill="#cccccc" stroke="#222222" stroke-width="1"/>
<polygon points="363.11,237.79 390.93,226.55 396.17,239.53 368.36,250.77" fill="#f5e3bc" stroke="#222222" stroke-width="1"/>
</g>
<line x1="373.27" y1="222.89" x2="373.27" y2="69.09" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="320.83" y1="93.09" x2="373.27" y2="93.09" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 4"/>
<g id="normal">
