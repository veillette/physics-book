<svg xmlns="http://www.w3.org/2000/svg" width="380" height="280" viewBox="0 0 380 280" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the skater</title>
<desc id="desc">Free-body diagram with +x along the total push F tot and +y up: F tot along +x, kinetic friction f k along -x, normal force N up, weight w down; acceleration along +x.</desc>
<rect width="380" height="280" fill="#ffffff"/>
<line x1="25" y1="145" x2="336" y2="145" stroke="#555555" stroke-width="1.5"/><polygon points="345,145 335,149.2 335,140.8" fill="#555555"/>
<line x1="180" y1="250" x2="180" y2="49" stroke="#555555" stroke-width="1.5"/><polygon points="180,40 184.2,50 175.8,50" fill="#555555"/>
<line x1="180" y1="145" x2="180" y2="86" stroke="#b03a2e" stroke-width="3.5"/><polygon points="180,75 185.04,87 174.96,87" fill="#b03a2e"/>
<line x1="180" y1="145" x2="180" y2="204" stroke="#b03a2e" stroke-width="3.5"/><polygon points="180,215 174.96,203 185.04,203" fill="#b03a2e"/>
<line x1="180" y1="145" x2="279" y2="145" stroke="#b03a2e" stroke-width="3.5"/><polygon points="290,145 278,150.04 278,139.96" fill="#b03a2e"/>
<line x1="180" y1="145" x2="146" y2="145" stroke="#b03a2e" stroke-width="3.5"/><polygon points="135,145 147,139.96 147,150.04" fill="#b03a2e"/>
<line x1="220" y1="65" x2="249" y2="65" stroke="#1e8449" stroke-width="3"/><polygon points="260,65 248,70.04 248,59.96" fill="#1e8449"/>
<circle cx="180" cy="145" r="6" fill="#1f3a5f"/>
<text x="170" y="173" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="end">skater</text>
<text x="361" y="151" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="180" y="30" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="192" y="94" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">N</tspan></text>
<text x="192" y="210" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan></text>
<text x="276" y="133" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">tot</tspan><tspan dy="-6"></tspan></text>
<text x="149" y="133" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">f</tspan><tspan font-style="normal" font-size="14" dy="6">k</tspan><tspan dy="-6"></tspan></text>
<text x="246" y="53" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
</svg>
