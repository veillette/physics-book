<title id="title">Reflection from a flat mirror</title>
<desc id="desc">Two rays leave a point at angle θ to each other and strike a flat mirror at two places, each reflecting with equal angles to the normal (θ1 and θ1, θ2 and θ2). The reflected rays still diverge at angle θ. Extended backward as dashed lines, they meet at a point behind the mirror, where they also make angle θ.</desc>
