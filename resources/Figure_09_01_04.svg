<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Equal and opposite forces on different lines make a hockey stick rotate</title>
<desc id="desc">The same two forces F act on the shaft at different heights: the upper one pushes right on the left side and the lower one pushes left on the right side. The net force is still zero, but together they produce a clockwise torque, so the stick’s rotation accelerates clockwise. The free-body diagram is unchanged.</desc>
