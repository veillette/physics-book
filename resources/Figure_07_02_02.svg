<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="305" viewBox="0 0 1000 305" role="img" aria-labelledby="title desc">
<title id="title">A package pushed along a roller belt</title>
<desc id="desc">A 30.0 kg package rests on a row of rollers. An applied force Fapp = 120 N pushes it to the right and a friction force f = 5.00 N acts to the left. Its weight w points down and the normal force N points up, with equal magnitude. The package moves through a displacement d = 0.800 m to the right.</desc>
