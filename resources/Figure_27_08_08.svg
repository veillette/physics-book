<svg xmlns="http://www.w3.org/2000/svg" width="660" height="560" viewBox="0 0 660 560" role="img" aria-labelledby="title desc">
<title id="title">Polarization by reflection</title>
<desc id="desc">Unpolarized light in air strikes a glass surface. The reflected light is partially polarized, mostly perpendicular to the plane of the paper (dots), and the refracted light is partially polarized, mostly in the plane of the paper (arrows). At Brewster’s angle, θ = arctan 1.5 = 56.3°, the reflected and refracted rays are perpendicular and the reflected light is completely polarized.</desc>
