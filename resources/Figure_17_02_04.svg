<ellipse cx="302" cy="150" rx="16.56" ry="46" fill="none" stroke="#5b7fb8" stroke-width="3"/>
<ellipse cx="322" cy="150" rx="19.8" ry="55" fill="none" stroke="#7a4fa6" stroke-width="2.4" stroke-dasharray="7 5"/>
<ellipse cx="342" cy="150" rx="23.04" ry="64" fill="none" stroke="#5b7fb8" stroke-width="3"/>
