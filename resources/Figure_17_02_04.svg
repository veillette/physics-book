<ellipse cx="232" cy="340" rx="52" ry="104" fill="url(#cone)" stroke="#2a2c30" stroke-width="2"/>
<ellipse cx="224.2" cy="334.8" rx="16.64" ry="22.88" fill="#c9d3ea" stroke="#8a96b4" stroke-width="1.2"/>
