<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" role="img" aria-labelledby="title desc">
<title id="title">Wavelengths from a tweeter and a woofer</title>
<desc id="desc">A loudspeaker cabinet with a small speaker, the tweeter, above a large one, the woofer. Sound waves leave both to the right, drawn as rings: solid rings are compressions and dashed rings rarefactions. The tweeter’s rings are closely spaced (high frequency, small wavelength); the woofer’s are about two and a half times farther apart (small frequency, large wavelength), since both travel at the same speed.</desc>
<rect width="640" height="520" fill="#ffffff"/>
<defs><linearGradient id="cab_side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d4d6d9"/><stop offset="1" stop-color="#a9acb1"/></linearGradient><linearGradient id="cab_front" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a9da2"/><stop offset="1" stop-color="#7d8086"/></linearGradient><radialGradient id="cone" cx="0.45" cy="0.45" r="0.6"><stop offset="0" stop-color="#5c6068"/><stop offset="0.7" stop-color="#202226"/><stop offset="1" stop-color="#101113"/></radialGradient></defs>
<polygon points="20,110 160,30 160,505 20,440" fill="url(#cab_side)" stroke="#3a3c40" stroke-width="3"/>
<polygon points="160,30 300,50 300,470 160,505" fill="url(#cab_front)" stroke="#3a3c40" stroke-width="3"/>
<ellipse cx="232" cy="150" rx="36" ry="58" fill="url(#cone)" stroke="#2a2c30" stroke-width="2"/>
