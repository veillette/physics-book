<svg xmlns="http://www.w3.org/2000/svg" width="560" height="615" viewBox="0 0 560 615" role="img" aria-labelledby="title desc">
<title id="title">Feynman diagram of virtual pion exchange</title>
<desc id="desc">A Feynman diagram with time t up and position x to the right. A proton and a neutron approach each other and exchange a virtual positive pion. The proton becomes a neutron at the first vertex, and the neutron becomes a proton when it absorbs the pion: the strong nuclear force is carried by the pion.</desc>
