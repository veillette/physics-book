<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
<title id="title">Food acceleration on a rotating microwave plate</title>
<desc id="desc">Three top views at a nonzero angular speed. With counterclockwise motion at the right edge, velocity is upward. During spin-up, tangential acceleration is upward and radial acceleration inward; at constant speed only inward acceleration remains; during slowing tangential acceleration is downward and radial acceleration remains inward. At the exact initially stationary instant radial acceleration is zero, and after the stop all acceleration is zero.</desc>
