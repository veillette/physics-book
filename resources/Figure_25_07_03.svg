<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
<title id="title">Parallel rays reflected by a convex mirror</title>
<desc id="desc">Parallel rays, including rays 1, 2 and 3, strike a small convex mirror and reflect outward, diverging. Extended backward as dashed lines, the reflected rays seem to come from a focal point F behind the mirror, a distance f from it. Convex mirrors have a negative focal length.</desc>
