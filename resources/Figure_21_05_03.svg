<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc">
<title id="title">Two ways of measuring resistance with standard meters</title>
<desc id="desc">(a) A source of emf with internal resistance r drives current I through an ammeter A and a resistance R; R = V/I is calculated assuming the terminal voltage V is constant. (b) The same circuit with a voltmeter V connected across the source, so the terminal voltage is measured rather than assumed.</desc>
