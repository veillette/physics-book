<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the skier on the slope and on the level</title>
<desc id="desc">Two panels. (a) On the 3.0° slope (drawn steeper): +x points up the slope, the direction of motion. The snow pushes the skier forward with F along +x (the reaction to his backward push); air resistance F_air = 25.0 N and the weight component mg sin θ point along −x. He moves at a constant 2.00 m/s. (c) On level snow: +x points in the direction of motion; F along +x and F_air along −x; the speed rises from 2.00 m/s to 10.0 m/s.</desc>
