<svg xmlns="http://www.w3.org/2000/svg" width="660" height="320" viewBox="0 0 660 320" role="img" aria-labelledby="title desc">
<title id="title">Electrons circulating in the SPEAR storage ring</title>
<desc id="desc">A doughnut-shaped storage ring 72 m in diameter, its tube marked by dashed cross sections of area A. Electrons, drawn as small spheres, circulate around the ring; the current I = 20 A points opposite to their motion.</desc>
