<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="title desc">
<title id="title">Torque and the direction of change in angular momentum</title>
<desc id="desc">(a) The position vector r runs from a pivot to the point where force F acts in a plane. Their cross product τ points upward, perpendicular to that plane. (b) A child rides a carousel horse on a merry-go-round. A tangential force F at radius r produces upward torque, parallel to the change in angular momentum. For the counterclockwise rotation viewed from above, ω and L also point upward.</desc>
