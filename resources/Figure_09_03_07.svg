<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
<title id="title">Neutral equilibrium of a sphere and a pencil lying flat</title>
<desc id="desc">A sphere and a horizontal pencil have their weight and normal force on the same vertical line. Each center of gravity stays at constant height during a small displacement along the horizontal surface, so gravity produces no restoring or overturning torque.</desc>
