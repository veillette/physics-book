<svg xmlns="http://www.w3.org/2000/svg" width="620" height="322" viewBox="0 0 620 322" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagrams for the baby on the scale</title>
<desc id="desc">Two free-body diagrams with +x to the right and +y up, both with a = 0. (b) Baby plus basket: tension T1 up and weight w baby down, equal lengths. (c) Baby plus basket plus scale: tension T2 up; weights w baby and a short w scale both pointing down.</desc>
<rect width="620" height="322" fill="#ffffff"/>
<g transform="translate(0 0)">
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222">(b) System: baby + basket</text>
<g transform="translate(0 22)">
<line x1="30" y1="160" x2="236" y2="160" stroke="#555555" stroke-width="1.5"/><polygon points="245,160 235,164.2 235,155.8" fill="#555555"/>
<line x1="130" y1="275" x2="130" y2="54" stroke="#555555" stroke-width="1.5"/><polygon points="130,45 134.2,55 125.8,55" fill="#555555"/>
<line x1="130" y1="160" x2="130" y2="96" stroke="#b03a2e" stroke-width="3.5"/><polygon points="130,85 135.04,97 124.96,97" fill="#b03a2e"/>
<line x1="130" y1="160" x2="130" y2="224" stroke="#b03a2e" stroke-width="3.5"/><polygon points="130,235 124.96,223 135.04,223" fill="#b03a2e"/>
<circle cx="130" cy="160" r="6" fill="#1f3a5f"/>
<text x="120" y="182" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="end">baby + basket</text>
<text x="261" y="166" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="130" y="35" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="142" y="104" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan font-style="normal" font-size="14" dy="6">1</tspan><tspan dy="-6"></tspan></text>
<text x="142" y="230" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan><tspan font-style="normal" font-size="14" dy="6">baby</tspan><tspan dy="-6"></tspan></text>
<text x="70" y="71" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-style="normal"> = 0</tspan></text>
</g>
</g>
<line x1="300" y1="10" x2="300" y2="312" stroke="#cccccc" stroke-width="1"/>
<g transform="translate(300 0)">
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222">(c) System: baby + basket + scale</text>
<g transform="translate(0 22)">
<line x1="40" y1="160" x2="251" y2="160" stroke="#555555" stroke-width="1.5"/><polygon points="260,160 250,164.2 250,155.8" fill="#555555"/>
<line x1="140" y1="275" x2="140" y2="54" stroke="#555555" stroke-width="1.5"/><polygon points="140,45 144.2,55 135.8,55" fill="#555555"/>
<line x1="140" y1="160" x2="140" y2="89" stroke="#b03a2e" stroke-width="3.5"/><polygon points="140,78 145.04,90 134.96,90" fill="#b03a2e"/>
<line x1="133" y1="160" x2="133" y2="224" stroke="#b03a2e" stroke-width="3.5"/><polygon points="133,235 127.96,223 138.04,223" fill="#b03a2e"/>
<line x1="147" y1="160" x2="147" y2="173.1" stroke="#b03a2e" stroke-width="3.5"/><polygon points="147,182 142.84,172.1 151.16,172.1" fill="#b03a2e"/>
<circle cx="140" cy="160" r="6" fill="#1f3a5f"/>
<text x="152" y="230" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="start">baby + basket + scale</text>
<text x="276" y="166" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="140" y="35" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="152" y="97" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan font-style="normal" font-size="14" dy="6">2</tspan><tspan dy="-6"></tspan></text>
<text x="67" y="236" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan><tspan font-style="normal" font-size="14" dy="6">baby</tspan><tspan dy="-6"></tspan></text>
<text x="159" y="179" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan><tspan font-style="normal" font-size="14" dy="6">scale</tspan><tspan dy="-6"></tspan></text>
<text x="75" y="71" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-style="normal"> = 0</tspan></text>
</g>
</g>
</svg>
