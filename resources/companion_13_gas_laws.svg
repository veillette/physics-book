<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690" role="img" aria-labelledby="title desc">
<title id="title">Which quantities stay fixed in the ideal gas laws?</title>
<desc id="desc">Three before-and-after pairs compare a fixed amount of gas. Boyle law: at fixed temperature, doubling absolute pressure halves volume. Charles law: at fixed absolute pressure, doubling Kelvin temperature doubles volume. Fixed-volume law: doubling Kelvin temperature doubles absolute pressure. Piston drawings are schematic and a locked piston marks fixed volume.</desc>
