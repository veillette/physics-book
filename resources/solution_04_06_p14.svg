<svg xmlns="http://www.w3.org/2000/svg" width="430" height="370" viewBox="0 0 430 370" role="img" aria-labelledby="title desc">
<title id="title">Elevator and load accelerating upward</title>
<desc id="desc">The elevator plus load is the system. With origin at its center, positive y upward and x right, cable tension points upward and is larger than downward weight. Upward acceleration is shown separately. Example tension is approximately 13400 N and weight 11760 N.</desc>
<rect width="430" height="370" fill="#ffffff"/>
<line x1="60" y1="180" x2="361" y2="180" stroke="#555555" stroke-width="1.5"/><polygon points="370,180 360,184.2 360,175.8" fill="#555555"/>
<line x1="200" y1="310" x2="200" y2="54" stroke="#555555" stroke-width="1.5"/><polygon points="200,45 204.2,55 195.8,55" fill="#555555"/>
<line x1="200" y1="180" x2="200" y2="100" stroke="#b03a2e" stroke-width="3.5"/><polygon points="200,89 205.04,101 194.96,101" fill="#b03a2e"/>
<line x1="200" y1="180" x2="200" y2="249" stroke="#b03a2e" stroke-width="3.5"/><polygon points="200,260 194.96,248 205.04,248" fill="#b03a2e"/>
<line x1="310" y1="165" x2="310" y2="131" stroke="#1e8449" stroke-width="3"/><polygon points="310,120 315.04,132 304.96,132" fill="#1e8449"/>
<circle cx="200" cy="180" r="6" fill="#1f3a5f"/>
<text x="180" y="165" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="end">elevator + load</text>
<text x="386" y="186" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="200" y="35" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="212" y="108" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">T</tspan></text>
<text x="212" y="255" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">mg</tspan></text>
<text x="322" y="139" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="start" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
<text x="200" y="340" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#444444" text-anchor="middle">+y upward: T − mg = ma</text>
</svg>
