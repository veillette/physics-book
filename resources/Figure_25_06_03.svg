<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860" role="img" aria-labelledby="title desc">
<title id="title">Parallel rays through a diverging lens</title>
<desc id="desc">Top: an expanded view of ray 1 crossing a wedge of diverging-lens glass; it bends at each face so that it is turned away from the axis. Bottom: rays 1, 2 and 3 enter a diverging lens parallel to its axis; ray 2 on the axis is undeviated, and rays 1 and 3 spread out as if they came from the focal point F, a distance f in front of the lens. The dashed lines are extensions, not rays.</desc>
