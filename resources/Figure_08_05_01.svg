<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc">
<title id="title">A perfectly inelastic one-dimensional collision</title>
<desc id="desc">(a) Before: two blocks of equal mass m on a frictionless surface move toward each other with velocities v and −v. Net F = 0, p1 + p2 = 0, and the internal kinetic energy is KEint = mv². (b) After: the blocks are stuck together and at rest, v = 0, so p1′ + p2′ = 0 and KE′int = 0. Each panel is circled as the system of interest.</desc>
