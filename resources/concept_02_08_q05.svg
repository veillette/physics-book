<title id="title">Position and acceleration of the elevator</title>
<desc id="desc">(a) Position versus time: a parabola curving upward from 0 to 4.5 m during the first 3 s, a straight line rising to 49.5 m at 18 s, and a parabola curving downward that levels off at 57.0 m at 23 s. (b) Acceleration versus time: 1.0 m/s² from 0 to 3 s, zero from 3 s to 18 s, and −0.60 m/s² from 18 s to 23 s.</desc>
