<title id="title">A ball thrown backward from a moving truck</title>
<desc id="desc">Left, in the truck’s frame: the ball leaves the thrower at 10 m/s backward and curves down and away behind the truck. Right, in the ground frame: the truck moves forward at 10 m/s and the ball, whose horizontal velocity relative to the ground is 10 m/s − 10 m/s = 0, falls straight down.</desc>
