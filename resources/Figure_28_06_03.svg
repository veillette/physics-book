<svg xmlns="http://www.w3.org/2000/svg" width="600" height="470" viewBox="0 0 600 470" role="img" aria-labelledby="title desc">
<title id="title">Relativistic and classical kinetic energy</title>
<desc id="desc">Kinetic energy versus speed v from 0 to c. The relativistic kinetic energy (γ − 1)mc² agrees with the classical ½mv² at low speed, but rises far more steeply and grows without limit as v approaches c, shown by a dashed vertical line; the classical curve stays finite.</desc>
