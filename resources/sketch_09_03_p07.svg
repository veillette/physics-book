<circle cx="90" cy="150" r="6" fill="#ffffff" stroke="#555555" stroke-width="2"/>
<circle cx="90" cy="150" r="1.8" fill="#555555"/>
<line x1="90" y1="156" x2="90" y2="254" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
