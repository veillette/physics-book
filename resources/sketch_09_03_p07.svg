<line x1="90" y1="156" x2="90" y2="282" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="540" y1="156" x2="540" y2="282" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
