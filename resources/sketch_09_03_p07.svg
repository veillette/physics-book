<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the drawbridge resting on the far shore</title>
<desc id="desc">The bridge pivots at its hinge (the origin). +x points from the hinge toward the opposite shore and +y up, and counterclockwise torques are positive. The weight w acts down 1.5 m from the hinge (clockwise torque); the shore pushes up with F_shore 9.0 m from the hinge (counterclockwise torque); the hinge force F_hinge acts at the origin.</desc>
