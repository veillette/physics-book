<svg xmlns="http://www.w3.org/2000/svg" width="740" height="342" viewBox="0 0 740 342" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagrams for Superhero and Trusty Sidekick</title>
<desc id="desc">Three free-body diagrams with +x to the right and +y up, all with a = 0. Superhero: tension T1 up; his weight wH and the pull of the lower rope T2 both down. Sidekick: tension T2 up, weight wS down. Both together: T1 up and combined weight (mH + mS)g down; the lower rope is internal and does not appear.</desc>
<rect width="740" height="342" fill="#ffffff"/>
<g transform="translate(0 0)">
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222">Superhero</text>
<g transform="translate(0 22)">
<line x1="20" y1="170" x2="206" y2="170" stroke="#555555" stroke-width="1.5"/><polygon points="215,170 205,174.2 205,165.8" fill="#555555"/>
<line x1="110" y1="305" x2="110" y2="59" stroke="#555555" stroke-width="1.5"/><polygon points="110,50 114.2,60 105.8,60" fill="#555555"/>
<line x1="110" y1="170" x2="110" y2="81" stroke="#b03a2e" stroke-width="3.5"/><polygon points="110,70 115.04,82 104.96,82" fill="#b03a2e"/>
<line x1="103" y1="170" x2="103" y2="221" stroke="#b03a2e" stroke-width="3.5"/><polygon points="103,232 97.96,220 108.04,220" fill="#b03a2e"/>
<line x1="117" y1="170" x2="117" y2="197" stroke="#b03a2e" stroke-width="3.5"/><polygon points="117,208 111.96,196 122.04,196" fill="#b03a2e"/>
<circle cx="110" cy="170" r="6" fill="#1f3a5f"/>
<text x="100" y="148" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="end">Superhero</text>
<text x="231" y="176" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="110" y="40" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="122" y="89" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan font-style="normal" font-size="14" dy="6">1</tspan><tspan dy="-6"></tspan></text>
<text x="77" y="233" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan><tspan font-style="normal" font-size="14" dy="6">H</tspan><tspan dy="-6"></tspan></text>
<text x="129" y="203" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan font-style="normal" font-size="14" dy="6">2</tspan><tspan dy="-6"></tspan></text>
<text x="55" y="66" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-style="normal"> = 0</tspan></text>
</g>
</g>
<line x1="250" y1="10" x2="250" y2="332" stroke="#cccccc" stroke-width="1"/>
<g transform="translate(250 0)">
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222">Sidekick</text>
<g transform="translate(0 22)">
<line x1="15" y1="170" x2="191" y2="170" stroke="#555555" stroke-width="1.5"/><polygon points="200,170 190,174.2 190,165.8" fill="#555555"/>
<line x1="100" y1="305" x2="100" y2="59" stroke="#555555" stroke-width="1.5"/><polygon points="100,50 104.2,60 95.8,60" fill="#555555"/>
<line x1="100" y1="170" x2="100" y2="143" stroke="#b03a2e" stroke-width="3.5"/><polygon points="100,132 105.04,144 94.96,144" fill="#b03a2e"/>
<line x1="100" y1="170" x2="100" y2="197" stroke="#b03a2e" stroke-width="3.5"/><polygon points="100,208 94.96,196 105.04,196" fill="#b03a2e"/>
<circle cx="100" cy="170" r="6" fill="#1f3a5f"/>
<text x="90" y="148" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="end">Sidekick</text>
<text x="216" y="176" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="100" y="40" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="112" y="151" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan font-style="normal" font-size="14" dy="6">2</tspan><tspan dy="-6"></tspan></text>
<text x="112" y="203" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan><tspan font-style="normal" font-size="14" dy="6">S</tspan><tspan dy="-6"></tspan></text>
<text x="55" y="66" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-style="normal"> = 0</tspan></text>
</g>
</g>
<line x1="480" y1="10" x2="480" y2="332" stroke="#cccccc" stroke-width="1"/>
<g transform="translate(480 0)">
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222">Both together</text>
<g transform="translate(0 22)">
<line x1="20" y1="170" x2="211" y2="170" stroke="#555555" stroke-width="1.5"/><polygon points="220,170 210,174.2 210,165.8" fill="#555555"/>
<line x1="110" y1="305" x2="110" y2="59" stroke="#555555" stroke-width="1.5"/><polygon points="110,50 114.2,60 105.8,60" fill="#555555"/>
<line x1="110" y1="170" x2="110" y2="81" stroke="#b03a2e" stroke-width="3.5"/><polygon points="110,70 115.04,82 104.96,82" fill="#b03a2e"/>
<line x1="110" y1="170" x2="110" y2="259" stroke="#b03a2e" stroke-width="3.5"/><polygon points="110,270 104.96,258 115.04,258" fill="#b03a2e"/>
<circle cx="110" cy="170" r="6" fill="#1f3a5f"/>
<text x="100" y="148" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="end">both</text>
<text x="236" y="176" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="110" y="40" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="122" y="89" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan font-style="normal" font-size="14" dy="6">1</tspan><tspan dy="-6"></tspan></text>
<text x="122" y="259" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="italic">m</tspan><tspan font-style="normal" font-size="14" dy="6">H</tspan><tspan dy="-6"></tspan><tspan font-style="normal"> + </tspan><tspan font-style="italic">m</tspan><tspan font-style="normal" font-size="14" dy="6">S</tspan><tspan dy="-6"></tspan><tspan font-style="normal">)</tspan><tspan font-style="italic">g</tspan></text>
<text x="55" y="66" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-style="normal"> = 0</tspan></text>
</g>
</g>
</svg>
