<title id="title">An electronic circuit with a capacitor and resistor in parallel</title>
<desc id="desc">An electronic circuit, a capacitor C = 80 microfarads and a resistor R = 250 kilohms are connected in parallel. A switch on the top wire, between the electronic circuit and the capacitor, disconnects them.</desc>
