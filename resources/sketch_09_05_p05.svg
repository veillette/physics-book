<svg xmlns="http://www.w3.org/2000/svg" width="620" height="290" viewBox="0 0 620 290" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the vertical forces on the nail puller</title>
<desc id="desc">Vertical forces on the nail puller, with +y up. Your hand pushes down with F_i = 50 N at the handle; the nail pushes down on the claw with F_n = 1250 N (the reaction to the 1250-N pull on the nail); the puller’s weight W = 20.6 N acts down; the supporting surface pushes up at the pivot with N.</desc>
<rect width="620" height="290" fill="#ffffff"/>
<line x1="56" y1="160" x2="497" y2="160" stroke="#a9c2d9" stroke-width="10" stroke-linecap="round"/>
<line x1="56" y1="160" x2="497" y2="160" stroke="#1f3a5f" stroke-width="1.4"/>
<polygon points="470,165 460.9,178 479.1,178" fill="#999999" stroke="#555555" stroke-width="1.2"/>
<line x1="65" y1="100" x2="65" y2="148.4" stroke="#b03a2e" stroke-width="3"/>
<polygon points="65,160 59.96,147.4 70.04,147.4" fill="#b03a2e"/>
<text x="74" y="85.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">i</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 50 </tspan><tspan font-style="normal">N</tspan></text>
<line x1="486.2" y1="70" x2="486.2" y2="148.4" stroke="#b03a2e" stroke-width="3"/>
<polygon points="486.2,160 481.16,147.4 491.24,147.4" fill="#b03a2e"/>
<text x="494" y="55.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">n</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 1250 </tspan><tspan font-style="normal">N</tspan></text>
<line x1="290" y1="160" x2="290" y2="188.4" stroke="#b03a2e" stroke-width="3"/>
<polygon points="290,200 284.96,187.4 295.04,187.4" fill="#b03a2e"/>
<text x="298" y="221.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">W</tspan></text>
<line x1="470" y1="230" x2="470" y2="171.6" stroke="#b03a2e" stroke-width="3"/>
<polygon points="470,160 475.04,172.6 464.96,172.6" fill="#b03a2e"/>
<text x="456" y="239.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">N</tspan></text>
<line x1="540" y1="260" x2="577" y2="260" stroke="#555555" stroke-width="1.5"/>
<polygon points="586,260 576,264 576,256" fill="#555555"/>
<text x="602" y="265.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
