<svg xmlns="http://www.w3.org/2000/svg" width="620" height="284" viewBox="0 0 620 284" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the car hitting the deer</title>
<desc id="desc">A horizontal +x axis points in the direction both are moving. Before: the car (900 kg) moves at +30.0 m/s and the deer (150 kg) ahead of it at +12.0 m/s. After, the deer stays on the car and they move together with unknown velocity v_f.</desc>
