<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">A middle polarizer opens a path through crossed filters</title>
<desc id="desc">Three filter axes are vertical, diagonal, and horizontal. Unpolarized light emerges with intensities I0/2, I0/4, and I0/8. Each successive axis differs by 45 degrees.</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172b45"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1763a6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad4d12"/></marker></defs>
<rect width="960" height="480" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<text x="480" y="36" font-size="25" fill="#172b45" text-anchor="middle" font-weight="bold">A middle polarizer opens a path through crossed filters</text>
<text x="480" y="76" font-size="18" fill="#526176" text-anchor="middle" font-weight="normal">Filter faces viewed along the beam; intensity labels assume unpolarized input.</text><circle cx="180" cy="220" r="76" fill="#edf4fa" stroke="#1763a6" stroke-width="2"/><path d="M180.0 280.0L180.0 160.0" fill="none" stroke="#1763a6" stroke-width="5"/><text x="180" y="330" font-size="22" fill="#172b45" text-anchor="middle" font-weight="normal">First filter: 0°</text><text x="180" y="367" font-size="24" fill="#172b45" text-anchor="middle" font-weight="normal">I₁ = I₀/2</text><circle cx="480" cy="220" r="76" fill="#edf4fa" stroke="#1763a6" stroke-width="2"/><path d="M437.57359312880715 262.42640687119285L522.4264068711929 177.57359312880715" fill="none" stroke="#1763a6" stroke-width="5"/><text x="480" y="330" font-size="22" fill="#172b45" text-anchor="middle" font-weight="normal">Middle filter: 45°</text><text x="480" y="367" font-size="24" fill="#172b45" text-anchor="middle" font-weight="normal">I₂ = I₀/4</text><circle cx="780" cy="220" r="76" fill="#edf4fa" stroke="#1763a6" stroke-width="2"/><path d="M720.0 220.0L840.0 220.0" fill="none" stroke="#1763a6" stroke-width="5"/><text x="780" y="330" font-size="22" fill="#172b45" text-anchor="middle" font-weight="normal">Last filter: 90°</text><text x="780" y="367" font-size="24" fill="#172b45" text-anchor="middle" font-weight="normal">I₃ = I₀/8</text><path d="M270 220L380 220" fill="none" stroke="#172b45" stroke-width="2" marker-end="url(#ink)"/><path d="M570 220L680 220" fill="none" stroke="#172b45" stroke-width="2" marker-end="url(#ink)"/><text x="480" y="424" font-size="21" fill="#172b45" text-anchor="middle" font-weight="normal">Each 45° projection transmits cos²45° = 1/2 of the preceding intensity.</text>
</g>
</svg>
