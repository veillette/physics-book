<svg xmlns="http://www.w3.org/2000/svg" width="760" height="740" viewBox="0 0 760 740" role="img" aria-labelledby="title desc">
<title id="title">A nail bent in shear by a hanging picture</title>
<desc id="desc">Side view of a nail 1.50 mm thick through a wall, with L₀ = 5.00 mm sticking out and a picture hanger at its head. The weight w of the picture pulls the head down, and the wall pushes up with an equal force w at the wall face, so equal and opposite forces act across opposite cross sections. Dashed lines show the unbent nail; the head drops by Δx = 1.80 μm, drawn greatly exaggerated.</desc>
