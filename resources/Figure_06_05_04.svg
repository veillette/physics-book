<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Earth and the Moon orbit their common center of mass</title>
<desc id="desc">(a) The Moon orbits counterclockwise, and Earth’s center moves on a small dashed circle around the Earth–Moon center of mass (CM), which lies inside Earth. (b) The center of mass follows a smooth ellipse around the Sun, while Earth’s own path wiggles about it once a month (exaggerated). Not to scale.</desc>
