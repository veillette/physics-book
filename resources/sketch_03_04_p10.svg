<title id="title">Sketch of the arrow shot onto the cliff</title>
<desc id="desc">Axes with +x horizontal toward the cliff and +y up, origin on the ground below the archer. The arrow leaves from y_0 = 1.5 m with v_0 = 30 m/s at 60° above horizontal and lands on the top edge of the cliff, of unknown height H, at t = 4.0 s. Its maximum height y_max is unknown. The acceleration is a_y = −9.80 m/s², a_x = 0.</desc>
