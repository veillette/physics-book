<svg xmlns="http://www.w3.org/2000/svg" width="520" height="390" viewBox="0 0 520 390" role="img" aria-labelledby="title desc">
<title id="title">Radial and tangential directions in circular motion</title>
<desc id="desc">A particle at the right side of a circle moves counterclockwise. Its velocity points upward along the positive tangent; centripetal acceleration points left along the positive inward normal, perpendicular to velocity. The center and radius are marked.</desc>
<rect width="520" height="390" fill="#ffffff"/>
<circle cx="195" cy="220" r="100" fill="none" stroke="#666666" stroke-width="2"/>
<circle cx="195" cy="220" r="4" fill="#222222"/>
<text x="160" y="242.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">center</tspan></text>
<line x1="195" y1="220" x2="295" y2="220" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="243" y="251.3" font-family="'Times New Roman', Times, serif" font-size="18" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">r</tspan></text>
<line x1="295" y1="220" x2="295" y2="106.6" stroke="#5e9e1e" stroke-width="3"/>
<polygon points="295,95 300.04,107.6 289.96,107.6" fill="#5e9e1e"/>
<text x="315" y="101.3" font-family="'Times New Roman', Times, serif" font-size="18" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">v<tspan font-size="11.16" font-weight="normal" dx="-10.08" dy="-9.36">→</tspan><tspan dx="-1.08" dy="9.36">​</tspan></tspan><tspan font-style="normal">, +</tspan><tspan font-style="italic">t</tspan></text>
<line x1="295" y1="220" x2="221.6" y2="220" stroke="#6a3d9a" stroke-width="3"/>
<polygon points="210,220 222.6,214.96 222.6,225.04" fill="#6a3d9a"/>
<text x="240" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">a<tspan font-size="9.92" font-weight="normal" dx="-8.96" dy="-8.32">→</tspan><tspan dx="-0.96" dy="8.32">​</tspan></tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">c</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal">, +</tspan><tspan font-style="italic">n</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">inward</tspan></text>
<circle cx="295" cy="220" r="7" fill="#ef7d22"/>
<polyline points="295,203 278,203 278,220" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round"/>
<text x="260" y="355.25" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Local</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">axes</tspan><tspan font-style="normal">: +</tspan><tspan font-style="normal">t</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">along</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">motion</tspan><tspan font-style="normal">; +</tspan><tspan font-style="normal">n</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">toward</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">the</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">center</tspan><tspan font-style="normal">.</tspan></text>
</svg>
