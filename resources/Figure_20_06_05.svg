<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" role="img" aria-labelledby="title desc">
<title id="title">Shock-current thresholds versus frequency</title>
<desc id="desc">Average current in milliamperes versus frequency from 10 Hz to 10 000 Hz on a logarithmic scale. The threshold of sensation is lowest, about 1 mA, near 60 to 100 Hz and rises to about 14 mA at 10 000 Hz. The “can’t let go” current is about 15 mA near 60 to 100 Hz, rising to about 25 mA at 1000 Hz and about 75 mA at 10 000 Hz. The lower the value, the more sensitive the body is at that frequency; the body is most sensitive near the 50 to 60 Hz of household power.</desc>
