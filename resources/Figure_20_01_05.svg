<title id="title">The path of a free electron in a conductor</title>
<desc id="desc">A free electron e⁻ in a wire moves along a random zigzag path, changing direction at each collision with other electrons and atoms. Its average velocity, the drift velocity v_d, is to the right, opposite the electric field E, which points left. The conventional current I is in the direction of E.</desc>
