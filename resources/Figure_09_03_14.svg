<svg xmlns="http://www.w3.org/2000/svg" width="590" height="650" viewBox="0 0 590 650" role="img" aria-labelledby="title desc">
<title id="title">A sandwich-board sign</title>
<desc id="desc">Two uniform boards are hinged together at the top and stand on the sidewalk as an upside-down V, their feet 1.10 m apart. The hinge is 1.30 m above the sidewalk. A horizontal chain joins the two boards 0.50 m below the hinge. Each board’s center of gravity, CG, is at its center. Drawn to scale.</desc>
