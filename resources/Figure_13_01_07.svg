<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc">
<title id="title">Pressure versus temperature at constant volume</title>
<desc id="desc">Pressure versus temperature for four gases held at constant volume. Each graph is a straight line; the lines have different slopes, but all extrapolate (dashed) to zero pressure at −273.15 °C.</desc>
<rect width="480" height="440" fill="#ffffff"/>
<line x1="70" y1="340" x2="404" y2="340" stroke="#333333" stroke-width="1.5"/>
<polygon points="414,340 403,344.4 403,335.6" fill="#333333"/>
<line x1="70" y1="340" x2="70" y2="36" stroke="#333333" stroke-width="1.5"/>
<polygon points="70,26 74.4,37 65.6,37" fill="#333333"/>
<line x1="102.21" y1="334" x2="102.21" y2="346" stroke="#333333" stroke-width="1.5"/>
<line x1="152.5" y1="334" x2="152.5" y2="346" stroke="#333333" stroke-width="1.5"/>
<line x1="221.25" y1="334" x2="221.25" y2="346" stroke="#333333" stroke-width="1.5"/>
<line x1="290" y1="334" x2="290" y2="346" stroke="#333333" stroke-width="1.5"/>
<line x1="358.75" y1="334" x2="358.75" y2="346" stroke="#333333" stroke-width="1.5"/>
<text x="152.5" y="368.65" font-family="'Times New Roman', Times, serif" font-size="19" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">−200</tspan></text>
<text x="221.25" y="368.65" font-family="'Times New Roman', Times, serif" font-size="19" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">−100</tspan></text>
<text x="290" y="368.65" font-family="'Times New Roman', Times, serif" font-size="19" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">0</tspan></text>
<text x="358.75" y="368.65" font-family="'Times New Roman', Times, serif" font-size="19" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">100</tspan></text>
<text x="102.21" y="392.65" font-family="'Times New Roman', Times, serif" font-size="19" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">−273.15</tspan></text>
