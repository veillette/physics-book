<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="625" viewBox="0 0 1030 625" role="img" aria-labelledby="title desc">
<title id="title">Pulley systems with mechanical advantage 2, 3 and 4</title>
<desc id="desc">Three pulley systems lifting a weight, each with its free-body diagram. (a) A rope tied to the fixed upper pulley runs down under a movable pulley carrying the load and back up over the fixed pulley to the free end, pulled with tension T. Two rope segments pull up on the load, so the free-body diagram shows 2T up and w down: MA ≈ 2. (b) With a second small pulley hung from the fixed one, three rope segments support the movable pulley: 3T up, MA ≈ 3. (c) With a small pulley mounted on the movable block and the free end pulled upward, four segments support the load: 4T up, MA ≈ 4.</desc>
