<svg xmlns="http://www.w3.org/2000/svg" width="460" height="280" viewBox="0 0 460 280" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the center of the rope</title>
<desc id="desc">Free-body diagram with +x along the car-to-tree line (to the right, toward the tree) and +y perpendicular to it (up the page): tension T toward the car, up and to the left, and tension T toward the tree, up and to the right, each at a small angle theta above the x-axis, with dashed components T sin theta along +y; the applied force F app points along -y. a = 0.</desc>
