<svg xmlns="http://www.w3.org/2000/svg" width="560" height="520" viewBox="0 0 560 520" role="img" aria-labelledby="title desc">
<title id="title">Phase diagram for carbon dioxide</title>
<desc id="desc">Pressure versus temperature for carbon dioxide, with nonlinear axes not to scale. The solid, liquid, and vapor regions meet at the triple point, 5.11 atm and −56.6 °C; the solid–liquid boundary rises steeply and leans right. At 1 atm solid CO₂ sublimes at −78.5 °C, so there is no liquid at atmospheric pressure. The liquid–vapor boundary passes 56 atm at 20 °C and ends at the critical point, 73 atm and 31 °C.</desc>
