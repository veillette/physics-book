<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the puck’s velocities for the shot on goal</title>
<desc id="desc">Axes with +x toward the goal (east) and +y along the player’s motion (north). The player’s velocity relative to the ice is v_P/I = 8.00 m/s along +y. The puck’s velocity relative to the player, v_p/P = 29.0 m/s at unknown angle θ from the player’s direction (+y), plus v_P/I must give a puck velocity relative to the ice, v_p/I, along +x, toward the goal.</desc>
