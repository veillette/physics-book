<svg xmlns="http://www.w3.org/2000/svg" width="560" height="470" viewBox="0 0 560 470" role="img" aria-labelledby="title desc">
<title id="title">Path of the lunch box released on a merry-go-round</title>
<desc id="desc">Top view of a merry-go-round turning clockwise. The lunch box is released at point P, halfway out, moving with the platform’s velocity at that point, which is tangent to its circle. In Earth’s frame it slides in a straight line along that tangent, path B. Meanwhile the platform turns clockwise underneath it, so the trail it leaves in the dust starts out radially outward and then curves counterclockwise, to the left of its direction of travel, until it reaches the edge.</desc>
