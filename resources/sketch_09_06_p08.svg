<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the foot when standing on the toes</title>
<desc id="desc">Torques are taken about the ankle pivot (the origin), with the toes to the right. +x points toward the toes and +y up, and counterclockwise torques are positive. The Achilles tendon pulls up with F_A, 4.0 cm behind the pivot (clockwise torque); the floor pushes up on the ball of the foot with N = 735 N, 12 cm in front of it (counterclockwise torque); the pivot force F_P on the foot points down.</desc>
<rect width="640" height="310" fill="#ffffff"/>
<line x1="120" y1="170" x2="516" y2="170" stroke="#a9c2d9" stroke-width="10" stroke-linecap="round"/>
<line x1="120" y1="170" x2="516" y2="170" stroke="#1f3a5f" stroke-width="1.4"/>
<line x1="142" y1="176" x2="142" y2="220" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="230" y1="176" x2="230" y2="220" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="149" y1="214" x2="223" y2="214" stroke="#444444" stroke-width="1.2"/>
<polygon points="230,214 222,217.2 222,210.8" fill="#444444"/>
<polygon points="142,214 150,210.8 150,217.2" fill="#444444"/>
<text x="186" y="208.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">4.0 </tspan><tspan font-style="normal">cm</tspan></text>
<line x1="230" y1="176" x2="230" y2="220" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="494" y1="176" x2="494" y2="220" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="237" y1="214" x2="487" y2="214" stroke="#444444" stroke-width="1.2"/>
<polygon points="494,214 486,217.2 486,210.8" fill="#444444"/>
<polygon points="230,214 238,210.8 238,217.2" fill="#444444"/>
<text x="362" y="208.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">12 </tspan><tspan font-style="normal">cm</tspan></text>
<line x1="142" y1="170" x2="142" y2="91.6" stroke="#b03a2e" stroke-width="3"/>
<polygon points="142,80 147.04,92.6 136.96,92.6" fill="#b03a2e"/>
<text x="150" y="95.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">A</tspan></tspan><tspan dy="-4.48">​</tspan></text>
<line x1="494" y1="170" x2="494" y2="121.6" stroke="#b03a2e" stroke-width="3"/>
<polygon points="494,110 499.04,122.6 488.96,122.6" fill="#b03a2e"/>
<text x="500" y="109.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">N</tspan><tspan font-style="normal"> = 735 </tspan><tspan font-style="normal">N</tspan></text>
