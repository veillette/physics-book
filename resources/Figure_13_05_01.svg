<svg xmlns="http://www.w3.org/2000/svg" width="520" height="500" viewBox="0 0 520 500" role="img" aria-labelledby="title desc">
<title id="title">Volume versus temperature for a real gas</title>
<desc id="desc">Volume versus temperature at constant pressure. Above about −183 °C the gas follows the ideal-gas straight line, which extrapolates (dashed) to zero volume at −273.15 °C. At about −183 °C the gas condenses to a liquid and the volume drops almost to zero; at about −218 °C the liquid freezes to a solid, a further small decrease.</desc>
