<svg xmlns="http://www.w3.org/2000/svg" width="620" height="284" viewBox="0 0 620 284" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the satellite separating from its launcher</title>
<desc id="desc">Frame in which both are at rest before separation. A horizontal +x axis points in the direction the satellite moves after separation. After: the satellite (4800 kg) moves with v_1 along +x and the launcher (1500 kg) with v_2 along −x; both are unknown, and 5000 J of kinetic energy is supplied.</desc>
<rect width="620" height="284" fill="#ffffff"/>
<line x1="40" y1="86" x2="480" y2="86" stroke="#8d6e63" stroke-width="2.2"/>
<text x="14" y="30.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">before</tspan></text>
<polygon points="215,86 385,86 385,60 215,60" fill="#d6e4f0" stroke="#1f3a5f" stroke-width="2"/>
<text x="300" y="108.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">launcher</tspan><tspan font-style="normal"> + </tspan><tspan font-style="normal">satellite</tspan></text>
<text x="300" y="45.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-style="normal"> = 0</tspan></text>
<line x1="40" y1="198" x2="480" y2="198" stroke="#8d6e63" stroke-width="2.2"/>
<text x="14" y="142.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">after</tspan></text>
<polygon points="150,198 210,198 210,172 150,172" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<text x="180" y="220.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">launcher</tspan></text>
<line x1="215" y1="156" x2="156.6" y2="156" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="145,156 157.6,150.96 157.6,161.04" fill="#3f8a1e"/>
<text x="180" y="143.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">2</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = ?</tspan></text>
<polygon points="355,198 445,198 445,172 355,172" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<text x="400" y="220.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">satellite</tspan></text>
<line x1="385" y1="156" x2="403.4" y2="156" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="415,156 402.4,161.04 402.4,150.96" fill="#3f8a1e"/>
<text x="400" y="143.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">1</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = ?</tspan></text>
<line x1="40" y1="244" x2="460" y2="244" stroke="#555555" stroke-width="1.6"/>
<polygon points="470,244 459,248.4 459,239.6" fill="#555555"/>
<text x="478" y="249.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
