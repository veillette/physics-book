<text x="220" y="281" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="11.2" dy="4.8">app</tspan><tspan dy="-4.8"></tspan><tspan font-style="normal"> = 2</tspan><tspan font-style="italic">T</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">sin</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">θ</tspan><tspan font-style="normal">  (</tspan><tspan font-style="italic">sum</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">of</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">the</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">two</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">tensions</tspan><tspan font-style="normal">, </tspan><tspan font-style="italic">along</tspan><tspan font-style="normal"> −</tspan><tspan font-style="italic">y</tspan><tspan font-style="normal">)</tspan></text>
