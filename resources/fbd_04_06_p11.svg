<svg xmlns="http://www.w3.org/2000/svg" width="440" height="290" viewBox="0 0 440 290" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the tooth</title>
<desc id="desc">Free-body diagram with +x to the right and +y up (toward the front of the mouth): two wire tensions T, one down and to the right and one down and to the left, each 15 degrees below the horizontal, with dashed components T cos theta along the x-axis and T sin theta along -y. Their sum, F app, points along -y.</desc>
