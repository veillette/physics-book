<path d="M 316.59 135.88 A 100 100 0 0 0 320 110" fill="none" stroke="#222222" stroke-width="1.5"/>
<path d="M 120 110 A 100 100 0 0 0 123.41 135.88" fill="none" stroke="#222222" stroke-width="1.5"/>
<line x1="220" y1="110" x2="354" y2="110" stroke="#c0675e" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="365,110 353,115.04 353,104.96" fill="#c0675e"/>
<line x1="220" y1="110" x2="86" y2="110" stroke="#c0675e" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="75,110 87,104.96 87,115.04" fill="#c0675e"/>
<line x1="226" y1="110" x2="226" y2="138" stroke="#c0675e" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="226,149 220.96,137 231.04,137" fill="#c0675e"/>
<line x1="214" y1="110" x2="214" y2="138" stroke="#c0675e" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="214,149 208.96,137 219.04,137" fill="#c0675e"/>
<line x1="220" y1="110" x2="354.26" y2="145.98" stroke="#b03a2e" stroke-width="3.5"/><polygon points="364.89,148.82 351.99,150.59 354.6,140.85" fill="#b03a2e"/>
<line x1="220" y1="110" x2="85.74" y2="145.98" stroke="#b03a2e" stroke-width="3.5"/><polygon points="75.11,148.82 85.4,140.85 88.01,150.59" fill="#b03a2e"/>
