<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" role="img" aria-labelledby="title desc">
<title id="title">Why you seem to be thrown outward in a turning car</title>
<desc id="desc">Top view of a car turning left along a circular arc. The dashed straight line shows the path the passenger would follow if no force acted on her, tangent to the curve. The car turns away from that line, so the door moves inward into her and pushes her toward the center of the curve with the centripetal force. Relative to the car she seems to slide outward, but no outward force acts on her.</desc>
