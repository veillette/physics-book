<text x="380" y="334.4" font-family="'Times New Roman', Times, serif" font-size="24" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">x</tspan></text>
<text x="682" y="228.4" font-family="'Times New Roman', Times, serif" font-size="24" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">y</tspan></text>
<line x1="26" y1="286" x2="26" y2="314" stroke="#222222" stroke-width="1.4"/>
<polygon points="26,322 22.4,313 29.6,313" fill="#222222"/>
<polygon points="26,278 29.6,287 22.4,287" fill="#222222"/>
<line x1="18" y1="278" x2="34" y2="278" stroke="#222222" stroke-width="1.3"/>
<line x1="18" y1="322" x2="34" y2="322" stroke="#222222" stroke-width="1.3"/>
