<line x1="50" y1="120" x2="50" y2="272" stroke="#222222" stroke-width="6"/>
<line x1="50" y1="284" x2="50" y2="316" stroke="#222222" stroke-width="6"/>
<line x1="50" y1="328" x2="50" y2="480" stroke="#222222" stroke-width="6"/>
<line x1="660" y1="20" x2="660" y2="540" stroke="#222222" stroke-width="4"/>
<line x1="70" y1="300" x2="660" y2="300" stroke="#9b1b30" stroke-width="4"/>
<line x1="70" y1="300" x2="660" y2="140" stroke="#9b1b30" stroke-width="4"/>
