<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" role="img" aria-labelledby="title desc">
<title id="title">Distance between fringes on a screen</title>
<desc id="desc">Two slits a distance d apart are a distance x from a screen. A line at angle θ from the slits reaches the screen a distance y from its center, forming a right triangle with the horizontal line x. For small angles the distance between adjacent fringes is Δy = xλ/d.</desc>
