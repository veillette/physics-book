<svg xmlns="http://www.w3.org/2000/svg" width="620" height="284" viewBox="0 0 620 284" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the hockey player recoiling</title>
<desc id="desc">A horizontal +x axis points in the direction the puck moves, toward the goal 15.0 m away. Before: player and puck are at rest. After: the puck (0.150 kg) moves at +45.0 m/s and the player (90.0 kg) recoils with unknown velocity along −x; the distance he recoils while the puck travels 15.0 m is unknown.</desc>
<rect width="620" height="284" fill="#ffffff"/>
<line x1="40" y1="86" x2="480" y2="86" stroke="#8d6e63" stroke-width="2.2"/>
<text x="14" y="30.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">before</tspan></text>
<circle cx="160" cy="75" r="10" fill="#1f3a5f"/>
<text x="160" y="108.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">player</tspan></text>
<text x="160" y="45.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-style="normal"> = 0</tspan></text>
<circle cx="190" cy="81" r="4" fill="#1f3a5f"/>
<line x1="40" y1="198" x2="480" y2="198" stroke="#8d6e63" stroke-width="2.2"/>
<text x="14" y="142.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">after</tspan></text>
<circle cx="140" cy="187" r="10" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<text x="140" y="220.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">player</tspan></text>
<line x1="155" y1="156" x2="136.6" y2="156" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="125,156 137.6,150.96 137.6,161.04" fill="#3f8a1e"/>
<text x="140" y="143.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">player</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = ?</tspan></text>
<circle cx="420" cy="193" r="4" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<text x="420" y="220.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">puck</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">at</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">the</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">goal</tspan></text>
<line x1="380" y1="156" x2="448.4" y2="156" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="460,156 447.4,161.04 447.4,150.96" fill="#3f8a1e"/>
<text x="420" y="143.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">puck</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = +45.0 </tspan><tspan font-style="normal">m/s</tspan></text>
<line x1="40" y1="244" x2="460" y2="244" stroke="#555555" stroke-width="1.6"/>
<polygon points="470,244 459,248.4 459,239.6" fill="#555555"/>
