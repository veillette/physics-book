<svg xmlns="http://www.w3.org/2000/svg" width="420" height="360" viewBox="0 0 420 360" role="img" aria-labelledby="title desc">
<title id="title">Velocities vA and vB adding to vtot</title>
<desc id="desc">vA points 22.5° above the +x axis. vB starts at the head of vA. Their sum vtot = 6.72 m/s makes 26.5° with vA and 23.0° with vB.</desc>
