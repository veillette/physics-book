<text x="132.45" y="160.71" font-family="'Times New Roman', Times, serif" font-size="19" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">v<tspan font-size="11.78" font-weight="normal" dx="-10.64" dy="-9.88">→</tspan><tspan dx="-1.14" dy="9.88">​</tspan></tspan><tspan font-size="13.3" dy="5.32"><tspan font-style="normal">tot</tspan></tspan><tspan dy="-5.32">​</tspan></text>
