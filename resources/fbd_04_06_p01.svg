<svg xmlns="http://www.w3.org/2000/svg" width="320" height="330" viewBox="0 0 320 330" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the rocket</title>
<desc id="desc">Free-body diagram with +x to the right and +y up: thrust T up; air resistance f and weight mg both down, drawn side by side; the acceleration points up.</desc>
<rect width="320" height="330" fill="#ffffff"/>
<line x1="40" y1="175" x2="266" y2="175" stroke="#555555" stroke-width="1.5"/><polygon points="275,175 265,179.2 265,170.8" fill="#555555"/>
<line x1="150" y1="295" x2="150" y2="49" stroke="#555555" stroke-width="1.5"/><polygon points="150,40 154.2,50 145.8,50" fill="#555555"/>
<line x1="150" y1="175" x2="150" y2="68" stroke="#b03a2e" stroke-width="3.5"/><polygon points="150,57 155.04,69 144.96,69" fill="#b03a2e"/>
<line x1="143" y1="175" x2="143" y2="210" stroke="#b03a2e" stroke-width="3.5"/><polygon points="143,221 137.96,209 148.04,209" fill="#b03a2e"/>
<line x1="157" y1="175" x2="157" y2="214" stroke="#b03a2e" stroke-width="3.5"/><polygon points="157,225 151.96,213 162.04,213" fill="#b03a2e"/>
<line x1="80" y1="115" x2="80" y2="86" stroke="#1e8449" stroke-width="3"/><polygon points="80,75 85.04,87 74.96,87" fill="#1e8449"/>
<circle cx="150" cy="175" r="6" fill="#1f3a5f"/>
<text x="160" y="151" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="start">rocket</text>
<text x="291" y="181" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="150" y="30" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="162" y="76" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">T</tspan></text>
<text x="123" y="220" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">f</tspan></text>
<text x="169" y="220" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">mg</tspan></text>
<text x="92" y="94" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="start" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
</svg>
