<title id="title">Current along a bar and across it</title>
<desc id="desc">(a) A battery of voltage V drives current I along the length of a rectangular bar, which has resistance R along that path. (b) The same battery drives current I′ across the width of the same bar, along a much shorter path of larger cross section. The resistance R′ and current I′ for that path are to be found.</desc>
