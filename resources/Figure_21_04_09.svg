<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-labelledby="title desc">
<title id="title">A source driving R1 in parallel with R2 and R3 in series</title>
<desc id="desc">Top points a, b and c and bottom points h, g and f. The left branch from h to a has emf = 90 V with internal resistance r = 0.25 ohm. The middle branch from b to g has R1 = 3.0 ohms between points i and j. The right branch from c to f has R2 = 6.0 ohms, points d and e, then R3 = 1.5 ohms.</desc>
