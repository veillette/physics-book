<svg xmlns="http://www.w3.org/2000/svg" width="720" height="312" viewBox="0 0 720 312" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagrams for the tug of war</title>
<desc id="desc">Two free-body diagrams with +x to the right, toward team 2, and +y up. (a) Both teams plus rope: F2 from the ground to the right, slightly shorter F1 to the left, total normal force N up, total weight w down; acceleration to the right. (b) Team 1 alone: rope tension T to the right, F1 to the left, N1 up, w1 down; acceleration to the right.</desc>
<rect width="720" height="312" fill="#ffffff"/>
<g transform="translate(0 0)">
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222">(a) System: both teams + rope</text>
<g transform="translate(0 22)">
<line x1="25" y1="150" x2="326" y2="150" stroke="#555555" stroke-width="1.5"/><polygon points="335,150 325,154.2 325,145.8" fill="#555555"/>
<line x1="180" y1="260" x2="180" y2="49" stroke="#555555" stroke-width="1.5"/><polygon points="180,40 184.2,50 175.8,50" fill="#555555"/>
<line x1="180" y1="150" x2="180" y2="86" stroke="#b03a2e" stroke-width="3.5"/><polygon points="180,75 185.04,87 174.96,87" fill="#b03a2e"/>
<line x1="180" y1="150" x2="180" y2="214" stroke="#b03a2e" stroke-width="3.5"/><polygon points="180,225 174.96,213 185.04,213" fill="#b03a2e"/>
<line x1="180" y1="150" x2="287" y2="150" stroke="#b03a2e" stroke-width="3.5"/><polygon points="298,150 286,155.04 286,144.96" fill="#b03a2e"/>
<line x1="180" y1="150" x2="81" y2="150" stroke="#b03a2e" stroke-width="3.5"/><polygon points="70,150 82,144.96 82,155.04" fill="#b03a2e"/>
<line x1="220" y1="65" x2="249" y2="65" stroke="#1e8449" stroke-width="3"/><polygon points="260,65 248,70.04 248,59.96" fill="#1e8449"/>
<circle cx="180" cy="150" r="6" fill="#1f3a5f"/>
<text x="190" y="192" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="start">teams + rope</text>
<text x="351" y="156" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="180" y="30" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="192" y="94" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">N</tspan></text>
<text x="192" y="220" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan></text>
<text x="284" y="138" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">2</tspan><tspan dy="-6"></tspan></text>
<text x="84" y="138" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">1</tspan><tspan dy="-6"></tspan></text>
<text x="246" y="53" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
</g>
</g>
<line x1="360" y1="10" x2="360" y2="302" stroke="#cccccc" stroke-width="1"/>
<g transform="translate(360 0)">
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222">(b) System: team 1</text>
<g transform="translate(0 22)">
<line x1="25" y1="150" x2="326" y2="150" stroke="#555555" stroke-width="1.5"/><polygon points="335,150 325,154.2 325,145.8" fill="#555555"/>
<line x1="180" y1="260" x2="180" y2="49" stroke="#555555" stroke-width="1.5"/><polygon points="180,40 184.2,50 175.8,50" fill="#555555"/>
<line x1="180" y1="150" x2="180" y2="101" stroke="#b03a2e" stroke-width="3.5"/><polygon points="180,90 185.04,102 174.96,102" fill="#b03a2e"/>
<line x1="180" y1="150" x2="180" y2="199" stroke="#b03a2e" stroke-width="3.5"/><polygon points="180,210 174.96,198 185.04,198" fill="#b03a2e"/>
<line x1="180" y1="150" x2="289" y2="150" stroke="#b03a2e" stroke-width="3.5"/><polygon points="300,150 288,155.04 288,144.96" fill="#b03a2e"/>
<line x1="180" y1="150" x2="76" y2="150" stroke="#b03a2e" stroke-width="3.5"/><polygon points="65,150 77,144.96 77,155.04" fill="#b03a2e"/>
<line x1="220" y1="65" x2="249" y2="65" stroke="#1e8449" stroke-width="3"/><polygon points="260,65 248,70.04 248,59.96" fill="#1e8449"/>
<circle cx="180" cy="150" r="6" fill="#1f3a5f"/>
<text x="170" y="174" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="end">team 1</text>
<text x="351" y="156" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="180" y="30" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="192" y="109" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">N</tspan><tspan font-style="normal" font-size="14" dy="6">1</tspan><tspan dy="-6"></tspan></text>
<text x="192" y="205" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan><tspan font-style="normal" font-size="14" dy="6">1</tspan><tspan dy="-6"></tspan></text>
<text x="286" y="138" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">T</tspan></text>
<text x="79" y="138" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">1</tspan><tspan dy="-6"></tspan></text>
<text x="246" y="53" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
</g>
</g>
</svg>
