<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
<title id="title">A marble trapped in a crater</title>
<desc id="desc">A marble rolls in a bowl at the top of a volcano. It has enough kinetic energy to reach the dashed line but not to get over the rim, so it is trapped. If it could find a tunnel through the side, shown shaded, it would escape, roll downhill and gain kinetic energy.</desc>
<rect width="640" height="300" fill="#ffffff"/>
<defs><linearGradient id="volcano31" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3b48f"/><stop offset="1" stop-color="#fde7da"/></linearGradient></defs>
<path d="M 0 290 L 250 40 Q 320 150 390 40 L 640 290 Z" fill="url(#volcano31)" stroke="#c97a4a" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="255" y1="50" x2="385" y2="50" stroke="#222222" stroke-width="1.4" stroke-dasharray="6 4"/>
<defs><clipPath id="tunnel31"><polygon points="381.9,52 402,52 418,68 368.8,68"/></clipPath></defs>
<polygon points="381.9,52 402,52 418,68 368.8,68" fill="#9a9a9a"/>
<g clip-path="url(#tunnel31)"><line x1="350" y1="52" x2="366" y2="68" stroke="#5a5a5a" stroke-width="1"/><line x1="356" y1="52" x2="372" y2="68" stroke="#5a5a5a" stroke-width="1"/><line x1="362" y1="52" x2="378" y2="68" stroke="#5a5a5a" stroke-width="1"/><line x1="368" y1="52" x2="384" y2="68" stroke="#5a5a5a" stroke-width="1"/><line x1="374" y1="52" x2="390" y2="68" stroke="#5a5a5a" stroke-width="1"/><line x1="380" y1="52" x2="396" y2="68" stroke="#5a5a5a" stroke-width="1"/><line x1="386" y1="52" x2="402" y2="68" stroke="#5a5a5a" stroke-width="1"/><line x1="392" y1="52" x2="408" y2="68" stroke="#5a5a5a" stroke-width="1"/><line x1="398" y1="52" x2="414" y2="68" stroke="#5a5a5a" stroke-width="1"/><line x1="404" y1="52" x2="420" y2="68" stroke="#5a5a5a" stroke-width="1"/><line x1="410" y1="52" x2="426" y2="68" stroke="#5a5a5a" stroke-width="1"/><line x1="416" y1="52" x2="432" y2="68" stroke="#5a5a5a" stroke-width="1"/></g>
<circle cx="277.5" cy="58.8" r="11" fill="#7ac06a" stroke="#3f7f3a" stroke-width="1.5"/>
<line x1="291" y1="66" x2="298.19" y2="71.75" stroke="#222222" stroke-width="2"/>
<polygon points="306,78 294.66,74.56 300.16,67.69" fill="#222222"/>
<circle cx="467.8" cy="102.2" r="11" fill="#7ac06a" stroke="#3f7f3a" stroke-width="1.5"/>
<line x1="480" y1="118" x2="492.93" y2="130.93" stroke="#222222" stroke-width="2"/>
<polygon points="500,138 489.11,133.33 495.33,127.11" fill="#222222"/>
</svg>
