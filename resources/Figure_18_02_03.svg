<svg xmlns="http://www.w3.org/2000/svg" width="560" height="820" viewBox="0 0 560 820" role="img" aria-labelledby="title desc">
<title id="title">Charging by induction</title>
<desc id="desc">(a) Two neutral metal spheres on insulating stands touch each other. (b) A positively charged rod brought near the left sphere attracts negative charge to its near side, leaving positive charge on the far side of the right sphere. (c) The spheres are separated while the rod is still near, so the left sphere keeps a negative charge and the right sphere a positive one. (d) After the rod is removed, the spheres keep equal and opposite charges, which gather on the sides facing each other.</desc>
