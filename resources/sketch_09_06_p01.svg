<svg xmlns="http://www.w3.org/2000/svg" width="620" height="340" viewBox="0 0 620 340" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the forearm holding a book</title>
<desc id="desc">The forearm pivots at the elbow (the origin). +x points from the elbow toward the hand and +y up, and counterclockwise torques are positive. The biceps pulls up with F_B = 470 N, 4.00 cm from the elbow; the forearm’s weight w_a = 24.5 N acts down at 16.0 cm and the book’s weight w_b = 39.2 N at 38.0 cm; the elbow joint pushes down on the forearm with F_E.</desc>
