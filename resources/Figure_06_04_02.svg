<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
<title id="title">Rotating and inertial views of a merry-go-round</title>
<desc id="desc">Top views of counterclockwise rotation. In the rotating frame an outward fictitious centrifugal force balances the inward real force for a rider at rest. In the inertial frame a held rider has a real inward centripetal force; a separate unshaded released rider has zero net horizontal force and follows a straight tangent.</desc>
