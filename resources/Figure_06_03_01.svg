<svg xmlns="http://www.w3.org/2000/svg" width="560" height="900" viewBox="0 0 560 900" role="img" aria-labelledby="title desc">
<title id="title">Friction supplies the centripetal force</title>
<desc id="desc">Top: a car on a curve of large radius r with velocity v tangent to the path; friction f points toward the center. Bottom: on a curve of smaller radius r′ at the same speed v, the centripetal force Fc must be larger. Since Fc = mac, f = Fc is parallel to ac.</desc>
