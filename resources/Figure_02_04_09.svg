<svg xmlns="http://www.w3.org/2000/svg" width="510" height="218" viewBox="0 0 510 218" role="img" aria-labelledby="title desc">
<title id="title">Knowns for the decelerating subway train</title>
<desc id="desc">The train starts at v0 = 30.0 km/h to the right and stops (vf = 0 km/h); the acceleration a points left and is unknown.</desc>
<rect width="510" height="218" fill="#ffffff"/>
<line x1="25" y1="35" x2="226" y2="35" stroke="#5e9e1e" stroke-width="3"/>
<polygon points="240,35 225,41 225,29" fill="#5e9e1e"/>
<text x="130" y="64.65" font-family="'Times New Roman', Times, serif" font-size="19" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="13.3" dy="5.32"><tspan font-style="normal">0</tspan></tspan><tspan dy="-5.32">​</tspan><tspan font-style="normal"> = 30.0 </tspan><tspan font-style="normal">km/h</tspan></text>
<circle cx="122" cy="95" r="7" fill="#5e9e1e"/>
<text x="130" y="131.65" font-family="'Times New Roman', Times, serif" font-size="19" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="13.3" dy="5.32"><tspan font-style="normal">f</tspan></tspan><tspan dy="-5.32">​</tspan><tspan font-style="normal"> = 0 </tspan><tspan font-style="normal">km/h</tspan></text>
<line x1="150" y1="160" x2="82" y2="160" stroke="#6a3d9a" stroke-width="3"/>
<polygon points="68,160 83,154 83,166" fill="#6a3d9a"/>
<text x="115" y="191.65" font-family="'Times New Roman', Times, serif" font-size="19" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-style="normal"> = ?</tspan></text>
<line x1="392" y1="154" x2="454" y2="154" stroke="#333333" stroke-width="1.5"/>
<polygon points="462,154 453,157.6 453,150.4" fill="#333333"/>
