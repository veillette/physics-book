<title id="title">Knowns for the decelerating subway train</title>
<desc id="desc">The train starts at v0 = 30.0 km/h to the right and stops (vf = 0 km/h); the acceleration a points left and is unknown. An animated companion below illustrates the process; its complete static alternative is shown for reduced motion and print.</desc>
