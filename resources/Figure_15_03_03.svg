<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
<title id="title">Heat transfer and a heat engine</title>
<desc id="desc">(a) Heat flows spontaneously from a hot reservoir at T_h to a cold reservoir at T_c. (b) A heat engine takes heat Q_h from the hot reservoir, does work W, and gives heat Q_c to the cold reservoir, so W = Q_h − Q_c.</desc>
