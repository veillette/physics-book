<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the pass in the ground frame and the quarterback’s frame</title>
<desc id="desc">Axes with +x horizontal downfield and +y up (fixed to the ground). The quarterback’s velocity relative to the ground is v_Q/G = −2.00 m/s (backward). The ball’s velocity relative to the ground, v_b/G, is 15.2 m/s at 25.0° above +x. The ball’s velocity relative to the quarterback is v_b/Q = v_b/G − v_Q/G, drawn as v_b/G followed by +2.00 m/s; its magnitude and angle are unknown.</desc>
