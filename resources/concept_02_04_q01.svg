<svg xmlns="http://www.w3.org/2000/svg" width="460" height="400" viewBox="0 0 460 400" role="img" aria-labelledby="title desc">
<title id="title">Uniform circular motion</title>
<desc id="desc">A car moves around a circular track of radius 50 m at a constant speed of 20 m/s. At three positions the velocity arrow (green) is tangent to the circle and has the same length, while the acceleration arrow (purple) points toward the center. The speed is constant but the direction of the velocity changes, so the acceleration is not zero.</desc>
