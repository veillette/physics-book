<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Parallel rays reflected by spherical mirrors</title>
<desc id="desc">(a) Parallel rays reflected from a large spherical mirror do not all cross at one point: rays far from the axis cross closer to the mirror. (b) A spherical mirror that is small compared with its radius of curvature focuses parallel rays, including rays 1, 2 and 3, to a common focal point F, a distance f from the mirror.</desc>
