<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the lever lifting the mower</title>
<desc id="desc">The 2.0-m lever pivots on the fulcrum (the origin). +x points from the mower end toward your hands and +y up, and counterclockwise torques are positive. The mower pushes down on the left end with F_o = 2450 N at l_o (counterclockwise torque); you push down on the right end with F_i = 300 N at l_i (clockwise torque); l_o + l_i = 2.0 m.</desc>
