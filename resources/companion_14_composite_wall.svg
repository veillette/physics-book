<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc">
<title id="title">Temperature drops across an insulated composite wall</title>
<desc id="desc">A series model of a wall at steady state has gypsum 1.25 cm thick with conductivity 0.17, insulation 9 cm with conductivity 0.04, and brick 10 cm with conductivity 0.72 watts per meter kelvin. The material surfaces are at 20 and 0 Celsius. The calculated heat flux is approximately 8.12 watts per square meter. Temperature is continuous at ideal interfaces and drops most steeply in the insulation. Studs, air films, and contact resistances are excluded.</desc>
