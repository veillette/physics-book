<svg xmlns="http://www.w3.org/2000/svg" width="640" height="880" viewBox="0 0 640 880" role="img" aria-labelledby="title desc">
<title id="title">Isobaric expansion</title>
<desc id="desc">A vertical cylinder of gas of volume V with a piston of area A on top. Heat Q_in flows into the gas, which pushes up on the piston with force F = PA and raises it a distance d at constant pressure. The volume increases by ΔV = Ad, and the work done is W_out = Fd = PAd = PΔV.</desc>
