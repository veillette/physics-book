<svg xmlns="http://www.w3.org/2000/svg" width="620" height="420" viewBox="0 0 620 420" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the forearm lowered 30° below the horizontal</title>
<desc id="desc">The forearm pivots at the elbow (the origin) and points 30° below the horizontal. +x points to the right and +y up, and counterclockwise torques are positive. As in Figure 1, the biceps force F_B is vertical (up, 4.00 cm along the forearm) and the weights w_a (at 16.0 cm) and w_b (at 38.0 cm) are vertical (down). The perpendicular lever arm of each vertical force is its distance along the forearm times cos 30°.</desc>
