<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" aria-labelledby="title desc">
<title id="title">Actual and effective force versus time</title>
<desc id="desc">A graph of force F versus time t. The actual force rises smoothly from zero at t1 to a peak midway between t1 and t2 and falls back to zero at t2. The effective force Feff is constant from t1 to t2 at half the peak value. The area under the actual-force curve equals the area of the Feff rectangle, so both forces deliver the same impulse.</desc>
