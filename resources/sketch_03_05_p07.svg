<svg xmlns="http://www.w3.org/2000/svg" width="460" height="300" viewBox="0 0 460 300" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the jet’s velocity with +x west and +y south</title>
<desc id="desc">This solution uses +x pointing WEST and +y pointing SOUTH, origin at the airplane. The airplane’s velocity relative to the air, v_p/a = 260 m/s, points 5.0° south of west (just below +x). The wind, v_a/E = 35.0 m/s at 15° south of east, has a negative x-component and a positive y-component. Their sum is v_p/E, unknown.</desc>
