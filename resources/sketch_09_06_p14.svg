<line x1="300" y1="166" x2="300" y2="268" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="556.3" y1="166" x2="556.3" y2="268" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
