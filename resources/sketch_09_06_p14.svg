<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the seesaw with the second child off the end</title>
<desc id="desc">The 3.00-m seesaw pivots at its center (the origin), so each side is 1.50 m long. +x points to the right and +y up, and counterclockwise torques are positive. The 30.0-kg child sits 1.40 m to the left of the pivot (counterclockwise torque); the 18.0-kg child would have to sit r_2 to the right (clockwise torque), beyond the 1.50-m end of the board.</desc>
