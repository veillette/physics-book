<line x1="135" y1="160" x2="465" y2="160" stroke="#a9c2d9" stroke-width="10" stroke-linecap="round"/>
<line x1="135" y1="160" x2="465" y2="160" stroke="#1f3a5f" stroke-width="1.4"/>
<polygon points="300,165 290.9,178 309.1,178" fill="#999999" stroke="#555555" stroke-width="1.2"/>
<line x1="146" y1="166" x2="146" y2="268" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
