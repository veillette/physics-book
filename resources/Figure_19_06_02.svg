<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="title desc">
<title id="title">Capacitors in parallel</title>
<desc id="desc">(a) Three capacitors C1, C2 and C3 connected in parallel across a battery of voltage V, each holding its own charge, ±Q1, ±Q2 and ±Q3. (b) The equivalent capacitor Cp = C1 + C2 + C3 has a larger plate area and holds the total charge +Q = Q1 + Q2 + Q3 on one plate and −Q = −Q1 − Q2 − Q3 on the other.</desc>
