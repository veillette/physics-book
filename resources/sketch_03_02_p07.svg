<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the vector differences A − B and B − A</title>
<desc id="desc">Two panels, each with +x east and +y north and the origin at the start. (a) A, 12.0 m at 20.0° west of north (110° from +x), followed by −B, 20.0 m at 40.0° north of east (40° from +x); their sum R′ = A − B ends in the first quadrant. (b) B, 20.0 m at 40.0° south of west (220° from +x), followed by −A, 12.0 m at 20.0° east of south (290° from +x); their sum R″ = B − A ends in the third quadrant, opposite to R′.</desc>
