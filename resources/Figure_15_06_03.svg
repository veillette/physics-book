<svg xmlns="http://www.w3.org/2000/svg" width="880" height="820" viewBox="0 0 880 820" role="img" aria-labelledby="title desc">
<title id="title">Irreversible and reversible heat transfer</title>
<desc id="desc">(a) Heat Q flows directly from a hot reservoir at T_h to a cold one at T_c, an irreversible process. (b) The same heat leaves the hot reservoir in one reversible process and enters the cold reservoir in another. The entropy change is the same either way: ΔS_irrev = ΔS_rev.</desc>
