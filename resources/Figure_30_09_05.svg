<svg xmlns="http://www.w3.org/2000/svg" width="420" height="160" viewBox="0 0 420 160" role="img" aria-labelledby="title desc">
<title id="title">Reading electron configuration notation</title>
<desc id="desc">In the notation 2p³, the 2 is the principal quantum number n, the letter p stands for the angular momentum quantum number ℓ, and the superscript 3 is the number of electrons in that subshell.</desc>
<rect width="420" height="160" fill="#ffffff"/>
<text x="60" y="83.9" font-family="'Times New Roman', Times, serif" font-size="34" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">2</tspan><tspan font-style="italic">p</tspan><tspan font-size="23.8" dy="-13.6"><tspan font-style="normal">3</tspan></tspan><tspan dy="13.6">​</tspan></text>
<line x1="26" y1="130" x2="45.79" y2="101.08" stroke="#222222" stroke-width="1.8"/>
<polygon points="52,92 49.19,104.61 41.26,99.19" fill="#222222"/>
<text x="18" y="149.1" font-family="'Times New Roman', Times, serif" font-size="26" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">n</tspan></text>
<line x1="150" y1="132" x2="101.06" y2="98.25" stroke="#222222" stroke-width="1.8"/>
<polygon points="92,92 104.6,94.86 99.15,102.76" fill="#222222"/>
<text x="160" y="149.1" font-family="'Times New Roman', Times, serif" font-size="26" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">ℓ </tspan><tspan font-style="normal">symbol</tspan></text>
<line x1="150" y1="40" x2="108.51" y2="52.77" stroke="#222222" stroke-width="1.8"/>
<polygon points="98,56 108.06,47.88 110.88,57.06" fill="#222222"/>
<text x="160" y="44.4" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">number</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">of</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">electrons</tspan></text>
</svg>
