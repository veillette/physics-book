<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img" aria-labelledby="title desc">
<title id="title">Quantum tunneling</title>
<desc id="desc">A potential barrier and the wave function of a particle. Inside the nucleus, on the left, the wave function is a sinusoid of wavelength λ = h/p. Inside the barrier it decreases exponentially rather than dropping to zero. Outside, on the right, it is again sinusoidal with the same wavelength but much smaller amplitude, so there is a small chance of finding the particle outside: it can tunnel through.</desc>
