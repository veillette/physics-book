<svg xmlns="http://www.w3.org/2000/svg" width="460" height="860" viewBox="0 0 460 860" role="img" aria-labelledby="title desc">
<title id="title">A parallel-plate capacitor</title>
<desc id="desc">Two parallel plates, each of area A, face each other a distance d apart, with a uniform electric field drawn as arrows from the left plate to the right plate. The left plate is wired to the battery’s positive terminal and carries +Q; the right plate is wired to the negative terminal and carries −Q.</desc>
