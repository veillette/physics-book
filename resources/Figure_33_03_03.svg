<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">Synchrotron ring and drift tubes</title>
<desc id="desc">(a) A synchrotron: a ring of evenly spaced accelerating tubes around a circular beam path. (b) A proton between two tubes is pushed forward by the electric field E from the positive tube behind it toward the negative tube ahead. (c) After the proton enters the tube and coasts through it, the voltages reverse, so the field in the next gap again pushes it forward.</desc>
