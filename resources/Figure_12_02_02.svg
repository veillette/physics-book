<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
<title id="title">Four examples of fluid entrainment</title>
<desc id="desc">Four labeled line drawings show a gas jet drawing air into a Bunsen burner, an air jet drawing liquid into an atomizer, a fast water stream drawing air through an aspirator side branch, and rising chimney gases drawing room air into a draft hood. Blue arrows mark primary flow and orange arrows mark entrained secondary flow. Chimney draft includes a buoyancy contribution.</desc>
