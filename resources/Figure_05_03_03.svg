<svg xmlns="http://www.w3.org/2000/svg" width="850" height="560" viewBox="0 0 850 560" role="img" aria-labelledby="title desc">
<title id="title">Tension and compression of a rod</title>
<desc id="desc">Two equal opposing axial forces stretch a rod in tension and shorten an identical rod in compression. Dotted outlines show the original top at length L₀. The change ΔL has equal magnitude for small elastic deformations under the same force magnitude.</desc>
