<line x1="190" y1="175" x2="190" y2="140" stroke="#666666" stroke-width="1.3" stroke-dasharray="6 5"/>
<line x1="280" y1="175" x2="280" y2="140" stroke="#666666" stroke-width="1.3" stroke-dasharray="6 5"/>
<rect x="190" y="140" width="90" height="260" fill="#d0e3f2" stroke="#547fa3" stroke-width="1.5"/>
<path d="M 190 400 A 45 13 0 0 0 280 400" fill="#d0e3f2" stroke="#547fa3" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="235" cy="140" rx="45" ry="13" fill="#e8f2fa" stroke="#547fa3" stroke-width="2"/>
<path d="M 190 175 A 45 13 0 1 1 280 175" fill="none" stroke="#666666" stroke-width="1.3" stroke-dasharray="6 5" stroke-linejoin="round"/>
<g id="tension-forces">
