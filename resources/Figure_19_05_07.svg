<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">The polar water molecule</title>
<desc id="desc">Left: a schematic water molecule, an oxygen atom O bonded to two hydrogen atoms H with 104.5° between the bonds. Right: its electron cloud, drawn as shading that is densest around the oxygen nucleus. Electrons crowd toward the oxygen, leaving a net positive charge near the two hydrogen nuclei, marked +. Bottom left: the molecule as a whole has an inherent separation of charge, positive on one side and negative on the other.</desc>
