<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" aria-labelledby="title desc">
<title id="title">Current is the rate of flow of charge</title>
<desc id="desc">Charges q move to the right along a section of wire and pass through a cross-sectional area A. The current is the charge that flows through A per unit time; one ampere is one coulomb through the area each second.</desc>
