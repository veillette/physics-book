<svg xmlns="http://www.w3.org/2000/svg" width="760" height="770" viewBox="0 0 760 770" role="img" aria-labelledby="title desc">
<title id="title">A collision in a dark room</title>
<desc id="desc">Net F = 0. Before: p1 = ptot. After: p1′ + p2′ = ptot. Mass m1 moves to the right with velocity v1 into a dark room, where it strikes m2 = 0.400 kg, initially at rest (v2 = 0). Mass m1 leaves through the top of the room with velocity v1′ at θ1 = 45° above its incoming direction. The final velocity v2′ and angle θ2 of m2 are unknown. An x–y axis indicator shows x to the right and y up.</desc>
