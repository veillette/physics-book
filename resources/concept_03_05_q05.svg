<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-labelledby="title desc">
<title id="title">Velocity of the clod relative to the truck and to the ground</title>
<desc id="desc">Vector diagram: the clod’s velocity relative to the truck, v_CT, points straight down. Adding the truck’s velocity relative to the ground, v_TG, which points horizontally forward, gives the clod’s velocity relative to the ground, v_CG, which points forward and down.</desc>
<rect width="440" height="300" fill="#ffffff"/>
<line x1="110" y1="50" x2="298.4" y2="50" stroke="#1f77c8" stroke-width="3"/>
<polygon points="310,50 297.4,55.04 297.4,44.96" fill="#1f77c8"/>
<line x1="310" y1="50" x2="310" y2="228.4" stroke="#c62828" stroke-width="3"/>
<polygon points="310,240 304.96,227.4 315.04,227.4" fill="#c62828"/>
<line x1="110" y1="50" x2="300" y2="230.5" stroke="#8e4f8e" stroke-width="4"/>
<polygon points="310,240 295.19,234.1 303.35,225.51" fill="#8e4f8e"/>
<text x="210" y="37.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">v<tspan font-size="9.92" font-weight="normal" dx="-8.56" dy="-6.72">→</tspan><tspan dx="-0.56" dy="6.72">​</tspan></tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">TG</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> (</tspan><tspan font-style="normal">truck</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">rel</tspan><tspan font-style="normal">. </tspan><tspan font-style="normal">ground</tspan><tspan font-style="normal">)</tspan></text>
<text x="324" y="150.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">v<tspan font-size="10.54" font-weight="normal" dx="-9.1" dy="-7.14">→</tspan><tspan dx="-0.6" dy="7.14">​</tspan></tspan><tspan font-size="11.9" dy="4.76"><tspan font-style="normal">CT</tspan></tspan><tspan dy="-4.76">​</tspan></text>
<text x="324" y="171.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">clod</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">rel</tspan><tspan font-style="normal">. </tspan><tspan font-style="normal">truck</tspan><tspan font-style="normal">)</tspan></text>
<text x="235.15" y="144.5" font-family="'Times New Roman', Times, serif" font-size="17" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">v<tspan font-size="10.54" font-weight="normal" dx="-9.1" dy="-7.14">→</tspan><tspan dx="-0.6" dy="7.14">​</tspan></tspan><tspan font-size="11.9" dy="4.76"><tspan font-style="normal">CG</tspan></tspan><tspan dy="-4.76">​</tspan></text>
<text x="185" y="176.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">clod</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">rel</tspan><tspan font-style="normal">. </tspan><tspan font-style="normal">ground</tspan><tspan font-style="normal">)</tspan></text>
<polyline points="298,50 298,62 310,62" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
