<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" role="img" aria-labelledby="title desc">
<title id="title">Space quantization of angular momentum</title>
<desc id="desc">For ℓ = 1 the angular momentum L has magnitude √2 ħ and its z-component Lz can be only ħ, 0 or −ħ (mℓ = 1, 0, −1). L therefore lies at θ1 = 45°, θ2 = 90° or θ3 = 135° from the z axis, anywhere around a cone; the shaded circles show where the tip of L can be.</desc>
