<text x="516" y="191.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">east</tspan><tspan font-style="normal">)</tspan></text>
<line x1="300" y1="320" x2="300" y2="39" stroke="#555555" stroke-width="1.5"/>
<polygon points="300,30 304,40 296,40" fill="#555555"/>
