<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the two cars colliding at the intersection</title>
<desc id="desc">Axes with +x east and +y north, origin at the intersection. Car 1 (1200 kg) approaches moving due south, v_1y = −8.00 m/s. Car 2 (850 kg) approaches moving due west, v_2x = −17.0 m/s. After they stick together, they move with unknown velocity v_f at an unknown angle θ south of west.</desc>
