<svg xmlns="http://www.w3.org/2000/svg" width="540" height="520" viewBox="0 0 540 520" role="img" aria-labelledby="title desc">
<title id="title">Phase diagram for water</title>
<desc id="desc">Pressure versus temperature for water, with nonlinear axes not to scale. The solid (s), liquid (l), and vapor (v) regions meet at the triple point, 0.006 atm and 0.01 °C. The solid–liquid boundary rises steeply and leans to the left: raising the pressure lowers the melting point. The liquid–vapor boundary passes through 1 atm at 100 °C and ends at the critical point, 218 atm and 374 °C. Below the triple point, solid sublimes directly to vapor.</desc>
