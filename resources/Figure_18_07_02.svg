<svg xmlns="http://www.w3.org/2000/svg" width="440" height="640" viewBox="0 0 440 640" role="img" aria-labelledby="title desc">
<title id="title">Electric field at the surface of a conductor</title>
<desc id="desc">(a) An electric field E at a conductor’s surface, drawn with its component E⊥ perpendicular to the surface and E∥ parallel to it. The parallel component exerts a force F∥ = qE∥ on a free charge q at the surface, moving it along the surface. (b) In static equilibrium the charges have moved until the field is perpendicular to the surface, so there is no parallel force.</desc>
