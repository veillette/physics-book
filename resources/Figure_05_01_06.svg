<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="435" viewBox="0 0 1000 435" role="img" aria-labelledby="title desc">
<title id="title">Ice skaters pushing with two forces</title>
<desc id="desc">Panel a is an overhead view of two skaters pushing a third, with F₁ rightward and F₂ upward along their arms. Her skate blades point along the northeast resultant. A head-to-tail triangle adds the two pushes. Panel b shows the horizontal forces on her: F₁, F₂, and friction opposite the motion or attempted motion. The vertical weight and normal force balance out of the page.</desc>
