<svg xmlns="http://www.w3.org/2000/svg" width="560" height="600" viewBox="0 0 560 600" role="img" aria-labelledby="title desc">
<title id="title">The voltage of an AC source</title>
<desc id="desc">The potential difference V = V0 sin 2πft between the terminals of an AC source, drawn as a sine wave between +V0 and −V0 versus time t. At the positive peaks the source’s left terminal is positive, as in the circuit drawn above the graph; at the negative peaks the polarity is reversed, as in the circuit drawn below.</desc>
