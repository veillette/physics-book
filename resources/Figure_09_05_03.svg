<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">Crank, car axle, and pulley as simple machines</title>
<desc id="desc">(a) A crank with a long input radius r_i and a short but nonzero output shaft radius r_o. Both delivered forces are tangential and drive clockwise rotation; F_o is the force on the driven shaft. (b) A small axle drives a larger wheel: F_i is tangential at the top of the axle and F_o is the leftward force delivered to the road at the bottom of the wheel. Both radii are perpendicular to their forces. (c) A single fixed pulley carries one continuous rope over its upper rim, with the input pulled down on the left and a connected load supported on the right. Equal lever arms give F_i = F_o = T and MA = 1.</desc>
