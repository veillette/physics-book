<svg xmlns="http://www.w3.org/2000/svg" width="740" height="670" viewBox="0 0 740 670" role="img" aria-labelledby="title desc">
<title id="title">Nail puller lever</title>
<desc id="desc">The hand pushes down with F_i at the long handle. The puller rests directly on the plank at the pivot, which supplies upward N. The nail pushes down on the claw with F_n. Horizontal perpendicular arms l_i and l_o straddle the pivot, with l_i much longer. The dashed upward F_o acts on the nail, not on the puller, and equals F_n in magnitude. The separate free-body diagram includes only the three forces on the puller.</desc>
