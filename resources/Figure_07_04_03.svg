<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="262" viewBox="0 0 1030 262" role="img" aria-labelledby="title desc">
<title id="title">A spring-launched toy car on two possible paths</title>
<desc id="desc">A compressed spring launches a toy race car to the right along a level track. The path of the car curves gently upward and levels off h = 18 cm above its starting level. An alternate path first dips down, goes around a vertical loop, and then climbs to the same level, 18 cm above the start.</desc>
