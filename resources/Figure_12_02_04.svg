<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="title desc">
<title id="title">Measuring fluid speed with a manometer</title>
<desc id="desc">(a) A manometer is connected to two small tubes in a flow. Tube 1 opens facing the flow, creating a dead spot where v1 = 0; tube 2 opens on its side, where the fluid passes at speed v2. By Bernoulli’s principle the pressure is higher at tube 1, and the manometer’s fluid levels differ by h proportional to the dynamic pressure ½ρv2². (b) A Pitot tube combines the two openings in one device, with the same reading.</desc>
