<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520" viewBox="0 0 700 520" role="img" aria-labelledby="title desc">
<title id="title">A short circuit</title>
<desc id="desc">(a) A toaster of resistance R is plugged into an AC outlet. Worn insulation lets the two wires of its cord touch, through a small resistance r. (b) The schematic: the AC source drives the low resistance r in parallel with the toaster’s R, so a very large current flows through r and the cord overheats.</desc>
