<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" role="img" aria-labelledby="title desc">
<title id="title">Archimedes’ principle</title>
<desc id="desc">(a) An object submerged in a fluid has weight w_obj acting down and a buoyant force F_B acting up; in this case the weight is larger, so the object sinks. (b) If the object is removed, the space it occupied fills with fluid of weight w_fl. That fluid is held up by the same buoyant force, so F_B = w_fl: the buoyant force equals the weight of the fluid displaced. A free-body diagram beside each panel shows the forces.</desc>
