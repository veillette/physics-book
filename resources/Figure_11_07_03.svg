<text x="155" y="381.35" font-family="'Times New Roman', Times, serif" font-size="21" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">F<tspan font-size="13.02" font-weight="normal" dx="-12.93" dy="-17.22">→</tspan><tspan dx="-0.09" dy="17.22">​</tspan></tspan><tspan font-size="14.7" dy="5.88"><tspan font-style="normal">B</tspan></tspan><tspan dy="-5.88">​</tspan></text>
