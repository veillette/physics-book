<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">A ray entering the end of an optical fiber</title>
<desc id="desc">A ray in medium n1 strikes the flat end of a fiber of index n2 at angle θ1 to the fiber’s axis, refracts to angle θ2, and then strikes the side of the fiber at angle θ3 to its normal, where it may be totally internally reflected.</desc>
