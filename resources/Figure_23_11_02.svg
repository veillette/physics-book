<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="title desc">
<title id="title">An AC voltage source driving a capacitor</title>
<desc id="desc">(a) An AC source V in series with a capacitor C of negligible resistance; V_C is the voltage across the capacitor. (b) The voltage V starts at its maximum while the current I starts at zero and goes negative first, peaking a quarter cycle before the voltage: the voltage follows the current by 90°. Points a to e mark successive quarter periods.</desc>
