<svg xmlns="http://www.w3.org/2000/svg" width="560" height="680" viewBox="0 0 560 680" role="img" aria-labelledby="title desc">
<title id="title">A heat pump with friction</title>
<desc id="desc">A heat pump driven by work W. Part of W is done against friction and is lost as heat Q_f to the cold reservoir; the remainder, W′, together with Q_c taken from the cold reservoir, is delivered to the hot reservoir as Q_h.</desc>
