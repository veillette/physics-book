<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the crate pushed up the ramp</title>
<desc id="desc">A ramp rises at 20.0° to the right. +x points up the ramp, the direction of the push and of the motion; a vertical +y axis (up) measures height, with 0 at the bottom of the ramp and 1.37 m at the top. The crate moves d = 4.00 m along +x while the man pushes it with F = 500 N, also along +x. Both the crate and the man rise h = d sin 20.0° = 1.37 m.</desc>
