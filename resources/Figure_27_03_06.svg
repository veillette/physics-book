<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
<title id="title">The double-slit interference pattern</title>
<desc id="desc">Left: light from two slits a distance d apart reaches a screen a distance x away. The intensity on the screen peaks at the center and at angles θ1 and θ2, a distance y1 and y2 from the center, with the peaks growing dimmer away from the center. Right: the pattern of bright fringes as seen on the screen.</desc>
