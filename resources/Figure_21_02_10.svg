<line x1="340" y1="200" x2="340" y2="207" stroke="#222222" stroke-width="2"/>
<line x1="340" y1="263" x2="340" y2="270" stroke="#222222" stroke-width="2"/>
<polyline points="340,207 329,211.67 351,221 329,230.33 351,239.67 329,249 351,258.33 340,263" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
