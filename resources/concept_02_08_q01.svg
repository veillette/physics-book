<svg xmlns="http://www.w3.org/2000/svg" width="545" height="410" viewBox="0 0 545 410" role="img" aria-labelledby="title desc">
<title id="title">Tangent lines on the position graph of Figure 9</title>
<desc id="desc">The position-versus-time curve of Figure 9 with dashed tangent lines at points a, d and e. The tangent at a is the steepest (greatest velocity), the tangent at d is horizontal (zero velocity), and the tangent at e slopes slightly downward (negative velocity).</desc>
