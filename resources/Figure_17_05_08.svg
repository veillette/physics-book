<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-labelledby="title desc">
<title id="title">The first overtone of a tube closed at one end</title>
<desc id="desc">A tube of length L closed at its left end, with its air in the first overtone: no displacement at the closed end, a node a third of the way from the open end, and the most displacement at the open end. Three quarters of a wavelength fit in the tube, (3/4)λ′ = L, so λ′ = 4L/3; the dashed curve continues the wave beyond the open end.</desc>
<rect width="640" height="380" fill="#ffffff"/>
