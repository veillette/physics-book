<svg xmlns="http://www.w3.org/2000/svg" width="660" height="299" viewBox="0 0 660 299" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the bicycle sprint</title>
<desc id="desc">A horizontal +x axis points toward the finish line, with the origin where the winner starts to accelerate. Winner: t = 0, x_0 = 0, v_0 = +11.5 m/s, a = +0.500 m/s² for 7.00 s, then constant speed (a = 0). The other racer (orange) starts 5.00 m ahead, at x = 5.00 m, moving at a constant +11.8 m/s. The finish line is at x = 300 m.</desc>
<rect width="660" height="299" fill="#ffffff"/>
<line x1="30" y1="122" x2="600" y2="122" stroke="#8d6e63" stroke-width="2.2"/>
<line x1="30" y1="156" x2="580" y2="156" stroke="#555555" stroke-width="1.6"/>
<polygon points="590,156 579,160.4 579,151.6" fill="#555555"/>
<text x="606" y="161.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="590" y="180.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">direction</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">of</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">motion</tspan><tspan font-style="normal">)</tspan></text>
<line x1="90" y1="151" x2="90" y2="161" stroke="#555555" stroke-width="1.6"/>
<text x="90" y="177.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">0</tspan></text>
<line x1="140" y1="151" x2="140" y2="161" stroke="#555555" stroke-width="1.6"/>
<text x="140" y="177.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">5.00 </tspan><tspan font-style="normal">m</tspan></text>
<circle cx="90" cy="110" r="7" fill="#1f3a5f"/>
<text x="90" y="98.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f3a5f" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">winner</tspan></text>
<line x1="90" y1="72" x2="123.4" y2="72" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="135,72 122.4,77.04 122.4,66.96" fill="#3f8a1e"/>
<text x="112.5" y="63.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan></text>
<text x="90" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">t</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 0</tspan></text>
<text x="90" y="226.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">x</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 0</tspan></text>
<text x="90" y="247.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = +11.5 </tspan><tspan font-style="normal">m/s</tspan></text>
<line x1="90" y1="151" x2="90" y2="161" stroke="#555555" stroke-width="1.6"/>
<circle cx="290" cy="110" r="7" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<line x1="290" y1="72" x2="338.4" y2="72" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="350,72 337.4,77.04 337.4,66.96" fill="#3f8a1e"/>
<text x="320" y="63.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">1</tspan></tspan><tspan dy="-4.48">​</tspan></text>
<text x="290" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">t</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">1</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 7.00 </tspan><tspan font-style="normal">s</tspan></text>
<text x="290" y="226.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">x</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">1</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = ?</tspan></text>
<text x="290" y="247.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">1</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = ?</tspan></text>
<line x1="290" y1="151" x2="290" y2="161" stroke="#555555" stroke-width="1.6"/>
<text x="560" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">finish</tspan></text>
<text x="560" y="226.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">x</tspan><tspan font-style="normal"> = 300 </tspan><tspan font-style="normal">m</tspan></text>
<line x1="560" y1="151" x2="560" y2="161" stroke="#555555" stroke-width="1.6"/>
<line x1="160" y1="40" x2="198.4" y2="40" stroke="#6a3d9a" stroke-width="3"/>
<polygon points="210,40 197.4,45.04 197.4,34.96" fill="#6a3d9a"/>
<text x="185" y="30.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#6a3d9a" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-style="normal"> = +0.500 </tspan><tspan font-style="normal">m/s</tspan><tspan font-size="11.2" dy="-6.4"><tspan font-style="normal">2</tspan></tspan><tspan dy="6.4">​</tspan></text>
<text x="420" y="30.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#6a3d9a" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">then</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">a</tspan><tspan font-style="normal"> = 0</tspan></text>
<line x1="560" y1="52" x2="560" y2="122" stroke="#222222" stroke-width="3" stroke-dasharray="6 4"/>
<circle cx="140" cy="110" r="7" fill="#d35400"/>
<text x="330" y="277.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#d35400" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">other</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">racer</tspan><tspan font-style="normal"> (</tspan><tspan font-style="normal">orange</tspan><tspan font-style="normal">): </tspan><tspan font-style="italic">x</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 5.00 </tspan><tspan font-style="normal">m</tspan><tspan font-style="normal">, </tspan><tspan font-style="italic">v</tspan><tspan font-style="normal"> = +11.8 </tspan><tspan font-style="normal">m/s</tspan><tspan font-style="normal"> (</tspan><tspan font-style="normal">constant</tspan><tspan font-style="normal">)</tspan></text>
</svg>
