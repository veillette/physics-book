<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-labelledby="title desc">
<title id="title">Acceptance angle of an optical fiber</title>
<desc id="desc">A ray enters the end of an optical fiber at the edge of its cone of acceptance, making angle αmax with the axis, bends toward the axis as it enters the core, and is guided along the core by total internal reflection at the boundary with the cladding. The two lines bounding the full acceptance angle meet at the fiber’s end.</desc>
