<svg xmlns="http://www.w3.org/2000/svg" width="480" height="230" viewBox="0 0 480 230" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the punt and the gust at the top</title>
<desc id="desc">Axes with +x horizontal downfield and +y up, origin at the kick on level ground. The ball leaves at unknown speed v_0 at 45.0° above +x; without wind it would land at x = 60.0 m. At the top of its path a gust reduces v_x by 1.50 m/s, so it lands short of 60.0 m, at an unknown distance. The acceleration is a_y = −9.80 m/s², a_x = 0 except during the gust.</desc>
