<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="title desc">
<title id="title">The work done by friction depends on the path</title>
<desc id="desc">Two identical happy faces are erased from point A to point B. (a) A straight diagonal stroke erases a narrow band. (b) A winding stroke between the same points erases much more of the face. More work is done against friction along the longer path.</desc>
