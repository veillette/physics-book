<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="title desc">
<title id="title">An idealized ocean wave</title>
<desc id="desc">A sinusoidal water wave with two crests and two troughs moves right at speed vw. A dashed line marks the undisturbed water level. Crests rise a height X above it and troughs dip X below it, labeled −X, so a sea gull floating in a trough sits 2X below where it was on the crest; its earlier position is shown faded above. The wavelength λ is the distance between adjacent crests.</desc>
