<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-labelledby="title desc">
<title id="title">Superposition of non-identical waves</title>
<desc id="desc">Wave 1 has a long wavelength and large amplitude; wave 2 has a wavelength one fifth as long and a smaller amplitude. Their sum, the resultant, is an irregular wave: in some places the two add (constructive interference) and in others they partly cancel (destructive interference).</desc>
