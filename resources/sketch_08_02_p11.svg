<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the water from the fire hose striking the wall</title>
<desc id="desc">A horizontal +x axis points from the hose toward the wall. The water arrives with v_i = +42.0 m/s at 50.0 kg/s and is stopped (v_f = 0). The wall pushes on the water along −x; by Newton’s third law the water pushes on the wall along +x.</desc>
