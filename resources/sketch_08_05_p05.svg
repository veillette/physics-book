<svg xmlns="http://www.w3.org/2000/svg" width="620" height="508" viewBox="0 0 620 508" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the docking satellites in two frames of reference</title>
<desc id="desc">A horizontal +x axis points from satellite 2 toward satellite 1 in both frames. (a) Frame where satellite 1 is at rest: satellite 2 (7.50 × 10³ kg) approaches at v_2 = +0.250 m/s; after docking both move at unknown v_f. (c) Frame where satellite 2 is at rest: satellite 1 (4.00 × 10³ kg) approaches at v_1 = −0.250 m/s; after docking both move at unknown v_f.</desc>
