<polygon points="135,86 205,86 205,60 135,60" fill="#d6e4f0" stroke="#1f3a5f" stroke-width="2"/>
<text x="170" y="108.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">satellite</tspan><tspan font-style="normal"> 2</tspan></text>
