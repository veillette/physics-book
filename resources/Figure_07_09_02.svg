<title id="title">World total energy supply, 2015–2025</title>
<desc id="desc">A line chart of reported annual total energy supply, using physical energy content accounting throughout. Supply rises from 523.80 EJ in 2015 to 600.31 EJ in 2025, with a decline from 556.63 EJ in 2019 to 532.75 EJ in 2020. All points are historical estimates; no forecasts are shown.</desc>
