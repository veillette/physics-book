<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">Global primary energy consumption by energy source, 2010–2050</title>
<desc id="desc">A stacked area chart in quadrillion British thermal units. Total use grows from about 540 in 2010 to about 600 in 2020 (history) and is projected to reach about 890 by 2050. Petroleum and other liquids, natural gas, coal and nuclear grow slowly; renewables grow fastest, from about 60 to about 235.</desc>
