<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1260" viewBox="0 0 500 1260" role="img" aria-labelledby="title desc">
<title id="title">Capacitors in series</title>
<desc id="desc">(a) Three capacitors C1, C2 and C3 connected in series across a battery of voltage V. Each has charge +Q on one plate and −Q on the other. (b) The equivalent capacitor Cs, with the same charges ±Q, has a larger plate separation d, so its capacitance is less than that of any of the individual capacitors.</desc>
