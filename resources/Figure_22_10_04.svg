<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">A long straight wire near a rectangular current loop</title>
<desc id="desc">A long straight wire at the top carries I1 = 15.0 A to the right. Below it, 7.50 cm away, is the top of a rectangular loop 30.0 cm wide and 10.0 cm tall carrying I2 = 30.0 A counterclockwise: right along the bottom, up the right side, left along the top and down the left side.</desc>
