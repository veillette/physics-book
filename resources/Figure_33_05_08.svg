<title id="title">Quark diagram of π⁺ + p → Δ⁺⁺</title>
<desc id="desc">The π⁺ (an up quark and an anti-down quark) and the proton (down, up, up) combine. The pion’s anti-down quark annihilates with the proton’s down quark, exchanging gluons with the other quarks, and the three remaining up quarks form the Δ⁺⁺.</desc>
