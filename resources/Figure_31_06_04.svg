<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
<title id="title">The range of the nuclear force</title>
<desc id="desc">A nucleus drawn as a cluster of nucleons. A dashed circle around one nucleon at its edge shows the range of the nuclear force: only the nucleons inside the circle feel that nucleon’s nuclear attraction directly.</desc>
