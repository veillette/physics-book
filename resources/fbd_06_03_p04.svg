<svg xmlns="http://www.w3.org/2000/svg" width="440" height="360" viewBox="0 0 440 360" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of a car on a curve banked at 20 degrees</title>
<desc id="desc">Free-body diagram with +x horizontally toward the center of the curve and +y up: normal force N tilted 20 degrees from the vertical toward the center, with dashed components N sin theta along +x and N cos theta along +y; weight w down. No friction. The acceleration points toward the center.</desc>
