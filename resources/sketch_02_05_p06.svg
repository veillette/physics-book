<svg xmlns="http://www.w3.org/2000/svg" width="600" height="269" viewBox="0 0 600 269" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the runner slowing down</title>
<desc id="desc">A horizontal +x axis points in the direction the runner is moving, with the origin where she starts to slow down. Start: t = 0, x_0 = 0, v_0 = +9.00 m/s. After 5.00 s: x and v unknown. The acceleration points in −x: a = −2.00 m/s².</desc>
<rect width="600" height="269" fill="#ffffff"/>
<line x1="30" y1="122" x2="540" y2="122" stroke="#8d6e63" stroke-width="2.2"/>
<line x1="30" y1="156" x2="520" y2="156" stroke="#555555" stroke-width="1.6"/>
<polygon points="530,156 519,160.4 519,151.6" fill="#555555"/>
<text x="546" y="161.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="530" y="180.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">direction</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">of</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">motion</tspan><tspan font-style="normal">)</tspan></text>
<line x1="90" y1="151" x2="90" y2="161" stroke="#555555" stroke-width="1.6"/>
<text x="90" y="177.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">0</tspan></text>
<circle cx="90" cy="110" r="7" fill="#1f3a5f"/>
<text x="90" y="98.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f3a5f" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">runner</tspan></text>
<line x1="90" y1="72" x2="158.4" y2="72" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="170,72 157.4,77.04 157.4,66.96" fill="#3f8a1e"/>
<text x="130" y="63.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan></text>
<text x="90" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">t</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 0</tspan></text>
<text x="90" y="226.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">x</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 0</tspan></text>
<text x="90" y="247.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = +9.00 </tspan><tspan font-style="normal">m/s</tspan></text>
<line x1="90" y1="151" x2="90" y2="161" stroke="#555555" stroke-width="1.6"/>
<circle cx="420" cy="110" r="7" fill="#1f3a5f"/>
<text x="420" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">t</tspan><tspan font-style="normal"> = 5.00 </tspan><tspan font-style="normal">s</tspan></text>
<text x="420" y="226.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">x</tspan><tspan font-style="normal"> = ?</tspan></text>
<text x="420" y="247.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-style="normal"> = ?</tspan></text>
<line x1="420" y1="151" x2="420" y2="161" stroke="#555555" stroke-width="1.6"/>
<line x1="330" y1="40" x2="281.6" y2="40" stroke="#6a3d9a" stroke-width="3"/>
<polygon points="270,40 282.6,34.96 282.6,45.04" fill="#6a3d9a"/>
<text x="300" y="30.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#6a3d9a" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-style="normal"> = −2.00 </tspan><tspan font-style="normal">m/s</tspan><tspan font-size="11.2" dy="-6.4"><tspan font-style="normal">2</tspan></tspan><tspan dy="6.4">​</tspan></text>
</svg>
