<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc">
<title id="title">A walk to the store and partway back</title>
<desc id="desc">A number line in kilometers with east positive. The walker goes from home at x = 0 to a store at x = 4.0 km, then walks 1.5 km back west to x = 2.5 km. The distance traveled is 5.5 km, the displacement is +2.5 km (2.5 km east), and the magnitude of the displacement is 2.5 km.</desc>
