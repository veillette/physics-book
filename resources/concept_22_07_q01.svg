<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="title desc">
<title id="title">Force on the electrons in a wire between magnet poles</title>
<desc id="desc">Cross-section view between the magnet poles: the magnetic field points to the right. Electrons in the wire move into the page, opposite to the conventional current, which points out of the page. For the electrons, v cross B points down, so the force on the negative electrons, and therefore on the wire, points up.</desc>
