<svg xmlns="http://www.w3.org/2000/svg" width="560" height="500" viewBox="0 0 560 500" role="img" aria-labelledby="title desc">
<title id="title">Potential energy of an alpha particle near a nucleus</title>
<desc id="desc">Total potential energy versus distance r from the center of a nucleus. Inside the nucleus the attractive nuclear force makes a deep well; at its edge the energy rises sharply to the top of the Coulomb barrier, then falls off as 1/r outside, where the repulsive Coulomb force acts. An alpha particle inside, with energy shown by a dashed line, lacks the energy to get over the rim; outside, an alpha particle of the same energy is pushed away.</desc>
