<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" aria-labelledby="title desc">
<title id="title">Total internal reflection at a liquid surface</title>
<desc id="desc">A light ray from a point 15.0 cm below the surface of a liquid of index n1 travels up to the surface, striking it 13.4 cm away horizontally, at the critical angle θc, and is totally reflected back into the liquid. Above the surface is medium n2.</desc>
<rect width="680" height="500" fill="#ffffff"/>
<defs><linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde9d6"/><stop offset="1" stop-color="#f6a965"/></linearGradient></defs>
<rect x="0" y="60" width="680" height="440" fill="url(#liquid)"/>
<line x1="0" y1="60" x2="680" y2="60" stroke="#e3a35c" stroke-width="2"/>
<line x1="500" y1="420" x2="178.4" y2="60" stroke="#1fa8d8" stroke-width="2.4"/>
<line x1="345.86" y1="247.46" x2="340.93" y2="241.94" stroke="#1fa8d8" stroke-width="2.4"/>
<polygon points="335.2,235.53 344.46,240.13 338.73,245.24" fill="#1fa8d8"/>
<line x1="178.4" y1="60" x2="91.79" y2="156.95" stroke="#1fa8d8" stroke-width="2.4"/>
<line x1="124.44" y1="120.41" x2="119.51" y2="125.93" stroke="#1fa8d8" stroke-width="2.4"/>
<polygon points="113.78,132.34 117.31,122.62 123.04,127.74" fill="#1fa8d8"/>
<line x1="178.4" y1="60" x2="178.4" y2="130" stroke="#222222" stroke-width="1.4" stroke-dasharray="6 5"/>
<path d="M 178.4 94 A 34 34 0 0 0 201.05 85.36" fill="none" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<text x="198.37" y="120.02" font-family="'Times New Roman', Times, serif" font-size="22" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">θ</tspan><tspan font-size="15.4" dy="6.16"><tspan font-style="normal">c</tspan></tspan><tspan dy="-6.16">​</tspan></text>
<circle cx="500" cy="420" r="6" fill="#1fa8d8"/>
<line x1="500" y1="70" x2="500" y2="410" stroke="#222222" stroke-width="1.4"/>
<polygon points="500,419 496,409 504,409" fill="#222222"/>
<polygon points="500,61 504,71 496,71" fill="#222222"/>
<line x1="491" y1="60" x2="509" y2="60" stroke="#222222" stroke-width="1.3"/>
<line x1="491" y1="420" x2="509" y2="420" stroke="#222222" stroke-width="1.3"/>
<text x="514" y="247.7" font-family="'Times New Roman', Times, serif" font-size="22" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">15.0 </tspan><tspan font-style="normal">cm</tspan></text>
<line x1="188.4" y1="36" x2="490" y2="36" stroke="#222222" stroke-width="1.4"/>
<polygon points="499,36 489,40 489,32" fill="#222222"/>
<polygon points="179.4,36 189.4,32 189.4,40" fill="#222222"/>
<line x1="178.4" y1="27" x2="178.4" y2="45" stroke="#222222" stroke-width="1.3"/>
<line x1="500" y1="27" x2="500" y2="45" stroke="#222222" stroke-width="1.3"/>
<text x="339.2" y="25.7" font-family="'Times New Roman', Times, serif" font-size="22" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">13.4 </tspan><tspan font-style="normal">cm</tspan></text>
<text x="20" y="42.4" font-family="'Times New Roman', Times, serif" font-size="24" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">n</tspan><tspan font-size="16.8" dy="6.72"><tspan font-style="normal">2</tspan></tspan><tspan dy="-6.72">​</tspan></text>
<text x="20" y="98.4" font-family="'Times New Roman', Times, serif" font-size="24" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">n</tspan><tspan font-size="16.8" dy="6.72"><tspan font-style="normal">1</tspan></tspan><tspan dy="-6.72">​</tspan></text>
</svg>
