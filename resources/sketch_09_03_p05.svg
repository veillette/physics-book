<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the braced wall in the wind</title>
<desc id="desc">Side view of the 17.0-m wall, pivoting at its base (the origin). +x points to the right (the direction the wind pushes) and +y up, and counterclockwise torques are positive. The wind force F_wind acts along +x halfway up, 8.50 m above the base (clockwise torque). Each brace pushes on the wall at 8.50 m along the brace, 35.0° from the wall, up and to the left; its horizontal component F_B sin 35.0° points along −x (counterclockwise torque).</desc>
