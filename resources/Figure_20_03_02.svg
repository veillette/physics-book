<svg xmlns="http://www.w3.org/2000/svg" width="600" height="540" viewBox="0 0 600 540" role="img" aria-labelledby="title desc">
<title id="title">Resistance of mercury near its superconducting transition</title>
<desc id="desc">Resistance R in ohms of a mercury sample versus temperature T from 4.0 to 4.4 K. Below the critical temperature Tc of about 4.2 K the resistance is zero: mercury is a superconductor. At Tc the resistance jumps, shown dashed, to about 0.11 Ω, and above it rises nearly linearly with temperature, to about 0.135 Ω at 4.37 K. Dots mark measured points.</desc>
