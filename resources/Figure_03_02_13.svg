<svg xmlns="http://www.w3.org/2000/svg" width="190" height="240" viewBox="0 0 190 240" role="img" aria-labelledby="title desc">
<title id="title">A vector B and its negative −B</title>
<desc id="desc">Two parallel arrows of equal length: B points up and to the right; −B points down and to the left.</desc>
<rect width="190" height="240" fill="#ffffff"/>
<line x1="10" y1="222" x2="137.7" y2="23.97" stroke="#8e4f8e" stroke-width="3.5"/>
<polygon points="148,8 143.88,29.14 130.44,20.47" fill="#8e4f8e"/>
<line x1="176" y1="32" x2="48.94" y2="212.46" stroke="#8e4f8e" stroke-width="3.5"/>
<polygon points="38,228 42.97,207.04 56.06,216.25" fill="#8e4f8e"/>
<text x="52" y="105.35" font-family="'Times New Roman', Times, serif" font-size="21" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">B<tspan font-size="13.02" font-weight="normal" dx="-12.99" dy="-13.02">→</tspan><tspan dx="1.01" dy="13.02">​</tspan></tspan></text>
<text x="140" y="152.35" font-family="'Times New Roman', Times, serif" font-size="21" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">−</tspan><tspan font-weight="bold" font-style="normal">B<tspan font-size="13.02" font-weight="normal" dx="-12.99" dy="-13.02">→</tspan><tspan dx="1.01" dy="13.02">​</tspan></tspan></text>
</svg>
