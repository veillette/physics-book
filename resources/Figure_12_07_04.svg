<svg xmlns="http://www.w3.org/2000/svg" width="810" height="440" viewBox="0 0 810 440" role="img" aria-labelledby="title desc">
<title id="title">Osmosis through a semipermeable membrane</title>
<desc id="desc">(a) Two sugar-water solutions, separated by a semipermeable membrane that passes water (small blue dots) but not sugar (larger red dots). The right side has more sugar, so its water is less concentrated, and water moves by osmosis to the right. (b) The right-hand level rises until the back pressure hρg from the height difference h balances the osmotic flow.</desc>
