<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" aria-labelledby="title desc">
<title id="title">Adding electric fields at the origin</title>
<desc id="desc">Charge q1 = +5.0 nC is on the y axis 2.00 cm below the origin O, and q2 = +10 nC is on the x axis 4.00 cm to the right of O. At O the field E1 = 1.13 × 10⁵ N/C from q1 points in the +y direction, and the field E2 = 0.56 × 10⁵ N/C from q2 points in the −x direction. They add to E_tot = 1.26 × 10⁵ N/C, pointing up and to the left at 63.4° above the −x axis.</desc>
<rect width="680" height="560" fill="#ffffff"/>
<polygon points="420,400 290.77,400 290.77,141.54 420,141.54" fill="#c9b6dc" fill-opacity="0.7"/>
<line x1="220" y1="400" x2="650" y2="400" stroke="#333333" stroke-width="1.4"/>
<polygon points="660,400 649,404.4 649,395.6" fill="#333333"/>
<line x1="420" y1="540" x2="420" y2="70" stroke="#333333" stroke-width="1.4"/>
<polygon points="420,60 424.4,71 415.6,71" fill="#333333"/>
<text x="670" y="407.7" font-family="'Times New Roman', Times, serif" font-size="22" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">x</tspan></text>
<text x="432" y="63.7" font-family="'Times New Roman', Times, serif" font-size="22" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">y</tspan></text>
<line x1="420" y1="400" x2="420" y2="160.54" stroke="#1f77c8" stroke-width="4"/>
<polygon points="420,141.54 428,161.54 412,161.54" fill="#1f77c8"/>
<line x1="420" y1="400" x2="309.77" y2="400" stroke="#1f77c8" stroke-width="4"/>
<polygon points="290.77,400 310.77,392 310.77,408" fill="#1f77c8"/>
<line x1="420" y1="400" x2="299.27" y2="158.53" stroke="#1f77c8" stroke-width="4"/>
<polygon points="290.77,141.54 306.87,155.85 292.56,163" fill="#1f77c8"/>
<text x="434" y="277.77" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">E<tspan font-size="12.4" font-weight="normal" dx="-12.87" dy="-16.4">→</tspan><tspan dx="0.47" dy="16.4">​</tspan></tspan><tspan font-size="14" dy="5.6"><tspan font-style="normal">1</tspan></tspan><tspan dy="-5.6">​</tspan><tspan font-style="normal"> = 1.13 × 10</tspan><tspan font-size="14" dy="-8"><tspan font-style="normal">5</tspan></tspan><tspan dy="8">​</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">N/C</tspan></text>
<text x="386" y="441.35" font-family="'Times New Roman', Times, serif" font-size="21" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">E<tspan font-size="13.02" font-weight="normal" dx="-13.51" dy="-17.22">→</tspan><tspan dx="0.49" dy="17.22">​</tspan></tspan><tspan font-size="14.7" dy="5.88"><tspan font-style="normal">2</tspan></tspan><tspan dy="-5.88">​</tspan><tspan font-style="normal"> = 0.56 × 10</tspan><tspan font-size="14.7" dy="-8.4"><tspan font-style="normal">5</tspan></tspan><tspan dy="8.4">​</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">N/C</tspan></text>
<text x="280.77" y="126.54" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">E<tspan font-size="12.4" font-weight="normal" dx="-12.87" dy="-16.4">→</tspan><tspan dx="0.47" dy="16.4">​</tspan></tspan><tspan font-size="14" dy="5.6"><tspan font-style="normal">tot</tspan></tspan><tspan dy="-5.6">​</tspan><tspan font-style="normal"> = 1.26 × 10</tspan><tspan font-size="14" dy="-8"><tspan font-style="normal">5</tspan></tspan><tspan dy="8">​</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">N/C</tspan></text>
