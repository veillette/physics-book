<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" role="img" aria-labelledby="title desc">
<title id="title">Wheelbarrow and shovel as levers</title>
<desc id="desc">(a) The wheelbarrow load at CG lies between the handles and the wheel axle. F_i and ground reaction N point up; weight w points down. l_i is longer than l_o, giving MA greater than one. (b) Two hands hold a shovel: the right hand at the handle end is the pivot and pushes down, while the hand nearer the blade supplies upward F_i. The load weight points down beyond the input, with l_i shorter than l_o and MA less than one. Separate free-body diagrams show the same force directions. F_o is the upward force supporting each load and equals w in magnitude.</desc>
<rect width="1080" height="900" fill="#ffffff"/>
<text x="345" y="38.4" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">a</tspan><tspan font-style="normal">) </tspan><tspan font-style="normal">Wheelbarrow</tspan><tspan font-style="normal">: </tspan><tspan font-style="normal">MA</tspan><tspan font-style="normal"> &gt; 1</tspan></text>
