<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the walk west then north</title>
<desc id="desc">Axes with +x east and +y north, origin at the start. A is 18.0 m west, along −x, ending at (−18.0 m, 0). B is 25.0 m north, along +y, from the tip of A. The resultant R = A + B runs from the origin to (−18.0 m, 25.0 m); its direction θ is measured from the −x (west) axis toward north.</desc>
