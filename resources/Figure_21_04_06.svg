<title id="title">Effect of voltmeter resistance on the circuit</title>
<desc id="desc">(a) Desired: a voltmeter in parallel with R, where the voltmeter resistance is much larger than R, so the combination is approximately R. (b) To be avoided: a voltmeter whose resistance equals R, so the combination R in parallel with R equals R/2.</desc>
