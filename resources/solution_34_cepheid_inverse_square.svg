<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
<title id="title">The same luminosity spreads over a larger sphere</title>
<desc id="desc">Concentric shells of radii d and two d are shown in cross-section. Their spherical areas scale as d squared, so the outer shell has four times the area and one quarter the flux for the same luminosity.</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172b45"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1763a6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad4d12"/></marker></defs>
<rect width="960" height="550" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<text x="480" y="36" font-size="25" fill="#172b45" text-anchor="middle" font-weight="bold">The same luminosity spreads over a larger sphere</text>
<text x="480" y="78" font-size="20" fill="#526176" text-anchor="middle" font-weight="normal">One calibrated luminosity L, with isotropic emission and no extinction.</text><circle cx="270" cy="275" r="164" fill="white" stroke="#a5bdd4" stroke-width="2"/><circle cx="270" cy="275" r="82" fill="white" stroke="#1763a6" stroke-width="2"/><circle cx="270" cy="275" r="13" fill="#f4cb64" stroke="#ad4d12" stroke-width="2"/><path d="M250.94744111674234 264.0L133.16798620205867 196.0" fill="none" stroke="#ad4d12" stroke-width="1.5" marker-end="url(#orange)"/><path d="M264.30598100774455 253.7496318216405L229.1065908738017 122.3837194463272" fill="none" stroke="#ad4d12" stroke-width="1.5" marker-end="url(#orange)"/><path d="M281.0 255.94744111674234L349.0 138.1679862020587" fill="none" stroke="#ad4d12" stroke-width="1.5" marker-end="url(#orange)"/><path d="M291.2503681783595 269.30598100774455L422.6162805536728 234.10659087380174" fill="none" stroke="#ad4d12" stroke-width="1.5" marker-end="url(#orange)"/><path d="M289.05255888325763 286.0L406.83201379794133 354.0" fill="none" stroke="#ad4d12" stroke-width="1.5" marker-end="url(#orange)"/><path d="M275.69401899225545 296.2503681783595L310.89340912619826 427.6162805536728" fill="none" stroke="#ad4d12" stroke-width="1.5" marker-end="url(#orange)"/><path d="M259.0 294.05255888325763L191.00000000000003 411.83201379794133" fill="none" stroke="#ad4d12" stroke-width="1.5" marker-end="url(#orange)"/><path d="M248.7496318216405 280.69401899225545L117.38371944632723 315.8934091261983" fill="none" stroke="#ad4d12" stroke-width="1.5" marker-end="url(#orange)"/><path d="M270 275L434 275" fill="none" stroke="#172b45" stroke-width="2" marker-end="url(#ink)"/><text x="338" y="264" font-size="20" fill="#172b45" text-anchor="start" font-weight="normal">d</text><text x="448" y="282" font-size="20" fill="#172b45" text-anchor="start" font-weight="normal">2d</text><text x="270" y="466" font-size="18" fill="#526176" text-anchor="middle" font-weight="normal">Spherical shells shown in cross-section</text><rect x="548" y="135" width="376" height="132" rx="4" fill="#edf4fa" stroke="none"/><rect x="548" y="292" width="376" height="132" rx="4" fill="#faf0e7" stroke="none"/><text x="570" y="169" font-size="23" fill="#172b45" text-anchor="start" font-weight="bold">Distance d</text><text x="570" y="207" font-size="22" fill="#172b45" text-anchor="start" font-weight="normal">Area = 4πd²</text><text x="570" y="246" font-size="23" fill="#1763a6" text-anchor="start" font-weight="normal">Flux F = L / (4πd²)</text><text x="570" y="326" font-size="23" fill="#172b45" text-anchor="start" font-weight="bold">Distance 2d</text><text x="570" y="364" font-size="21" fill="#172b45" text-anchor="start" font-weight="normal">Area = 4π(2d)² = 4 × 4πd²</text><text x="570" y="403" font-size="25" fill="#ad4d12" text-anchor="start" font-weight="normal">Flux = F/4</text><text x="480" y="517" font-size="22" fill="#172b45" text-anchor="middle" font-weight="normal">Doubling the distance spreads the same power over four times the area.</text>
</g>
</svg>
