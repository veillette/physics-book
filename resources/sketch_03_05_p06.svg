<svg xmlns="http://www.w3.org/2000/svg" width="400" height="350" viewBox="0 0 400 350" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the ship’s velocity and the current</title>
<desc id="desc">Axes with +x east and +y north. The ship’s velocity relative to the water, v_s/w = 7.00 m/s, points north (+y). The current, v_w/E = 1.50 m/s at 40.0° north of east, is drawn from its tip. Their sum is the ship’s velocity relative to the Earth, v_s/E, unknown.</desc>
