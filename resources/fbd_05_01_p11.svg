<svg xmlns="http://www.w3.org/2000/svg" width="440" height="370" viewBox="0 0 440 370" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the skier</title>
<desc id="desc">Free-body diagram with tilted axes: +x down the slope and +y perpendicular to the slope, away from it. Normal force N along +y, kinetic friction f k up the slope (along -x), weight w straight down with dashed components mg sin theta along +x and mg cos theta along -y. The acceleration points down the slope (it is zero at the constant-velocity angle of part b).</desc>
