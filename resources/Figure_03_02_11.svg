<svg xmlns="http://www.w3.org/2000/svg" width="560" height="480" viewBox="0 0 560 480" role="img" aria-labelledby="title desc">
<title id="title">Measuring the resultant R with a ruler and a protractor</title>
<desc id="desc">Vectors A, B and C placed head to tail, with the resultant R from the tail of A to the head of C. A ruler laid alongside R, its zero at the tail, reads 50.8 m at the head. A protractor turned upside down below it, with an arrow parallel to R, reads 5.47° below the +x axis.</desc>
