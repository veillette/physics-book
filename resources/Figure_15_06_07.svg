<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="title desc">
<title id="title">Energy flow from the Sun to deep space</title>
<desc id="desc">Heat Q flows from the Sun at temperature T_h toward deep space at T_c = 3 K. The Earth sits in this flow: part of the energy, ΔU, is diverted to it, which can decrease the Earth’s entropy locally (ΔS &lt; 0?) while the total entropy still increases.</desc>
