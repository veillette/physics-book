<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
<title id="title">A similar-mass target can take more neutron energy</title>
<desc id="desc">A neutron incident on a stationary proton transfers nearly all its kinetic energy in a head-on elastic collision. With an oxygen target of mass sixteen times neutron mass, the neutron rebounds at fifteen seventeenths its incident speed and the target moves at two seventeenths, taking sixty-four over two hundred eighty-nine, about twenty-two percent, of the incident kinetic energy.</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172b45"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1763a6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad4d12"/></marker></defs>
<rect width="960" height="550" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<text x="480" y="36" font-size="25" fill="#172b45" text-anchor="middle" font-weight="bold">A similar-mass target can take more neutron energy</text>
<text x="480" y="78" font-size="20" fill="#526176" text-anchor="middle" font-weight="normal">Nonrelativistic, head-on elastic collisions with a stationary target.</text><text x="240" y="122" font-size="22" fill="#172b45" text-anchor="middle" font-weight="bold">Proton target: M ≈ m</text><text x="40" y="164" font-size="19" fill="#172b45" text-anchor="start" font-weight="bold">Before</text><circle cx="115" cy="202" r="16" fill="#1763a6" stroke="#1763a6" stroke-width="2"/><path d="M139 202L245 202" fill="none" stroke="#1763a6" stroke-width="3" marker-end="url(#blue)"/><text x="185" y="185" font-size="20" fill="#1763a6" text-anchor="start" font-weight="normal">v</text><circle cx="325" cy="202" r="18" fill="#e5eaf0" stroke="#172b45" stroke-width="2"/><text x="325" y="208" font-size="20" fill="#172b45" text-anchor="middle" font-weight="normal">p</text><text x="40" y="266" font-size="19" fill="#172b45" text-anchor="start" font-weight="bold">After</text><circle cx="165" cy="302" r="16" fill="#1763a6" stroke="#1763a6" stroke-width="2"/><circle cx="325" cy="302" r="18" fill="#e5eaf0" stroke="#172b45" stroke-width="2"/><path d="M365 302L430 302" fill="none" stroke="#ad4d12" stroke-width="3" marker-end="url(#orange)"/><text x="165" y="358" font-size="21" fill="#1763a6" text-anchor="middle" font-weight="normal">Neutron: 0</text><text x="325" y="392" font-size="21" fill="#ad4d12" text-anchor="middle" font-weight="normal">Target: v</text><text x="240" y="445" font-size="21" fill="#172b45" text-anchor="middle" font-weight="normal">Target gains ≈100% of incident energy</text><text x="715" y="122" font-size="22" fill="#172b45" text-anchor="middle" font-weight="bold">Oxygen target: M ≈ 16m</text><text x="515" y="164" font-size="19" fill="#172b45" text-anchor="start" font-weight="bold">Before</text><circle cx="590" cy="202" r="16" fill="#1763a6" stroke="#1763a6" stroke-width="2"/><path d="M614 202L720 202" fill="none" stroke="#1763a6" stroke-width="3" marker-end="url(#blue)"/><text x="660" y="185" font-size="20" fill="#1763a6" text-anchor="start" font-weight="normal">v</text><circle cx="800" cy="202" r="35" fill="#e5eaf0" stroke="#172b45" stroke-width="2"/><text x="800" y="208" font-size="20" fill="#172b45" text-anchor="middle" font-weight="normal">O</text><text x="515" y="266" font-size="19" fill="#172b45" text-anchor="start" font-weight="bold">After</text><circle cx="640" cy="302" r="16" fill="#1763a6" stroke="#1763a6" stroke-width="2"/><circle cx="800" cy="302" r="35" fill="#e5eaf0" stroke="#172b45" stroke-width="2"/><path d="M618 302L540 302" fill="none" stroke="#1763a6" stroke-width="3" marker-end="url(#blue)"/><path d="M840 302L905 302" fill="none" stroke="#ad4d12" stroke-width="3" marker-end="url(#orange)"/><text x="640" y="358" font-size="21" fill="#1763a6" text-anchor="middle" font-weight="normal">Neutron: −15v/17</text><text x="800" y="392" font-size="21" fill="#ad4d12" text-anchor="middle" font-weight="normal">Target: 2v/17</text><text x="715" y="445" font-size="21" fill="#172b45" text-anchor="middle" font-weight="normal">Target gains ≈22% of incident energy</text><text x="480" y="489" font-size="24" fill="#172b45" text-anchor="middle" font-weight="normal">Maximum transferred fraction = 4mM / (m + M)²</text><text x="480" y="522" font-size="18" fill="#526176" text-anchor="middle" font-weight="normal">Arrow lengths are schematic; these are maximum losses, not angular averages.</text>
</g>
</svg>
