<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
<title id="title">Velocity of a fly on a rotating record</title>
<desc id="desc">A record turns clockwise with angular velocity ω. Flies sit at the top and right edge, each a distance r from the center. Each fly’s velocity v is tangent to the circle and perpendicular to its radius: to the right at the top and downward at the right edge.</desc>
