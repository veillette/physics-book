<circle cx="360" cy="400" r="142" fill="#2f3133"/>
<circle cx="360" cy="400" r="125" fill="#e07c62"/>
<circle cx="360" cy="400" r="5" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<line x1="360" y1="400" x2="360" y2="55" stroke="#222222" stroke-width="2.5"/>
<line x1="360" y1="400" x2="705" y2="400" stroke="#222222" stroke-width="2.5"/>
<text x="335" y="320.5" font-family="'Times New Roman', Times, serif" font-size="30" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">r</tspan></text>
<text x="445" y="385.5" font-family="'Times New Roman', Times, serif" font-size="30" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">r</tspan></text>
<g transform="translate(360 92) rotate(0)">
