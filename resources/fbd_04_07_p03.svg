<text x="159.25" y="42.84" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan font-style="normal" font-size="14" dy="6">1</tspan><tspan dy="-6"></tspan></text>
<text x="257.12" y="155.5" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan font-style="normal" font-size="14" dy="6">2</tspan><tspan dy="-6"></tspan></text>
<text x="160" y="209" font-family="'Times New Roman', Times, serif" font-size="20" fill="#c0675e" text-anchor="end" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan font-style="normal" font-size="14" dy="6">1</tspan><tspan dy="-6"></tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">sin</tspan><tspan font-style="normal"> 15°</tspan></text>
