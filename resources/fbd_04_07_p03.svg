<svg xmlns="http://www.w3.org/2000/svg" width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the person being rescued</title>
<desc id="desc">Free-body diagram with +x to the right and +y up: T1 up and to the left at 15 degrees from +y, T2 to the right at 10 degrees above +x, weight w down. Dashed components of T1: T1 sin 15 along -x and T1 cos 15 along +y. a = 0.</desc>
