<svg xmlns="http://www.w3.org/2000/svg" width="700" height="535" viewBox="0 0 700 535" role="img" aria-labelledby="title desc">
<title id="title">A small tilt produces a restoring torque</title>
<desc id="desc">A pencil on its flat end tilts slightly left about the left base corner. Its center of gravity remains to the right of the pivot, so its weight produces a clockwise restoring torque.</desc>
<rect width="700" height="535" fill="#ffffff"/>
<rect x="95" y="405" width="355" height="16" fill="#ded8e6"/>
<polygon points="275,405 340.36,395.81 309.04,173 264.54,93.42 243.69,182.19" fill="#e6c884" stroke="#947647" stroke-width="2"/>
<polygon points="256.83,124.8 280.59,121.46 264.54,93.42" fill="#444444"/>
<line x1="295.8" y1="402.08" x2="264.48" y2="179.27" stroke="#c9a354" stroke-width="2"/>
<line x1="287.5" y1="256.82" x2="287.5" y2="405" stroke="#666666" stroke-width="1.3" stroke-dasharray="6 5"/>
<g id="weight">
<line x1="287.5" y1="256.82" x2="287.5" y2="323.02" stroke="#d52350" stroke-width="4"/>
<polygon points="287.5,336.82 281.58,322.02 293.42,322.02" fill="#d52350"/>
</g>
<circle cx="287.5" cy="256.82" r="5" fill="#222222"/>
<text x="318.5" y="258.82" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">CG</tspan></text>
<text x="311.5" y="323.57" font-family="'Times New Roman', Times, serif" font-size="25" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">w<tspan font-size="15.5" font-weight="normal" dx="-16.77" dy="-13">→</tspan><tspan dx="1.27" dy="13">​</tspan></tspan></text>
<g id="normal">
<line x1="275" y1="485" x2="275" y2="418.8" stroke="#d52350" stroke-width="4"/>
<polygon points="275,405 280.92,419.8 269.08,419.8" fill="#d52350"/>
</g>
<text x="304" y="466.75" font-family="'Times New Roman', Times, serif" font-size="25" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">N<tspan font-size="15.5" font-weight="normal" dx="-16.77" dy="-20.5">→</tspan><tspan dx="1.27" dy="20.5">​</tspan></tspan></text>
<circle cx="275" cy="405" r="5" fill="#222222"/>
<text x="113" y="370" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Pivot</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">point</tspan></text>
<path d="M 160 378 Q 208.05 431.75 268.5 407.6" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="266.64" y1="408.34" x2="270.91" y2="406.63" stroke="#333333" stroke-width="1.2"/>
<polygon points="275,405 270.79,409.01 269.18,405" fill="#333333"/>
<text x="285" y="49.1" font-family="'Times New Roman', Times, serif" font-size="26" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">τ</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">cw</tspan></tspan><tspan dy="-7.28">​</tspan></text>
<text x="560" y="127.35" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Free</tspan><tspan font-style="normal">-</tspan><tspan font-style="normal">body</tspan></text>
<text x="560" y="154.35" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">diagram</tspan></text>
<line x1="555" y1="266" x2="555" y2="201.4" stroke="#333333" stroke-width="2"/>
<polygon points="555,192 559.16,202.4 550.84,202.4" fill="#333333"/>
