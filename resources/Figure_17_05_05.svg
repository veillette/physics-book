<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
<title id="title">The reflected disturbance returning to the tuning fork</title>
<desc id="desc">The reflected disturbance reaches the open end just as the tuning fork’s tines move together, half a cycle after it was sent. If the tube’s length L is just right, it interferes constructively with the continuing sound from the fork, a standing wave forms, and the air column resonates.</desc>
