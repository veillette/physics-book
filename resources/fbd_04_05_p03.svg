<line x1="224" y1="175" x2="224" y2="158" stroke="#c0675e" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="224,147 229.04,159 218.96,159" fill="#c0675e"/>
<line x1="230" y1="175" x2="351" y2="175" stroke="#c0675e" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="362,175 350,180.04 350,169.96" fill="#c0675e"/>
