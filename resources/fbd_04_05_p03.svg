<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagrams of the spider</title>
<desc id="desc">Two free-body diagrams with +x to the right and +y up, both with a = 0. (a) Vertical strand: tension T vertical up, weight w down, equal lengths. (b) Horizontal strand: two tensions T, one up and to the right and one up and to the left, each at angle theta = 12 degrees above the horizontal, with dashed components T cos theta along the x-axis and T sin theta along +y; weight w down.</desc>
<rect width="720" height="322" fill="#ffffff"/>
<g transform="translate(0 0)">
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222">(a) Vertical strand</text>
<g transform="translate(0 22)">
<line x1="25" y1="155" x2="211" y2="155" stroke="#555555" stroke-width="1.5"/><polygon points="220,155 210,159.2 210,150.8" fill="#555555"/>
<line x1="120" y1="265" x2="120" y2="54" stroke="#555555" stroke-width="1.5"/><polygon points="120,45 124.2,55 115.8,55" fill="#555555"/>
<line x1="120" y1="155" x2="120" y2="111" stroke="#b03a2e" stroke-width="3.5"/><polygon points="120,100 125.04,112 114.96,112" fill="#b03a2e"/>
<line x1="120" y1="155" x2="120" y2="199" stroke="#b03a2e" stroke-width="3.5"/><polygon points="120,210 114.96,198 125.04,198" fill="#b03a2e"/>
<circle cx="120" cy="155" r="6" fill="#1f3a5f"/>
<text x="130" y="177" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="start">spider</text>
<text x="236" y="161" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="120" y="35" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="132" y="119" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan font-style="normal" font-size="14" dy="6">vertical</tspan><tspan dy="-6"></tspan></text>
<text x="132" y="205" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan></text>
<text x="65" y="66" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-style="normal"> = 0</tspan></text>
</g>
</g>
<line x1="260" y1="10" x2="260" y2="312" stroke="#cccccc" stroke-width="1"/>
<g transform="translate(260 0)">
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222">(b) Horizontal strand</text>
<g transform="translate(0 22)">
<line x1="30" y1="175" x2="421" y2="175" stroke="#555555" stroke-width="1.5"/><polygon points="430,175 420,179.2 420,170.8" fill="#555555"/>
<line x1="230" y1="285" x2="230" y2="74" stroke="#555555" stroke-width="1.5"/><polygon points="230,65 234.2,75 225.8,75" fill="#555555"/>
