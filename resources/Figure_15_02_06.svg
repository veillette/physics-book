<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1010" viewBox="0 0 640 1010" role="img" aria-labelledby="title desc">
<title id="title">Work as the area under a PV curve</title>
<desc id="desc">(a) A process from A to B on a PV diagram, divided into narrow strips. Each strip of width ΔV_i has area P_i(ave) ΔV_i = W_i, so the total work W_out = ΣW_i is the area under the curve. (b) Going the other way along the same path, from B to A, the work done on the gas is W_in = −W_out.</desc>
