<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Four-stroke gasoline engine</title>
<desc id="desc">(a) Intake: the piston moves down and the intake valve opens, drawing in an air–fuel mixture. (b) Compression: with both valves closed, the piston moves up and compresses the mixture. (c) Power: a spark ignites the mixture, and the hot gas pushes the piston down with force F = PA. (d) Exhaust: the exhaust valve opens and the piston moves up, pushing out the burned gas. The crankshaft turns clockwise throughout.</desc>
