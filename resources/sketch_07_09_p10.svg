<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the basketball player’s jump</title>
<desc id="desc">A vertical +y axis points up, with y = 0 at the center of gravity’s normal standing height, where the feet leave the floor. Crouched: y = −0.400 m, at rest. Leaving the floor: y = 0, speed v unknown, directed along +y. Top of the jump: y = +0.950 m, v = 0. During the push-off the floor pushes up with F along +y and the weight w = mg points along −y.</desc>
<rect width="560" height="320" fill="#ffffff"/>
<line x1="90" y1="300" x2="90" y2="44" stroke="#555555" stroke-width="1.6"/>
<polygon points="90,34 94.4,45 85.6,45" fill="#555555"/>
<text x="90" y="21.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="106" y="20.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">up</tspan><tspan font-style="normal">)</tspan></text>
<line x1="85" y1="210" x2="95" y2="210" stroke="#555555" stroke-width="1.6"/>
<text x="80" y="214.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">0</tspan></text>
<line x1="85" y1="77" x2="95" y2="77" stroke="#555555" stroke-width="1.6"/>
<text x="80" y="81.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">0.950 </tspan><tspan font-style="normal">m</tspan></text>
<line x1="85" y1="266" x2="95" y2="266" stroke="#555555" stroke-width="1.6"/>
<text x="80" y="270.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">−0.400 </tspan><tspan font-style="normal">m</tspan></text>
<line x1="96" y1="77" x2="150" y2="77" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="96" y1="210" x2="150" y2="210" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="96" y1="266" x2="150" y2="266" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<circle cx="160" cy="266" r="7" fill="#1f3a5f"/>
<text x="160" y="292.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f3a5f" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">crouched</tspan></text>
<text x="190" y="271.25" font-family="'Times New Roman', Times, serif" font-size="15" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-style="normal"> = 0</tspan></text>
<circle cx="160" cy="210" r="7" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<line x1="140" y1="210" x2="140" y2="171.6" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="140,160 145.04,172.6 134.96,172.6" fill="#3f8a1e"/>
<text x="132" y="175.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-style="normal"> = ?</tspan></text>
<text x="190" y="215.25" font-family="'Times New Roman', Times, serif" font-size="15" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">feet</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">leave</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">the</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">floor</tspan></text>
<circle cx="160" cy="77" r="7" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<text x="190" y="82.25" font-family="'Times New Roman', Times, serif" font-size="15" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">top</tspan><tspan font-style="normal">:  </tspan><tspan font-style="italic">v</tspan><tspan font-style="normal"> = 0</tspan></text>
<text x="450" y="124.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">forces</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">during</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">push</tspan><tspan font-style="normal">-</tspan><tspan font-style="normal">off</tspan></text>
<circle cx="450" cy="200" r="7" fill="#1f3a5f"/>
<line x1="450" y1="200" x2="450" y2="151.6" stroke="#b03a2e" stroke-width="3"/>
<polygon points="450,140 455.04,152.6 444.96,152.6" fill="#b03a2e"/>
<text x="462" y="151.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan></text>
<line x1="450" y1="200" x2="450" y2="228.4" stroke="#b03a2e" stroke-width="3"/>
<polygon points="450,240 444.96,227.4 455.04,227.4" fill="#b03a2e"/>
<text x="462" y="241.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">w</tspan><tspan font-style="normal"> = </tspan><tspan font-style="italic">mg</tspan></text>
</svg>
