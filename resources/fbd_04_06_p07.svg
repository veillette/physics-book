<svg xmlns="http://www.w3.org/2000/svg" width="720" height="302" viewBox="0 0 720 302" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagrams for the car and boat trailer</title>
<desc id="desc">Two free-body diagrams with +x forward (to the right) and +y up. (a) Car plus boat plus trailer: forward force from the road F road to the right, total resisting force f total to the left, N up, w down; acceleration to the right. (b) Boat plus trailer: hitch force F hitch to the right, resisting force f boat to the left, N boat up, w boat down; acceleration to the right.</desc>
<rect width="720" height="302" fill="#ffffff"/>
<g transform="translate(0 0)">
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222">(a) System: car + boat + trailer</text>
<g transform="translate(0 22)">
<line x1="20" y1="145" x2="326" y2="145" stroke="#555555" stroke-width="1.5"/><polygon points="335,145 325,149.2 325,140.8" fill="#555555"/>
<line x1="170" y1="250" x2="170" y2="49" stroke="#555555" stroke-width="1.5"/><polygon points="170,40 174.2,50 165.8,50" fill="#555555"/>
<line x1="170" y1="145" x2="170" y2="91" stroke="#b03a2e" stroke-width="3.5"/><polygon points="170,80 175.04,92 164.96,92" fill="#b03a2e"/>
<line x1="170" y1="145" x2="170" y2="199" stroke="#b03a2e" stroke-width="3.5"/><polygon points="170,210 164.96,198 175.04,198" fill="#b03a2e"/>
<line x1="170" y1="145" x2="284" y2="145" stroke="#b03a2e" stroke-width="3.5"/><polygon points="295,145 283,150.04 283,139.96" fill="#b03a2e"/>
<line x1="170" y1="145" x2="121" y2="145" stroke="#b03a2e" stroke-width="3.5"/><polygon points="110,145 122,139.96 122,150.04" fill="#b03a2e"/>
<line x1="210" y1="65" x2="239" y2="65" stroke="#1e8449" stroke-width="3"/><polygon points="250,65 238,70.04 238,59.96" fill="#1e8449"/>
<circle cx="170" cy="145" r="6" fill="#1f3a5f"/>
<text x="160" y="175" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="end">car + boat + trailer</text>
<text x="351" y="151" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="170" y="30" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="182" y="99" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">N</tspan></text>
<text x="182" y="205" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan></text>
<text x="281" y="133" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">road</tspan><tspan dy="-6"></tspan></text>
<text x="124" y="133" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">f</tspan><tspan font-style="normal" font-size="14" dy="6">total</tspan><tspan dy="-6"></tspan></text>
<text x="236" y="53" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
</g>
</g>
<line x1="360" y1="10" x2="360" y2="292" stroke="#cccccc" stroke-width="1"/>
<g transform="translate(360 0)">
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222">(b) System: boat + trailer</text>
<g transform="translate(0 22)">
<line x1="20" y1="145" x2="326" y2="145" stroke="#555555" stroke-width="1.5"/><polygon points="335,145 325,149.2 325,140.8" fill="#555555"/>
<line x1="170" y1="250" x2="170" y2="49" stroke="#555555" stroke-width="1.5"/><polygon points="170,40 174.2,50 165.8,50" fill="#555555"/>
<line x1="170" y1="145" x2="170" y2="101" stroke="#b03a2e" stroke-width="3.5"/><polygon points="170,90 175.04,102 164.96,102" fill="#b03a2e"/>
<line x1="170" y1="145" x2="170" y2="189" stroke="#b03a2e" stroke-width="3.5"/><polygon points="170,200 164.96,188 175.04,188" fill="#b03a2e"/>
<line x1="170" y1="145" x2="249" y2="145" stroke="#b03a2e" stroke-width="3.5"/><polygon points="260,145 248,150.04 248,139.96" fill="#b03a2e"/>
<line x1="170" y1="145" x2="123" y2="145" stroke="#b03a2e" stroke-width="3.5"/><polygon points="112,145 124,139.96 124,150.04" fill="#b03a2e"/>
<line x1="210" y1="65" x2="239" y2="65" stroke="#1e8449" stroke-width="3"/><polygon points="250,65 238,70.04 238,59.96" fill="#1e8449"/>
<circle cx="170" cy="145" r="6" fill="#1f3a5f"/>
<text x="160" y="175" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="end">boat + trailer</text>
<text x="351" y="151" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="170" y="30" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="182" y="109" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">N</tspan><tspan font-style="normal" font-size="14" dy="6">boat</tspan><tspan dy="-6"></tspan></text>
<text x="182" y="195" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan><tspan font-style="normal" font-size="14" dy="6">boat</tspan><tspan dy="-6"></tspan></text>
<text x="246" y="133" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">hitch</tspan><tspan dy="-6"></tspan></text>
<text x="126" y="133" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">f</tspan><tspan font-style="normal" font-size="14" dy="6">boat</tspan><tspan dy="-6"></tspan></text>
<text x="236" y="53" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
</g>
</g>
</svg>
