<svg xmlns="http://www.w3.org/2000/svg" width="500" height="420" viewBox="0 0 500 420" role="img" aria-labelledby="title desc">
<title id="title">Capacitors in series and parallel</title>
<desc id="desc">A 10 μF capacitor and a 2.5 μF capacitor in parallel, and that pair in series with a 0.30 μF capacitor below it.</desc>
<rect width="500" height="420" fill="#ffffff"/>
<polyline points="250,20 250,60" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="130,60 370,60 370,240 130,240 130,60" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="250,240 250,400" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<line x1="130" y1="143" x2="130" y2="157" stroke="#ffffff" stroke-width="7"/>
<line x1="152" y1="143" x2="108" y2="143" stroke="#1b7a4a" stroke-width="4.5"/>
<line x1="152" y1="157" x2="108" y2="157" stroke="#1b7a4a" stroke-width="4.5"/>
<line x1="370" y1="143" x2="370" y2="157" stroke="#ffffff" stroke-width="7"/>
<line x1="392" y1="143" x2="348" y2="143" stroke="#1b7a4a" stroke-width="4.5"/>
<line x1="392" y1="157" x2="348" y2="157" stroke="#1b7a4a" stroke-width="4.5"/>
<line x1="250" y1="313" x2="250" y2="327" stroke="#ffffff" stroke-width="7"/>
<line x1="272" y1="313" x2="228" y2="313" stroke="#1b7a4a" stroke-width="4.5"/>
<line x1="272" y1="327" x2="228" y2="327" stroke="#1b7a4a" stroke-width="4.5"/>
<text x="98" y="159.8" font-family="'Times New Roman', Times, serif" font-size="28" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">10 </tspan><tspan font-style="normal">μF</tspan></text>
<text x="402" y="159.8" font-family="'Times New Roman', Times, serif" font-size="28" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">2.5 </tspan><tspan font-style="normal">μF</tspan></text>
<text x="282" y="329.8" font-family="'Times New Roman', Times, serif" font-size="28" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">0.30 </tspan><tspan font-style="normal">μF</tspan></text>
</svg>
