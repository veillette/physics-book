<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
<title id="title">Two steps A and B: zero, intermediate, and maximum resultant</title>
<desc id="desc">Three panels with steps A and B of 3.0 m each, drawn head to tail. Left: B points opposite to A, so the resultant R is zero and you are back at the start. Middle: B at an angle to A gives a resultant shorter than 6.0 m. Right: B in the same direction as A gives the largest resultant, R = A + B = 6.0 m.</desc>
<rect width="720" height="250" fill="#ffffff"/>
<text x="12" y="29.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Opposite</tspan><tspan font-style="normal">: </tspan><tspan font-style="normal">R</tspan><tspan font-style="normal"> = 0</tspan></text>
<line x1="40" y1="146" x2="196.4" y2="146" stroke="#c62828" stroke-width="3"/>
<polygon points="208,146 195.4,151.04 195.4,140.96" fill="#c62828"/>
<line x1="208" y1="174" x2="51.6" y2="174" stroke="#1f77c8" stroke-width="3"/>
<polygon points="40,174 52.6,168.96 52.6,179.04" fill="#1f77c8"/>
<text x="124" y="133.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">A<tspan font-size="9.92" font-weight="normal" dx="-10.34" dy="-9.92">→</tspan><tspan dx="1.21" dy="9.92">​</tspan></tspan><tspan font-style="normal"> (3.0 </tspan><tspan font-style="normal">m</tspan><tspan font-style="normal">)</tspan></text>
<text x="124" y="201.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">B<tspan font-size="9.92" font-weight="normal" dx="-9.9" dy="-9.92">→</tspan><tspan dx="0.77" dy="9.92">​</tspan></tspan><tspan font-style="normal"> (3.0 </tspan><tspan font-style="normal">m</tspan><tspan font-style="normal">)</tspan></text>
<circle cx="40" cy="160" r="5" fill="#222222"/>
<text x="80" y="226.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">start</tspan><tspan font-style="normal"> = </tspan><tspan font-style="normal">end</tspan></text>
<line x1="240" y1="10" x2="240" y2="240" stroke="#cccccc" stroke-width="1"/>
<text x="252" y="29.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">At</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">an</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">angle</tspan><tspan font-style="normal">: </tspan><tspan font-style="normal">R</tspan><tspan font-style="normal"> &lt; </tspan><tspan font-style="normal">A</tspan><tspan font-style="normal"> + </tspan><tspan font-style="normal">B</tspan></text>
