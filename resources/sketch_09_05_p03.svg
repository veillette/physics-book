<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the wheelbarrow</title>
<desc id="desc">Torques are taken about the wheel’s axle (the origin). +x points from the handles toward the wheel and +y up, and counterclockwise torques are positive. The weight w = 539 N acts down 5.50 cm to the left of the axle (counterclockwise torque); you lift with F_i at the handles, 1.02 m to the left of the axle (clockwise torque); the ground pushes up on the wheel with N.</desc>
