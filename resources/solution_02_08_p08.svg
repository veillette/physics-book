<svg xmlns="http://www.w3.org/2000/svg" width="670" height="660" viewBox="0 0 670 660" role="img" aria-labelledby="title desc">
<title id="title">Velocity and acceleration for piecewise-linear position</title>
<desc id="desc">Velocity is +1 m/s from 0 to 2 s, minus 5 m/s from 2 to 3 s, zero from 3 to 5 s, and +1 m/s from 5 to 6 s. Acceleration is zero on those open intervals. At 2, 3, and 5 s, arrows indicate idealized impulses of areas minus 6, plus 5, and plus 1 m/s, not finite acceleration heights.</desc>
