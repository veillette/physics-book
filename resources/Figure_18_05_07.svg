<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title desc">
<title id="title">An electric field extending over three regions</title>
<desc id="desc">Five field lines run from left to right through regions I, II and III. In region I they are straight, parallel and closely spaced. In region II two of the lines end at points, which are negative charges. The middle line continues straight. In region III the top and bottom lines curve away from the middle, so the lines are farther apart and the field is weaker.</desc>
