<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720" role="img" aria-labelledby="title desc">
<title id="title">Characteristic x-ray transitions</title>
<desc id="desc">Inner-shell energy levels of a heavy atom: K (n = 1) at the bottom, then L (n = 2), M (n = 3), N (n = 4) and higher levels crowding together. An electron dropping from L to a vacancy in K emits a Kα x ray; from M to K, a Kβ x ray. Drops from M and N to a vacancy in L give Lα and Lβ x rays.</desc>
