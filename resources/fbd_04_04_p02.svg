<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagrams of the two rugby players</title>
<desc id="desc">Two free-body diagrams, both with +x to the right and +y up. (a) Losing player: push F push to the right, a shorter friction force f to the left, normal force N1 up, weight w1 down; acceleration to the right. (b) Winning player: F ground to the right, a slightly shorter F reaction to the left, normal force N2 up, weight w2 down; acceleration to the right.</desc>
<rect width="720" height="322" fill="#ffffff"/>
<g transform="translate(0 0)">
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222">(a) Losing player (90.0 kg)</text>
<g transform="translate(0 22)">
<line x1="25" y1="160" x2="321" y2="160" stroke="#555555" stroke-width="1.5"/><polygon points="330,160 320,164.2 320,155.8" fill="#555555"/>
<line x1="175" y1="270" x2="175" y2="59" stroke="#555555" stroke-width="1.5"/><polygon points="175,50 179.2,60 170.8,60" fill="#555555"/>
<line x1="175" y1="160" x2="175" y2="96" stroke="#b03a2e" stroke-width="3.5"/><polygon points="175,85 180.04,97 169.96,97" fill="#b03a2e"/>
<line x1="175" y1="160" x2="175" y2="224" stroke="#b03a2e" stroke-width="3.5"/><polygon points="175,235 169.96,223 180.04,223" fill="#b03a2e"/>
<line x1="175" y1="160" x2="274" y2="160" stroke="#b03a2e" stroke-width="3.5"/><polygon points="285,160 273,165.04 273,154.96" fill="#b03a2e"/>
<line x1="175" y1="160" x2="91" y2="160" stroke="#b03a2e" stroke-width="3.5"/><polygon points="80,160 92,154.96 92,165.04" fill="#b03a2e"/>
<line x1="215" y1="75" x2="249" y2="75" stroke="#1e8449" stroke-width="3"/><polygon points="260,75 248,80.04 248,69.96" fill="#1e8449"/>
<circle cx="175" cy="160" r="6" fill="#1f3a5f"/>
<text x="185" y="202" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="start">losing player</text>
<text x="346" y="166" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="175" y="40" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="187" y="104" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">N</tspan><tspan font-style="normal" font-size="14" dy="6">1</tspan><tspan dy="-6"></tspan></text>
<text x="187" y="230" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan><tspan font-style="normal" font-size="14" dy="6">1</tspan><tspan dy="-6"></tspan></text>
<text x="271" y="148" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">push</tspan><tspan dy="-6"></tspan></text>
<text x="94" y="148" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">f</tspan></text>
<text x="246" y="63" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
</g>
</g>
<line x1="360" y1="10" x2="360" y2="312" stroke="#cccccc" stroke-width="1"/>
<g transform="translate(360 0)">
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222">(b) Winning player (110 kg)</text>
<g transform="translate(0 22)">
<line x1="25" y1="160" x2="321" y2="160" stroke="#555555" stroke-width="1.5"/><polygon points="330,160 320,164.2 320,155.8" fill="#555555"/>
<line x1="175" y1="270" x2="175" y2="59" stroke="#555555" stroke-width="1.5"/><polygon points="175,50 179.2,60 170.8,60" fill="#555555"/>
<line x1="175" y1="160" x2="175" y2="86" stroke="#b03a2e" stroke-width="3.5"/><polygon points="175,75 180.04,87 169.96,87" fill="#b03a2e"/>
<line x1="175" y1="160" x2="175" y2="234" stroke="#b03a2e" stroke-width="3.5"/><polygon points="175,245 169.96,233 180.04,233" fill="#b03a2e"/>
<line x1="175" y1="160" x2="292" y2="160" stroke="#b03a2e" stroke-width="3.5"/><polygon points="303,160 291,165.04 291,154.96" fill="#b03a2e"/>
<line x1="175" y1="160" x2="76" y2="160" stroke="#b03a2e" stroke-width="3.5"/><polygon points="65,160 77,154.96 77,165.04" fill="#b03a2e"/>
<line x1="215" y1="75" x2="249" y2="75" stroke="#1e8449" stroke-width="3"/><polygon points="260,75 248,80.04 248,69.96" fill="#1e8449"/>
<circle cx="175" cy="160" r="6" fill="#1f3a5f"/>
<text x="185" y="202" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="start">winning player</text>
<text x="346" y="166" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="175" y="40" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="187" y="94" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">N</tspan><tspan font-style="normal" font-size="14" dy="6">2</tspan><tspan dy="-6"></tspan></text>
<text x="187" y="240" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan><tspan font-style="normal" font-size="14" dy="6">2</tspan><tspan dy="-6"></tspan></text>
<text x="289" y="148" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">ground</tspan><tspan dy="-6"></tspan></text>
<text x="79" y="148" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">reaction</tspan><tspan dy="-6"></tspan></text>
<text x="246" y="63" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
</g>
</g>
</svg>
