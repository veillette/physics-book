<title id="title">Sketch of the rock thrown from the cliff</title>
<desc id="desc">A vertical +y axis points up, with the origin at the top of the cliff where the rock is released. Part (a): v_0 = +8.00 m/s (thrown up); the rock rises, falls past the cliff top, and hits the ground at t = 2.35 s at unknown y (negative, below the origin). Part (b): v_0 = −8.00 m/s (thrown down); the time to reach the same ground level is unknown. The acceleration is a = −9.80 m/s² throughout.</desc>
