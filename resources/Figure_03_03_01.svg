<svg xmlns="http://www.w3.org/2000/svg" width="340" height="400" viewBox="0 0 340 400" role="img" aria-labelledby="title desc">
<title id="title">A vector and its x and y components</title>
<desc id="desc">Vector A at angle θ above the +x axis is the sum of a horizontal component Ax along the x axis and a vertical component Ay; together they form a right triangle.</desc>
