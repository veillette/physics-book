<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
<title id="title">Laminar flow between two plates</title>
<desc id="desc">Fluid fills the gap of thickness L between two plates of area A. The bottom plate is fixed. A force F pushes the top plate to the right at speed v, and it drags the fluid along in layers: the layer touching the top plate moves at v, each layer below moves a little slower, and the layer on the fixed bottom plate has v = 0.</desc>
