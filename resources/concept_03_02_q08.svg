<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-labelledby="title desc">
<title id="title">Unequal vectors: two cannot cancel, three can</title>
<desc id="desc">Left: steps of 4.0 m east and 2.0 m west leave a resultant of 2.0 m east, never zero. Right: three steps of 3.0 m, 4.0 m and 5.0 m placed head to tail form a closed right triangle, so their sum is zero and you return to the start.</desc>
<rect width="600" height="270" fill="#ffffff"/>
<text x="12" y="29.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Two</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">unequal</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">steps</tspan><tspan font-style="normal">: </tspan><tspan font-style="normal">R</tspan><tspan font-style="normal"> ≠ 0</tspan></text>
<line x1="40" y1="125" x2="228.4" y2="125" stroke="#c62828" stroke-width="3"/>
<polygon points="240,125 227.4,130.04 227.4,119.96" fill="#c62828"/>
<line x1="240" y1="165" x2="151.6" y2="165" stroke="#1f77c8" stroke-width="3"/>
<polygon points="140,165 152.6,159.96 152.6,170.04" fill="#1f77c8"/>
<line x1="40" y1="205" x2="127.3" y2="205" stroke="#8e4f8e" stroke-width="3.5"/>
<polygon points="140,205 126.3,210.48 126.3,199.52" fill="#8e4f8e"/>
<text x="140" y="112.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">A<tspan font-size="9.92" font-weight="normal" dx="-10.34" dy="-9.92">→</tspan><tspan dx="1.21" dy="9.92">​</tspan></tspan><tspan font-style="normal"> = 4.0 </tspan><tspan font-style="normal">m</tspan></text>
<text x="220" y="190.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">B<tspan font-size="9.92" font-weight="normal" dx="-9.9" dy="-9.92">→</tspan><tspan dx="0.77" dy="9.92">​</tspan></tspan><tspan font-style="normal"> = 2.0 </tspan><tspan font-style="normal">m</tspan></text>
<text x="90" y="232.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">R<tspan font-size="9.92" font-weight="normal" dx="-10.34" dy="-9.92">→</tspan><tspan dx="1.21" dy="9.92">​</tspan></tspan><tspan font-style="normal"> = 2.0 </tspan><tspan font-style="normal">m</tspan></text>
<line x1="290" y1="10" x2="290" y2="260" stroke="#cccccc" stroke-width="1"/>
<text x="302" y="29.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Three</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">steps</tspan><tspan font-style="normal">: </tspan><tspan font-style="normal">A</tspan><tspan font-style="normal"> + </tspan><tspan font-style="normal">B</tspan><tspan font-style="normal"> + </tspan><tspan font-style="normal">C</tspan><tspan font-style="normal"> = 0</tspan></text>
<line x1="350" y1="225" x2="506.4" y2="225" stroke="#c62828" stroke-width="3"/>
<polygon points="518,225 505.4,230.04 505.4,219.96" fill="#c62828"/>
<line x1="518" y1="225" x2="518" y2="110.6" stroke="#1f77c8" stroke-width="3"/>
<polygon points="518,99 523.04,111.6 512.96,111.6" fill="#1f77c8"/>
<line x1="518" y1="99" x2="359.28" y2="218.04" stroke="#3f9a2b" stroke-width="3"/>
<polygon points="350,225 357.06,213.41 363.1,221.47" fill="#3f9a2b"/>
<polyline points="506,225 506,213 518,213" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round"/>
<text x="434" y="248.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">A<tspan font-size="9.92" font-weight="normal" dx="-10.34" dy="-9.92">→</tspan><tspan dx="1.21" dy="9.92">​</tspan></tspan><tspan font-style="normal"> = 4.0 </tspan><tspan font-style="normal">m</tspan></text>
<text x="532" y="167.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">B<tspan font-size="9.92" font-weight="normal" dx="-9.9" dy="-9.92">→</tspan><tspan dx="0.77" dy="9.92">​</tspan></tspan><tspan font-style="normal"> = 3.0 </tspan><tspan font-style="normal">m</tspan></text>
<text x="449.6" y="188.4" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">C<tspan font-size="9.92" font-weight="normal" dx="-10.34" dy="-9.92">→</tspan><tspan dx="1.21" dy="9.92">​</tspan></tspan><tspan font-style="normal"> = 5.0 </tspan><tspan font-style="normal">m</tspan></text>
</svg>
