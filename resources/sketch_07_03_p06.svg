<svg xmlns="http://www.w3.org/2000/svg" width="580" height="300" viewBox="0 0 580 300" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the skier on the 30° slope</title>
<desc id="desc">A frictionless 30° slope descends to the right. A vertical +y axis (up) measures height, with y = 0 at the bottom and 35.0 m at the start. A tilted +x axis points down the slope, the direction of motion. The skier travels d = 70.0 m along +x, starting with v_0 = 0 in part (a) or 2.50 m/s in part (b); the final speed v and time t are unknown. The acceleration a = g sin 30° points along +x.</desc>
