<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" role="img" aria-labelledby="title desc">
<title id="title">The Wheatstone bridge</title>
<desc id="desc">Four resistors form a diamond of two paths from point a on the left to point c on the right: variable R3 then Rx along the top through point b, and R1 then R2 along the bottom through point d. A galvanometer G with resistance rG and a switch connects b to d. A source of emf with internal resistance r drives current I into a and out of c. Current I2 flows along the top path and I1 along the bottom path.</desc>
