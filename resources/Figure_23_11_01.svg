<title id="title">An AC voltage source driving an inductor</title>
<desc id="desc">(a) An AC source V in series with an inductor L of negligible resistance; V_L is the voltage across the inductor. (b) The voltage V starts at its maximum while the current I starts at zero and peaks a quarter cycle later: the voltage leads the current by 90°. Points a to e mark successive quarter periods.</desc>
