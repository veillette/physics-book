<svg xmlns="http://www.w3.org/2000/svg" width="600" height="540" viewBox="0 0 600 540" role="img" aria-labelledby="title desc">
<title id="title">Two measurements of a 25.00 cm length</title>
<desc id="desc">A number line from 24.4 cm to 25.6 cm with the accepted value, 25.00 cm, marked by a dashed line. Measurement A, 25.1 ± 0.3 cm, has a wide uncertainty bar that includes 25.00 cm. Measurement B, 24.62 ± 0.05 cm, has a narrow bar that lies entirely below 25.00 cm: it is precise but not accurate. An animated companion below illustrates the process; its complete static alternative is shown for reduced motion and print.</desc>
