<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1250" viewBox="0 0 560 1250" role="img" aria-labelledby="title desc">
<title id="title">Heat, work, and internal energy in a piston engine</title>
<desc id="desc">(a) Heat Q_in is added to the gas while the piston is held still, so ΔU_a = Q_in; the gas pushes on the piston with force F = PA. (b) The gas expands, pushing the piston a distance d and doing work W_out = Fd on the crank, so ΔU_b = −W_out. (c) The piston is pushed back the distance d by a smaller force F′, so W_in = F′d with F′ &lt; F, while heat Q_out leaves the gas.</desc>
