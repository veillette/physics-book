<text x="640" y="104.1" font-family="'Times New Roman', Times, serif" font-size="26" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">B</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">ext</tspan></tspan><tspan dy="-7.28">​</tspan><tspan font-style="normal"> = 0</tspan></text>
