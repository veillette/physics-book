<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">The Zeeman effect</title>
<desc id="desc">Two spectral lines (a) with no external magnetic field, (b) in a magnetic field, where the left line splits into three and the right line into five, and (c) in a large field, where the split lines are farther apart. The splitting grows in proportion to the field.</desc>
