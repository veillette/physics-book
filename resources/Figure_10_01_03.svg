<svg xmlns="http://www.w3.org/2000/svg" width="650" height="490" viewBox="0 0 650 490" role="img" aria-labelledby="title desc">
<title id="title">Tangential and centripetal acceleration in circular motion</title>
<desc id="desc">Velocity is tangent to the circular path. The tangential acceleration aₜ points along the tangent and changes speed; the perpendicular centripetal acceleration a꜀ points toward the center and changes the direction of velocity.</desc>
<rect width="650" height="490" fill="#ffffff"/>
<path d="M 365.69 372.46 A 165 165 0 1 0 70.46 225.27" fill="none" stroke="#87949d" stroke-width="2" stroke-linejoin="round"/>
<line x1="220" y1="295" x2="362.89" y2="212.5" stroke="#333333" stroke-width="1.7"/>
<circle cx="220" cy="295" r="4" fill="#222222"/>
<circle cx="362.89" cy="212.5" r="4" fill="#222222"/>
<text x="285" y="283.4" font-family="'Times New Roman', Times, serif" font-size="24" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">r</tspan></text>
<path d="M 191.35 132.51 A 165 165 0 0 0 132.56 155.07" fill="none" stroke="#222222" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="140.64" y1="150.34" x2="133" y2="155.09" stroke="#222222" stroke-width="2.5"/>
<polygon points="125.36,159.84 131.74,151.16 135.96,157.96" fill="#222222"/>
<line x1="362.89" y1="212.5" x2="311.74" y2="123.91" stroke="#5e9e1e" stroke-width="3.5"/>
<polygon points="305.39,112.91 316.99,122.03 307.5,127.51" fill="#5e9e1e"/>
<text x="286.39" y="113.35" font-family="'Times New Roman', Times, serif" font-size="26" fill="#5e9e1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan></text>
<g id="tangential-acceleration">
<line x1="379.35" y1="203" x2="343.75" y2="141.34" stroke="#ef7d22" stroke-width="4"/>
<polygon points="336.85,129.39 349.38,139.25 339.12,145.17" fill="#ef7d22"/>
</g>
<text x="371.85" y="150.08" font-family="'Times New Roman', Times, serif" font-size="26" fill="#ef7d22" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">t</tspan></tspan><tspan dy="-7.28">​</tspan></text>
<g id="centripetal-acceleration">
<line x1="362.89" y1="212.5" x2="288.24" y2="255.6" stroke="#6a3d9a" stroke-width="4"/>
<polygon points="276.29,262.5 286.15,249.97 292.07,260.23" fill="#6a3d9a"/>
</g>
<text x="288.54" y="236.82" font-family="'Times New Roman', Times, serif" font-size="26" fill="#6a3d9a" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">c</tspan></tspan><tspan dy="-7.28">​</tspan></text>
<polyline points="353.39,196.05 336.94,205.55 346.44,222" fill="none" stroke="#222222" stroke-width="1.3" stroke-linejoin="round"/>
<text x="345" y="426.05" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-size="16.1" dy="6.44"><tspan font-style="normal">t</tspan></tspan><tspan dy="-6.44">​</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">changes</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">speed</tspan></text>
<text x="345" y="458.05" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-size="16.1" dy="6.44"><tspan font-style="normal">c</tspan></tspan><tspan dy="-6.44">​</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">changes</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">direction</tspan></text>
</svg>
