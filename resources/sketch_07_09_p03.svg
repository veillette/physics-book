<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the forces on the swimmer</title>
<desc id="desc">A horizontal +x axis points in the direction the swimmer moves. The water pushes him forward with F = 80.0 N along +x (the reaction to the backward push of his arms); water resistance, 45.0 N at the start, points along −x. His speed rises from 1.25 m/s to 2.50 m/s in 5.00 s.</desc>
