<svg xmlns="http://www.w3.org/2000/svg" width="750" height="330" viewBox="0 0 750 330" role="img" aria-labelledby="title desc">
<title id="title">A drain insert with four partitions</title>
<desc id="desc">A short, wide ring, like a section of a cylinder, divided into four equal sections by two crossed partitions that meet along its axis. Devices like this sit in drains and increase the flow rate by preventing the water from swirling.</desc>
<rect width="750" height="330" fill="#ffffff"/>
<defs><clipPath id="drain12"><ellipse cx="375" cy="95" rx="350" ry="78"/></clipPath><linearGradient id="ring12" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7fa48f"/><stop offset="0.45" stop-color="#cfe0d5"/><stop offset="1" stop-color="#7fa48f"/></linearGradient></defs>
<ellipse cx="375" cy="95" rx="350" ry="78" fill="#93b5a1" stroke="none" stroke-width="0"/>
