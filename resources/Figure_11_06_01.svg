<svg xmlns="http://www.w3.org/2000/svg" width="740" height="620" viewBox="0 0 740 620" role="img" aria-labelledby="title desc">
<title id="title">An aneroid pressure gauge</title>
<desc id="desc">Pressure P being measured pushes on flexible bellows from the right. The bellows expand, pushing outward with forces F, and move a lever about a pivot; the lever’s long arm is a pointer that moves over a scale marked 0 to 25. A spring on the left resists the motion, so the pointer’s position measures the pressure.</desc>
