<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" role="img" aria-labelledby="title desc">
<title id="title">Potential energy between two light nuclei</title>
<desc id="desc">Potential energy of two light nuclei versus their separation r. At large r the repulsive Coulomb force makes the energy positive and falling off slowly; closer in it rises to a hump, then plunges into a deep well where the attractive nuclear force takes over. A nucleus with enough energy to get over the hump is pulled together into the well; one without enough is repelled.</desc>
