<title id="title">Sketch of the drive and its east and north legs</title>
<desc id="desc">Axes with +x east and +y north, origin at the start. The displacement R is 7.50 km at 15.0° east of north, so it makes 15.0° with the +y axis. Driving its components instead: east R_x then north R_y (dashed, lower right), or north R_y then east R_x (dashed, upper left), reaches the same point.</desc>
