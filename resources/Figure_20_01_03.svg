<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" role="img" aria-labelledby="title desc">
<title id="title">Positive and negative charges give the same conventional current</title>
<desc id="desc">(a) Positive charges move to the right, in the direction of the electric field E, through a cross-sectional area A of a wire; the conventional current I is also to the right. (b) Negative charges move to the left, opposite the field, through the area A; the conventional current I is still to the right, in the direction of the field.</desc>
