<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
<title id="title">Two perpendicular forces adding to Ftot = 20 N at 35°</title>
<desc id="desc">A right triangle: F1 along the base, F2 vertical, and their sum Ftot = 20 N along the hypotenuse at 35° above F1. A free-body diagram shows F1 to the right and F2 up.</desc>
