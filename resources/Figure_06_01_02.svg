<svg xmlns="http://www.w3.org/2000/svg" width="420" height="350" viewBox="0 0 420 350" role="img" aria-labelledby="title desc">
<title id="title">Rotation angle and arc length</title>
<desc id="desc">A circle of radius r centered at O. As the radius turns from OA to OB through the angle Δθ, a point on the circle moves along the arc Δs, so Δθ = Δs/r.</desc>
<rect width="420" height="350" fill="#ffffff"/>
<circle cx="160" cy="185" r="155" fill="none" stroke="#3aa7dc" stroke-width="2"/>
<path d="M 305.65 131.99 A 155 155 0 0 0 200.12 35.28" fill="none" stroke="#4caf3d" stroke-width="4.5" stroke-linejoin="round"/>
<line x1="160" y1="185" x2="305.65" y2="131.99" stroke="#3aa7dc" stroke-width="2.5"/>
<line x1="160" y1="185" x2="200.12" y2="35.28" stroke="#3aa7dc" stroke-width="2.5"/>
<circle cx="160" cy="185" r="7" fill="#3aa7dc"/>
<path d="M 191.95 173.37 A 34 34 0 0 0 168.8 152.16" fill="none" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<text x="212" y="148" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Δ</tspan><tspan font-style="italic">θ</tspan></text>
<text x="260" y="186" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal"><tspan font-style="normal">r</tspan></tspan></text>
<text x="148" y="217" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">O</tspan></text>
<text x="323.65" y="132.99" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">A</tspan></text>
<text x="196.12" y="26.28" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">B</tspan></text>
<text x="287.71" y="64.64" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Δ</tspan><tspan font-weight="bold" font-style="normal"><tspan font-style="normal">s</tspan></tspan></text>
<text x="338" y="272" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Δ</tspan><tspan font-style="italic">θ</tspan><tspan font-style="normal"> =</tspan></text>
<text x="362" y="259.6" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Δ</tspan><tspan font-weight="bold" font-style="normal"><tspan font-style="normal">s</tspan></tspan></text>
<line x1="344" y1="265" x2="380" y2="265" stroke="#222222" stroke-width="1.2"/>
<text x="362" y="286.4" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal"><tspan font-style="normal">r</tspan></tspan></text>
</svg>
