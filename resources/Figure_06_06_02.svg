<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
<title id="title">Kepler's second law</title>
<desc id="desc">A planet of mass m moves on an ellipse around the Sun, of mass M, at one focus. The shaded regions A1 (from A to B), A2 (from C to D) and A3 (from E to F) are swept out in equal times and have equal areas: the arcs are long near the Sun and short far from it.</desc>
