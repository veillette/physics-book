<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" aria-labelledby="title desc">
<title id="title">Poiseuille flow through a tube</title>
<desc id="desc">Fluid of viscosity η flows through a tube of radius r and length l, from the end at higher pressure P2 to the end at lower pressure P1. Arrows across the tube show the parabolic velocity profile of laminar flow: fastest at the center, zero at the walls. The flow rate Q is proportional to the pressure difference P2 − P1 and to r⁴, and inversely proportional to η and l.</desc>
