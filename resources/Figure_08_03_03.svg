<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">Electrons scattering from a target and from a quark in a proton</title>
<desc id="desc">Top: a beam of electrons strikes a macroscopic target. Most electrons pass through and continue to the right, but one scatters straight back to the left. Below, an enlarged view of a small region of the target: an electron strikes a quark inside a proton. The quark recoils forward and the electron bounces back.</desc>
