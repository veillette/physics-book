<svg xmlns="http://www.w3.org/2000/svg" width="620" height="380" viewBox="0 0 620 380" role="img" aria-labelledby="title desc">
<title id="title">A motor loop as a magnet, viewed from above</title>
<desc id="desc">Top view of the motor loop between the N pole on the left and the S pole on the right, with the field pointing right. The loop’s current comes up out of the page at its left edge and goes down into the page at its right edge. By the right-hand rule its own field points up the page, so its north face is the back face. The force on the left edge points up the page and the force on the right edge points down the page, turning the loop clockwise until its north face points at the S pole.</desc>
