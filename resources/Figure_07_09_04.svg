<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc">
<title id="title">GDP and annual energy use per person, 2025</title>
<desc id="desc">A scatter plot for the eleven countries in Table 1. The horizontal axis shows GDP per person in constant 2021 international dollars, adjusted for purchasing power. The vertical axis shows annual total energy supply in kWh per person, using physical energy content accounting. Higher income generally accompanies higher energy use, but there is substantial variation: Germany uses less energy per person than Russia despite higher GDP per person.</desc>
