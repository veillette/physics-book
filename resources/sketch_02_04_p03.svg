<svg xmlns="http://www.w3.org/2000/svg" width="600" height="248" viewBox="0 0 600 248" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the car backing out of the garage</title>
<desc id="desc">A horizontal +x axis points in the direction the car backs out of the garage (away from the garage), with the origin where the car starts. Start: t = 0, v_0 = 0. After backing up: v_1 = +2.00 m/s at an unknown time. Stopped 0.800 s later: v_2 = 0. While speeding up a_1 = +1.40 m/s² (in +x); while braking a_2 is unknown and points in −x.</desc>
