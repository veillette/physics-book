<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
<title id="title">A northbound airplane drifts west in a headwind</title>
<desc id="desc">The airplane’s air velocity points north. The wind vector points southwest from its tip. Their sum points 20° west of north, or 110° counterclockwise from east. In the numerical example the airspeed is 45.0 m/s and the ground speed is 38.0 m/s; the wind components are −13.0 m/s eastward and −9.29 m/s northward.</desc>
