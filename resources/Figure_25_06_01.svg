<title id="title">Parallel rays through a converging lens</title>
<desc id="desc">Left: an expanded view of ray 1 crossing a wedge of lens glass; it bends toward the normal on entering (θ1 to θ2) and away from it on leaving (θ2′ to θ1′), so it is turned toward the axis. Right: rays 1, 2 and 3 enter a converging lens parallel to its axis; ray 2 on the axis is undeviated, and rays 1 and 3 cross the axis at the focal point F, a distance f from the lens.</desc>
