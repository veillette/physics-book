<rect x="420" y="46" width="24" height="76" fill="#f4d03f" stroke="#9a7d0a" stroke-width="1.5"/>
<text x="432" y="42.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">goalpost</tspan></text>
</svg>
