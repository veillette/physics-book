<svg xmlns="http://www.w3.org/2000/svg" width="600" height="269" viewBox="0 0 600 269" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the player stopping against the goalpost</title>
<desc id="desc">A horizontal +x axis points in the direction the player runs, toward the goalpost, with the origin where he first touches the padding. At contact: t = 0, x_0 = 0, v_0 = +7.50 m/s. Stopped: x = 0.350 m, v = 0. The acceleration points in −x.</desc>
<rect width="600" height="269" fill="#ffffff"/>
<line x1="30" y1="122" x2="510" y2="122" stroke="#8d6e63" stroke-width="2.2"/>
<line x1="30" y1="156" x2="490" y2="156" stroke="#555555" stroke-width="1.6"/>
<polygon points="500,156 489,160.4 489,151.6" fill="#555555"/>
<text x="516" y="161.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="500" y="180.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">direction</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">of</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">motion</tspan><tspan font-style="normal">)</tspan></text>
<line x1="110" y1="151" x2="110" y2="161" stroke="#555555" stroke-width="1.6"/>
<text x="110" y="177.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">0</tspan></text>
<circle cx="110" cy="110" r="7" fill="#1f3a5f"/>
<text x="110" y="98.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f3a5f" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">player</tspan></text>
<line x1="110" y1="72" x2="178.4" y2="72" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="190,72 177.4,77.04 177.4,66.96" fill="#3f8a1e"/>
<text x="150" y="63.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan></text>
<text x="110" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">t</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 0</tspan></text>
<text x="110" y="226.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">x</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 0</tspan></text>
<text x="110" y="247.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = +7.50 </tspan><tspan font-style="normal">m/s</tspan></text>
<line x1="110" y1="151" x2="110" y2="161" stroke="#555555" stroke-width="1.6"/>
<circle cx="400" cy="110" r="7" fill="#1f3a5f"/>
<text x="400" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">t</tspan><tspan font-style="normal"> = ?</tspan></text>
