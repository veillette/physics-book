<text x="400" y="247.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-style="normal"> = 0</tspan></text>
<line x1="400" y1="151" x2="400" y2="161" stroke="#555555" stroke-width="1.6"/>
<line x1="330" y1="40" x2="281.6" y2="40" stroke="#6a3d9a" stroke-width="3"/>
<polygon points="270,40 282.6,34.96 282.6,45.04" fill="#6a3d9a"/>
