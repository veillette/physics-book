<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="title desc">
<title id="title">The Moon raises two tidal bulges</title>
<desc id="desc">Earth, rotating counterclockwise, sits inside an ocean stretched into an ellipse along the line to the Moon. High tides are on the sides nearest and farthest from the Moon, and low tides are at right angles to that line. The Moon, at right, moves upward in its counterclockwise orbit. Not to scale.</desc>
