<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="title desc">
<title id="title">Charging a capacitor through a resistor</title>
<desc id="desc">(a) A source of emf, a resistor R, a capacitor C and a switch in series; when the switch closes, current I flows clockwise and the capacitor plates acquire charges +q and −q. (b) The capacitor voltage V rises from 0 toward the emf, reaching 0.632 emf at one time constant τ = RC and coming closer at 2τ, 3τ and 4τ.</desc>
