<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the left half of the sandwich board, chain broken</title>
<desc id="desc">Left half of the sign with the chain broken, torques taken about its foot (the origin). +x points to the right (toward the center) and +y up, and counterclockwise torques are positive. The weight W = 39.2 N acts down 0.275 m right of the foot (clockwise torque); the other half pushes horizontally along −x on the hinge, 1.30 m above the foot (counterclockwise torque); friction f on the foot points along +x and N along +y.</desc>
