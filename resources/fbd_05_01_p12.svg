<svg xmlns="http://www.w3.org/2000/svg" width="440" height="370" viewBox="0 0 440 370" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of an object resting on an incline</title>
<desc id="desc">Free-body diagram with tilted axes: +x down the slope and +y perpendicular to the slope, away from it. Normal force N along +y, static friction f s up the slope (along -x) equal in length to the weight component mg sin theta along +x, weight w straight down with dashed components mg sin theta and mg cos theta. a = 0.</desc>
