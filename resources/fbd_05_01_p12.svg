<line x1="150" y1="296.24" x2="285.5" y2="61.55" stroke="#555555" stroke-width="1.5"/><polygon points="290,53.76 288.64,64.52 281.36,60.32" fill="#555555"/>
<line x1="48.46" y1="92.12" x2="377.54" y2="282.12" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M 188 230.43 A 64 64 0 0 0 220 239" fill="none" stroke="#222222" stroke-width="1.5"/>
<line x1="220" y1="175" x2="258.11" y2="197" stroke="#c0675e" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="267.63,202.5 254.72,200.86 259.76,192.14" fill="#c0675e"/>
<line x1="220" y1="175" x2="177.87" y2="247.97" stroke="#c0675e" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="172.37,257.5 174,244.59 182.73,249.63" fill="#c0675e"/>
<line x1="220" y1="175" x2="262.13" y2="102.03" stroke="#b03a2e" stroke-width="3.5"/><polygon points="267.63,92.5 266,105.41 257.27,100.37" fill="#b03a2e"/>
<line x1="220" y1="175" x2="220" y2="274" stroke="#b03a2e" stroke-width="3.5"/><polygon points="220,285 214.96,273 225.04,273" fill="#b03a2e"/>
<line x1="222" y1="171.54" x2="183.89" y2="149.54" stroke="#b03a2e" stroke-width="3.5"/><polygon points="174.37,144.04 187.28,145.67 182.24,154.4" fill="#b03a2e"/>
<circle cx="220" cy="175" r="6" fill="#1f3a5f"/>
<text x="270" y="153" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="start">object</text>
