<line x1="90" y1="190" x2="486.39" y2="120.11" stroke="#a9c2d9" stroke-width="10" stroke-linecap="round"/>
<line x1="90" y1="190" x2="486.39" y2="120.11" stroke="#1f3a5f" stroke-width="1.4"/>
<polygon points="90,195 80.9,208 99.1,208" fill="#999999" stroke="#555555" stroke-width="1.2"/>
<line x1="90" y1="196" x2="90" y2="256" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="293.86" y1="160.05" x2="293.86" y2="256" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="97" y1="250" x2="286.86" y2="250" stroke="#444444" stroke-width="1.2"/>
<polygon points="293.86,250 285.86,253.2 285.86,246.8" fill="#444444"/>
<polygon points="90,250 98,246.8 98,253.2" fill="#444444"/>
