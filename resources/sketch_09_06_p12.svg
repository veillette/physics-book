<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the push-up</title>
<desc id="desc">The body is a rigid lever pivoting at the toes (the origin). +x points from the feet toward the head and +y up, and counterclockwise torques are positive. Her weight W = 490 N acts down 0.90 m from the toes (clockwise torque); the floor pushes up on the two hands with a total of 2F_hand, 1.50 m from the toes (counterclockwise torque).</desc>
