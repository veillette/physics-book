<line x1="90" y1="196" x2="90" y2="284" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="429.76" y1="136.09" x2="429.76" y2="284" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="97" y1="278" x2="422.76" y2="278" stroke="#444444" stroke-width="1.2"/>
<polygon points="429.76,278 421.76,281.2 421.76,274.8" fill="#444444"/>
<polygon points="90,278 98,274.8 98,281.2" fill="#444444"/>
<text x="259.88" y="272.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">1.50 </tspan><tspan font-style="normal">m</tspan></text>
<line x1="293.86" y1="154.05" x2="293.86" y2="202.45" stroke="#b03a2e" stroke-width="3"/>
<polygon points="293.86,214.05 288.82,201.45 298.9,201.45" fill="#b03a2e"/>
