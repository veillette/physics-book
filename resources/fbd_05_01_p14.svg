<line x1="220" y1="175" x2="220" y2="274" stroke="#b03a2e" stroke-width="3.5"/><polygon points="220,285 214.96,273 225.04,273" fill="#b03a2e"/>
<line x1="218.63" y1="171.24" x2="274.07" y2="151.06" stroke="#b03a2e" stroke-width="3.5"/><polygon points="284.41,147.3 274.86,156.14 271.41,146.67" fill="#b03a2e"/>
