<svg xmlns="http://www.w3.org/2000/svg" width="440" height="370" viewBox="0 0 440 370" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the car accelerating uphill</title>
<desc id="desc">Free-body diagram with tilted axes: +x up the slope and +y perpendicular to the slope, away from it. Normal force N along +y; static friction from the road on the drive wheels f s max up the slope (along +x); weight w straight down with dashed components mg sin theta along -x and mg cos theta along -y. The acceleration points up the slope.</desc>
