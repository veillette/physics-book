<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the dragster run</title>
<desc id="desc">A horizontal +x axis points in the direction the dragster moves, with the origin at the start. It starts from rest and reaches v = +110 m/s at x = 400 m after 7.30 s. Forces along x: the driving force F along +x and friction f = 1200 N along −x.</desc>
<rect width="600" height="250" fill="#ffffff"/>
<line x1="40" y1="124" x2="470" y2="124" stroke="#8d6e63" stroke-width="2.2"/>
<line x1="40" y1="164" x2="450" y2="164" stroke="#555555" stroke-width="1.6"/>
<polygon points="460,164 449,168.4 449,159.6" fill="#555555"/>
<text x="468" y="169.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="468" y="186.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">direction</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">of</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">motion</tspan><tspan font-style="normal">)</tspan></text>
<line x1="90" y1="159" x2="90" y2="169" stroke="#555555" stroke-width="1.6"/>
<text x="90" y="185.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">0</tspan></text>
<line x1="420" y1="159" x2="420" y2="169" stroke="#555555" stroke-width="1.6"/>
<text x="420" y="185.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">400 </tspan><tspan font-style="normal">m</tspan></text>
<polygon points="65,123 115,123 115,101 65,101" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<polygon points="230,123 280,123 280,101 230,101" fill="#d6e4f0" stroke="#1f3a5f" stroke-width="2"/>
<line x1="280" y1="112" x2="338.4" y2="112" stroke="#b03a2e" stroke-width="3"/>
<polygon points="350,112 337.4,117.04 337.4,106.96" fill="#b03a2e"/>
<text x="363" y="117.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan></text>
<line x1="230" y1="112" x2="181.6" y2="112" stroke="#b03a2e" stroke-width="3"/>
<polygon points="170,112 182.6,106.96 182.6,117.04" fill="#b03a2e"/>
<text x="176" y="101.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">f</tspan></text>
<polygon points="395,123 445,123 445,101 395,101" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<line x1="396" y1="82" x2="454.4" y2="82" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="466,82 453.4,87.04 453.4,76.96" fill="#3f8a1e"/>
<text x="430" y="71.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan></text>
<text x="255" y="146.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">dragster</tspan></text>
<text x="90" y="209.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">t</tspan><tspan font-style="normal"> = 0</tspan></text>
<text x="90" y="230.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 0</tspan></text>
<text x="255" y="209.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">f</tspan><tspan font-style="normal"> = 1200 </tspan><tspan font-style="normal">N</tspan></text>
<text x="420" y="209.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">t</tspan><tspan font-style="normal"> = 7.30 </tspan><tspan font-style="normal">s</tspan></text>
<text x="420" y="230.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-style="normal"> = +110 </tspan><tspan font-style="normal">m/s</tspan></text>
</svg>
