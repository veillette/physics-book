<svg xmlns="http://www.w3.org/2000/svg" width="360" height="340" viewBox="0 0 360 340" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the jumping flea</title>
<desc id="desc">Free-body diagram with +x in the direction of the breeze (to the right) and +y up: force from the ground F ground up, weight w down (about half as long), small breeze force F breeze to the right. The acceleration points up and slightly to the right, 4.67 degrees from vertical.</desc>
<rect width="360" height="340" fill="#ffffff"/>
<line x1="40" y1="200" x2="301" y2="200" stroke="#555555" stroke-width="1.5"/><polygon points="310,200 300,204.2 300,195.8" fill="#555555"/>
<line x1="160" y1="315" x2="160" y2="79" stroke="#555555" stroke-width="1.5"/><polygon points="160,70 164.2,80 155.8,80" fill="#555555"/>
<line x1="160" y1="200" x2="160" y2="91" stroke="#b03a2e" stroke-width="3.5"/><polygon points="160,80 165.04,92 154.96,92" fill="#b03a2e"/>
<line x1="160" y1="200" x2="160" y2="248" stroke="#b03a2e" stroke-width="3.5"/><polygon points="160,259 154.96,247 165.04,247" fill="#b03a2e"/>
<line x1="160" y1="200" x2="181" y2="200" stroke="#b03a2e" stroke-width="3.5"/><polygon points="192,200 180,205.04 180,194.96" fill="#b03a2e"/>
<line x1="80" y1="180" x2="83.99" y2="131.16" stroke="#1e8449" stroke-width="3"/><polygon points="84.88,120.2 88.93,132.57 78.88,131.75" fill="#1e8449"/>
<circle cx="160" cy="200" r="6" fill="#1f3a5f"/>
<text x="150" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="end">flea</text>
<text x="326" y="206" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="160" y="60" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="172" y="99" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">ground</tspan><tspan dy="-6"></tspan></text>
<text x="172" y="254" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan></text>
<text x="192" y="188" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">breeze</tspan><tspan dy="-6"></tspan></text>
<text x="96.88" y="139.16" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="start" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
<text x="200" y="334" font-family="'Times New Roman', Times, serif" font-size="14" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="9.8" dy="4.2">breeze</tspan><tspan dy="-4.2"></tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">drawn</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">larger</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">than</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">to</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">scale</tspan></text>
</svg>
