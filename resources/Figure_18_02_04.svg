<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">Charging by induction using a ground connection</title>
<desc id="desc">(a) A positively charged rod near a neutral metal sphere polarizes it: negative charge on the side near the rod, positive charge on the far side. (b) The sphere is grounded, and electrons flow up from the earth and cancel the positive charge on the far side. (c) The ground connection is broken; the sphere keeps its excess negative charge, still held on the near side by the rod. (d) With the rod removed, the excess negative charge spreads out over the sphere.</desc>
