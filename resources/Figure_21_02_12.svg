<title id="title">Two voltage sources with identical emfs in parallel</title>
<desc id="desc">Top: two sources, each with the same emf, with internal resistances r1 and r2, connected in parallel across a load R_load. An arrow points to the equivalent circuit below: a single source of the same emf with a total internal resistance r_tot across R_load, where r_tot is less than r1 or r2.</desc>
