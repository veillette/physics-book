<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc">
<title id="title">Forces on the mass and on the string</title>
<desc id="desc">Top view of a mass circling a nail on a frictionless table. Separate force diagrams: the string pulls the mass toward the nail with tension T (the centripetal force). By Newton’s third law the mass pulls the string outward with an equal force T. The nail pulls the other end of the string inward with T. The two equal and opposite pulls at its ends are what stretch the string.</desc>
<rect width="600" height="300" fill="#ffffff"/>
<circle cx="70" cy="140" r="9" fill="#888888" stroke="#222222" stroke-width="1.5"/>
<text x="70" y="176.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">nail</tspan></text>
<line x1="170" y1="140" x2="400" y2="140" stroke="#222222" stroke-width="3"/>
<text x="285" y="164.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">string</tspan></text>
<circle cx="520" cy="140" r="20" fill="#e0a030" stroke="#222222" stroke-width="1.5"/>
<text x="545" y="180.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">mass</tspan></text>
<line x1="170" y1="140" x2="132.7" y2="140" stroke="#c62828" stroke-width="3.5"/>
<polygon points="120,140 133.7,134.52 133.7,145.48" fill="#c62828"/>
<text x="140" y="122.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">(nail on string)</tspan></text>
<line x1="400" y1="140" x2="437.3" y2="140" stroke="#c62828" stroke-width="3.5"/>
<polygon points="450,140 436.3,145.48 436.3,134.52" fill="#c62828"/>
<text x="415" y="122.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">(mass on string)</tspan></text>
<line x1="500" y1="140" x2="474.7" y2="140" stroke="#c62828" stroke-width="3.5"/>
<polygon points="462,140 475.7,134.52 475.7,145.48" fill="#c62828"/>
<text x="470" y="170.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">(string on mass)</tspan></text>
<text x="470" y="190.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">centripetal</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">force</tspan></text>
<text x="300" y="234.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">the</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">mass</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">pulls</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">outward</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">on</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">the</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">string</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">because</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">the</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">string</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">pulls</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">it</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">inward</tspan></text>
<text x="300" y="258.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">Newton</tspan><tspan font-style="normal">’</tspan><tspan font-style="normal">s</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">third</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">law</tspan><tspan font-style="normal">); </tspan><tspan font-style="normal">pulled</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">at</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">both</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">ends</tspan><tspan font-style="normal">, </tspan><tspan font-style="normal">the</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">string</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">stretches</tspan></text>
