<title id="title">Geometric and wave-optics focus</title>
<desc id="desc">(a) In geometric optics, parallel rays through a lens cross at a single focal point. (b) Wave optics shows that the light converges only to a focal region of finite width, because of diffraction, and then spreads again.</desc>
