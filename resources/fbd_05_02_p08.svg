<svg xmlns="http://www.w3.org/2000/svg" width="320" height="300" viewBox="0 0 320 300" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the sinking bacterium</title>
<desc id="desc">Free-body diagram with +x to the right and +y up: Stokes drag F s up and buoyant force F B up, drawn side by side, together balancing the weight w pointing down; a = 0 at terminal velocity.</desc>
<rect width="320" height="300" fill="#ffffff"/>
<line x1="40" y1="150" x2="266" y2="150" stroke="#555555" stroke-width="1.5"/><polygon points="275,150 265,154.2 265,145.8" fill="#555555"/>
<line x1="150" y1="265" x2="150" y2="44" stroke="#555555" stroke-width="1.5"/><polygon points="150,35 154.2,45 145.8,45" fill="#555555"/>
<line x1="143" y1="150" x2="143" y2="140.2" stroke="#b03a2e" stroke-width="3.5"/><polygon points="143,134 146.02,141.2 139.98,141.2" fill="#b03a2e"/>
<line x1="157" y1="150" x2="157" y2="81" stroke="#b03a2e" stroke-width="3.5"/><polygon points="157,70 162.04,82 151.96,82" fill="#b03a2e"/>
<line x1="150" y1="150" x2="150" y2="235" stroke="#b03a2e" stroke-width="3.5"/><polygon points="150,246 144.96,234 155.04,234" fill="#b03a2e"/>
<circle cx="150" cy="150" r="6" fill="#1f3a5f"/>
<text x="140" y="176" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="end">bacterium</text>
<text x="291" y="156" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="150" y="25" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="136" y="130" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="end" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">s</tspan><tspan dy="-6"></tspan></text>
<text x="169" y="89" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">B</tspan><tspan dy="-6"></tspan></text>
<text x="162" y="241" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan></text>
<text x="80" y="61" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-style="normal"> = 0</tspan></text>
<text x="150" y="284" font-family="'Times New Roman', Times, serif" font-size="15" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="10.5" dy="4.5">s</tspan><tspan dy="-4.5"></tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">is</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">about</tspan><tspan font-style="normal"> 1/11 </tspan><tspan font-style="italic">of</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">w</tspan></text>
</svg>
