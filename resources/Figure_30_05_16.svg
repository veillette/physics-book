<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" role="img" aria-labelledby="title desc">
<title id="title">Energy levels of a ruby laser</title>
<desc id="desc">Energy levels of chromium ions in an aluminum oxide crystal (ruby), drawn to scale: the ground state at 0.0 eV, a metastable first excited state at 1.79 eV, a second at 2.3 eV and a third at 3.0 eV.</desc>
<rect width="640" height="520" fill="#ffffff"/>
<line x1="180" y1="440" x2="460" y2="440" stroke="#a5182f" stroke-width="2.6"/>
<text x="170" y="448.4" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Ground</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">state</tspan></text>
<text x="470" y="448.4" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">0.0 </tspan><tspan font-style="normal">eV</tspan></text>
<line x1="180" y1="207.3" x2="460" y2="207.3" stroke="#a5182f" stroke-width="2.6"/>
<text x="170" y="215.7" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">First</tspan></text>
<text x="470" y="215.7" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Metastable</tspan></text>
<text x="470" y="245.7" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">1.79 </tspan><tspan font-style="normal">eV</tspan></text>
<line x1="180" y1="141" x2="460" y2="141" stroke="#a5182f" stroke-width="2.6"/>
<text x="170" y="149.4" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Second</tspan></text>
<text x="470" y="149.4" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">2.3 </tspan><tspan font-style="normal">eV</tspan></text>
<line x1="180" y1="50" x2="460" y2="50" stroke="#a5182f" stroke-width="2.6"/>
<text x="170" y="58.4" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Third</tspan></text>
<text x="470" y="58.4" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">3.0 </tspan><tspan font-style="normal">eV</tspan></text>
<text x="320" y="488.4" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Ruby</tspan><tspan font-style="normal"> (</tspan><tspan font-style="normal">Cr</tspan><tspan font-size="16.8" dy="-9.6"><tspan font-style="normal">3+</tspan></tspan><tspan dy="9.6">​</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">in</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">Al</tspan><tspan font-size="16.8" dy="6.72"><tspan font-style="normal">2</tspan></tspan><tspan dy="-6.72">​</tspan><tspan font-style="normal">O</tspan><tspan font-size="16.8" dy="6.72"><tspan font-style="normal">3</tspan></tspan><tspan dy="-6.72">​</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">crystal</tspan><tspan font-style="normal">)</tspan></text>
</svg>
