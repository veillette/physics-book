<title id="title">Displacement versus average velocity for a given time</title>
<desc id="desc">A straight line through the origin: for a fixed time t, the displacement Δx increases in proportion to the average velocity. An animated companion below illustrates the process; its complete static alternative is shown for reduced motion and print.</desc>
