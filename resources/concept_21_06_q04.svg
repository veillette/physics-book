<title id="title">Charge versus time for a charging and a discharging capacitor</title>
<desc id="desc">Two graphs of charge versus time. Left, charging: the charge rises from zero, reaching 0.632 Q at one time constant and 0.865 Q at two, and approaching Q along a horizontal asymptote. Right, discharging: the charge falls from Q zero, to 0.368 Q zero at one time constant and 0.135 Q zero at two, and approaches zero.</desc>
