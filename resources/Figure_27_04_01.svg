<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
<title id="title">Diffraction grating orders</title>
<desc id="desc">(a) White light falls on a diffraction grating, a barrier with many evenly spaced slits, and leaves in several directions. (b) Straight through is the central white maximum; on either side are first-order rainbows and, farther out, fainter and broader second-order rainbows.</desc>
