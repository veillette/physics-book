<svg xmlns="http://www.w3.org/2000/svg" width="660" height="269" viewBox="0 0 660 269" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the train passing through the station</title>
<desc id="desc">A horizontal +x axis points in the direction the train travels, with the origin at the entrance of the 210-m station. At t = 0 the nose is at x_0 = 0 with v_0 = +22.0 m/s, and the 130-m train trails behind it. The nose leaves the station at x = 210 m; the end of the train leaves when the nose is at x = 340 m. The acceleration points in −x: a = −0.150 m/s².</desc>
