<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 440 440" role="img" aria-labelledby="title desc">
<title id="title">Field lines and equipotentials of a point charge</title>
<desc id="desc">A positive point charge Q at the center. Twelve straight field lines, in blue, point radially outward. Four green equipotential circles surround the charge, drawn for equal steps of potential, so they are closest together near the charge, where the field is strongest. The field lines cross every equipotential at right angles.</desc>
