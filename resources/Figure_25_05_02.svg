<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="230" viewBox="0 0 1040 230" role="img" aria-labelledby="title desc">
<title id="title">The visible spectrum</title>
<desc id="desc">A wavelength scale from 850 nm on the left to 250 nm on the right. Visible light runs from about 760 nm (red) through orange, yellow, green and blue to about 380 nm (violet), shown as a continuous band of color. Infrared lies at longer wavelengths to the left and ultraviolet at shorter wavelengths to the right.</desc>
