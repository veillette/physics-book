<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" role="img" aria-labelledby="title desc">
<title id="title">Electrons entering and leaving a length of wire</title>
<desc id="desc">A length of wire holds free electrons. Two electrons are being pushed in at the left end, each with a faded trail and an arrow to the right, and at the same moment two electrons leave at the right end, also moving right. The other electrons inside stay spread out, because their mutual repulsion lets the number in the wire change hardly at all.</desc>
