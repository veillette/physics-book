<svg xmlns="http://www.w3.org/2000/svg" width="880" height="720" viewBox="0 0 880 720" role="img" aria-labelledby="title desc">
<title id="title">Conduction by molecular collisions</title>
<desc id="desc">Two regions meet at a surface: higher temperature on the left, lower on the right. A high-energy molecule from the left collides at the surface with a low-energy molecule from the right. After the collision the left molecule moves back more slowly and the right one moves away faster, so energy has passed from the hot side to the cold side. The net effect is heat conduction, Q, to the right.</desc>
