<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" role="img" aria-labelledby="title desc">
<title id="title">An ammeter connected directly across a voltage source</title>
<desc id="desc">A source of emf with internal resistance r on the left, connected directly to an ammeter A on the right with nothing else in the circuit. Labeled &quot;Do not do this!&quot;</desc>
<rect width="500" height="300" fill="#ffffff"/>
<polyline points="110,40 330,40 330,260 110,260 110,40" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<line x1="110" y1="120.4" x2="110" y2="100.4" stroke="#ffffff" stroke-width="7"/>
<line x1="110" y1="135.4" x2="110" y2="116.9" stroke="#222222" stroke-width="2"/>
<line x1="110" y1="103.9" x2="110" y2="85.4" stroke="#222222" stroke-width="2"/>
<line x1="94" y1="116.9" x2="126" y2="116.9" stroke="#c62828" stroke-width="5"/>
<line x1="78" y1="103.9" x2="142" y2="103.9" stroke="#c62828" stroke-width="3"/>
<text x="84" y="122.1" font-family="'Times New Roman', Times, serif" font-size="22" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">emf</tspan></text>
<line x1="110" y1="170.4" x2="110" y2="226.4" stroke="#ffffff" stroke-width="7"/>
<line x1="110" y1="163.4" x2="110" y2="170.4" stroke="#222222" stroke-width="2"/>
<line x1="110" y1="226.4" x2="110" y2="233.4" stroke="#222222" stroke-width="2"/>
<polyline points="110,170.4 99,175.07 121,184.4 99,193.73 121,203.07 99,212.4 121,221.73 110,226.4" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<text x="92" y="206.1" font-family="'Times New Roman', Times, serif" font-size="22" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">r</tspan></text>
<line x1="330" y1="122" x2="330" y2="178" stroke="#ffffff" stroke-width="7"/>
<line x1="330" y1="110" x2="330" y2="122" stroke="#222222" stroke-width="2"/>
<line x1="330" y1="178" x2="330" y2="190" stroke="#222222" stroke-width="2"/>
<circle cx="330" cy="150" r="28" fill="#c9cfe6" stroke="#222222" stroke-width="2"/>
<text x="330" y="156.3" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">A</tspan></text>
<text x="350" y="97" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Do</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">not</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">do</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">this</tspan><tspan font-style="normal">!</tspan></text>
</svg>
