<svg xmlns="http://www.w3.org/2000/svg" width="400" height="360" viewBox="0 0 400 360" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the shell in the tilted mortar</title>
<desc id="desc">Free-body diagram with tilted axes: +x along the tube, 10 degrees from vertical, and +y perpendicular to the tube. The force from the gases F points along +x. The weight w points straight down and is split into dashed components mg cos 10 along -x and mg sin 10 along -y. The tube wall pushes with N along +y. The acceleration points along +x.</desc>
