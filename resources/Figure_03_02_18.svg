<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
<title id="title">Two paths from a cabin to a lake with one displacement</title>
<desc id="desc">A cabin sits at the origin of x–y axes, with north up. The displacement vector S, 5.0 km long, points 40° north of east to a lake. Path 1 wanders east below and across S before reaching the lake; Path 2 loops north and over the top. Both paths have the same displacement S.</desc>
