<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
<title id="title">Entropy change between two states</title>
<desc id="desc">Two states of a system, state 1 with entropy S₁ and state 2 with entropy S₂. A reversible process from state 1 to state 2 has ΔS = (Q/T)_rev. An irreversible process between the same states has the same change, ΔS_irrev = ΔS_rev = S₂ − S₁, because entropy is a property of the state.</desc>
<rect width="640" height="560" fill="#ffffff"/>
<line x1="150" y1="115" x2="470" y2="115" stroke="#7ab32e" stroke-width="5"/>
<polygon points="470,100 470,130 500,115" fill="#7ab32e"/>
<path d="M 75 185 L 75 335 Q 75 380 120 380 L 520 380 Q 565 380 565 335 L 565 215" fill="none" stroke="#6a3d9a" stroke-width="5" stroke-linejoin="round"/>
<polygon points="550,220 580,220 565,190" fill="#6a3d9a"/>
<circle cx="75" cy="115" r="72" fill="#e3f2c5" stroke="#9ccf54" stroke-width="2"/>
<circle cx="565" cy="115" r="72" fill="#dcd0ea" stroke="#9a7cc2" stroke-width="2"/>
<text x="75" y="109.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">State</tspan><tspan font-style="normal"> 1</tspan></text>
<text x="75" y="141.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">S</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">1</tspan></tspan><tspan dy="-7.28">​</tspan></text>
<text x="565" y="109.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">State</tspan><tspan font-style="normal"> 2</tspan></text>
<text x="565" y="141.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">S</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">2</tspan></tspan><tspan dy="-7.28">​</tspan></text>
<text x="320" y="39.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Reversible</tspan></text>
<text x="320" y="71.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">process</tspan></text>
<text x="320" y="199.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Δ</tspan><tspan font-style="italic">S</tspan><tspan font-style="normal"> = (</tspan><tspan font-style="italic">Q</tspan><tspan font-style="normal">/</tspan><tspan font-style="italic">T</tspan><tspan font-style="normal">)</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">rev</tspan></tspan><tspan dy="-7.28">​</tspan></text>
<text x="320" y="284.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Δ</tspan><tspan font-style="italic">S</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">irrev</tspan></tspan><tspan dy="-7.28">​</tspan><tspan font-style="normal"> = </tspan><tspan font-style="normal">Δ</tspan><tspan font-style="italic">S</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">rev</tspan></tspan><tspan dy="-7.28">​</tspan></text>
<text x="320" y="318.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">= </tspan><tspan font-style="italic">S</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">2</tspan></tspan><tspan dy="-7.28">​</tspan><tspan font-style="normal"> − </tspan><tspan font-style="italic">S</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">1</tspan></tspan><tspan dy="-7.28">​</tspan></text>
<text x="320" y="449.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Irreversible</tspan></text>
<text x="320" y="481.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">process</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">has</tspan></text>
<text x="320" y="513.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">the</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">same</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">Δ</tspan><tspan font-style="italic">S</tspan></text>
</svg>
