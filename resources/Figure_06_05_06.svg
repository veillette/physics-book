<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img" aria-labelledby="title desc">
<title id="title">Spring and neap tides</title>
<desc id="desc">The Sun is far to the right in each panel. (a) New moon: the Moon lies between Earth and the Sun, and the two tides add to a large bulge along the Sun–Earth line, a spring tide. (b) Full moon: the Moon is on the far side, and the bulge is again along that line, another spring tide. (c) Quarter moon: the Moon is at right angles to the Sun line; the smaller solar tide partly cancels the lunar one, and the weaker bulge points toward the Moon, a neap tide. The Moon moves counterclockwise and is lit on the side facing the Sun.</desc>
