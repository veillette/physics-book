<title id="title">A corner reflector</title>
<desc id="desc">Two mirrors meet at a right angle. A ray reflects from the lower mirror, making equal angles θ1 with its normal, then from the upper mirror, making equal angles θ2 with that normal, and leaves parallel to the incoming ray but traveling in the opposite direction.</desc>
