<title id="title">Hockey player shoots backward relative to north to hit an eastward goal</title>
<desc id="desc">Player velocity is 8.00 m/s north. The puck velocity relative to the player is 29.0 m/s, with components about 27.9 m/s east and 8.00 m/s south. Head-to-tail addition gives a purely eastward velocity toward the center of the goal. θ is measured from north, about 106°.</desc>
