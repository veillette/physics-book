<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1250" viewBox="0 0 620 1250" role="img" aria-labelledby="title desc">
<title id="title">Work along different paths and around cycles</title>
<desc id="desc">(a) Two paths from A to C: ABC (isobaric then isochoric) and ADC (isochoric then isobaric). The work is the area under each path, so W_ABC &gt; W_ADC. (b) A cycle ABCDA with P_AB = 1.5 × 10⁶ N/m², P_CD = 2 × 10⁵ N/m², and ΔV = 500 cm³: the net work W_tot = W_out + W_in is the area enclosed. (c) For any cycle, the net work W is the area inside the loop.</desc>
