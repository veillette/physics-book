<title id="title">A flashlight with two cells in series</title>
<desc id="desc">Left: two dry cells stacked in series light a bulb connected across them. Right: the schematic, with emf1 and internal resistance r1 in series with emf2 and internal resistance r2, driving current I through the load resistance R_load. I = (emf1 + emf2)/(r1 + r2 + R_load).</desc>
