<svg xmlns="http://www.w3.org/2000/svg" width="375" height="585" viewBox="0 0 375 585" role="img" aria-labelledby="title desc">
<title id="title">A dropped ball and a ball thrown horizontally</title>
<desc id="desc">Two identical balls fall side by side, shown at five equal time intervals. The red ball on the left falls from rest; the blue ball on the right has a constant horizontal velocity. At each instant both balls are at the same height with the same, steadily growing, downward velocity, so the vertical motion does not depend on the horizontal motion.</desc>
<style>
.motion{opacity:0}
@media (prefers-reduced-motion:no-preference){.motion{opacity:1}.still{opacity:0}}
@media (prefers-reduced-motion:reduce), print{.motion{display:none !important}.still{opacity:1 !important}}
</style>
