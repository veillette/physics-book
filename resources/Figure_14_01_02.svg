<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760" role="img" aria-labelledby="title desc">
<title id="title">Joule’s experiment</title>
<desc id="desc">Two masses m, each of weight w, hang from cords that pass over pulleys and wind around a roller. A crank on top winds them up; as they fall a measured height h, the roller turns paddles in an insulated container holding a known volume of water. A thermometer in the water measures the rise in temperature that the work produces.</desc>
