<svg xmlns="http://www.w3.org/2000/svg" width="400" height="290" viewBox="0 0 400 290" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the child in the wagon</title>
<desc id="desc">Free-body diagram with +x to the right and +y up: F2 to the right, a slightly shorter F1 to the left, a short friction force f to the left, normal force N up, weight w down; the acceleration points to the right.</desc>
<rect width="400" height="290" fill="#ffffff"/>
<line x1="35" y1="150" x2="361" y2="150" stroke="#555555" stroke-width="1.5"/><polygon points="370,150 360,154.2 360,145.8" fill="#555555"/>
<line x1="200" y1="260" x2="200" y2="49" stroke="#555555" stroke-width="1.5"/><polygon points="200,40 204.2,50 195.8,50" fill="#555555"/>
<line x1="200" y1="150" x2="200" y2="91" stroke="#b03a2e" stroke-width="3.5"/><polygon points="200,80 205.04,92 194.96,92" fill="#b03a2e"/>
<line x1="200" y1="150" x2="200" y2="209" stroke="#b03a2e" stroke-width="3.5"/><polygon points="200,220 194.96,208 205.04,208" fill="#b03a2e"/>
<line x1="200" y1="150" x2="319" y2="150" stroke="#b03a2e" stroke-width="3.5"/><polygon points="330,150 318,155.04 318,144.96" fill="#b03a2e"/>
<line x1="200" y1="143" x2="103" y2="143" stroke="#b03a2e" stroke-width="3.5"/><polygon points="92,143 104,137.96 104,148.04" fill="#b03a2e"/>
<line x1="200" y1="157" x2="171" y2="157" stroke="#b03a2e" stroke-width="3.5"/><polygon points="160,157 172,151.96 172,162.04" fill="#b03a2e"/>
<line x1="240" y1="65" x2="269" y2="65" stroke="#1e8449" stroke-width="3"/><polygon points="280,65 268,70.04 268,59.96" fill="#1e8449"/>
<circle cx="200" cy="150" r="6" fill="#1f3a5f"/>
<text x="210" y="192" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="start">child + wagon</text>
<text x="386" y="156" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="200" y="30" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="212" y="99" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">N</tspan></text>
<text x="212" y="215" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan></text>
<text x="316" y="138" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">2</tspan><tspan dy="-6"></tspan></text>
<text x="106" y="131" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">1</tspan><tspan dy="-6"></tspan></text>
<text x="174" y="179" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">f</tspan></text>
<text x="266" y="53" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
</svg>
