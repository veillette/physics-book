<svg xmlns="http://www.w3.org/2000/svg" width="460" height="420" viewBox="0 0 460 420" role="img" aria-labelledby="title desc">
<title id="title">San Francisco to Sacramento displacement</title>
<desc id="desc">A circle of radius 123 km centered on San Francisco. Sacramento lies on the circumference at 45° north of east. A compass rose shows cardinal directions.</desc>
<rect width="460" height="420" fill="#ffffff"/>
<circle cx="200" cy="220" r="159.9" fill="none" stroke="#222222" stroke-width="2"/>
<circle cx="200" cy="220" r="5" fill="#c62828" stroke="none" stroke-width="1.5"/>
<text x="200" y="245.25" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">San</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">Francisco</tspan></text>
<circle cx="313.07" cy="106.93" r="5" fill="#c62828" stroke="none" stroke-width="1.5"/>
<text x="313.07" y="100.18" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Sacramento</tspan></text>
<line x1="200" y1="220" x2="303.87" y2="116.13" stroke="#1f77c8" stroke-width="3"/>
<polygon points="313.07,106.93 307.13,120.79 299.21,112.87" fill="#1f77c8"/>
<text x="226.53" y="141.77" font-family="'Times New Roman', Times, serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">S</tspan></text>
<text x="226.53" y="158.37" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">S</tspan><tspan font-style="normal"> = 123 </tspan><tspan font-style="normal">km</tspan></text>
<path d="M 250 220 A 50 50 0 0 0 235.36 184.64" fill="none" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<text x="272" y="215.25" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">45°</tspan></text>
<text x="320" y="240.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">East</tspan></text>
<line x1="200" y1="220" x2="320" y2="220" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="363" y1="65" x2="427" y2="65" stroke="#333333" stroke-width="1.3"/>
<line x1="395" y1="97" x2="395" y2="41" stroke="#333333" stroke-width="1.3"/>
<polygon points="395,33 398.6,42 391.4,42" fill="#333333"/>
<text x="395" y="27.6" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">N</tspan></text>
<text x="395" y="113.6" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">S</tspan></text>
