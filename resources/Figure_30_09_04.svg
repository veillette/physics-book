<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
<title id="title">Quantum numbers of the n = 2 shell</title>
<desc id="desc">A table of every allowed set of quantum numbers for n = 2. The 2s subshell (ℓ = 0, mℓ = 0, ms = ±1/2) holds 2 electrons; the 2p subshell (ℓ = 1, mℓ = 1, 0, −1, each with ms = ±1/2) holds 6; the shell holds 8 in all.</desc>
