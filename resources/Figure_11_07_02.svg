<svg xmlns="http://www.w3.org/2000/svg" width="700" height="560" viewBox="0 0 700 560" role="img" aria-labelledby="title desc">
<title id="title">Origin of the buoyant force</title>
<desc id="desc">A cylinder of cross-sectional area A is submerged in a fluid of density ρ, with its top at depth h1 and its bottom at depth h2. The fluid pushes down on the top with force F1 = P1A = h1ρgA and up on the bottom with the larger force F2 = P2A = h2ρgA, because pressure increases with depth. Their difference is the buoyant force, F_B = F2 − F1. The horizontal forces cancel.</desc>
