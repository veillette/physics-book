<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the right half of the sandwich board</title>
<desc id="desc">Right half of the sign, with torques taken about the hinge (the origin) at the top. +x points to the right (outward) and +y up, and counterclockwise torques are positive. The foot is 0.550 m right of and 1.30 m below the hinge; the ground pushes up there with N = 39.2 N (counterclockwise torque). The half’s weight w/2 = 39.2 N acts down 0.275 m right of the hinge, and the chain pulls along −x with T, 0.500 m below the hinge (both clockwise torques). The other half pushes on the hinge along +x.</desc>
