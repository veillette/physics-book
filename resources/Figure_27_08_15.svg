<title id="title">Birefringence</title>
<desc id="desc">An unpolarized beam enters a birefringent crystal such as calcite and splits in two. The ordinary ray o goes straight through, polarized perpendicular to the page; the extraordinary ray e is bent, polarized in the plane of the page, and leaves parallel to the o ray but displaced.</desc>
