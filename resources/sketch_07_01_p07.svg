<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the grocery cart pushed downward at an angle</title>
<desc id="desc">Axes with +x horizontal in the direction of motion and +y up. The shopper’s push F points 25.0° below +x. Friction f = 35.0 N points along −x, the weight w along −y, and the normal force N along +y. The displacement d = 20.0 m lies along +x; the speed is constant.</desc>
