<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" role="img" aria-labelledby="title desc">
<title id="title">The Stanford Linear Collider</title>
<desc id="desc">A schematic of SLAC. Electrons from an electron booster and positrons made at a positron source travel down a 3.2-kilometer linear accelerator, after the positrons are cooled in damping rings. At the end, magnets bend the electrons one way and the positrons the other around two arcs, so the beams meet head on inside the Mark II particle detector. Solid lines are electrons and dashed lines positrons.</desc>
