<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" role="img" aria-labelledby="title desc">
<title id="title">Conversational speech and the 0, 40 and 60 phon curves</title>
<desc id="desc">Intensity level in decibels versus frequency, with the 0-phon curve (the normal threshold of hearing) and the 40- and 60-phon curves from the equal-loudness graph. A shaded band shows where conversational speech lies: from about 200 Hz at 50 to 60 dB down to about 4000 Hz at 35 to 45 dB. All of it is above the 0-phon threshold. Much of it is below the 40-phon curve at the higher frequencies, and nearly all of it is below the 60-phon curve, so a person with a 40-phon loss misses the higher speech frequencies and a person with a 60-phon loss hears almost none of normal speech.</desc>
