<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">A paddle ball driven at three frequencies</title>
<desc id="desc">A finger moves up and down, holding a rubber band from which a ball hangs. Driven at a low frequency or at a high frequency, the ball oscillates with a small amplitude, swinging through 2X. Driven at the natural frequency f0 of the ball on the rubber band, the ball oscillates with a much larger amplitude: resonance.</desc>
