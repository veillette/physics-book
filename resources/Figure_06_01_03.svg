<circle cx="210" cy="340" r="205" fill="none" stroke="#7d3c98" stroke-width="3"/>
<line x1="210" y1="340" x2="415" y2="340" stroke="#b03a2e" stroke-width="3"/>
<line x1="210" y1="340" x2="367.04" y2="208.23" stroke="#b03a2e" stroke-width="3"/>
<path d="M 310 340 A 100 100 0 0 0 286.6 275.72" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<path d="M 415 340 A 205 205 0 0 0 367.04 208.23" fill="none" stroke="#222222" stroke-width="3.5" stroke-linejoin="round"/>
