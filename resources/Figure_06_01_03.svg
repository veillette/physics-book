<text x="332" y="301" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Δ</tspan><tspan font-style="italic">s</tspan><tspan font-size="14" dy="5.6"><tspan font-style="normal">1</tspan></tspan><tspan dy="-5.6">​</tspan></text>
