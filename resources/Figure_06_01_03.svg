<svg xmlns="http://www.w3.org/2000/svg" width="560" height="821.333" viewBox="0 0 560 821.333" role="img" aria-labelledby="title desc">
<title id="title">The same rotation angle at two radii</title>
<desc id="desc">Points 1 and 2 lie at radii r1 and r2 on the same radius line. Turning through Δθ, point 1 moves along the arc Δs1 and point 2 along the longer arc Δs2, but Δθ = Δs1/r1 = Δs2/r2. An animated companion below illustrates the process; its complete static alternative is shown for reduced motion and print.</desc>
