<svg xmlns="http://www.w3.org/2000/svg" width="400" height="780" viewBox="0 0 400 780" role="img" aria-labelledby="title desc">
<title id="title">Huygens’s principle applied to a straight wavefront</title>
<desc id="desc">Each point on an old straight wavefront is a source of a semicircular wavelet of radius s = vt. The new wavefront, a time t later, is the line tangent to all the wavelets, a distance s = vt ahead, and the wave moves in the direction of the arrow.</desc>
