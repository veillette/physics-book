<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">Precision with a systematic offset</title><desc id="desc">Repeated measurements cluster away from the target center. Their mean is offset even though their spread is small. Animated motion has a static alternative for reduced motion and print.</desc><style>.anim-movie{display:none}@media (prefers-reduced-motion:no-preference){.anim-movie{display:inline}.anim-still{display:none}}#animation-paused:target~.anim-movie{display:none!important}#animation-paused:target~.anim-still{display:inline!important}@media (prefers-reduced-motion:reduce),print{.anim-movie{display:none!important}.anim-still{display:inline!important}}</style><rect width="900" height="380" fill="white"/><defs><clipPath id="animation-diagram-clip"><rect x="20" y="42" width="860" height="282"/></clipPath></defs><g id="animation-paused"/><g class="anim-still"><text x="450" y="27" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222" text-anchor="middle">High precision, low accuracy</text><g clip-path="url(#animation-diagram-clip)"><circle cx="250" cy="170" r="120" fill="#c0392b"/><circle cx="250" cy="170" r="96" fill="white"/><circle cx="250" cy="170" r="72" fill="#c0392b"/><circle cx="250" cy="170" r="48" fill="white"/><circle cx="250" cy="170" r="24" fill="#c0392b"/><g opacity="1"><circle cx="168" cy="218" r="7" fill="#222222" opacity="1"/></g><g opacity="1"><circle cx="172" cy="232" r="7" fill="#222222" opacity="1"/></g><g opacity="1"><circle cx="156" cy="235" r="7" fill="#222222" opacity="1"/></g><g opacity="1"><circle cx="162" cy="248" r="7" fill="#222222" opacity="1"/></g><g opacity="1"><line x1="152.5" y1="233.25" x2="176.5" y2="233.25" stroke="#1f77c8" stroke-width="3"/><line x1="164.5" y1="221.25" x2="164.5" y2="245.25" stroke="#1f77c8" stroke-width="3"/></g><text x="520" y="120" font-family="Arial, Helvetica, sans-serif" font-size="19" 