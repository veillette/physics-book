<title id="title">Coin dropped in an airplane, viewed in two frames</title>
<desc id="desc">A magnified cabin shows a vertical 1.50 m drop in the plane frame. In the ground frame the plane advances about 144 m while the coin falls 1.50 m along a nearly horizontal parabola, ending at the floor of the advanced cabin. Ground-frame horizontal and vertical distances use the same scale.</desc>
