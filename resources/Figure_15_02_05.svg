<polyline points="470,205 468.51,206.53 467.04,208.06 465.61,209.61 464.25,211.18 462.97,212.77 461.79,214.4 460.72,216.07 459.78,217.77 458.97,219.52 458.3,221.32 457.77,223.16 457.38,225.05 457.12,226.99 456.99,228.96 456.97,230.97 457.05,233.02 457.21,235.09 457.44,237.18 457.71,239.29 458,241.4 458.29,243.51 458.56,245.62 458.79,247.71 458.95,249.78 459.03,251.83 459.01,253.84 458.88,255.81 458.62,257.75 458.23,259.64 457.7,261.48 457.03,263.28 456.22,265.03 455.28,266.73 454.21,268.4 453.03,270.03 451.75,271.62 450.39,273.19 448.96,274.74 447.49,276.27 446,277.8" fill="none" stroke="#222222" stroke-width="1.4" stroke-linejoin="round"/>
