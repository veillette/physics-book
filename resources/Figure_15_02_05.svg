<text x="840" y="571.2" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">V</tspan></text>
