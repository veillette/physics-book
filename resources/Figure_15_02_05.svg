<line x1="330" y1="300" x2="760" y2="300" stroke="#6a3d9a" stroke-width="3"/>
<polygon points="598.8,300 580.8,307.2 580.8,292.8" fill="#6a3d9a"/>
<circle cx="330" cy="300" r="6" fill="#222222"/>
<circle cx="760" cy="300" r="6" fill="#222222"/>
