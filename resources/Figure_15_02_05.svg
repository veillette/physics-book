<svg xmlns="http://www.w3.org/2000/svg" width="880" height="680" viewBox="0 0 880 680" role="img" aria-labelledby="title desc">
<title id="title">Isobaric process on a PV diagram</title>
<desc id="desc">A PV diagram of an isobaric (constant-pressure) process from A to B at pressure P. The work done, the area of the rectangle under the line AB, is Area = PΔV = Work, where ΔV is the change in volume.</desc>
