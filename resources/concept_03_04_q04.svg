<svg xmlns="http://www.w3.org/2000/svg" width="520" height="430" viewBox="0 0 520 430" role="img" aria-labelledby="title desc">
<title id="title">Two coins leaving a table at the same time</title>
<desc id="desc">Snapshots every 0.10 s of two coins leaving a 1.0 m high table edge at the same instant. The nudged coin falls straight down; the flicked coin, launched horizontally at 1.5 m/s, follows a parabola. At every instant both coins are at the same height (dashed lines), and both land after 0.45 s, the flicked one 0.68 m farther out.</desc>
