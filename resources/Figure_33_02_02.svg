<title id="title">Feynman diagram of virtual photon exchange</title>
<desc id="desc">A Feynman diagram with time t up and position x to the right. Two positive charges approach each other, exchange a virtual photon (drawn as a wave packet) between two vertices, and then move apart: the electromagnetic force is repulsive.</desc>
