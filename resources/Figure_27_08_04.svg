<title id="title">Unpolarized light</title>
<desc id="desc">A thin arrow shows the direction of a ray of unpolarized light. Bold arrows from a point on the ray show the directions of the electric fields E of the individual waves in the ray: since the light is unpolarized, they point in all directions perpendicular to the ray.</desc>
