<svg xmlns="http://www.w3.org/2000/svg" width="560" height="470" viewBox="0 0 560 470" role="img" aria-labelledby="title desc">
<title id="title">Charging a capacitor by switching an inductor</title>
<desc id="desc">An inductor L joins two switch points. From each, a switch blade connects either to a capacitor C (solid arrows) or to a battery of voltage V (dashed arrows). Rapidly switching the inductor from the battery to the capacitor induces an emf of several thousand volts, which charges the capacitor.</desc>
