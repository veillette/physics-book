<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
<title id="title">Follow the index change at each reflecting surface</title>
<desc id="desc">Side-by-side cover-glass, fluid, and slide stacks compare water and carbon disulfide. For water the top and bottom reflections reverse phase. For carbon disulfide the top and middle reflections reverse phase. Separate small ray pairs indicate downward incidence at each interface.</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172b45"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1763a6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad4d12"/></marker></defs>
<rect width="960" height="550" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<text x="480" y="36" font-size="25" fill="#172b45" text-anchor="middle" font-weight="bold">Follow the index change at each reflecting surface</text>
<text x="480" y="75" font-size="18" fill="#526176" text-anchor="middle" font-weight="normal">Each small ray pair shows a separate local reflection of downward light.</text><text x="240" y="116" font-size="22" fill="#172b45" text-anchor="middle" font-weight="bold">Water between glass</text><rect x="25" y="134" width="435" height="58" rx="4" fill="#ffffff" stroke="#c4ced8"/><rect x="25" y="192" width="435" height="92" rx="4" fill="#edf4fa" stroke="none"/><rect x="25" y="284" width="435" height="92" rx="4" fill="#faf0e7" stroke="none"/><rect x="25" y="376" width="435" height="64" rx="4" fill="#edf4fa" stroke="none"/><text x="39" y="166" font-size="18" fill="#172b45" text-anchor="start" font-weight="normal">Air: n ≈ 1.00</text><text x="39" y="242" font-size="18" fill="#172b45" text-anchor="start" font-weight="normal">Glass: n ≈ 1.52</text><text x="39" y="334" font-size="18" fill="#172b45" text-anchor="start" font-weight="normal">Fluid: n ≈ 1.33</text><text x="39" y="415" font-size="18" fill="#172b45" text-anchor="start" font-weight="normal">Glass: n ≈ 1.52</text><path d="M235 154L245 192" fill="none" stroke="#172b45" stroke-width="2" marker-end="url(#ink)"/><path d="M245 192L255 154" fill="none" stroke="#1763a6" stroke-width="2" marker-end="url(#blue)"/><path d="M25 192L460 192" fill="none" stroke="#526176" stroke-width="1"/><text x="283" y="183" font-size="18" fill="#1763a6" text-anchor="start" font-weight="normal">π reversal</text><path d="M235 246L245 284" fill="none" stroke="#172b45" stroke-width="2" marker-end="url(#ink)"/><path d="M245 284L255 246" fill="none" stroke="#1763a6" stroke-width="2" marker-end="url(#blue)"/><path d="M25 284L460 284" fill="none" stroke="#526176" stroke-width="1"/><text x="283" y="275" font-size="18" fill="#1763a6" text-anchor="start" font-weight="normal">No reversal</text><path d="M235 338L245 376" fill="none" stroke="#172b45" stroke-width="2" marker-end="url(#ink)"/><path d="M245 376L255 338" fill="none" stroke="#1763a6" stroke-width="2" marker-end="url(#blue)"/><path d="M25 376L460 376" fill="none" stroke="#526176" stroke-width="1"/><text x="283" y="367" font-size="18" fill="#1763a6" text-anchor="start" font-weight="normal">π reversal</text><text x="715" y="116" font-size="22" fill="#172b45" text-anchor="middle" font-weight="bold">Carbon disulfide between glass</text><rect x="500" y="134" width="435" height="58" rx="4" fill="#ffffff" stroke="#c4ced8"/><rect x="500" y="192" width="435" height="92" rx="4" fill="#edf4fa" stroke="none"/><rect x="500" y="284" width="435" height="92" rx="4" fill="#faf0e7" stroke="none"/><rect x="500" y="376" width="435" height="64" rx="4" fill="#edf4fa" stroke="none"/><text x="514" y="166" font-size="18" fill="#172b45" text-anchor="start" font-weight="normal">Air: n ≈ 1.00</text><text x="514" y="242" font-size="18" fill="#172b45" text-anchor="start" font-weight="normal">Glass: n ≈ 1.52</text><text x="514" y="334" font-size="18" fill="#172b45" text-anchor="start" font-weight="normal">Fluid: n ≈ 1.63</text><text x="514" y="415" font-size="18" fill="#172b45" text-anchor="start" font-weight="normal">Glass: n ≈ 1.52</text><path d="M710 154L720 192" fill="none" stroke="#172b45" stroke-width="2" marker-end="url(#ink)"/><path d="M720 192L730 154" fill="none" stroke="#1763a6" stroke-width="2" marker-end="url(#blue)"/><path d="M500 192L935 192" fill="none" stroke="#526176" stroke-width="1"/><text x="758" y="183" font-size="18" fill="#1763a6" text-anchor="start" font-weight="normal">π reversal</text><path d="M710 246L720 284" fill="none" stroke="#172b45" stroke-width="2" marker-end="url(#ink)"/><path d="M720 284L730 246" fill="none" stroke="#1763a6" stroke-width="2" marker-end="url(#blue)"/><path d="M500 284L935 284" fill="none" stroke="#526176" stroke-width="1"/><text x="758" y="275" font-size="18" fill="#1763a6" text-anchor="start" font-weight="normal">π reversal</text><path d="M710 338L720 376" fill="none" stroke="#172b45" stroke-width="2" marker-end="url(#ink)"/><path d="M720 376L730 338" fill="none" stroke="#1763a6" stroke-width="2" marker-end="url(#blue)"/><path d="M500 376L935 376" fill="none" stroke="#526176" stroke-width="1"/><text x="758" y="367" font-size="18" fill="#1763a6" text-anchor="start" font-weight="normal">No reversal</text><text x="480" y="485" font-size="21" fill="#172b45" text-anchor="middle" font-weight="normal">Reflection toward higher n: π phase reversal. Toward lower n: no reversal.</text><text x="480" y="520" font-size="18" fill="#526176" text-anchor="middle" font-weight="normal">Near-normal incidence; propagation adds its own phase. Layer thicknesses are schematic.</text>
</g>
</svg>
