<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
<title id="title">Forces on the top and bottom segments of a motor loop</title>
<desc id="desc">Front view of the motor loop, tilted at an angle phi to the magnetic field, which points to the right. On the top segment the current points into the page and to the right, and the force on it is straight down; on the bottom segment the current is reversed and the force is straight up. Both forces are parallel to the vertical axis of rotation, so they produce no torque about it.</desc>
