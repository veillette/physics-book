<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-labelledby="title desc">
<title id="title">Temperature versus heat added to water</title>
<desc id="desc">Temperature versus energy added per gram, ΔQ/m, starting with ice at −20 °C. The ice warms to 0 °C after 10 cal/g. The temperature stays at 0 °C while the ice melts, absorbing 79.8 cal/g, to about 90 cal/g. The liquid water then warms to 100 °C, reached at about 190 cal/g. The temperature stays at 100 °C while the water boils, absorbing 539 cal/g, to about 729 cal/g. The steam then warms to 120 °C at about 738 cal/g.</desc>
