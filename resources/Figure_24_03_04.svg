<title id="title">Extremely low frequency radio reaching a submarine</title>
<desc id="desc">A submarine deep under the sea surface receives a radio wave of very long wavelength (extremely low frequency, ELF) coming down from the air above. Shorter wavelengths do not penetrate to any significant depth.</desc>
