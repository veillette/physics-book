<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-labelledby="title desc">
<title id="title">Cavendish torsion balance</title>
<desc id="desc">A top view shows two small masses on a suspended rod. The large attracting masses lie on opposite sides of the rod, so their attractions produce torques in the same counterclockwise direction. A mirror on the suspension reflects a light beam onto a scale. A side inset shows the fiber and suspended rod.</desc>
