<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-labelledby="title desc">
<title id="title">A soft drink and ice reaching thermal equilibrium</title>
<desc id="desc">(a) A soft-drink can at temperature T₁ and an ice cube at T₂ sit apart; T₁ ≠ T₂, so they are not in thermal equilibrium. (b) Placed in contact, they exchange energy until both are at the same temperature T′.</desc>
