<title id="title">Resistor voltage and current while a capacitor charges</title>
<desc id="desc">Two graphs for the charging circuit, both decaying exponentials. Left: the potential difference across the resistor falls from the emf at time zero to 0.368 times the emf at one time constant and 0.135 times the emf at two. Right: the current falls from emf over R at time zero to 0.368 and 0.135 of that value at one and two time constants.</desc>
