<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" role="img" aria-labelledby="title desc">
<title id="title">Realms of physics by size and speed</title>
<desc id="desc">Object size (from 10^-15 m to 10^6 m, logarithmic) plotted against speed as a fraction of the speed of light (10^-8 to 1, logarithmic). Large, slow objects are in the realm of classical physics; objects near the speed of light need relativity; objects smaller than about 10^-8 m need quantum mechanics; small and fast objects need relativistic quantum mechanics. A car (30 m/s) and an orbiting satellite (7500 m/s, v/c = 2.5 × 10^-5) fall well inside the classical region; an electron in an atom falls in the quantum region, and a proton in an accelerator in the relativistic quantum region.</desc>
