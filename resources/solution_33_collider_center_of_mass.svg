<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
<title id="title">Opposing beams cancel the total momentum</title>
<desc id="desc">Two equal-energy, same-mass particles collide with equal opposite momenta, giving center-of-mass energy 2E. An identical beam particle striking a stationary target has total lab energy E plus mc squared and nonzero momentum; the invariant collision energy is square root of 2mc squared E plus 2m squared c to the fourth.</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172b45"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1763a6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad4d12"/></marker></defs>
<rect width="960" height="550" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<text x="480" y="36" font-size="25" fill="#172b45" text-anchor="middle" font-weight="bold">Opposing beams cancel the total momentum</text>
<text x="480" y="78" font-size="20" fill="#526176" text-anchor="middle" font-weight="normal">Same particle species, mass m; E is each moving particle’s TOTAL energy.</text><text x="240" y="132" font-size="22" fill="#172b45" text-anchor="middle" font-weight="bold">Equal counter-propagating beams</text><circle cx="90" cy="211" r="21" fill="#1763a6" stroke="#1763a6" stroke-width="2"/><path d="M123 211L213 211" fill="none" stroke="#1763a6" stroke-width="3" marker-end="url(#blue)"/><circle cx="390" cy="211" r="21" fill="#f4ddcc" stroke="#ad4d12" stroke-width="2"/><path d="M357 211L267 211" fill="none" stroke="#ad4d12" stroke-width="3" marker-end="url(#orange)"/><text x="90" y="174" font-size="20" fill="#1763a6" text-anchor="middle" font-weight="normal">E, +p</text><text x="390" y="174" font-size="20" fill="#ad4d12" text-anchor="middle" font-weight="normal">E, −p</text><text x="240" y="323" font-size="23" fill="#172b45" text-anchor="middle" font-weight="normal">Net momentum = 0</text><text x="240" y="374" font-size="24" fill="#172b45" text-anchor="middle" font-weight="normal">Ecm = 2E</text><text x="240" y="420" font-size="19" fill="#172b45" text-anchor="middle" font-weight="normal">Lab frame is the center-of-mass frame.</text><text x="715" y="132" font-size="22" fill="#172b45" text-anchor="middle" font-weight="bold">Beam on a stationary target</text><circle cx="565" cy="211" r="21" fill="#1763a6" stroke="#1763a6" stroke-width="2"/><path d="M598 211L688 211" fill="none" stroke="#1763a6" stroke-width="3" marker-end="url(#blue)"/><circle cx="865" cy="211" r="21" fill="#f4ddcc" stroke="#ad4d12" stroke-width="2"/><text x="865" y="261" font-size="19" fill="#172b45" text-anchor="middle" font-weight="normal">at rest</text><text x="565" y="174" font-size="20" fill="#1763a6" text-anchor="middle" font-weight="normal">E, +p</text><text x="865" y="174" font-size="20" fill="#ad4d12" text-anchor="middle" font-weight="normal">mc², 0</text><text x="715" y="323" font-size="23" fill="#172b45" text-anchor="middle" font-weight="normal">Net momentum = +p</text><text x="715" y="374" font-size="24" fill="#172b45" text-anchor="middle" font-weight="normal">Ecm = √(2mc²E + 2m²c⁴)</text><text x="715" y="420" font-size="19" fill="#172b45" text-anchor="middle" font-weight="normal">Some lab energy is bulk motion.</text><text x="480" y="478" font-size="24" fill="#172b45" text-anchor="middle" font-weight="normal">Invariant collision energy: Ecm² = Etot² − c² |ptot|²</text><text x="480" y="517" font-size="18" fill="#526176" text-anchor="middle" font-weight="normal">This comparison fixes projectile energy, not total energy invested in the two setups.</text>
</g>
</svg>
