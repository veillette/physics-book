<title id="title">Discharging a capacitor through a resistor</title>
<desc id="desc">(a) A charged capacitor C, a resistor R and a switch in series; when the switch closes, current I flows counterclockwise as the capacitor discharges. (b) The capacitor voltage V falls from V0, reaching 0.368 V0 at one time constant τ = RC and approaching zero at 2τ, 3τ and 4τ.</desc>
