<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" role="img" aria-labelledby="title desc">
<title id="title">Immersion objectives</title>
<desc id="desc">Rays leave a specimen on a cover glass at the same angle and refract into the medium between the cover glass and the objective. In air (a) the ray bends far from the axis and misses the objective; in water (b), n = 1.33, it bends less; in oil (c), n = 1.51, almost not at all, so more rays enter the objective.</desc>
<rect width="560" height="440" fill="#ffffff"/>
<defs><linearGradient id="cover26" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b9fd8"/><stop offset="0.5" stop-color="#e8f4fc"/><stop offset="1" stop-color="#5b9fd8"/></linearGradient><linearGradient id="drop26" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9d4f2"/><stop offset="1" stop-color="#3f86c6"/></linearGradient></defs>
<path d="M 220 270 Q 300 170 380 270 Z" fill="url(#drop26)" stroke="#3f86c6" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="160" y1="270" x2="500" y2="270" stroke="#9fd4e0" stroke-width="3"/>
<rect x="160" y="330" width="340" height="40" fill="url(#cover26)" stroke="#2f6aa0" stroke-width="1.5"/>
<line x1="330" y1="20" x2="330" y2="364" stroke="#222222" stroke-width="2"/>
