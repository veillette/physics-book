<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">A Venturi tube</title>
<desc id="desc">Fluid flows to the right through a tube with a narrow middle section, the Venturi constriction. The streamlines crowd together in the constriction, where the speed is higher and the pressure lower. That low pressure draws a second fluid, the entrained fluid, in through a narrow side tube on top of the constriction.</desc>
