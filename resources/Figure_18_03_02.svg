<svg xmlns="http://www.w3.org/2000/svg" width="800" height="170" viewBox="0 0 800 170" role="img" aria-labelledby="title desc">
<title id="title">Coulomb forces between two point charges</title>
<desc id="desc">The force between point charges q1 and q2 a distance r apart. (a) Two negative charges repel: F21 on q1 points away from q2, and F12 on q2 points away from q1. (b) A negative q1 and a positive q2 attract: the forces point toward each other. In each case the two forces are equal in magnitude and opposite in direction, as Newton’s third law requires.</desc>
