<polygon points="320,250 309,254.4 309,245.6" fill="#555555"/>
<line x1="70" y1="280" x2="70" y2="250" stroke="#555555" stroke-width="1.6"/>
<line x1="70" y1="250" x2="70" y2="50" stroke="#555555" stroke-width="1.6"/>
<polygon points="70,40 74.4,51 65.6,51" fill="#555555"/>
