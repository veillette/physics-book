<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the hikers’ displacement and its components</title>
<desc id="desc">Axes with +x east and +y north, origin at the cabin. The displacement S is 5.00 km at 40.0° north of east, that is, 40.0° counterclockwise from +x. Its east component S_x lies along +x and its north component S_y is parallel to +y.</desc>
