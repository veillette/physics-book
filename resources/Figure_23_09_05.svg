<line x1="340" y1="70" x2="490" y2="70" stroke="#222222" stroke-width="2"/>
<path d="M 160 70 A 30 30 0 0 1 220 70 A 30 30 0 0 1 280 70 A 30 30 0 0 1 340 70" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round"/>
<line x1="10" y1="70" x2="160" y2="70" stroke="#222222" stroke-width="4"/>
<line x1="340" y1="70" x2="490" y2="70" stroke="#222222" stroke-width="4"/>
