<title id="title">Parallax of a nearby star</title>
<desc id="desc">A star 4 light years from the Sun, far above the plane of the Earth’s orbit (not to scale). From the Earth at opposite sides of its orbit, six months apart, the lines of sight to the star make angles θ1 and θ2 with the line through the Sun. The known diameter of the orbit and these angles fix the distance to the star.</desc>
