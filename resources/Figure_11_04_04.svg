<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Sandbags stop a leak under a levee</title>
<desc id="desc">A flooding river on the right presses against a levee. Water leaks under the levee and comes up on its far side, where a ring of sandbags has been stacked around the leak. Water inside the sandbags rises at most to the level of the river, shown by a dashed line, and then stops rising.</desc>
