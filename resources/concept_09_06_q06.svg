<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" role="img" aria-labelledby="title desc">
<title id="title">Both attachment points determine the muscle moment arm</title>
<desc id="desc">Geometry sketch, not a complete free-body diagram. The elbow is the x-y origin, x points along the horizontal forearm toward the wrist, and y upward along the upper arm. The upper attachment is (0,a), and the distal attachment is (b,0). The tendon pulls obliquely from the distal point toward the upper attachment. The perpendicular distance from the elbow to its line is r perpendicular = ab/sqrt(a squared + b squared), not b. Example a=0.0400 m, b=0.350 m, hand at 0.380 m.</desc>
