<text x="360" y="455.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">r</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">⊥</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = </tspan><tspan font-style="italic">ab</tspan><tspan font-style="normal"> / √(</tspan><tspan font-style="italic">a</tspan><tspan font-size="11.2" dy="-6.4"><tspan font-style="normal">2</tspan></tspan><tspan dy="6.4">​</tspan><tspan font-style="normal"> + </tspan><tspan font-style="italic">b</tspan><tspan font-size="11.2" dy="-6.4"><tspan font-style="normal">2</tspan></tspan><tspan dy="6.4">​</tspan><tspan font-style="normal">) = 0.03974 </tspan><tspan font-style="italic">m</tspan><tspan font-style="normal">; </tspan><tspan font-style="normal">the</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">tendon</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">is</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">nearly</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">along</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">the</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">forearm</tspan><tspan font-style="normal">.</tspan></text>
