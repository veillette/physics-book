<svg xmlns="http://www.w3.org/2000/svg" width="560" height="500" viewBox="0 0 560 500" role="img" aria-labelledby="title desc">
<title id="title">Atmospheric pressure from the weight of the air above</title>
<desc id="desc">A column of air 1 m² in cross section rises from the ground to the top of the atmosphere, its top drawn dotted because it continues far above the picture. The air in it weighs w = 1.01 × 10⁵ N, so the average atmospheric pressure at sea level is 1.01 × 10⁵ Pa, or 1 atm.</desc>
<rect width="560" height="500" fill="#ffffff"/>
<rect x="0" y="450" width="560" height="50" fill="#e4eedc"/>
<line x1="0" y1="450" x2="560" y2="450" stroke="#8aa678" stroke-width="2"/>
<polygon points="80,450 116,450 136,430 100,430" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<line x1="80" y1="450" x2="80" y2="60" stroke="#a3122a" stroke-width="2.5"/>
<line x1="80" y1="60" x2="80" y2="20" stroke="#a3122a" stroke-width="2.5" stroke-dasharray="3 4"/>
<line x1="116" y1="450" x2="116" y2="60" stroke="#a3122a" stroke-width="2.5"/>
<line x1="116" y1="60" x2="116" y2="20" stroke="#a3122a" stroke-width="2.5" stroke-dasharray="3 4"/>
<line x1="136" y1="430" x2="136" y2="60" stroke="#a3122a" stroke-width="2.5"/>
<line x1="136" y1="60" x2="136" y2="20" stroke="#a3122a" stroke-width="2.5" stroke-dasharray="3 4"/>
<line x1="100" y1="430" x2="100" y2="60" stroke="#a3122a" stroke-width="2.5"/>
<line x1="100" y1="60" x2="100" y2="20" stroke="#a3122a" stroke-width="2.5" stroke-dasharray="3 4"/>
<path d="M 270 180 Q 202.6 131 145.26 181.38" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round"/>
<line x1="146.76" y1="180.06" x2="143.31" y2="183.1" stroke="#333333" stroke-width="1.6"/>
<polygon points="140,186 142.63,180.81 145.48,184.06" fill="#333333"/>
<text x="280" y="189.1" font-family="'Times New Roman', Times, serif" font-size="26" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">w</tspan><tspan font-style="normal"> = 1.01 × 10</tspan><tspan font-size="18.2" dy="-10.4"><tspan font-style="normal">5</tspan></tspan><tspan dy="10.4">​</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">N</tspan></text>
<text x="130" y="483.1" font-family="'Times New Roman', Times, serif" font-size="26" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">1 </tspan><tspan font-style="normal">m</tspan><tspan font-size="18.2" dy="-10.4"><tspan font-style="normal">2</tspan></tspan><tspan dy="10.4">​</tspan></text>
</svg>
