<title id="title">A switch wired in parallel with a bulb</title>
<desc id="desc">Two circuit diagrams. Left: switch open, all of the current flows through the bulb, which lights. Right: switch closed, nearly all of the current flows through the switch, which shorts out the bulb, and a large current flows through the battery and its internal resistance.</desc>
