<svg xmlns="http://www.w3.org/2000/svg" width="620" height="760" viewBox="0 0 620 760" role="img" aria-labelledby="title desc">
<title id="title">Change in velocity for uniform circular motion</title>
<desc id="desc">A circle centered at A. In a time Δt the object moves from B to C through the angle Δθ; the chord BC is Δr and the arc is Δs. Velocities v1 at B and v2 at C are tangent to the circle and equal in magnitude. In the vector triangle PQR, Δv = v2 − v1, which points toward the center of the circle.</desc>
<style>
.motion{opacity:0}
@media (prefers-reduced-motion:no-preference){.motion{opacity:1}}
@media (prefers-reduced-motion:reduce), print{.motion{display:none !important}}
</style>
