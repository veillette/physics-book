<text x="550" y="650.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Δ</tspan><tspan font-style="normal">S</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">total</tspan></tspan><tspan dy="-7.28">​</tspan><tspan font-style="normal"> = −</tspan><tspan font-style="normal">Q</tspan><tspan font-style="normal">/</tspan><tspan font-style="normal">T</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">h</tspan></tspan><tspan dy="-7.28">​</tspan><tspan font-style="normal"> + </tspan><tspan font-style="normal">Q</tspan><tspan font-style="normal">/</tspan><tspan font-style="normal">T</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">c</tspan></tspan><tspan dy="-7.28">​</tspan><tspan font-style="normal"> = </tspan><tspan font-style="normal">Q</tspan><tspan font-style="normal">(1/</tspan><tspan font-style="normal">T</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">c</tspan></tspan><tspan dy="-7.28">​</tspan><tspan font-style="normal"> − 1/</tspan><tspan font-style="normal">T</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">h</tspan></tspan><tspan dy="-7.28">​</tspan><tspan font-style="normal">) &gt; 0</tspan></text>
