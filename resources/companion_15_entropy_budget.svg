<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc">
<title id="title">Entropy accounting for heat flowing from hot to cold</title>
<desc id="desc">Four thousand joules flow from a reservoir at 600 kelvin to one at 250 kelvin. Reservoir temperatures remain fixed. The hot reservoir loses 6.67 joules per kelvin, the cold gains 16, and total entropy increases by 9.33 joules per kelvin. Signed bars share the same scale.</desc>
<rect width="1100" height="670" fill="#ffffff"/>
<text x="550" y="37.1" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">The</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">cold</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">reservoir</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">gains</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">more</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">entropy</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">than</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">the</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">hot</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">one</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">loses</tspan></text>
<text x="550" y="71.3" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#657382" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">A</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">transfer</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">of</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">Q</tspan><tspan font-style="normal"> = 4000 </tspan><tspan font-style="normal">J</tspan><tspan font-style="normal">; </tspan><tspan font-style="normal">both</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">reservoir</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">temperatures</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">remain</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">fixed</tspan><tspan font-style="normal">.</tspan></text>
<rect x="40" y="142" width="290" height="110" rx="4" fill="#f6e9df" stroke="#222222" stroke-width="2"/>
