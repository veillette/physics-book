<text x="185" y="509.4" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">T</tspan><tspan font-size="16.8" dy="6.72"><tspan font-style="normal">c</tspan></tspan><tspan dy="-6.72">​</tspan><tspan font-style="normal"> = 250 </tspan><tspan font-style="normal">K</tspan></text>
