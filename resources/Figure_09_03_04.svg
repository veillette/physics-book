<svg xmlns="http://www.w3.org/2000/svg" width="700" height="535" viewBox="0 0 700 535" role="img" aria-labelledby="title desc">
<title id="title">A large tilt overturns the pencil</title>
<desc id="desc">A pencil on its flat end tilts beyond the point where its center of gravity lies above the pivot. The weight acts to the left of the pivot and produces counterclockwise torque, increasing the tilt.</desc>
