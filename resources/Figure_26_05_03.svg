<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" aria-labelledby="title desc">
<title id="title">A reflecting telescope</title>
<desc id="desc">Parallel rays from a distant object strike a large concave mirror, the objective, which reflects them toward its focal point. A small flat mirror at 45° intercepts them and sends them down through an eyepiece lens, which makes them parallel again for the eye.</desc>
