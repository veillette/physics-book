<line x1="200" y1="150" x2="200" y2="229" stroke="#b03a2e" stroke-width="3.5"/><polygon points="200,240 194.96,228 205.04,228" fill="#b03a2e"/>
<line x1="200" y1="150" x2="211.64" y2="158.15" stroke="#b03a2e" stroke-width="3.5"/><polygon points="219.68,163.78 208.22,161.3 213.43,153.86" fill="#b03a2e"/>
<line x1="200" y1="150" x2="188.18" y2="150" stroke="#b03a2e" stroke-width="3.5"/><polygon points="180.32,150 189.18,146.28 189.18,153.72" fill="#b03a2e"/>
<circle cx="200" cy="150" r="6" fill="#1f3a5f"/>
<text x="190" y="126" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="end">cart</text>
