<line x1="219.68" y1="150" x2="219.68" y2="158.58" stroke="#c0675e" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="219.68,163.78 217.07,157.58 222.28,157.58" fill="#c0675e"/>
