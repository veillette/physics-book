<svg xmlns="http://www.w3.org/2000/svg" width="440" height="330" viewBox="0 0 440 330" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the cart</title>
<desc id="desc">Free-body diagram with +x forward (to the right) and +y up: applied force F at 35 degrees below +x with dashed components F cos 35 along +x and F sin 35 along -y; friction f along -x; normal force N up; weight w down. a = 0 (constant velocity).</desc>
