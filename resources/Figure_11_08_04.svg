<svg xmlns="http://www.w3.org/2000/svg" width="620" height="600" viewBox="0 0 620 600" role="img" aria-labelledby="title desc">
<title id="title">Sliding-wire device for measuring surface tension</title>
<desc id="desc">A U-shaped wire frame holds a soap film, closed on the right by a sliding wire of length l. The film’s two surfaces pull the wire to the left, so a force F = γ(2l) to the right is needed to hold it in place; the force stays nearly constant as the film is stretched, until it breaks. A side view shows the film’s two surfaces between the frame and the wire.</desc>
