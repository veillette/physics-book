<polygon points="294.25,349.15 290.06,352.06 289.21,348.37" fill="#1f77c8"/>
<text x="165" y="422.35" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Direction</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">of</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">rotation</tspan></text>
<text x="540" y="350.5" font-family="'Times New Roman', Times, serif" font-size="30" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">ω</tspan><tspan font-style="normal"> = </tspan><tspan font-style="italic">v</tspan><tspan font-style="normal">/</tspan><tspan font-style="italic">r</tspan></text>
