<svg xmlns="http://www.w3.org/2000/svg" width="660" height="480" viewBox="0 0 660 480" role="img" aria-labelledby="title desc">
<title id="title">Angular displacement and tangential velocity in uniform circular motion</title>
<desc id="desc">Two radii of a disk enclose angular displacement Δθ. Equal-speed velocity vectors are tangent to the circle at both endpoints and point counterclockwise. Angular speed is ω = v/r.</desc>
