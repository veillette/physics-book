<circle cx="265" cy="240" r="155" fill="#e7edf2" stroke="#7a8995" stroke-width="2"/>
<line x1="265" y1="240" x2="420" y2="240" stroke="#333333" stroke-width="2.5"/>
<line x1="420" y1="240" x2="420" y2="157.7" stroke="#5e9e1e" stroke-width="3.5"/>
<polygon points="420,145 425.48,158.7 414.52,158.7" fill="#5e9e1e"/>
<text x="437" y="144.1" font-family="'Times New Roman', Times, serif" font-size="26" fill="#5e9e1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan></text>
<line x1="265" y1="240" x2="374.6" y2="130.4" stroke="#333333" stroke-width="2.5"/>
<line x1="374.6" y1="130.4" x2="316.41" y2="72.2" stroke="#5e9e1e" stroke-width="3.5"/>
<polygon points="307.43,63.22 320.99,69.04 313.24,76.79" fill="#5e9e1e"/>
<text x="317.36" y="65.25" font-family="'Times New Roman', Times, serif" font-size="26" fill="#5e9e1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan></text>
<circle cx="265" cy="240" r="5" fill="#222222"/>
<text x="345" y="268.75" font-family="'Times New Roman', Times, serif" font-size="25" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">r</tspan></text>
<path d="M 320 240 A 55 55 0 0 0 303.89 201.11" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/>
<text x="350" y="215.75" font-family="'Times New Roman', Times, serif" font-size="25" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Δ</tspan><tspan font-style="italic">θ</tspan></text>
<path d="M 200.19 147.44 A 113 113 0 0 0 288.49 350.53" fill="none" stroke="#1f77c8" stroke-width="2.5" stroke-linejoin="round"/>
