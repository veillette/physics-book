<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="title desc">
<title id="title">Metabolism and the first law</title>
<desc id="desc">(a) A person takes in food energy and gives off heat Q and does work W: ΔU = −Q − W + food energy. (b) A plant takes in energy Q_in from sunlight and gives off heat Q_out; the change in its internal energy is the stored food energy.</desc>
