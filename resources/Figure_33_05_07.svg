<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc">
<title id="title">The Δ⁺⁺ resonance</title>
<desc id="desc">Number of π⁺ + p → π⁺ + p interactions versus the kinetic energy of the π⁺, from 0 to about 850 MeV. The curve rises steeply to a sharp peak at 200 MeV, where the short-lived Δ⁺⁺ is formed, falls to a broad minimum near 500 MeV, and rises gently again. The peak’s full width at half maximum is about 100 MeV.</desc>
