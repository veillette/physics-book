<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-labelledby="title desc">
<title id="title">Force of water on a dam</title>
<desc id="desc">A dam of length L holds back water of depth h. The average pressure on its face is the pressure at the average depth, P̄ = h̄ρg, with h̄ = h/2, and the total force of the water on the dam is F = P̄A, where A = hL is the area of the face in contact with the water. Because the pressure grows with depth, the resultant force F acts at two-thirds of the depth (2h/3 below the surface), below the average depth h̄.</desc>
