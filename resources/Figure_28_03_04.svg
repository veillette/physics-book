<title id="title">Field lines of a fast-moving electron</title>
<desc id="desc">An electron moves at high velocity v to the right through a tube. Its electric field lines, which point radially in toward it, are bunched toward the plane perpendicular to its motion by length contraction, so few lines point forward or backward.</desc>
