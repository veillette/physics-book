<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the chicken leaning into the wind</title>
<desc id="desc">The chicken pivots about its foot (the origin). +x points to the right, the direction the wind blows, and +y up, and counterclockwise torques are positive. The center of gravity is 9.0 cm to the left of the foot and 20 cm above it. The weight W, acting down at the center of gravity, gives a counterclockwise torque; the wind force F_wind, pushing along +x at the height of the center of gravity, gives a clockwise torque.</desc>
