<title id="title">Fahrenheit, Celsius, and Kelvin scales</title>
<desc id="desc">Three horizontal temperature scales, one above the other, aligned. Absolute zero is −459.67 °F, −273.15 °C, and 0 K. 0 °F is −17.8 °C or 255.37 K. Water freezes at 32 °F, 0 °C, 273.15 K; normal body temperature is 98.6 °F, 37 °C, 310.15 K; water boils at 212 °F, 100 °C, 373.15 K. At the right, a span of 9 °F equals 5 °C and 5 K.</desc>
