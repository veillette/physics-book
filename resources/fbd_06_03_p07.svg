<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the centrifuge cage</title>
<desc id="desc">Free-body diagram with +x horizontally toward the center of rotation and +y up: force of the arm F inward and upward at angle theta above +x, with dashed components F cos theta along +x and F sin theta along +y; weight mg down. The acceleration points toward the center.</desc>
<rect width="420" height="300" fill="#ffffff"/>
<line x1="30" y1="150" x2="371" y2="150" stroke="#555555" stroke-width="1.5"/><polygon points="380,150 370,154.2 370,145.8" fill="#555555"/>
<line x1="120" y1="260" x2="120" y2="49" stroke="#555555" stroke-width="1.5"/><polygon points="120,40 124.2,50 115.8,50" fill="#555555"/>
<path d="M 210 150 A 90 90 0 0 0 206.93 126.71" fill="none" stroke="#222222" stroke-width="1.5"/>
<line x1="120" y1="150" x2="302" y2="150" stroke="#c0675e" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="313,150 301,155.04 301,144.96" fill="#c0675e"/>
<line x1="313" y1="150" x2="313" y2="109" stroke="#c0675e" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="313,98 318.04,110 307.96,110" fill="#c0675e"/>
<line x1="120" y1="150" x2="302.56" y2="101.08" stroke="#b03a2e" stroke-width="3.5"/><polygon points="313.19,98.24 302.9,106.21 300.29,96.47" fill="#b03a2e"/>
<line x1="120" y1="150" x2="120" y2="191" stroke="#b03a2e" stroke-width="3.5"/><polygon points="120,202 114.96,190 125.04,190" fill="#b03a2e"/>
<line x1="160" y1="65" x2="194" y2="65" stroke="#1e8449" stroke-width="3"/><polygon points="205,65 193,70.04 193,59.96" fill="#1e8449"/>
<circle cx="120" cy="150" r="6" fill="#1f3a5f"/>
<text x="110" y="126" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="end">cage</text>
<text x="396" y="156" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="120" y="30" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="370" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444444" text-anchor="end">toward center →</text>
<text x="326.71" y="101.61" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">F</tspan></text>
<text x="299" y="174" font-family="'Times New Roman', Times, serif" font-size="20" fill="#c0675e" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">cos</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">θ</tspan></text>
<text x="325" y="117" font-family="'Times New Roman', Times, serif" font-size="20" fill="#c0675e" text-anchor="start" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">sin</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">θ</tspan></text>
<text x="132" y="197" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">mg</tspan></text>
<text x="223.11" y="142.03" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">θ</tspan></text>
<text x="191" y="53" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
<text x="270" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444444" text-anchor="middle" font-style="italic">angle exaggerated (actual 5.71°)</text>
</svg>
