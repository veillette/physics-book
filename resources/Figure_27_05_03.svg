<title id="title">Single-slit intensity</title>
<desc id="desc">Intensity versus sin θ for a single slit of width D. The central maximum is twice as wide as the others, and the intensity falls to zero at sin θ = ±λ/D, ±2λ/D, ±3λ/D. The secondary maxima are much dimmer than the central one.</desc>
