<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the plank held by two hands</title>
<desc id="desc">The plank is 2.00 m long. The origin (pivot for torques) is at the left end, where F_1 pushes down. +x points along the plank and +y up, and counterclockwise torques are positive. F_2 pushes up 0.500 m from the end (counterclockwise torque), and the weight W = 196 N acts down at the middle, 1.00 m from the end (clockwise torque).</desc>
