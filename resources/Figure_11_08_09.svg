<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
<title id="title">Mercury and water in a glass tube</title>
<desc id="desc">(a) In a glass tube standing in mercury, Hg, the contact angle is about 140°, greater than 90°. Surface tension acts along the mercury surface at the walls, with a net force F_ST downward that depresses the mercury in the tube by a height h; the dashed curve shows the shape the surface would have without this flattening. (b) For water the contact angle is about 0°. Surface tension pulls up along the walls, a net force F_ST upward that raises the water a height h above the outside level.</desc>
