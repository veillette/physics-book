<svg xmlns="http://www.w3.org/2000/svg" width="600" height="269" viewBox="0 0 600 269" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the puck during the slap shot</title>
<desc id="desc">A horizontal +x axis points in the direction the puck moves, with the origin where the stick starts to accelerate it. Start: t = 0, x_0 = 0, v_0 = +8.00 m/s. End of the shot: t = 3.33 × 10⁻² s, v = +40.0 m/s, x unknown.</desc>
<rect width="600" height="269" fill="#ffffff"/>
<line x1="30" y1="122" x2="540" y2="122" stroke="#8d6e63" stroke-width="2.2"/>
<line x1="30" y1="156" x2="520" y2="156" stroke="#555555" stroke-width="1.6"/>
<polygon points="530,156 519,160.4 519,151.6" fill="#555555"/>
<text x="546" y="161.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="530" y="180.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">direction</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">of</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">motion</tspan><tspan font-style="normal">)</tspan></text>
<line x1="90" y1="151" x2="90" y2="161" stroke="#555555" stroke-width="1.6"/>
