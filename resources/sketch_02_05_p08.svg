<text x="400" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">t</tspan><tspan font-style="normal"> = 3.33 × 10</tspan><tspan font-size="11.2" dy="-6.4"><tspan font-style="normal">-2</tspan></tspan><tspan dy="6.4">​</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">s</tspan></text>
<text x="400" y="226.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">x</tspan><tspan font-style="normal"> = ?</tspan></text>
<text x="400" y="247.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-style="normal"> = +40.0 </tspan><tspan font-style="normal">m/s</tspan></text>
<line x1="400" y1="151" x2="400" y2="161" stroke="#555555" stroke-width="1.6"/>
<line x1="200" y1="40" x2="248.4" y2="40" stroke="#6a3d9a" stroke-width="3"/>
<polygon points="260,40 247.4,45.04 247.4,34.96" fill="#6a3d9a"/>
<text x="230" y="30.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#6a3d9a" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-style="normal"> = ?</tspan></text>
