<circle cx="90" cy="110" r="7" fill="#1f3a5f"/>
<text x="90" y="98.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f3a5f" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">puck</tspan></text>
<line x1="90" y1="72" x2="108.4" y2="72" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="120,72 107.4,77.04 107.4,66.96" fill="#3f8a1e"/>
