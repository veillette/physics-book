<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title id="title">A vibrating string compressing the air in front of it</title>
<desc id="desc">A string held between two clamps bows to the right as it moves right. It squeezes the air just ahead of it into a compression, a darker band whose center is the solid line, and leaves a rarefaction, a paler band with a dashed center, behind it on the left.</desc>
<rect width="640" height="400" fill="#ffffff"/>
