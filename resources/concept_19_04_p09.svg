<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">Fair-weather field above the ground</title>
<desc id="desc">The ground carries negative charge, shown by minus signs along its surface. The electric field lines are vertical, evenly spaced, and point down toward the ground; the field is 113 V/m. The equipotentials are horizontal lines parallel to the ground, equally spaced for equal potential steps: 0 V at the ground, 113 V at 1 m, 226 V at 2 m, and 339 V at 3 m. The potential increases with height.</desc>
