<svg xmlns="http://www.w3.org/2000/svg" width="620" height="440" viewBox="0 0 620 440" role="img" aria-labelledby="title desc">
<title id="title">Minimum height of a full-length mirror</title>
<desc id="desc">A person 1.80 meters tall stands in front of a flat wall mirror. The ray from the toes reflects into the eye from a point at half the eye height, and the ray from the top of the head reflects from a point halfway between the eye and the top of the head. The mirror needs to extend only between these two points, 0.90 meters, half the person’s height, whatever the distance from the mirror.</desc>
