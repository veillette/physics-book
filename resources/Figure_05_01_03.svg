<title id="title">Skier on slope with force components</title>
<desc id="desc">A skier descends left down a 25° slope. Weight w points vertically down, normal force N points outward, and friction f points uphill. Dashed weight components w perpendicular and w parallel sum to w. The x axis points downhill and the y axis outward. The free-body diagram repeats the same three forces; N and w share one scale, and the 45 N friction is enlarged so it stays visible.</desc>
