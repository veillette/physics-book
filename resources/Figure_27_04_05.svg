<svg xmlns="http://www.w3.org/2000/svg" width="560" height="780" viewBox="0 0 560 780" role="img" aria-labelledby="title desc">
<title id="title">First-order spectrum on a screen</title>
<desc id="desc">White light leaves a grating with 10 000 lines per centimeter and falls on a screen 2.00 m away. In first order, violet light leaves at angle θV and red light at the larger angle θR, reaching distances yV and yR from the center of the screen; the rainbow between them appears above and below the center. The angles and distances are the quantities to find.</desc>
