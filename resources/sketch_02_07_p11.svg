<svg xmlns="http://www.w3.org/2000/svg" width="540" height="350" viewBox="0 0 540 350" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the rock falling toward the hiker</title>
<desc id="desc">A vertical +y axis points down, with the origin where the rock breaks loose, 105 m above the hiker. Start: t = 0, y_0 = 0, v_0 = 0. The hiker hears the break when sound has traveled 105 m, and sees the rock 1.50 s later, at t = 1.81 s, when it is at unknown y. The hiker’s head is at y = 105 m. The acceleration is a = +9.80 m/s² (downward).</desc>
