<title id="title">Air-filled tube near a water faucet</title>
<desc id="desc">A horizontal water pipe leads to a faucet, from which water pours. Just before the faucet a vertical tube, closed at the top, rises from the pipe. Water fills the pipe, and the tube above it stays full of air.</desc>
