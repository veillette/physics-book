<svg xmlns="http://www.w3.org/2000/svg" width="640" height="269" viewBox="0 0 640 269" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the sprint model</title>
<desc id="desc">A horizontal +x axis points along the track, with the origin at the start. Start: t = 0, x_0 = 0, v_0 = 0. Phase 1: constant acceleration a (unknown, in +x) for 3.00 s up to the maximum speed v (unknown). Phase 2: constant speed v, a = 0, to the finish: x = 100 m at t = 9.69 s, or x = 200 m at t = 19.30 s.</desc>
