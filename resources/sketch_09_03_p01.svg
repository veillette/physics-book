<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the horse leaning on the wall</title>
<desc id="desc">Rear view with the wall on the left. Torques are taken about the horse’s feet (the origin). +x points away from the wall and +y up, and counterclockwise torques are positive. The weight w = 4900 N acts down 0.35 m from the feet, on the wall side (counterclockwise torque); the wall pushes horizontally along +x with F_wall, 1.2 m above the ground (clockwise torque).</desc>
