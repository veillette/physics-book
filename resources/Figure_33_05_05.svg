<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="215" viewBox="0 0 1000 215" role="img" aria-labelledby="title desc">
<title id="title">Colors of the quarks in a baryon and a meson</title>
<desc id="desc">A baryon contains three quarks, one red, one green and one blue; the three colors add to white. A meson contains a quark and an antiquark, red and antired; a color and its anticolor also add to white. Hadrons are always white.</desc>
<rect width="1000" height="215" fill="#ffffff"/>
<text x="10" y="53.4" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Baryon</tspan></text>
<circle cx="205" cy="105" r="100" fill="none" stroke="#222222" stroke-width="2"/>
<circle cx="158" cy="62" r="21" fill="#f6b9b9" stroke="#d0263f" stroke-width="2"/>
<text x="158" y="72.1" font-family="'Times New Roman', Times, serif" font-size="26" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">q</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">1</tspan></tspan><tspan dy="-7.28">​</tspan></text>
<text x="158" y="112.4" font-family="'Times New Roman', Times, serif" font-size="24" fill="#d0263f" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">R</tspan></text>
<circle cx="270" cy="72" r="21" fill="#bfe5d2" stroke="#2f9a6a" stroke-width="2"/>
