<text x="270" y="122.4" font-family="'Times New Roman', Times, serif" font-size="24" fill="#2f9a6a" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">G</tspan></text>
<circle cx="212" cy="140" r="21" fill="#bcd3f0" stroke="#2b6fc4" stroke-width="2"/>
<text x="212" y="150.1" font-family="'Times New Roman', Times, serif" font-size="26" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">q</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">3</tspan></tspan><tspan dy="-7.28">​</tspan></text>
<text x="212" y="190.4" font-family="'Times New Roman', Times, serif" font-size="24" fill="#2b6fc4" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">B</tspan></text>
