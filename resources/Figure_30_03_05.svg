<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" role="img" aria-labelledby="title desc">
<title id="title">Energy-level diagram for hydrogen</title>
<desc id="desc">The energy levels of hydrogen’s electron, E_n = −13.6 eV/n², drawn to scale, with energy increasing upward. The levels crowd together toward n = ∞ at the top. An arrow shows the electron dropping from n = 4 to n = 2.</desc>
