<svg xmlns="http://www.w3.org/2000/svg" width="680" height="800" viewBox="0 0 680 800" role="img" aria-labelledby="title desc">
<title id="title">Thermos bottle</title>
<desc id="desc">A cutaway of a thermos bottle. A double-walled glass bottle with silvered surfaces sits inside an outer container, held by a rubber support at the bottom and spring centering devices at the sides. The space between the glass walls is a vacuum. The hot or cold liquid is in the inner bottle, closed by a stopper.</desc>
