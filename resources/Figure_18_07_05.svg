<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260" role="img" aria-labelledby="title desc">
<title id="title">Field between two oppositely charged metal plates</title>
<desc id="desc">An upper metal plate with positive charge and a lower plate with an equal negative charge. Between them the field lines are straight, evenly spaced and point down from the positive plate to the negative plate, so the field is uniform; near the ends the lines bow outward.</desc>
