<svg xmlns="http://www.w3.org/2000/svg" width="640" height="780" viewBox="0 0 640 780" role="img" aria-labelledby="title desc">
<title id="title">The Pauli exclusion principle</title>
<desc id="desc">Electrons drawn with arrows for spin up (ms = +1/2) or spin down (ms = −1/2) in the n = 1 and n = 2 shells. Allowed: one electron in n = 1 with either spin; two in n = 1 with opposite spins; and two opposite spins in n = 1 with a third electron, of either spin, in n = 2. Not allowed: two electrons in n = 1 with the same spin, or three electrons in n = 1, since n = 1 holds only two.</desc>
