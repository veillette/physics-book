<title id="title">Two voltage sources in series</title>
<desc id="desc">Two dry cells are stacked, the positive terminal of the lower one touching the negative end of the upper one. Beside them, the schematic shows the same series connection: emf1 with internal resistance r1, then emf2 with internal resistance r2. The emfs add and so do the internal resistances.</desc>
