<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="title desc">
<title id="title">Double image from the two surfaces of a glass sheet</title>
<desc id="desc">Light from an object reflects from both the front and back surfaces of a sheet of glass. The two reflected rays leave parallel to each other but slightly offset, so the eye sees two images, one from each surface, the second slightly behind and displaced from the first.</desc>
