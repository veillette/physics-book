<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" viewBox="0 0 660 300" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the lower leg lifting the child</title>
<desc id="desc">The lower leg pivots at the knee (the origin). +x points from the knee toward the foot and +y up, and counterclockwise torques are positive. The quadriceps force F_Q acts 2.0 cm from the knee (perpendicular lever arm) and gives a counterclockwise torque; the leg’s weight w_leg = 39.2 N acts down at 20.0 cm and the child’s weight w_child = 98 N at 38.0 cm (clockwise torques).</desc>
