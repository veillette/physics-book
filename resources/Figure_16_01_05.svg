<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
<title id="title">Work done deforming a Hooke’s-law spring</title>
<desc id="desc">A graph of the applied force F_app = kx versus displacement, a straight line through the origin. The work done to reach displacement x is the shaded triangle under the line. Method A: W = ½bh = ½kx·x = ½kx². Method B: the average force is ½kx, shown by a dashed line halfway up, so W = (½kx)(x) = ½kx².</desc>
