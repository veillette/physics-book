<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc">
<title id="title">Two addition orders and an alternative force pair</title>
<desc id="desc">Force diagrams share x to the right, y up, and a scale of 10 pixels per newton. Left: horizontal F1 and vertical F2 added in either order form the same 20.0 N resultant at 35 degrees. Right: F3 at 75 degrees followed by horizontal F4 reaches the same tip, with magnitudes approximately 11.9 N and 13.3 N.</desc>
