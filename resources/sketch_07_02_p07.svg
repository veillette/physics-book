<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the sprinter accelerating into a headwind</title>
<desc id="desc">A horizontal +x axis points in the direction the sprinter runs. Over d = 25.0 m the speed rises from v_i = +2.00 m/s to v_f = +8.00 m/s. Forces on the sprinter along x: the track pushes forward with F_sprinter along +x (the reaction to his backward push on the track) and the headwind pushes back with F_wind = 30.0 N along −x.</desc>
<rect width="600" height="240" fill="#ffffff"/>
<line x1="40" y1="120" x2="470" y2="120" stroke="#8d6e63" stroke-width="2.2"/>
<line x1="40" y1="160" x2="450" y2="160" stroke="#555555" stroke-width="1.6"/>
<polygon points="460,160 449,164.4 449,155.6" fill="#555555"/>
<text x="468" y="165.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="468" y="182.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">direction</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">of</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">running</tspan><tspan font-style="normal">)</tspan></text>
<line x1="90" y1="155" x2="90" y2="165" stroke="#555555" stroke-width="1.6"/>
<text x="90" y="181.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">0</tspan></text>
<line x1="420" y1="155" x2="420" y2="165" stroke="#555555" stroke-width="1.6"/>
<text x="420" y="181.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">25.0 </tspan><tspan font-style="normal">m</tspan></text>
<circle cx="90" cy="106" r="7" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<line x1="76" y1="76" x2="94.4" y2="76" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="106,76 93.4,81.04 93.4,70.96" fill="#3f8a1e"/>
<text x="91" y="65.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">i</tspan></tspan><tspan dy="-4.48">​</tspan></text>
<circle cx="255" cy="106" r="7" fill="#1f3a5f"/>
<text x="255" y="136.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f3a5f" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">sprinter</tspan></text>
<line x1="255" y1="106" x2="318.4" y2="106" stroke="#b03a2e" stroke-width="3"/>
<polygon points="330,106 317.4,111.04 317.4,100.96" fill="#b03a2e"/>
<text x="343" y="111.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">sprinter</tspan></tspan><tspan dy="-4.48">​</tspan></text>
<line x1="255" y1="106" x2="221.6" y2="106" stroke="#b03a2e" stroke-width="3"/>
<polygon points="210,106 222.6,100.96 222.6,111.04" fill="#b03a2e"/>
<text x="200" y="89.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">wind</tspan></tspan><tspan dy="-4.48">​</tspan></text>
<circle cx="420" cy="106" r="7" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<line x1="390" y1="76" x2="468.4" y2="76" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="480,76 467.4,81.04 467.4,70.96" fill="#3f8a1e"/>
<text x="435" y="65.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">f</tspan></tspan><tspan dy="-4.48">​</tspan></text>
<text x="90" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">i</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = +2.00 </tspan><tspan font-style="normal">m/s</tspan></text>
<text x="255" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">wind</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 30.0 </tspan><tspan font-style="normal">N</tspan></text>
<text x="420" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">f</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = +8.00 </tspan><tspan font-style="normal">m/s</tspan></text>
</svg>
