<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the landing after a jump from a ledge</title>
<desc id="desc">A vertical +y axis points up, with y = 0 at ground level where the feet first touch. The person starts at rest 0.600 m up, falls to the ground, then stops while moving a further distance d down (1.50 cm in part a, 0.300 m in part b; drawn larger). During the stop the displacement points along −y; the ground pushes up with N along +y and the weight w = mg points along −y.</desc>
