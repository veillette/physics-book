<text x="540" y="430.5" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">Stored</tspan></text>
<text x="540" y="482.5" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">fat</tspan></text>
