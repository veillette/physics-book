<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="640" viewBox="0 0 1030 640" role="img" aria-labelledby="title desc">
<title id="title">Energy conversion in humans</title>
<desc id="desc">Food energy, the initial other energy OEi, branches into three forms: work, which is nonconservative work Wnc and is negative; thermal energy; and stored fat. Thermal energy and stored fat together make up the final other energy OEf. So OEi + Wnc = OEf.</desc>
