<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the skier coasting up the rise</title>
<desc id="desc">A slope rises at 35° to a height of 2.50 m. A vertical +y axis (up) has y = 0 at the bottom and 2.50 m at the top. A tilted +x axis points up the slope, the direction of motion. The skier starts at the bottom with v_i = 12.0 m/s and travels d = 4.36 m along the slope; kinetic friction f points down the slope (−x). The final speed v_f at the top is unknown.</desc>
