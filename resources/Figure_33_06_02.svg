<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 175" role="img" aria-labelledby="title desc">
  <title id="title">Eight gluon color states</title>
  <desc id="desc">Eight circles represent the eight gluon states. All carry the strong interaction's color charge; none is a separate colorless gluon.</desc>
  <rect width="720" height="175" rx="8" fill="#fff"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="360" y="30" font-size="22" fill="#172536">Eight gluon color states</text>
    <g fill="#514190" stroke="#292044" stroke-width="2">
      <circle cx="80" cy="83" r="25"/><circle cx="160" cy="83" r="25"/>
      <circle cx="240" cy="83" r="25"/><circle cx="320" cy="83" r="25"/>
      <circle cx="400" cy="83" r="25"/><circle cx="480" cy="83" r="25"/>
      <circle cx="560" cy="83" r="25"/><circle cx="640" cy="83" r="25"/>
    </g>
    <g fill="#fff" font-size="19">
      <text x="80" y="90">g₁</text><text x="160" y="90">g₂</text>
      <text x="240" y="90">g₃</text><text x="320" y="90">g₄</text>
      <text x="400" y="90">g₅</text><text x="480" y="90">g₆</text>
      <text x="560" y="90">g₇</text><text x="640" y="90">g₈</text>
    </g>
    <text x="360" y="145" font-size="17" fill="#172536">All eight carry the strong interaction's color charge.</text>
  </g>
</svg>
