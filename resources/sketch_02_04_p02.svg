<svg xmlns="http://www.w3.org/2000/svg" width="600" height="248" viewBox="0 0 600 248" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the rocket sled run</title>
<desc id="desc">A horizontal +x axis points in the direction the sled travels, with the origin at its starting point. Start: t = 0, v_0 = 0. End of the burn: t = 5.00 s, v = +282 m/s. Stop: t = 6.40 s, v = 0. While speeding up the acceleration a_1 points in +x; while stopping a_2 points in −x.</desc>
<rect width="600" height="248" fill="#ffffff"/>
<line x1="30" y1="122" x2="540" y2="122" stroke="#8d6e63" stroke-width="2.2"/>
<line x1="30" y1="156" x2="520" y2="156" stroke="#555555" stroke-width="1.6"/>
<polygon points="530,156 519,160.4 519,151.6" fill="#555555"/>
<text x="546" y="161.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="530" y="180.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">direction</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">of</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">motion</tspan><tspan font-style="normal">)</tspan></text>
<line x1="80" y1="151" x2="80" y2="161" stroke="#555555" stroke-width="1.6"/>
<text x="80" y="177.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">0</tspan></text>
<rect x="60" y="95" width="40" height="22" rx="4" fill="#d6e4f0" stroke="#1f3a5f" stroke-width="2"/>
<text x="80" y="88.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f3a5f" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">sled</tspan></text>
<text x="80" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">t</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 0</tspan></text>
<text x="80" y="226.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 0</tspan></text>
<line x1="80" y1="151" x2="80" y2="161" stroke="#555555" stroke-width="1.6"/>
<rect x="280" y="95" width="40" height="22" rx="4" fill="#d6e4f0" stroke="#1f3a5f" stroke-width="2"/>
<line x1="300" y1="72" x2="368.4" y2="72" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="380,72 367.4,77.04 367.4,66.96" fill="#3f8a1e"/>
<text x="340" y="63.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">1</tspan></tspan><tspan dy="-4.48">​</tspan></text>
<text x="300" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">t</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">1</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 5.00 </tspan><tspan font-style="normal">s</tspan></text>
<text x="300" y="226.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">1</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = +282 </tspan><tspan font-style="normal">m/s</tspan></text>
<line x1="300" y1="151" x2="300" y2="161" stroke="#555555" stroke-width="1.6"/>
<rect x="450" y="95" width="40" height="22" rx="4" fill="#d6e4f0" stroke="#1f3a5f" stroke-width="2"/>
<text x="470" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">t</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">2</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 6.40 </tspan><tspan font-style="normal">s</tspan></text>
<text x="470" y="226.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">2</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 0</tspan></text>
<line x1="470" y1="151" x2="470" y2="161" stroke="#555555" stroke-width="1.6"/>
<line x1="150" y1="40" x2="198.4" y2="40" stroke="#6a3d9a" stroke-width="3"/>
<polygon points="210,40 197.4,45.04 197.4,34.96" fill="#6a3d9a"/>
<text x="180" y="30.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#6a3d9a" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">1</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = ?</tspan></text>
<line x1="420" y1="40" x2="381.6" y2="40" stroke="#6a3d9a" stroke-width="3"/>
<polygon points="370,40 382.6,34.96 382.6,45.04" fill="#6a3d9a"/>
<text x="395" y="30.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#6a3d9a" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">2</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = ?</tspan></text>
</svg>
