<svg xmlns="http://www.w3.org/2000/svg" width="700" height="720" viewBox="0 0 700 720" role="img" aria-labelledby="title desc">
<title id="title">Forces on the arm of a backhoe</title>
<desc id="desc">The arm of a backhoe, drawn as a straight bar pivoted at its upper end and tilted 30° from the vertical, with a shovel of dirt at its lower end. A hydraulic piston pushes on the arm with force F, applied 0.30 m from the pivot and perpendicular to the arm. The arm’s weight w_arm acts at its center of mass, 1.10 m from the pivot, and the load’s weight w_load acts 1.70 m from the pivot; both point straight down.</desc>
