<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title desc">
<title id="title">Heat transfer from a fireplace</title>
<desc id="desc">A room with a fireplace at the lower left. Hot air rises up the chimney by convection. Radiation (wavy lines) goes from the fire into the room. Cold air enters around the window at the right and flows across the floor toward the fire by convection. Heat is conducted from the fire down into the floor beneath it.</desc>
