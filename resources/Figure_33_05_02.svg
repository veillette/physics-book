<svg xmlns="http://www.w3.org/2000/svg" width="560" height="700" viewBox="0 0 560 700" role="img" aria-labelledby="title desc">
<title id="title">Tracks of the first Ω⁻ event</title>
<desc id="desc">A tracing of the bubble-chamber photograph of the first Ω⁻. An incoming K⁻ strikes a proton, making a K⁺ and a neutral K⁰ (dashed, as neutral particles leave no track) and the Ω⁻. The Ω⁻ travels a short way and decays into a Ξ⁰ and a π⁻. The Ξ⁰ decays into a Λ⁰ and a neutral pion, which at once gives two gamma rays; each gamma ray later makes an electron–positron pair. The Λ⁰ decays into a proton and a π⁻. A 10-cm scale bar is shown.</desc>
