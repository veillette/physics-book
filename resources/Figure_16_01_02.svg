<path d="M 306 250 Q 306 160 306 70" fill="none" stroke="#c75a4a" stroke-width="6" stroke-linejoin="round"/>
<rect x="292" y="250" width="28" height="16" fill="#555555"/>
<text x="306" y="24.3" font-family="'Times New Roman', Times, serif" font-size="18" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal"> = 0</tspan></text>
<line x1="316" y1="62" x2="353" y2="62" stroke="#3f9a2b" stroke-width="4"/>
<polygon points="368,62 352,68.4 352,55.6" fill="#3f9a2b"/>
