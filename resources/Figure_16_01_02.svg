<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">A plastic ruler oscillating about its equilibrium position</title>
<desc id="desc">Five stages of a ruler clamped at its lower end. (a) Released from the left of equilibrium, the restoring force F points right. (b) At the equilibrium position the force is zero but the ruler moves right with velocity v. (c) Displaced to the right, the restoring force points left and slows it. (d) At equilibrium again, the force is zero and it moves left. (e) Back at the starting position, ready to repeat; without damping the motion continues.</desc>
<rect width="1000" height="300" fill="#ffffff"/>
<line x1="140" y1="250" x2="140" y2="60" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4"/>
<path d="M 140 250 Q 140 160 80 77.2" fill="none" stroke="#c75a4a" stroke-width="6" stroke-linejoin="round"/>
<rect x="126" y="250" width="28" height="16" fill="#555555"/>
<line x1="26" y1="62" x2="59" y2="62" stroke="#e0245e" stroke-width="4"/>
<polygon points="74,62 58,68.4 58,55.6" fill="#e0245e"/>
<text x="20" y="47" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">F<tspan font-size="12.4" font-weight="normal" dx="-12.31" dy="-16.4">→</tspan><tspan dx="-0.09" dy="16.4">​</tspan></tspan></text>
<text x="140" y="297" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">a</tspan><tspan font-style="normal">)</tspan></text>
