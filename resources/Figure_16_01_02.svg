<path d="M 336 250 Q 336 160 336 70" fill="none" stroke="#c75a4a" stroke-width="6" stroke-linejoin="round"/>
<rect x="322" y="250" width="28" height="16" fill="#555555"/>
<text x="336" y="24.3" font-family="'Times New Roman', Times, serif" font-size="18" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal"> = 0</tspan></text>
<line x1="346" y1="62" x2="383" y2="62" stroke="#3f9a2b" stroke-width="4"/>
<polygon points="398,62 382,68.4 382,55.6" fill="#3f9a2b"/>
