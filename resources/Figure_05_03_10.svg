<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="530" viewBox="0 0 1040 530" role="img" aria-labelledby="title desc">
<title id="title">Telephone pole at a right-angle bend with a guy wire</title>
<desc id="desc">An oblique view shows two power lines and a guy wire attached at the top of a pole. The plan view shows perpendicular horizontal line directions and a guy wire opposite their bisector. The elevation of either power line shows 80° to the downward vertical; the guy-wire elevation shows 30° to the vertical. Every tension arrow follows its wire away from the pole.</desc>
