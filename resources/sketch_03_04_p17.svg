<title id="title">Sketch of the mouse falling toward the nest</title>
<desc id="desc">Axes with +x east and +y DOWN, origin where the owl drops the mouse. The mouse starts with the owl’s velocity, 3.50 m/s at 30.0° below the horizontal, so v_0x = +3.03 m/s and v_0y = +1.75 m/s. The 30.0-cm nest is centered at x = 4.00 m, y = 12.0 m. The acceleration is a_y = +9.80 m/s² (down), a_x = 0. The question is the mouse’s x when y = 12.0 m.</desc>
