<svg xmlns="http://www.w3.org/2000/svg" width="460" height="220" viewBox="0 0 460 220" role="img" aria-labelledby="title desc">
<title id="title">Sketch for deriving the range equation</title>
<desc id="desc">Axes with +x horizontal in the direction of launch and +y up, origin at the launch point. The projectile leaves with speed v_0 at angle θ_0 above +x, so v_0x = v_0 cos θ_0 and v_0y = v_0 sin θ_0. The acceleration is a_y = −g, a_x = 0. Landing condition: y = 0 at x = R.</desc>
