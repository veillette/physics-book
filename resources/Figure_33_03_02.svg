<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">A cyclotron</title>
<desc id="desc">Two hollow D-shaped plates, the dees, lie side by side with a gap between them. A uniform magnetic field B passes down through both. An alternating voltage across the gap gives an electric field E there, pointing from one dee to the other. Charged particles follow semicircular paths inside the dees, gain energy each time they cross the gap, and so spiral outward in ever larger semicircles until they leave as an external beam.</desc>
