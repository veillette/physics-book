<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600" role="img" aria-labelledby="title desc">
<title id="title">A sound wave of compressions and rarefactions moving out from a string</title>
<desc id="desc">After many vibrations, the string, shown at several positions as it swings left and right, has sent out a series of compressions (darker bands, solid lines) and rarefactions (paler bands, dashed lines) on both sides. Below, a graph of gauge pressure P_gauge versus distance x from the string is a sine wave: positive at compressions, negative at rarefactions, and only slightly different from atmospheric pressure for ordinary sounds.</desc>
<rect width="660" height="600" fill="#ffffff"/>
