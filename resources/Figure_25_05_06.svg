<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Dispersion by a prism</title>
<desc id="desc">White light strikes one face of an equilateral glass prism (all angles 60°) at an incident angle of 45°. Inside, it separates into colors; red light of 660 nm is bent least and violet light of 410 nm most, and they emerge from the far face at angles θR and θV. The spread is exaggerated for clarity.</desc>
