<text x="259" y="229.7" font-family="'Times New Roman', Times, serif" font-size="22" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">F<tspan font-size="13.64" font-weight="normal" dx="-13.54" dy="-18.04">→</tspan><tspan dx="-0.1" dy="18.04">​</tspan></tspan><tspan font-size="15.4" dy="6.16"><tspan font-style="normal">2</tspan></tspan><tspan dy="-6.16">​</tspan></text>
<line x1="70" y1="202" x2="350" y2="202" stroke="#222222" stroke-width="1.4"/>
<polygon points="360,202 349,206.4 349,197.6" fill="#222222"/>
<polygon points="60,202 71,197.6 71,206.4" fill="#222222"/>
<line x1="60" y1="192" x2="60" y2="212" stroke="#222222" stroke-width="1.2"/>
<line x1="360" y1="192" x2="360" y2="212" stroke="#222222" stroke-width="1.2"/>
<text x="210" y="193" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">r</tspan></text>
<text x="210" y="291.7" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">b</tspan><tspan font-style="normal">)</tspan></text>
</svg>
