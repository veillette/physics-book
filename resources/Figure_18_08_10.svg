<svg xmlns="http://www.w3.org/2000/svg" width="580" height="280" viewBox="0 0 580 280" role="img" aria-labelledby="title desc">
<title id="title">An electron deflected between charged plates</title>
<desc id="desc">Two parallel horizontal plates, positive on top and negative on the bottom, with the field between them pointing down. An electron enters from the left moving horizontally with velocity v0. The upward electric force bends its path into a parabola curving toward the positive plate, and it leaves with velocity v1 at an angle θ above the horizontal.</desc>
