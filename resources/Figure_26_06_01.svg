<svg xmlns="http://www.w3.org/2000/svg" width="760" height="920" viewBox="0 0 760 920" role="img" aria-labelledby="title desc">
<title id="title">Chromatic aberration</title>
<desc id="desc">(a) White light from a point passes through a single converging lens. Violet light is bent more than red, so it focuses closer to the lens (V) than red light does (R), and the colors spread into fans. (b) An achromatic doublet, a converging lens cemented to a weaker diverging lens of different glass, brings white light of all colors to one focus.</desc>
