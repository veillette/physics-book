<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
<title id="title">A goalie catches a hockey puck</title>
<desc id="desc">Before: a 0.150-kg puck moves right at 35.0 m/s toward a stationary 70.0-kg goalie on frictionless ice. After catching the puck, the goalie and puck move together to the right at 0.0748 m/s. Total momentum is conserved. Kinetic energy decreases from 91.9 J to 0.196 J, with about 91.7 J converted to thermal energy and sound. Velocity arrows show direction only, not a common scale.</desc>
