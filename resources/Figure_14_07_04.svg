<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1000" viewBox="0 0 780 1000" role="img" aria-labelledby="title desc">
<title id="title">Absorption and radiation by black and silver surfaces</title>
<desc id="desc">A black block absorbs most of the radiant energy that falls on it and reflects little; it also radiates well, emitting most of its energy and retaining little. A silver-coated block reflects most of the incident energy and absorbs little; it radiates poorly, emitting little and retaining most.</desc>
