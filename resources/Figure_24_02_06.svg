<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img" aria-labelledby="title desc">
<title id="title">Interference from two broadcast antennas</title>
<desc id="desc">An overhead view of two antennas sending the same signal. Solid circles centered on each antenna are crests and dashed circles are troughs. Where a crest from one antenna meets a crest from the other, marked with dots, the waves interfere constructively; these points line up along a few directions, shown by arrows: straight up and down between the antennas and along two diagonals on each side.</desc>
