<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the jaw biting the bullet</title>
<desc id="desc">The jaw pivots at the jaw joint (the origin), with the teeth to the right. +x points toward the teeth and +y up, and counterclockwise torques are positive. The masseter pulls up with F_M = 200 N, 2.9 cm from the joint (counterclockwise torque); the bullet pushes down on the teeth with F_T, 5.0 cm from the joint (clockwise torque); the joint pushes down with F_J.</desc>
<rect width="640" height="320" fill="#ffffff"/>
<line x1="140" y1="160" x2="518" y2="160" stroke="#a9c2d9" stroke-width="10" stroke-linecap="round"/>
<line x1="140" y1="160" x2="518" y2="160" stroke="#1f3a5f" stroke-width="1.4"/>
<circle cx="140" cy="160" r="6" fill="#ffffff" stroke="#555555" stroke-width="2"/>
<circle cx="140" cy="160" r="1.8" fill="#555555"/>
<line x1="140" y1="166" x2="140" y2="256" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="343" y1="166" x2="343" y2="256" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="147" y1="250" x2="336" y2="250" stroke="#444444" stroke-width="1.2"/>
<polygon points="343,250 335,253.2 335,246.8" fill="#444444"/>
<polygon points="140,250 148,246.8 148,253.2" fill="#444444"/>
<text x="241.5" y="244.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">2.9 </tspan><tspan font-style="normal">cm</tspan></text>
<line x1="140" y1="166" x2="140" y2="284" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="490" y1="166" x2="490" y2="284" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="147" y1="278" x2="483" y2="278" stroke="#444444" stroke-width="1.2"/>
<polygon points="490,278 482,281.2 482,274.8" fill="#444444"/>
<polygon points="140,278 148,274.8 148,281.2" fill="#444444"/>
<text x="315" y="272.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">5.0 </tspan><tspan font-style="normal">cm</tspan></text>
<line x1="343" y1="160" x2="343" y2="71.6" stroke="#b03a2e" stroke-width="3"/>
<polygon points="343,60 348.04,72.6 337.96,72.6" fill="#b03a2e"/>
<text x="355" y="75.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">M</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 200 </tspan><tspan font-style="normal">N</tspan></text>
<line x1="490" y1="160" x2="490" y2="218.4" stroke="#b03a2e" stroke-width="3"/>
<polygon points="490,230 484.96,217.4 495.04,217.4" fill="#b03a2e"/>
