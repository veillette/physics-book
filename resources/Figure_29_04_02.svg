<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" role="img" aria-labelledby="title desc">
<title id="title">The Compton effect</title>
<desc id="desc">A photon of energy E = hf and wavelength λ strikes an electron e− at rest and scatters off at a right angle as a photon of lower energy E′ = hf′ and longer wavelength λ′. The electron recoils with kinetic energy KE_e = E − E′, carrying the momentum the photon lost.</desc>
