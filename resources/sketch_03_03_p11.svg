<svg xmlns="http://www.w3.org/2000/svg" width="440" height="420" viewBox="0 0 440 420" role="img" aria-labelledby="title desc">
<title id="title">Sketch of Gilligan’s raft trip</title>
<desc id="desc">Axes with +x east and +y north, origin at the island. Seven displacements are drawn head to tail (blue): 2.50 km at 45.0° north of west, 4.70 km at 60.0° south of east, 1.30 km at 25.0° south of west, 5.10 km east, 1.70 km at 5.0° east of north, 7.20 km at 55.0° south of west, and 2.80 km at 10.0° north of east. The resultant R runs from the island to the end of the last leg, in the fourth quadrant (south of east).</desc>
