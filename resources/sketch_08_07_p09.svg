<svg xmlns="http://www.w3.org/2000/svg" width="620" height="284" viewBox="0 0 620 284" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the squid ejecting fluid</title>
<desc id="desc">A horizontal +x axis points in the direction the squid recoils. Before: the squid is at rest. During and after the 0.100-s ejection, 0.250 kg of fluid moves along −x at 10.0 m/s, friction f = 5.00 N on the squid points along −x, and the squid (4.75 kg after ejection) moves along +x with unknown velocity v.</desc>
