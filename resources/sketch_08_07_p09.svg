<line x1="40" y1="86" x2="480" y2="86" stroke="#8d6e63" stroke-width="2.2"/>
<text x="14" y="30.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">before</tspan></text>
<polygon points="245,86 315,86 315,60 245,60" fill="#d6e4f0" stroke="#1f3a5f" stroke-width="2"/>
<text x="280" y="108.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">squid</tspan><tspan font-style="normal"> (5.00 </tspan><tspan font-style="normal">kg</tspan><tspan font-style="normal">)</tspan></text>
<text x="280" y="45.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-style="normal"> = 0</tspan></text>
