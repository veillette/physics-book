<circle cx="240" cy="191" r="6" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<text x="240" y="220.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">fluid</tspan><tspan font-style="normal"> (0.250 </tspan><tspan font-style="normal">kg</tspan><tspan font-style="normal">)</tspan></text>
