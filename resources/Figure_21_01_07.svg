<svg xmlns="http://www.w3.org/2000/svg" width="420" height="330" viewBox="0 0 420 330" role="img" aria-labelledby="title desc">
<title id="title">A switch in series with a resistance and a voltage source</title>
<desc id="desc">A source of emf with internal resistance r on the left, a resistance R on the top wire, and an open switch on the right wire, all in one loop.</desc>
