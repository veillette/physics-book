<svg xmlns="http://www.w3.org/2000/svg" width="620" height="640" viewBox="0 0 620 640" role="img" aria-labelledby="title desc">
<title id="title">A dry cell modeled as an emf and an internal resistance</title>
<desc id="desc">A carbon-zinc dry cell is drawn beside its schematic: a source of emf (long plate positive, at the top) in series with an internal resistance r, between the two output terminals. The terminal voltage V measured across the terminals is V = emf − Ir, where I is the current through the cell, shown flowing up.</desc>
