<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
<title id="title">Allowed electron orbits in hydrogen</title>
<desc id="desc">The first four allowed orbits of hydrogen’s electron, drawn to scale: their radii r1, r2, r3 and r4 grow as n², in the ratio 1 : 4 : 9 : 16.</desc>
<rect width="760" height="760" fill="#ffffff"/>
<circle cx="380" cy="380" r="22" fill="none" stroke="#a5182f" stroke-width="3.5"/>
<circle cx="380" cy="380" r="88" fill="none" stroke="#a5182f" stroke-width="3.5"/>
<circle cx="380" cy="380" r="198" fill="none" stroke="#a5182f" stroke-width="3.5"/>
<circle cx="380" cy="380" r="352" fill="none" stroke="#a5182f" stroke-width="3.5"/>
<line x1="380" y1="380" x2="372.5" y2="367.01" stroke="#222222" stroke-width="1.8"/>
<polygon points="369,360.95 375.77,366.28 370.23,369.48" fill="#222222"/>
<text x="358" y="350.99" font-family="'Times New Roman', Times, serif" font-size="26" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">r</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">1</tspan></tspan><tspan dy="-7.28">​</tspan></text>
<line x1="380" y1="380" x2="456" y2="380" stroke="#222222" stroke-width="1.8"/>
<polygon points="468,380 455,385.2 455,374.8" fill="#222222"/>
<text x="490" y="389.1" font-family="'Times New Roman', Times, serif" font-size="26" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">r</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">2</tspan></tspan><tspan dy="-7.28">​</tspan></text>
<line x1="380" y1="380" x2="473" y2="541.08" stroke="#222222" stroke-width="1.8"/>
<polygon points="479,551.47 468,542.81 477,537.61" fill="#222222"/>
<text x="490" y="579.63" font-family="'Times New Roman', Times, serif" font-size="26" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">r</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">3</tspan></tspan><tspan dy="-7.28">​</tspan></text>
<line x1="380" y1="380" x2="263.71" y2="699.5" stroke="#222222" stroke-width="1.8"/>
<polygon points="259.61,710.77 259.17,696.78 268.94,700.33" fill="#222222"/>
<text x="252.08" y="740.55" font-family="'Times New Roman', Times, serif" font-size="26" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">r</tspan><tspan font-size="18.2" dy="7.28"><tspan font-style="normal">4</tspan></tspan><tspan dy="-7.28">​</tspan></text>
</svg>
