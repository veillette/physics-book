<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
<title id="title">Batteries made of many cells</title>
<desc id="desc">Left: two voltaic piles, stacks of alternating copper and zinc disks, joined at the top by a metal bar, with strips from their bases dipping into cups of electrolyte. Right: a crown of cups, a row of cups of electrolyte joined by arched strips that are copper at one end and zinc at the other, so each cup holds a copper plate and a zinc plate and the cells are in series.</desc>
