<svg xmlns="http://www.w3.org/2000/svg" width="560" height="700" viewBox="0 0 560 700" role="img" aria-labelledby="title desc">
<title id="title">Charged objects attract neutral objects by polarizing them</title>
<desc id="desc">(a) A positive rod near a neutral insulator: each molecule shifts slightly, with its negative side toward the rod. (b) A negative rod near the insulator: each molecule turns its positive side toward the rod. In both cases the nearer, unlike charges are attracted more strongly than the farther, like charges are repelled, so the insulator is attracted. (c) A negative rod near a neutral conductor: free electrons are pushed to the far side, leaving positive charge on the near side, and the conductor is attracted.</desc>
