<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-labelledby="title desc">
<title id="title">Net force on the basketball with gravity included</title>
<desc id="desc">The player’s horizontal push F and the ball’s weight w add head to tail. The net external force F_net points to the right and below the horizontal.</desc>
<rect width="420" height="300" fill="#ffffff"/>
<line x1="50" y1="90" x2="350" y2="90" stroke="#666666" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="90" y1="90" x2="298.4" y2="90" stroke="#c62828" stroke-width="3"/>
<polygon points="310,90 297.4,95.04 297.4,84.96" fill="#c62828"/>
<line x1="310" y1="90" x2="310" y2="188.4" stroke="#c62828" stroke-width="3"/>
<polygon points="310,200 304.96,187.4 315.04,187.4" fill="#c62828"/>
<line x1="90" y1="90" x2="297.66" y2="193.83" stroke="#8e4f8e" stroke-width="4"/>
<polygon points="310,200 294.11,198.68 299.41,188.09" fill="#8e4f8e"/>
<circle cx="90" cy="90" r="14" fill="#e07020" stroke="#222222" stroke-width="1.2"/>
<text x="200" y="77.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">F<tspan font-size="10.54" font-weight="normal" dx="-10.46" dy="-13.94">→</tspan><tspan dx="-0.08" dy="13.94">​</tspan></tspan><tspan font-style="normal"> (</tspan><tspan font-style="normal">push</tspan><tspan font-style="normal">)</tspan></text>
<text x="324" y="150.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">w<tspan font-size="10.54" font-weight="normal" dx="-11.41" dy="-8.84">→</tspan><tspan dx="0.87" dy="8.84">​</tspan></tspan><tspan font-style="normal"> = </tspan><tspan font-style="italic">m</tspan><tspan font-weight="bold" font-style="normal">g<tspan font-size="10.54" font-weight="normal" dx="-9.52" dy="-8.84">→</tspan><tspan dx="-1.02" dy="8.84">​</tspan></tspan></text>
<text x="220.84" y="136.77" font-family="'Times New Roman', Times, serif" font-size="17" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">F<tspan font-size="10.54" font-weight="normal" dx="-10.46" dy="-13.94">→</tspan><tspan dx="-0.08" dy="13.94">​</tspan></tspan><tspan font-size="11.9" dy="4.76"><tspan font-style="normal">net</tspan></tspan><tspan dy="-4.76">​</tspan></text>
<path d="M 143.66 116.84 A 60 60 0 0 0 150 90" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/>
<text x="160" y="193.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">below</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">horizontal</tspan><tspan font-style="normal">)</tspan></text>
</svg>
