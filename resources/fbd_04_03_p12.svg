<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the decelerating passenger</title>
<desc id="desc">Free-body diagram with +x forward and +y up: seat-and-belt force F total at angle theta above the -x axis with dashed components Fx along -x and Fy along +y; weight w down; acceleration to the left.</desc>
<rect width="420" height="280" fill="#ffffff"/>
<line x1="20" y1="150" x2="371" y2="150" stroke="#555555" stroke-width="1.5"/><polygon points="380,150 370,154.2 370,145.8" fill="#555555"/>
<line x1="290" y1="255" x2="290" y2="54" stroke="#555555" stroke-width="1.5"/><polygon points="290,45 294.2,55 285.8,55" fill="#555555"/>
<path d="M 200.99 136.7 A 90 90 0 0 0 200 150" fill="none" stroke="#222222" stroke-width="1.5"/>
<line x1="290" y1="150" x2="101" y2="150" stroke="#c0675e" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="90,150 102,144.96 102,155.04" fill="#c0675e"/>
<line x1="290" y1="150" x2="290" y2="131" stroke="#c0675e" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="290,120 295.04,132 284.96,132" fill="#c0675e"/>
<line x1="290" y1="150" x2="101.1" y2="121.77" stroke="#b03a2e" stroke-width="3.5"/><polygon points="90.22,120.14 102.83,116.93 101.34,126.9" fill="#b03a2e"/>
<line x1="290" y1="150" x2="290" y2="169" stroke="#b03a2e" stroke-width="3.5"/><polygon points="290,180 284.96,168 295.04,168" fill="#b03a2e"/>
<line x1="260" y1="65" x2="221" y2="65" stroke="#1e8449" stroke-width="3"/><polygon points="210,65 222,59.96 222,70.04" fill="#1e8449"/>
<circle cx="290" cy="150" r="6" fill="#1f3a5f"/>
<text x="302" y="206" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="start">passenger</text>
<text x="396" y="156" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="290" y="35" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="104" y="172" font-family="'Times New Roman', Times, serif" font-size="20" fill="#c0675e" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">x</tspan><tspan dy="-6"></tspan></text>
<text x="302" y="131" font-family="'Times New Roman', Times, serif" font-size="20" fill="#c0675e" text-anchor="start" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">y</tspan><tspan dy="-6"></tspan></text>
<text x="104.07" y="102.14" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">total</tspan><tspan dy="-6"></tspan></text>
<text x="302" y="175" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan></text>
<text x="184.29" y="148.44" font-family="'Times New Roman', Times, serif" font-size="18" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">θ</tspan></text>
<text x="224" y="53" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
<text x="210" y="262" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" font-style="italic">vertical forces and θ not to scale</text>
</svg>
