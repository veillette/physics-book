<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">One push on a basketball and on an SUV</title><desc id="desc">The same 30-newton push for 0.20 seconds accelerates a 0.62-kilogram basketball 4.8 meters in 0.60 seconds but moves an 1800-kilogram SUV only 1.7 millimeters. Animated motion has a static alternative for reduced motion and print.</desc><style>.anim-movie{display:none}@media (prefers-reduced-motion:no-preference){.anim-movie{display:inline}.anim-still{display:none}}#animation-paused:target~.anim-movie{display:none!important}#animation-paused:target~.anim-still{display:inline!important}@media (prefers-reduced-motion:reduce),print{.anim-movie{display:none!important}.anim-still{display:inline!important}}</style><rect width="900" height="380" fill="white"/><defs><clipPath id="animation-diagram-clip"><rect x="20" y="42" width="860" height="282"/></clipPath></defs><g id="animation-paused"/><g class="anim-still"><text x="450" y="27" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222" text-anchor="middle">The same force, very different accelerations</text><g clip-path="url(#animation-diagram-clip)"><line x1="70" y1="140" x2="840" y2="140" stroke="#d6dee4" stroke-width="2"/><circle cx="488.71" cy="120" r="18" fill="#d99a35" opacity="1"/><g opacity="0"><line x1="403.71" y1="120" x2="456.71" y2="120" stroke="#c0392b" stroke-width="3"/><polygon points="465.71,120 456.71,124 456.71,116" fill="#c0392b" stroke="none"/></g><text x="150" y="72" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#222222" text-anchor="start">Basketball, 0.62 kg</text><line x1="70" y1="265" x2="840" y2="265" stroke="#d6dee4" stroke-width="2"/><rect x="150.117" y="205" width="150" height="50" fill="#1f77c8" stroke="#222222" opacity="1"/><circle cx="180.117" cy="258" r="10" fill="#222222" opacity="1"/><circle cx="270.117" cy="258" r="10" fill="#222222" opacity="1"/><g opacity="0"><line x1="85" y1="230" x2="138" y2="230" stroke="#c0392b" stroke-width="3"/><polygon points="147,230 138,234 138,226" fill="#c0392b" stroke="none"/></g><text x="150" y="192" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#222222" text-anchor="start">Stalled SUV, 1800 kg</text><line x1="500" y1="300" x2="840" y2="300" stroke="#222222" stroke-width="1"/><circle cx="636.667" cy="300" r="5" fill="#6a3d9a" opacity="1"/><text x="520" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6a3d9a" text-anchor="start">SUV displacement × 1000</text><text x="660" y="170" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle">Same 30 N push for 0.20 s</text><text x="660" y="72" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#222222" text-anchor="start">a = F/m = 48 m/s²</text><text x="660" y="192" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#222222" text-anchor="start">a = F/m = 0.017 m/s²</text></g><text x="450" y="337" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#657382" text-anchor="middle">Red arrows show the push while it lasts. After 0.60 s the ball has moved 4.8 m; the SUV only 1.7 mm</text><text x="450" y="354" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#657382" text-anchor="middle">(the purple dot shows it magnified 1000 times).</text><text x="450" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#657382" text-anchor="middle">Illustrative motion • slowed down • cycle restarts</text></g><g class="anim-movie" aria-hidden="true"><text x="450" y="27" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222" text-anchor="middle">The same force, very different accelerations</text><g clip-path="url(#animation-diagram-clip)"><line x1="70" y1="140" x2="840" y2="140" stroke="#d6dee4" stroke-width="2"/><circle cx="150" cy="120" r="18" fill="#d99a35" opacity="1"><animate attributeN