<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the forces on the horse and on each foot</title>
<desc id="desc">Rear view with the wall on the left. +x points away from the wall and +y up. On the horse and rider: the wall pushes along +x with F_wall = 1.43 × 10³ N, 1.2 m up; the weight w = 4900 N acts down; each of the two feet on the ground gets N_foot along +y and friction f_foot along −x, toward the wall. The force on each foot, F_foot, is the sum of N_foot and f_foot, tilted from the vertical toward the wall by θ.</desc>
