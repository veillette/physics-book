<svg xmlns="http://www.w3.org/2000/svg" width="790" height="480" viewBox="0 0 790 480" role="img" aria-labelledby="title desc">
<title id="title">Distance from Earth’s center to a surface object</title>
<desc id="desc">Earth with a cutaway of its interior, its center of mass, and a radius to an object at the surface. A magnified circular inset shows a building above the curved surface. The building height is negligible compared with Earth’s radius, so the center-to-object distance is approximately the radius of Earth.</desc>
