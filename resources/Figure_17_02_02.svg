<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">A sound wave from a tuning fork</title>
<desc id="desc">A tuning fork vibrating at frequency f sends out sound to both sides as curved bands of compression (solid arcs) and rarefaction (dashed arcs). The wave travels outward at speed v_w on each side, and the distance between neighboring compressions is the wavelength λ.</desc>
