<svg xmlns="http://www.w3.org/2000/svg" width="620" height="320" viewBox="0 0 620 320" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the ball kicked by the punter</title>
<desc id="desc">Axes with +x horizontal in the direction of the kick and +y up. Just before the kick the ball moves straight down at v_i = 4.43 m/s (after falling 1.00 m from rest), so v_iy is negative. Just after, it moves at v_f = 18 m/s at 55° above +x. The impulse J from the foot, of unknown size, points up and forward at an unknown angle θ.</desc>
