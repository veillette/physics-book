<text x="325" y="131.04" font-family="'Times New Roman', Times, serif" font-size="18" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">τ</tspan><tspan font-size="12.6" dy="5.04"><tspan font-style="normal">z</tspan></tspan><tspan dy="-5.04">​</tspan></text>
