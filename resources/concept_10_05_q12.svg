<text x="310" y="477.25" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="normal">z</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">out</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">of</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">the</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">page</tspan><tspan font-style="normal">; </tspan><tspan font-style="normal">positive</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">torque</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">is</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">counterclockwise</tspan><tspan font-style="normal">.</tspan></text>
