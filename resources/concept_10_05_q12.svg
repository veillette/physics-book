<svg xmlns="http://www.w3.org/2000/svg" width="620" height="500" viewBox="0 0 620 500" role="img" aria-labelledby="title desc">
<title id="title">External torque on a diver during board contact</title>
<desc id="desc">The origin is the diver center of mass, x points toward the board end to the right, and y upward. Weight acts downward at the center, and the upward board force acts at the feet to its right. The horizontal offset d gives a positive counterclockwise torque d times N about the center. Once contact ends, the board force disappears.</desc>
