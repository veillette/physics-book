<polygon points="270,367 264.96,354.4 275.04,354.4" fill="#c62828"/>
<text x="245" y="322" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">mg</tspan></text>
<line x1="320" y1="395" x2="320" y2="181.6" stroke="#c62828" stroke-width="3"/>
<polygon points="320,170 325.04,182.6 314.96,182.6" fill="#c62828"/>
<text x="332" y="296.3" font-family="'Times New Roman', Times, serif" font-size="18" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">N</tspan><tspan font-style="normal"> (</tspan><tspan font-style="normal">board</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">on</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">feet</tspan><tspan font-style="normal">)</tspan></text>
<line x1="270" y1="220" x2="320" y2="220" stroke="#1f77c8" stroke-width="3" stroke-dasharray="5 4"/>
<text x="295" y="212.3" font-family="'Times New Roman', Times, serif" font-size="18" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">d</tspan></text>
<circle cx="270" cy="220" r="7" fill="#222222"/>
<circle cx="320" cy="395" r="5" fill="#222222"/>
<text x="250" y="212.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">center</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">of</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">mass</tspan></text>
