<title id="title">Sketch of the ball bouncing off the wall</title>
<desc id="desc">Axes with +x horizontal toward the wall and +y up. The ball arrives with v_i = 10 m/s at 60° above +x and leaves with v_f = 10 m/s at 60° above −x. The y-components are equal; the x-component reverses from +5.00 m/s to −5.00 m/s, so the impulse J from the wall points along −x.</desc>
