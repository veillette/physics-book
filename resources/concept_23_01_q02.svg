<svg xmlns="http://www.w3.org/2000/svg" width="560" height="460" viewBox="0 0 560 460" role="img" aria-labelledby="title desc">
<title id="title">Induced current when a magnet is pushed into a coil</title>
<desc id="desc">A bar magnet with its north pole pointing up is pushed upward into a horizontal coil. The magnet’s field points up through the coil and is increasing. The induced current, clockwise viewed from above, produces a downward field inside the coil, making the coil’s lower face a north pole that faces the magnet’s north pole, so the coil repels the magnet with a downward force that opposes its motion.</desc>
