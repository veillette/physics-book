<circle cx="470" cy="110" r="7" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<text x="470" y="98.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f3a5f" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">brain</tspan></text>
<text x="470" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">brain</tspan><tspan font-style="normal">: </tspan><tspan font-style="italic">v</tspan><tspan font-style="normal"> = 0</tspan></text>
<text x="470" y="226.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">x</tspan><tspan font-style="normal"> = 4.50 </tspan><tspan font-style="normal">mm</tspan></text>
<line x1="470" y1="151" x2="470" y2="161" stroke="#555555" stroke-width="1.6"/>
<line x1="300" y1="40" x2="251.6" y2="40" stroke="#6a3d9a" stroke-width="3"/>
