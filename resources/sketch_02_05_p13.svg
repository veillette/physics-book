<svg xmlns="http://www.w3.org/2000/svg" width="660" height="269" viewBox="0 0 660 269" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the woodpecker’s head stopping</title>
<desc id="desc">A horizontal +x axis points toward the tree, in the direction the head moves, with the origin where the beak first touches the bark. At contact: t = 0, x_0 = 0, v_0 = +0.600 m/s. The head stops at x = 2.00 mm; the brain stops at x = 4.50 mm. The acceleration points in −x, away from the tree.</desc>
<rect width="660" height="269" fill="#ffffff"/>
<line x1="30" y1="122" x2="550" y2="122" stroke="#8d6e63" stroke-width="2.2"/>
<line x1="30" y1="156" x2="530" y2="156" stroke="#555555" stroke-width="1.6"/>
<polygon points="540,156 529,160.4 529,151.6" fill="#555555"/>
<text x="556" y="161.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="540" y="180.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">toward</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">the</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">tree</tspan><tspan font-style="normal">)</tspan></text>
<line x1="110" y1="151" x2="110" y2="161" stroke="#555555" stroke-width="1.6"/>
<text x="110" y="177.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">0</tspan></text>
<circle cx="110" cy="110" r="7" fill="#1f3a5f"/>
<text x="110" y="98.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f3a5f" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">head</tspan></text>
<line x1="110" y1="72" x2="168.4" y2="72" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="180,72 167.4,77.04 167.4,66.96" fill="#3f8a1e"/>
