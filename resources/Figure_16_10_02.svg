<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-labelledby="title desc">
<title id="title">Pure constructive interference</title>
<desc id="desc">Two identical waves, each of amplitude X, arrive exactly in phase: crest on crest and trough on trough. They add to a resultant with twice the amplitude, 2X, and the same wavelength.</desc>
