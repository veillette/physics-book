<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="935.333" viewBox="0 0 1040 935.333" role="img" aria-labelledby="title desc">
<title id="title">A car coasting over hilly terrain</title>
<desc id="desc">A car experiencing non-negligible friction coasts down a hill, up over a small crest, down a second hill, and comes to a stop at a gas pump on the level ground at the bottom. Arrows mark each stage: coasts down hill, coasts up over crest, coasts down hill, stops for gasoline. An animated companion below illustrates the process; its complete static alternative is shown for reduced motion and print.</desc>
