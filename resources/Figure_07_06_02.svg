<title id="title">A car coasting over hilly terrain</title>
<desc id="desc">A car experiencing non-negligible friction coasts down a hill, up over a small crest, down a second hill, and comes to a stop at a gas pump on the level ground at the bottom. Arrows mark each stage: coasts down hill, coasts up over crest, coasts down hill, stops for gasoline.</desc>
