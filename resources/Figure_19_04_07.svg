<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-labelledby="title desc">
<title id="title">A negatively charged conductor</title>
<desc id="desc">A long conductor with flat sides and rounded ends carries negative charge, shown as minus signs on its surface. The charge is computed for a conductor at uniform potential, so the signs crowd together around the curved ends and are spread out along the flat sides.</desc>
