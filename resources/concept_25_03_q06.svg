<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc">
<title id="title">Why legs look short in a pool</title>
<desc id="desc">A person standing in a pool, seen by an observer at the side of the pool. Rays from the feet bend away from the perpendicular as they leave the water, so the observer traces them back to an image of the feet higher than the real feet. The legs below the surface appear shortened to about three quarters of their real length.</desc>
