<title id="title">Flow speeds up where a tube narrows</title>
<desc id="desc">Fluid flows to the right through a tube that narrows from area A1 at point 1 to area A2 at point 2. Shaded volumes of the same size are shown at each point; the one in the narrow part is longer. For the same volume to pass both points in the same time, A1v1 = A2v2, so the speed v2 in the narrow part is greater than v1.</desc>
