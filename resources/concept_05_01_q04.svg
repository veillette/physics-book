<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
<title id="title">Friction force during stick–slip motion</title>
<desc id="desc">Friction force on the chalk versus time. During each stick phase the static friction grows until it reaches the maximum μs N; the chalk then breaks loose and the friction drops to the smaller kinetic value μk N while it slips. The chalk sticks again and the cycle repeats rapidly, producing a sawtooth pattern whose vibration is heard as a screech.</desc>
<rect width="600" height="360" fill="#ffffff"/>
<line x1="80" y1="280" x2="555" y2="280" stroke="#333333" stroke-width="1.5"/>
<polygon points="564,280 554,284 554,276" fill="#333333"/>
<line x1="80" y1="280" x2="80" y2="25" stroke="#333333" stroke-width="1.5"/>
<polygon points="80,16 84,26 76,26" fill="#333333"/>
<text x="315" y="319.6" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Time</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">t</tspan></text>
<text x="50" y="160.6" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle" transform="rotate(-90 50 155)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Friction</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">force</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">f</tspan></text>
<line x1="80" y1="80" x2="550" y2="80" stroke="#666666" stroke-width="1.2" stroke-dasharray="6 4"/>
<line x1="80" y1="160" x2="550" y2="160" stroke="#666666" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="556" y="85.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">μ</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">s</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">N</tspan></text>
<text x="556" y="165.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">μ</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">k</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">N</tspan></text>
<polyline points="80,280 155.2,80 157.55,160 197.5,160 244.5,80 246.85,160 286.8,160 333.8,80 336.15,160 376.1,160 423.1,80 425.45,160 465.4,160" fill="none" stroke="#c62828" stroke-width="3" stroke-linejoin="round"/>
<text x="213.95" y="104.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">stick</tspan></text>
<text x="246.85" y="184.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">slip</tspan></text>
</svg>
