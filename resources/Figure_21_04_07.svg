<title id="title">Effect of ammeter resistance on the circuit</title>
<desc id="desc">(a) Desired: an ammeter in series with R, where the ammeter resistance is much smaller than R, so the total is approximately R. (b) To be avoided: an ammeter whose resistance equals R, so the total R + R equals 2R.</desc>
