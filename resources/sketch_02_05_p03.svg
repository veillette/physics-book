<rect x="70" y="98" width="360" height="24" fill="none" stroke="#8d6e63" stroke-width="1.5"/>
<text x="250" y="92.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">barrel</tspan></text>
