<text x="430" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">t</tspan><tspan font-style="normal"> = 8.10 × 10</tspan><tspan font-size="11.2" dy="-6.4"><tspan font-style="normal">-4</tspan></tspan><tspan dy="6.4">​</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">s</tspan></text>
<text x="430" y="226.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-style="normal"> = ?</tspan></text>
