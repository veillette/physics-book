<svg xmlns="http://www.w3.org/2000/svg" width="600" height="248" viewBox="0 0 600 248" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the bullet in the gun barrel</title>
<desc id="desc">A horizontal +x axis points along the barrel toward the muzzle, with the origin at the firing chamber. Start: t = 0, v_0 = 0. At the muzzle: t = 8.10 × 10⁻⁴ s, v unknown. The acceleration a = +6.20 × 10⁵ m/s² points in +x.</desc>
<rect width="600" height="248" fill="#ffffff"/>
<line x1="30" y1="122" x2="540" y2="122" stroke="#8d6e63" stroke-width="2.2"/>
<line x1="30" y1="156" x2="520" y2="156" stroke="#555555" stroke-width="1.6"/>
<polygon points="530,156 519,160.4 519,151.6" fill="#555555"/>
<text x="546" y="161.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="530" y="180.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">toward</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">the</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">muzzle</tspan><tspan font-style="normal">)</tspan></text>
<line x1="90" y1="151" x2="90" y2="161" stroke="#555555" stroke-width="1.6"/>
<text x="90" y="177.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">0</tspan></text>
<circle cx="90" cy="110" r="7" fill="#1f3a5f"/>
<text x="90" y="144.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f3a5f" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">bullet</tspan></text>
<text x="90" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">t</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 0</tspan></text>
<text x="90" y="226.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 0</tspan></text>
<line x1="90" y1="151" x2="90" y2="161" stroke="#555555" stroke-width="1.6"/>
<circle cx="430" cy="110" r="7" fill="#1f3a5f"/>
<line x1="430" y1="72" x2="488.4" y2="72" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="500,72 487.4,77.04 487.4,66.96" fill="#3f8a1e"/>
