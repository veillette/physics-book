<title id="title">Sketch of the coin falling in the moving airplane (Earth frame)</title>
<desc id="desc">Earth frame: axes with +x in the airplane’s direction of motion and +y up, origin where the coin is released. The coin starts with the airplane’s horizontal velocity, v_0x = +260 m/s, and v_0y = 0; it falls 1.50 m to the floor (y = −1.50 m) while moving an unknown horizontal distance x. The acceleration is a_y = −9.80 m/s², a_x = 0. The vertical scale is greatly exaggerated.</desc>
