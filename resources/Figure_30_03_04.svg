<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
<title id="title">Bohr’s quantized orbits</title>
<desc id="desc">Allowed electron orbits around a nucleus, with radii in proportion to n² for n = 1 to 5. An electron dropping from orbit E4 to E2, or from an outer orbit Ei to the innermost orbit Ef, gives up the difference in energy as a photon of frequency f, with ΔE = Ei − Ef = hf.</desc>
