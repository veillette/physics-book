<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="235" viewBox="0 0 1000 235" role="img" aria-labelledby="title desc">
<title id="title">Substructure of matter from solid to quark</title>
<desc id="desc">A chain of ever smaller structures, each an enlarged piece of the one before: a solid block; a molecule, about 10^−9 m; an atom, about 10^−10 m, with electrons orbiting a tiny nucleus; a nucleus of protons and neutrons, 10^−14 to 10^−15 m; a nucleon, about 10^−15 m, made of three quarks bound by gluons; and a quark, smaller than 10^−18 m, with a gluon.</desc>
