<title id="title">Slope of the position graph at P and Q</title>
<desc id="desc">Position of the jet car, x = 200 + 15t + 2.5t² m, with tangent lines at P (t = 10 s) and at Q (t = 25 s). The tangent at Q runs from 1300 m at 19 s to 3120 m at 32 s, a slope of 140 m/s. A table lists t (s) and x (m): 0, 200; 5, 338; 10, 600; 15, 988; 20, 1500; 25, 2138; 30, 2900.</desc>
