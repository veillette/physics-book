<svg xmlns="http://www.w3.org/2000/svg" width="620" height="500" viewBox="0 0 620 500" role="img" aria-labelledby="title desc">
<title id="title">The law of reflection</title>
<desc id="desc">A ray strikes a flat surface and reflects. The incident ray makes angle θi with the perpendicular to the surface at the point where it strikes, and the reflected ray makes angle θr with the same perpendicular, on the other side; θr = θi.</desc>
