<svg xmlns="http://www.w3.org/2000/svg" width="580" height="960" viewBox="0 0 580 960" role="img" aria-labelledby="title desc">
<title id="title">A simple circuit and its schematic</title>
<desc id="desc">(a) A battery of voltage V lights a headlight through two wires. Conventional current I leaves the positive terminal, goes up through one wire and the headlight, and returns down the other wire to the negative terminal. (b) The schematic of the same circuit: the battery is the pair of parallel red lines, the wires are straight lines, and the load is a zigzag resistor. Current I circulates clockwise, out of the positive terminal and through the load.</desc>
