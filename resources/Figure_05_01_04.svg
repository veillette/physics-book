<svg xmlns="http://www.w3.org/2000/svg" width="900" height="880" viewBox="0 0 900 880" role="img" aria-labelledby="title desc">
<title id="title">Real contact between rough surfaces grows with the normal force</title>
<desc id="desc">Two pairs of blocks with rough faces are pressed together by normal forces N. With a small normal force only a few high points touch, so the area of actual contact (dark segments) is a small part of the total area. With a larger normal force, drawn with longer arrows, the high points flatten and many more patches touch, so the contact area and the friction are larger.</desc>
