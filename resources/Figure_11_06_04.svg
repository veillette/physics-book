<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" role="img" aria-labelledby="title desc">
<title id="title">A mercury barometer</title>
<desc id="desc">A glass tube, closed at the top, stands upside down in a dish of mercury, Hg. The space above the mercury in the tube is a vacuum, with absolute pressure zero. Atmospheric pressure P_atm pushing on the open mercury holds the column up to a height h, where the pressure due to the mercury’s weight, P_abs = hρg, equals P_atm.</desc>
