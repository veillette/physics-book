<svg xmlns="http://www.w3.org/2000/svg" width="600" height="269" viewBox="0 0 600 269" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the fireworks shell in its launch tube</title>
<desc id="desc">A +x axis points along the launch tube in the direction the shell moves, with the origin where the shell starts from rest. Start: t = 0, x_0 = 0, v_0 = 0. At the end of the tube: x = 0.250 m, v = +65.0 m/s, t unknown. The acceleration, unknown, points in +x.</desc>
