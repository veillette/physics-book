<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="530" viewBox="0 0 1010 530" role="img" aria-labelledby="title desc">
<title id="title">A small object scattering from a massive cube</title>
<desc id="desc">Before: mass m1 moves to the right with velocity v1 along a horizontal line a distance b, the impact parameter, above the center of a massive cube M2 at rest (v2 = 0). The cube is turned so the face that m1 strikes slopes up at 30°. After: m1 leaves along a line at angle θ1 = ? above its incoming direction with velocity v1′, while the cube stays essentially at rest (v2′ ≈ 0). An x–y axis indicator shows x to the right and y up.</desc>
