<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the palm tree struck by the ball</title>
<desc id="desc">The tree pivots about its base at ground level (the origin). +x points in the direction the ball was moving and +y up, and counterclockwise torques are positive. The ball pushes the top of the tree along +x with F_ball = 250 N, 2.0 m above the base (clockwise torque); the soil pushes the root tip along +x with F_root, 0.20 m below the base (counterclockwise torque).</desc>
