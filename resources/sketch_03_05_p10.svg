<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the falling sandal in the ship frame and the shore frame</title>
<desc id="desc">Two side views with +x horizontal in the ship’s direction of motion (south) and +y up, origin on the deck at the foot of the mast; the sandal starts at y_0 = 15.0 m. (a) Ship frame: v_0 = 0 and the sandal falls straight down to the deck. (b) Shore frame: the sandal starts with the ship’s velocity, v_0x = +1.75 m/s, and follows a parabola, landing at the foot of the mast, which has moved forward with the ship. In both, a_y = −9.80 m/s².</desc>
