<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
<title id="title">A barrier suppresses transmission without changing energy</title>
<desc id="desc">A rectangular potential barrier of height V exceeds a horizontal constant particle energy E. Its width is a. Transmission decreases exponentially with width and with the square root of mass and V minus E; energy is conserved.</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172b45"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1763a6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad4d12"/></marker></defs>
<rect width="960" height="530" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<text x="480" y="36" font-size="25" fill="#172b45" text-anchor="middle" font-weight="bold">A barrier suppresses transmission without changing energy</text>
<text x="480" y="78" font-size="20" fill="#526176" text-anchor="middle" font-weight="normal">Rectangular-barrier model; the particle energy E stays constant.</text><rect x="350" y="124" width="245" height="225" rx="4" fill="#edf4fa" stroke="none"/><path d="M85 349L885 349" fill="none" stroke="#172b45" stroke-width="2" marker-end="url(#ink)"/><path d="M85 365L85 105" fill="none" stroke="#172b45" stroke-width="2" marker-end="url(#ink)"/><text x="50" y="113" font-size="18" fill="#172b45" text-anchor="start" font-weight="normal">Energy</text><path d="M100 349H350V135H595V349H865" fill="none" stroke="#172b45" stroke-width="3"/><path d="M100 246L865 246" fill="none" stroke="#ad4d12" stroke-width="2" stroke-dasharray="7 6"/><text x="880" y="252" font-size="21" fill="#ad4d12" text-anchor="start" font-weight="normal">E</text><text x="611" y="143" font-size="22" fill="#172b45" text-anchor="start" font-weight="normal">V</text><text x="473" y="116" font-size="22" fill="#172b45" text-anchor="middle" font-weight="normal">V &gt; E</text><path d="M355 380L590 380" fill="none" stroke="#172b45" stroke-width="2"/><path d="M355 373L355 387" fill="none" stroke="#172b45" stroke-width="2"/><path d="M590 373L590 387" fill="none" stroke="#172b45" stroke-width="2"/><text x="473" y="411" font-size="20" fill="#172b45" text-anchor="middle" font-weight="normal">Barrier width a</text><text x="198" y="191" font-size="20" fill="#172b45" text-anchor="middle" font-weight="normal">Incident region</text><text x="744" y="191" font-size="20" fill="#172b45" text-anchor="middle" font-weight="normal">Transmitted region</text><text x="473" y="292" font-size="20" fill="#172b45" text-anchor="middle" font-weight="normal">Classically forbidden</text><text x="480" y="458" font-size="24" fill="#172b45" text-anchor="middle" font-weight="normal">For a thick barrier: T ∝ exp(−2κa),   κ = √[2m(V − E)] / ℏ</text><text x="480" y="499" font-size="20" fill="#172b45" text-anchor="middle" font-weight="normal">Greater mass or width suppresses transmission exponentially; no energy is borrowed.</text>
</g>
</svg>
