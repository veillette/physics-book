<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">Huygens’s principle and refraction</title>
<desc id="desc">A wavefront strikes the surface between medium 1 and medium 2 at an angle. In medium 2 the wave is slower, so the wavelet spreading from a point on the surface travels only v2t in the time the wave travels v1t in medium 1. The wavefront bends, and the ray, perpendicular to the wavefronts, refracts from angle θ1 to angle θ2 measured from the perpendicular to the surface.</desc>
