<svg xmlns="http://www.w3.org/2000/svg" width="640" height="920" viewBox="0 0 640 920" role="img" aria-labelledby="title desc">
<title id="title">Pair production and annihilation</title>
<desc id="desc">(a) A burst of energy E is converted into matter: an electron e− and an antielectron e+ fly apart from the point where the energy arrives. The mass created is Δm = 2me = E/c². The total charge is zero before and after. (b) An electron and an antielectron collide and annihilate, leaving a burst of energy E. Again the total charge is zero before and after.</desc>
