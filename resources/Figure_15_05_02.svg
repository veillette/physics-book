<svg xmlns="http://www.w3.org/2000/svg" width="600" height="660" viewBox="0 0 600 660" role="img" aria-labelledby="title desc">
<title id="title">Components of a heat pump</title>
<desc id="desc">A heat pump circuit. The working fluid leaves the compressor (4) hot, gives off heat Q_h inside at the condenser (1), passes through the expansion valve (2), and, now cold, absorbs heat Q_c from the outside air at the evaporator (3), outside the wall, before returning to the compressor.</desc>
