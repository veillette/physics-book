<svg xmlns="http://www.w3.org/2000/svg" width="600" height="362" viewBox="0 0 600 362" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagrams of the lunar module</title>
<desc id="desc">Two free-body diagrams with +x to the right and +y up. (a) On the Moon: thrust T up, larger than the weight w Moon pointing down; the acceleration a points up. (b) On Earth, sitting on the ground: thrust T up and normal force N up together balance the weight w Earth pointing down, so a = 0.</desc>
<rect width="600" height="362" fill="#ffffff"/>
<g transform="translate(0 0)">
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222">(a) Moon: liftoff</text>
<g transform="translate(0 22)">
<line x1="40" y1="185" x2="241" y2="185" stroke="#555555" stroke-width="1.5"/><polygon points="250,185 240,189.2 240,180.8" fill="#555555"/>
<line x1="140" y1="305" x2="140" y2="74" stroke="#555555" stroke-width="1.5"/><polygon points="140,65 144.2,75 135.8,75" fill="#555555"/>
<line x1="140" y1="185" x2="140" y2="96" stroke="#b03a2e" stroke-width="3.5"/><polygon points="140,85 145.04,97 134.96,97" fill="#b03a2e"/>
<line x1="140" y1="185" x2="140" y2="229" stroke="#b03a2e" stroke-width="3.5"/><polygon points="140,240 134.96,228 145.04,228" fill="#b03a2e"/>
<line x1="70" y1="125" x2="70" y2="91" stroke="#1e8449" stroke-width="3"/><polygon points="70,80 75.04,92 64.96,92" fill="#1e8449"/>
<circle cx="140" cy="185" r="6" fill="#1f3a5f"/>
<text x="150" y="205" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="start">module</text>
<text x="266" y="191" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="140" y="55" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="152" y="104" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">T</tspan></text>
<text x="152" y="235" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan><tspan font-style="normal" font-size="14" dy="6">Moon</tspan><tspan dy="-6"></tspan></text>
<text x="82" y="99" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="start" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
</g>
</g>
<line x1="300" y1="10" x2="300" y2="352" stroke="#cccccc" stroke-width="1"/>
<g transform="translate(300 0)">
<text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222">(b) Earth: on the ground</text>
<g transform="translate(0 22)">
<line x1="50" y1="185" x2="251" y2="185" stroke="#555555" stroke-width="1.5"/><polygon points="260,185 250,189.2 250,180.8" fill="#555555"/>
<line x1="150" y1="305" x2="150" y2="74" stroke="#555555" stroke-width="1.5"/><polygon points="150,65 154.2,75 145.8,75" fill="#555555"/>
<line x1="143" y1="185" x2="143" y2="166" stroke="#b03a2e" stroke-width="3.5"/><polygon points="143,155 148.04,167 137.96,167" fill="#b03a2e"/>
<line x1="157" y1="185" x2="157" y2="126" stroke="#b03a2e" stroke-width="3.5"/><polygon points="157,115 162.04,127 151.96,127" fill="#b03a2e"/>
<line x1="150" y1="185" x2="150" y2="274" stroke="#b03a2e" stroke-width="3.5"/><polygon points="150,285 144.96,273 155.04,273" fill="#b03a2e"/>
<circle cx="150" cy="185" r="6" fill="#1f3a5f"/>
<text x="160" y="205" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="start">module</text>
<text x="276" y="191" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="150" y="55" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="107" y="178" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">T</tspan></text>
<text x="169" y="134" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">N</tspan></text>
<text x="162" y="280" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan><tspan font-style="normal" font-size="14" dy="6">Earth</tspan><tspan dy="-6"></tspan></text>
<text x="80" y="101" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-style="normal"> = 0</tspan></text>
</g>
</g>
</svg>
