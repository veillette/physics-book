<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">A two-dimensional collision</title>
<desc id="desc">Before: mass m1 moves along the x axis with velocity v1 toward m2, which is at rest (v2 = 0), so p1 = ptot; net F = 0. After: m1 moves off with velocity v1′ at angle θ1 above the x axis and m2 moves off with velocity v2′ at angle θ2 below it, so p1′ + p2′ = ptot. The system of interest is circled before and after the collision. An x–y axis indicator shows x to the right and y up.</desc>
