<svg xmlns="http://www.w3.org/2000/svg" width="520" height="270" viewBox="0 0 520 270" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the toy car coasting up the track</title>
<desc id="desc">A vertical +y axis points up, with y = 0 at the car’s starting level and a tick at 0.180 m. The car starts with v_0 = 2.00 m/s and coasts up the frictionless track to a point 0.180 m higher, where its speed v_f is unknown.</desc>
<rect width="520" height="270" fill="#ffffff"/>
<line x1="60" y1="250" x2="60" y2="44" stroke="#555555" stroke-width="1.6"/>
<polygon points="60,34 64.4,45 55.6,45" fill="#555555"/>
<text x="60" y="21.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="76" y="20.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">up</tspan><tspan font-style="normal">)</tspan></text>
<line x1="55" y1="220" x2="65" y2="220" stroke="#555555" stroke-width="1.6"/>
<text x="50" y="224.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">0</tspan></text>
<line x1="55" y1="110" x2="65" y2="110" stroke="#555555" stroke-width="1.6"/>
<text x="50" y="114.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">0.180 </tspan><tspan font-style="normal">m</tspan></text>
<path d="M 90 228 L 200 228 C 280 228 300 118 380 118 L 490 118" fill="none" stroke="#8d6e63" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="66" y1="220" x2="120" y2="220" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="66" y1="110" x2="410" y2="110" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<circle cx="140" cy="220" r="7" fill="#1f3a5f"/>
<text x="140" y="248.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f3a5f" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">toy</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">car</tspan></text>
<line x1="140" y1="196" x2="188.4" y2="196" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="200,196 187.4,201.04 187.4,190.96" fill="#3f8a1e"/>
<text x="170" y="187.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 2.00 </tspan><tspan font-style="normal">m/s</tspan></text>
<circle cx="440" cy="110" r="7" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<line x1="440" y1="86" x2="458.4" y2="86" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="470,86 457.4,91.04 457.4,80.96" fill="#3f8a1e"/>
<text x="455" y="75.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">f</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = ?</tspan></text>
<text x="330" y="214.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">frictionless</tspan></text>
</svg>
