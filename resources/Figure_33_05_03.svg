<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
<title id="title">Electrons scattering from quarks in a proton</title>
<desc id="desc">Five high-energy electrons enter a proton from the left. Two pass straight through. The other three strike the proton’s point-like quarks, two up quarks and a down quark, and are scattered through large angles, showing that the proton has internal structure.</desc>
