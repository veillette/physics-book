<svg xmlns="http://www.w3.org/2000/svg" width="620" height="330" viewBox="0 0 620 330" role="img" aria-labelledby="title desc">
<title id="title">An ammeter built from a galvanometer and a shunt resistance</title>
<desc id="desc">Current I_tot enters on the left and divides. A small current I_G passes through the galvanometer G and its internal resistance r on the upper branch; most of the current, I, passes through the small shunt resistance R on the lower branch. The currents rejoin as I_tot on the right.</desc>
