<svg xmlns="http://www.w3.org/2000/svg" width="520" height="190" viewBox="0 0 520 190" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the airliner and the tailwind</title>
<desc id="desc">Axes with +x east and +y north. The airplane’s velocity relative to the air, v_p/a = 280 m/s, points east. Its velocity relative to the ground, v_p/G = 3000 km / 1.50 h, points 5° south of east. The wind v_a/G = v_p/G − v_p/a, drawn from the tip of v_p/a to the tip of v_p/G, is unknown.</desc>
