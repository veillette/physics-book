<svg xmlns="http://www.w3.org/2000/svg" width="620" height="330" viewBox="0 0 620 330" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the rescue sled lowered down the slope</title>
<desc id="desc">A 60.0° slope descends to the right. Tilted axes: +x points down the slope, the direction of motion, and +y points perpendicular to the slope, away from it. Forces on the sled: rope tension T and friction f point up the slope (−x), the normal force N along +y, and the weight w straight down, whose component along +x is mg sin 60.0°. The displacement d = 30.0 m points along +x; the speed is constant.</desc>
