<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">Torricelli outflow from a large open reservoir</title>
<desc id="desc">Water drains from a small side opening into the atmosphere. The large free surface is at height h1 and the outlet center at h2, with h=h1-h2. Both have atmospheric pressure. Negligible free-surface speed and negligible losses give outlet speed square root of 2gh. A schematic parabolic jet leaves the outlet horizontally.</desc>
