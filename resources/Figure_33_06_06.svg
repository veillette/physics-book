<svg xmlns="http://www.w3.org/2000/svg" width="875" height="550" viewBox="0 0 875 550" role="img" aria-labelledby="title desc">
<title id="title">A cosmic-ray air shower</title>
<desc id="desc">An extremely energetic cosmic ray enters the Earth’s atmosphere and collides with a nucleus high above the ground, creating a spray of particles. Each of these creates further particles, so a shower spreading over a large area reaches the Earth’s surface.</desc>
