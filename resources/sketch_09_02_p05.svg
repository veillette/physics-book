<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the seesaw and both children</title>
<desc id="desc">The seesaw and both children form the system, with torques taken about the pivot (the origin). +x points from the pivot toward the heavier child and +y up, and counterclockwise torques are positive. The lighter child’s weight w_1 = 255 N acts down 1.60 m left of the pivot and the seesaw’s weight w_s = 118 N acts down 0.160 m left of the pivot (both counterclockwise torques); the heavier child’s weight w_2 = 314 N acts down at the unknown distance r_2 right of the pivot (clockwise torque); the pivot pushes up on the seesaw with F_p.</desc>
