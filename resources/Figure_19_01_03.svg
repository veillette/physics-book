<svg xmlns="http://www.w3.org/2000/svg" width="540" height="800" viewBox="0 0 540 800" role="img" aria-labelledby="title desc">
<title id="title">An electron gun</title>
<desc id="desc">Two vertical metal plates. Plate A on the left is negative and plate B on the right is positive, with a small hole in its middle. The electric field lines run straight from B to A, pointing left, and bow outward at the top and bottom ends. An electron e⁻ starts next to plate A, is accelerated to the right through the hole in B, and leaves with kinetic energy KE = qV.</desc>
