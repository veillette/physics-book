<svg xmlns="http://www.w3.org/2000/svg" width="620" height="340" viewBox="0 0 620 340" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagrams for the two-segment pulley</title>
<desc id="desc">Two free-body diagrams with +y up. Lower pulley and engine: two rope segments pull up, each with tension T, and the weight W = 1127 N pulls down. Upper pulley: the two segments to the lower pulley and the segment you pull straight down all pull down with T, and the ceiling pushes up with F_ceiling.</desc>
<rect width="620" height="340" fill="#ffffff"/>
<line x1="40" y1="300" x2="40" y2="259" stroke="#555555" stroke-width="1.5"/>
<polygon points="40,250 44,260 36,260" fill="#555555"/>
<text x="40" y="239.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="54" y="238.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">up</tspan><tspan font-style="normal">)</tspan></text>
<text x="70" y="30.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">lower</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">pulley</tspan><tspan font-style="normal"> + </tspan><tspan font-style="normal">engine</tspan></text>
<line x1="162" y1="170" x2="162" y2="91.6" stroke="#b03a2e" stroke-width="3"/>
<polygon points="162,80 167.04,92.6 156.96,92.6" fill="#b03a2e"/>
<line x1="178" y1="170" x2="178" y2="91.6" stroke="#b03a2e" stroke-width="3"/>
<polygon points="178,80 183.04,92.6 172.96,92.6" fill="#b03a2e"/>
<text x="194" y="95.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">2</tspan><tspan font-style="italic">T</tspan></text>
<line x1="170" y1="170" x2="170" y2="268.4" stroke="#b03a2e" stroke-width="3"/>
<polygon points="170,280 164.96,267.4 175.04,267.4" fill="#b03a2e"/>
<text x="180" y="279.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">W</tspan><tspan font-style="normal"> = 1127 </tspan><tspan font-style="normal">N</tspan></text>
<circle cx="170" cy="170" r="6" fill="#1f3a5f"/>
<line x1="330" y1="20" x2="330" y2="320" stroke="#cccccc" stroke-width="1"/>
<text x="350" y="30.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">upper</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">pulley</tspan></text>
<line x1="470" y1="170" x2="470" y2="71.6" stroke="#b03a2e" stroke-width="3"/>
<polygon points="470,60 475.04,72.6 464.96,72.6" fill="#b03a2e"/>
<text x="480" y="75.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">ceiling</tspan></tspan><tspan dy="-4.48">​</tspan></text>
<line x1="454" y1="170" x2="454" y2="208.4" stroke="#b03a2e" stroke-width="3"/>
<polygon points="454,220 448.96,207.4 459.04,207.4" fill="#b03a2e"/>
<line x1="470" y1="170" x2="470" y2="208.4" stroke="#b03a2e" stroke-width="3"/>
<polygon points="470,220 464.96,207.4 475.04,207.4" fill="#b03a2e"/>
<line x1="486" y1="170" x2="486" y2="208.4" stroke="#b03a2e" stroke-width="3"/>
<polygon points="486,220 480.96,207.4 491.04,207.4" fill="#b03a2e"/>
<text x="506" y="219.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">3</tspan><tspan font-style="italic">T</tspan></text>
<text x="470" y="270.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(2 </tspan><tspan font-style="normal">segments</tspan><tspan font-style="normal"> + </tspan><tspan font-style="normal">your</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">pull</tspan><tspan font-style="normal">)</tspan></text>
<circle cx="470" cy="170" r="6" fill="#1f3a5f"/>
</svg>
