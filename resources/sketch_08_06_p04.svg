<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the bowling ball scattering the pin</title>
<desc id="desc">Axes with +x along the ball’s initial velocity and +y perpendicular to it on the lane, origin at the collision. Before: the ball (5.50 kg) moves at 9.00 m/s along +x; the pin (0.850 kg) is at rest. After: the pin moves at 15.0 m/s at 85.0° above +x; the ball’s final velocity (magnitude v′ and angle θ, expected below +x) is unknown.</desc>
