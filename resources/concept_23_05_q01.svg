<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400" role="img" aria-labelledby="title desc">
<title id="title">Emfs in the sides of a generator loop</title>
<desc id="desc">Front view of a generator loop between N on the left and S on the right, with the field pointing right. The left side moves out of the page and the right side moves into the page. RHR-1 gives a force on positive charges up along the left side and down along the right side, so both emfs drive current the same way around the loop and add.</desc>
