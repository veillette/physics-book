<rect x="520" y="80" width="80" height="240" fill="#90a4ae" stroke="#222222" stroke-width="1.5"/>
<text x="560" y="209.1" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">S</tspan></text>
