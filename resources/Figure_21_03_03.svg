<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1040" viewBox="0 0 760 1040" role="img" aria-labelledby="title desc">
<title id="title">The loop rule</title>
<desc id="desc">(a) A series circuit: an 18 V emf with internal resistance r = 0.5 Ω drives a current I = 2.0 A clockwise through R1 = 6.0 Ω and R2 = 2.5 Ω. The potential is 0 V on the negative side of the emf and 18 V on its positive side, 17 V after r, 5 V after R1, and 0 V again after R2, so the 18 V rise is matched by drops of 1 V, 12 V and 5 V. (b) The same loop in perspective, with the height of a wall above each point of the circuit showing the potential there: the emf raises the charge from 0 to 18 V, and r, R1 and R2 lower it back to 0, like a roller coaster.</desc>
