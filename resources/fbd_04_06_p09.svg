<svg xmlns="http://www.w3.org/2000/svg" width="460" height="320" viewBox="0 0 460 320" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the sled seen from above</title>
<desc id="desc">Top-view free-body diagram with +x east (to the right) and +y north (up the page): F1 at 45 degrees above +x, F2 at 30 degrees below +x, and friction f pointing opposite the net pull, 12.4 degrees south of west. The acceleration points 12.4 degrees north of east. Vertical forces (weight and normal force) cancel and are not shown.</desc>
