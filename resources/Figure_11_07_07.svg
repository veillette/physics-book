<text x="500" y="71.3" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#657382" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Same</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">object</tspan><tspan font-style="normal">, </tspan><tspan font-style="normal">same</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">weight</tspan><tspan font-style="normal">; </tspan><tspan font-style="normal">equilibrium</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">in</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">both</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">panels</tspan><tspan font-style="normal">. </tspan><tspan font-style="normal">Air</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">buoyancy</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">is</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">neglected</tspan><tspan font-style="normal">.</tspan></text>
