<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">A submerged object has a smaller apparent weight</title>
<desc id="desc">Two spring balances support the same dense object. In air, tension equals weight with air buoyancy neglected. Submerged and not touching the beaker, the object has the same downward weight but also upward buoyancy, reducing the tension. A separate free-body diagram in each panel shows forces adding to zero.</desc>
