<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">Heat pump in a wall</title>
<desc id="desc">A heat pump set into a wall. Its outside coil, at T_c = −15 °C, is colder than the outside air at −5 °C, so heat Q_c flows in. Its inside coil, at T_h = 45 °C, is hotter than the inside air at 20 °C, so heat Q_h flows into the room. Work W comes from an electrical outlet.</desc>
