<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
<title id="title">Forces on an object falling through a viscous fluid</title>
<desc id="desc">An oval object of length L and density ρ_obj falls through a fluid of density ρ_fl. Three forces act on it: its weight w downward, the viscous drag F_V upward, and the buoyant force F_B upward. A free-body diagram beside it shows the same three forces; at terminal velocity they balance.</desc>
