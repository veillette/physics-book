<title id="title">Path-length difference from two slits</title>
<desc id="desc">Two slits S1 and S2 a distance d apart send rays ℓ1 and ℓ2 at the same angle θ to a distant point on a screen. Dropping a perpendicular from S1 to the lower ray marks off the extra distance the lower ray travels, Δℓ = d sin θ.</desc>
