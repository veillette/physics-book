<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" role="img" aria-labelledby="title desc">
<title id="title">Apparent depth of an object under water</title>
<desc id="desc">A stone on the bottom of a pond, 2.00 meters deep. Two rays from the stone bend away from the perpendicular as they leave the water and enter an observer’s eye. Traced straight back, the rays appear to come from a point 1.50 meters below the surface, so the stone appears shallower than it is.</desc>
