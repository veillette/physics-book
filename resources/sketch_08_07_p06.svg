<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" viewBox="0 0 520 330" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the rocket accelerating at 7g</title>
<desc id="desc">A vertical +y axis points up. The thrust F_thrust on the rocket points along +y; the weight mg points along −y; the exhaust gas leaves along −y at v_e = 2.40 × 10³ m/s. The acceleration a = 7g = +68.6 m/s² points along +y.</desc>
<rect width="520" height="330" fill="#ffffff"/>
<line x1="60" y1="310" x2="60" y2="40" stroke="#555555" stroke-width="1.6"/>
<polygon points="60,30 64.4,41 55.6,41" fill="#555555"/>
<text x="60" y="17.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="76" y="16.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">up</tspan><tspan font-style="normal">)</tspan></text>
<polygon points="200,70 218,100 218,200 182,200 182,100" fill="#d6e4f0" stroke="#1f3a5f" stroke-width="2"/>
<polygon points="188,200 212,200 200,240" fill="#f5b041" stroke="#d35400" stroke-width="1.5"/>
<line x1="234" y1="150" x2="234" y2="81.6" stroke="#b03a2e" stroke-width="3"/>
<polygon points="234,70 239.04,82.6 228.96,82.6" fill="#b03a2e"/>
<text x="246" y="97.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">thrust</tspan></tspan><tspan dy="-4.48">​</tspan></text>
<line x1="234" y1="160" x2="234" y2="198.4" stroke="#b03a2e" stroke-width="3"/>
<polygon points="234,210 228.96,197.4 239.04,197.4" fill="#b03a2e"/>
<text x="246" y="211.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">mg</tspan></text>
<line x1="160" y1="220" x2="160" y2="278.4" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="160,290 154.96,277.4 165.04,277.4" fill="#3f8a1e"/>
<text x="150" y="275.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">e</tspan></tspan><tspan dy="-4.48">​</tspan></text>
<text x="160" y="308.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">exhaust</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">gas</tspan></text>
<line x1="140" y1="130" x2="140" y2="91.6" stroke="#6a3d9a" stroke-width="3"/>
<polygon points="140,80 145.04,92.6 134.96,92.6" fill="#6a3d9a"/>
<text x="130" y="109.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#6a3d9a" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
<text x="330" y="125.25" font-family="'Times New Roman', Times, serif" font-size="15" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">m</tspan><tspan font-style="normal"> = 75 000 </tspan><tspan font-style="normal">kg</tspan></text>
<text x="330" y="147.25" font-family="'Times New Roman', Times, serif" font-size="15" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="10.5" dy="4.2"><tspan font-style="normal">e</tspan></tspan><tspan dy="-4.2">​</tspan><tspan font-style="normal"> = 2.40 × 10</tspan><tspan font-size="10.5" dy="-6"><tspan font-style="normal">3</tspan></tspan><tspan dy="6">​</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">m/s</tspan></text>
<text x="330" y="169.25" font-family="'Times New Roman', Times, serif" font-size="15" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan font-style="normal"> = 7</tspan><tspan font-style="italic">g</tspan><tspan font-style="normal"> = +68.6 </tspan><tspan font-style="normal">m/s</tspan><tspan font-size="10.5" dy="-6"><tspan font-style="normal">2</tspan></tspan><tspan dy="6">​</tspan></text>
<text x="330" y="191.25" font-family="'Times New Roman', Times, serif" font-size="15" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Δ</tspan><tspan font-style="italic">m</tspan><tspan font-style="normal">/</tspan><tspan font-style="normal">Δ</tspan><tspan font-style="italic">t</tspan><tspan font-style="normal"> = ?</tspan></text>
</svg>
