<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
<title id="title">Ray diagram: object between f and 2f of a converging lens</title>
<desc id="desc">Ray diagram for a converging lens with focal length 10 centimeters and an object 15 centimeters away, between f and 2f. Three principal rays from the tip of the object meet 30 centimeters on the other side of the lens, forming a real, inverted image twice as tall as the object.</desc>
