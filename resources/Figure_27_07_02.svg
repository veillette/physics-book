<svg xmlns="http://www.w3.org/2000/svg" width="520" height="780" viewBox="0 0 520 780" role="img" aria-labelledby="title desc">
<title id="title">Reflection from a thin film</title>
<desc id="desc">Light in medium n1 strikes a thin film of thickness t and index n2 lying on medium n3. Ray 1 reflects from the top surface of the film; the rest refracts into the film, reflects from its bottom surface and comes back out as ray 2, parallel to ray 1. The two rays interfere.</desc>
