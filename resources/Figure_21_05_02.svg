<svg xmlns="http://www.w3.org/2000/svg" width="820" height="740" viewBox="0 0 820 740" role="img" aria-labelledby="title desc">
<title id="title">The potentiometer, a null measurement device</title>
<desc id="desc">(a) A source of emf with internal resistance r passes a constant current I through a long wire resistor R. (b) An unknown emf_x, in series with a galvanometer G and its resistance rG, is connected from the left end of R to a sliding contact. The contact is moved until G reads zero; then emf_x = I R_x, where R_x is the resistance between the left end and the contact.</desc>
