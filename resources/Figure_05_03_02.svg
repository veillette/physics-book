<svg xmlns="http://www.w3.org/2000/svg" width="780" height="650" viewBox="0 0 780 650" role="img" aria-labelledby="title desc">
<title id="title">Equal loads stretch three strings by different amounts</title>
<desc id="desc">Strings of the same initial length L₀ support equal weights. Thin nylon stretches most, thicker nylon stretches less, and steel stretches least. The shaded extensions are below a common initial-length reference line. Upward support forces and downward weights have equal magnitude.</desc>
