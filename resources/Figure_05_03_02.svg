<line x1="90" y1="395" x2="700" y2="395" stroke="#666666" stroke-width="1.3" stroke-dasharray="6 5"/>
<text x="190" y="39" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Thin</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">nylon</tspan></text>
