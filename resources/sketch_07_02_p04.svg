<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the car brought to rest</title>
<desc id="desc">A horizontal +x axis points in the direction the car moves, with the origin where the stopping force starts to act. The car starts with v_0 = +25.0 m/s (90.0 km/h) and stops (v = 0) after a distance d: 120 m in part (a), 2.00 m in part (b). The stopping force F on the car points along −x, opposite to the displacement.</desc>
<rect width="600" height="260" fill="#ffffff"/>
<line x1="40" y1="128" x2="470" y2="128" stroke="#8d6e63" stroke-width="2.2"/>
<line x1="40" y1="170" x2="450" y2="170" stroke="#555555" stroke-width="1.6"/>
<polygon points="460,170 449,174.4 449,165.6" fill="#555555"/>
<text x="468" y="175.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="468" y="192.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">direction</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">of</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">motion</tspan><tspan font-style="normal">)</tspan></text>
<line x1="90" y1="165" x2="90" y2="175" stroke="#555555" stroke-width="1.6"/>
<text x="90" y="191.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">0</tspan></text>
<line x1="420" y1="165" x2="420" y2="175" stroke="#555555" stroke-width="1.6"/>
<text x="420" y="191.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">d</tspan></text>
<polygon points="64,126 116,126 116,102 64,102" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<line x1="66" y1="86" x2="104.4" y2="86" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="116,86 103.4,91.04 103.4,80.96" fill="#3f8a1e"/>
<text x="91" y="75.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan></text>
<polygon points="229,126 281,126 281,102 229,102" fill="#d6e4f0" stroke="#1f3a5f" stroke-width="2"/>
<line x1="229" y1="114" x2="170.6" y2="114" stroke="#b03a2e" stroke-width="3"/>
<polygon points="159,114 171.6,108.96 171.6,119.04" fill="#b03a2e"/>
<text x="190" y="101.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan></text>
<polygon points="394,126 446,126 446,102 394,102" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<text x="90" y="150.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">start</tspan></text>
<text x="255" y="150.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">car</tspan><tspan font-style="normal"> (</tspan><tspan font-style="normal">braking</tspan><tspan font-style="normal">)</tspan></text>
<text x="420" y="150.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">stopped</tspan></text>
<text x="90" y="215.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = +25.0 </tspan><tspan font-style="normal">m/s</tspan></text>
<text x="255" y="215.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="italic">a</tspan><tspan font-style="normal">)  </tspan><tspan font-style="italic">d</tspan><tspan font-style="normal"> = 120 </tspan><tspan font-style="normal">m</tspan></text>
<text x="255" y="236.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="italic">b</tspan><tspan font-style="normal">)  </tspan><tspan font-style="italic">d</tspan><tspan font-style="normal"> = 2.00 </tspan><tspan font-style="normal">m</tspan></text>
<text x="420" y="215.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-style="normal"> = 0</tspan></text>
</svg>
