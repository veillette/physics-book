<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">Torque on a hockey stick about two pivots</title>
<desc id="desc">(a) A nail at A near the end of the blade is the pivot. A force F pushes left and slightly up on the shaft. r runs from A to the point of application, θ is the angle between F and the line from that point to A, and r⊥ is the perpendicular distance from A to the line of action of F. The stick would rotate counterclockwise about A. (b) With the nail at B near the top of the shaft and the same force applied below it, the perpendicular distance r⊥ runs down the shaft and the stick would rotate clockwise about B.</desc>
