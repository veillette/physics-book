<svg xmlns="http://www.w3.org/2000/svg" width="460" height="610" viewBox="0 0 460 610" role="img" aria-labelledby="title desc">
<title id="title">Pion exchange between a proton and a neutron</title>
<desc id="desc">Four snapshots, top to bottom, of a proton on the left and a neutron on the right. The proton creates a positive pion and becomes a neutron; the pion travels to the right and is absorbed by the neutron, which becomes a proton.</desc>
