<svg xmlns="http://www.w3.org/2000/svg" width="880" height="690" viewBox="0 0 880 690" role="img" aria-labelledby="title desc">
<g id="animation-paused"/>
<title id="title">Convection from a gravity furnace</title>
<desc id="desc">A room with a gravity furnace at the lower left. Hot air from the furnace rises along the left wall, crosses under the ceiling, cools, sinks along the right wall, and returns along the floor to the furnace, forming a convection loop.</desc>
