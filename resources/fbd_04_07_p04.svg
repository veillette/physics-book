<svg xmlns="http://www.w3.org/2000/svg" width="380" height="280" viewBox="0 0 380 280" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the dolphin</title>
<desc id="desc">Free-body diagram with +x in the direction of motion (to the right) and +y up: drag force F to the left, buoyant force F B up, weight w down; the dolphin moves to the right but slows down, so the acceleration points to the left.</desc>
<rect width="380" height="280" fill="#ffffff"/>
<line x1="40" y1="150" x2="346" y2="150" stroke="#555555" stroke-width="1.5"/><polygon points="355,150 345,154.2 345,145.8" fill="#555555"/>
<line x1="200" y1="255" x2="200" y2="54" stroke="#555555" stroke-width="1.5"/><polygon points="200,45 204.2,55 195.8,55" fill="#555555"/>
<line x1="200" y1="150" x2="200" y2="91" stroke="#b03a2e" stroke-width="3.5"/><polygon points="200,80 205.04,92 194.96,92" fill="#b03a2e"/>
<line x1="200" y1="150" x2="200" y2="209" stroke="#b03a2e" stroke-width="3.5"/><polygon points="200,220 194.96,208 205.04,208" fill="#b03a2e"/>
<line x1="200" y1="150" x2="151" y2="150" stroke="#b03a2e" stroke-width="3.5"/><polygon points="140,150 152,144.96 152,155.04" fill="#b03a2e"/>
<line x1="180" y1="65" x2="151" y2="65" stroke="#1e8449" stroke-width="3"/><polygon points="140,65 152,59.96 152,70.04" fill="#1e8449"/>
<circle cx="200" cy="150" r="6" fill="#1f3a5f"/>
<text x="210" y="176" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="start">dolphin</text>
<text x="371" y="156" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="200" y="35" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="212" y="99" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">B</tspan><tspan dy="-6"></tspan></text>
<text x="212" y="215" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan></text>
<text x="154" y="138" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan></text>
<text x="154" y="53" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
<text x="310" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle">moving → (slowing)</text>
</svg>
