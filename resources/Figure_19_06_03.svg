<text x="230" y="134.8" font-family="'Times New Roman', Times, serif" font-size="28" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">C</tspan><tspan font-size="19.6" dy="7.84"><tspan font-style="normal">3</tspan></tspan><tspan dy="-7.84">​</tspan></text>
