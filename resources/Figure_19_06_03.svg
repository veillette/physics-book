<text x="100" y="102" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">1 </tspan><tspan font-style="normal">μF</tspan></text>
<text x="40" y="194.8" font-family="'Times New Roman', Times, serif" font-size="28" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">C</tspan><tspan font-size="19.6" dy="7.84"><tspan font-style="normal">2</tspan></tspan><tspan dy="-7.84">​</tspan></text>
