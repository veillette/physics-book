<svg xmlns="http://www.w3.org/2000/svg" width="520" height="560" viewBox="0 0 520 560" role="img" aria-labelledby="title desc">
<title id="title">A hydrometer</title>
<desc id="desc">A glass hydrometer, air-filled and weighted with lead at the bottom, floats upright in a fluid. Its stem is marked with specific gravities from 0.65 at the top to 1.00 lower down; it floats highest in the densest fluids. Here the fluid surface crosses the stem at 0.87, the fluid’s specific gravity.</desc>
