<line x1="60" y1="230" x2="391" y2="230" stroke="#555555" stroke-width="1.5"/>
<polygon points="400,230 390,234 390,226" fill="#555555"/>
<text x="416" y="235.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<line x1="230" y1="270" x2="230" y2="39" stroke="#555555" stroke-width="1.5"/>
<polygon points="230,30 234,40 226,40" fill="#555555"/>
