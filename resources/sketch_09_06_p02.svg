<svg xmlns="http://www.w3.org/2000/svg" width="460" height="290" viewBox="0 0 460 290" role="img" aria-labelledby="title desc">
<title id="title">Vector diagram of the two muscle forces on the Achilles tendon</title>
<desc id="desc">Axes with +x to the right and +y up (along the leg). Each muscle pulls on the tendon with 200 N, one at 20° to the left of +y and one at 20° to the right of +y. Their x-components, −68.4 N and +68.4 N, cancel; their y-components add along +y.</desc>
