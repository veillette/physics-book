<text x="244" y="18.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">up</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">the</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">leg</tspan><tspan font-style="normal">)</tspan></text>
<line x1="230" y1="230" x2="179.24" y2="90.55" stroke="#b03a2e" stroke-width="3"/>
<polygon points="175.28,79.65 184.32,89.77 174.85,93.21" fill="#b03a2e"/>
<text x="170.83" y="71.15" font-family="'Times New Roman', Times, serif" font-size="16" fill="#b03a2e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">200 </tspan><tspan font-style="normal">N</tspan></text>
