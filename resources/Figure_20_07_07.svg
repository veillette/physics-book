<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" role="img" aria-labelledby="title desc">
<title id="title">Einthoven’s triangle and the heart’s voltage vector</title>
<desc id="desc">Electrodes RA (right arm) and LA (left arm) at the top corners and LL (left leg) at the bottom corner of a triangle around the heart. A wave of depolarization spreading from the top of the heart leaves its outer surface negative above the wavefront and positive below. The wave is represented by a voltage vector pointing down and slightly to the left of the page’s vertical. Each pair of electrodes measures the component of this vector along its side of the triangle: lead I along RA to LA, lead II along RA to LL, and lead III along LA to LL. Lead II, nearly parallel to the vector, records the largest signal.</desc>
