<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the train compressing the spring bumper</title>
<desc id="desc">A horizontal +x axis points in the direction the train moves, with the origin where the train first touches the spring. At first contact the train moves with v = +0.500 m/s. When it stops (v = 0), it has moved x = 0.400 m along +x and compressed the spring by that amount; the spring force on the train points along −x.</desc>
