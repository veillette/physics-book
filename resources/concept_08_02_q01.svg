<svg xmlns="http://www.w3.org/2000/svg" width="620" height="380" viewBox="0 0 620 380" role="img" aria-labelledby="title desc">
<title id="title">Force on a child’s head hitting tile and carpet</title>
<desc id="desc">Force versus time for a child’s head (3.0 kg at 3.0 m/s) stopping on a tile floor and on a padded carpet. Both pulses have the same area, the impulse 9.0 kg·m/s, because the change in momentum is the same. On tile the head stops in about 2 ms, so the force is a tall narrow spike with an average of 4500 N. On carpet it stops in about 20 ms, so the force is ten times smaller, about 450 N on average, spread over ten times as long.</desc>
