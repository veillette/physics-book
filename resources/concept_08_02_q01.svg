<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" aria-labelledby="title desc">
<title id="title">Equal net impulses for hard and compliant landings</title>
<desc id="desc">Net upward force, not floor contact force, versus time. Symmetric half-sine pulses stop a 3.0 kg point mass initially moving downward at 3.0 m/s. The tile pulse lasts 2 ms and averages 4500 N; the compliant pulse lasts 20 ms and averages 450 N. Each net impulse is 9.0 N s. Average floor forces additionally include the 29.4 N weight, giving 4529 N and 479 N.</desc>
