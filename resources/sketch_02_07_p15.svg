<svg xmlns="http://www.w3.org/2000/svg" width="540" height="340" viewBox="0 0 540 340" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the rock dropped into the well</title>
<desc id="desc">A vertical +y axis points down, with the origin at the top of the well where the rock is released. Release: t = 0, y_0 = 0, v_0 = 0. The water is at an unknown depth d. The rock falls for t_fall, then the splash sound travels back up at 332.00 m/s for t_sound; the total is 2.0000 s. The acceleration is a = +9.80 m/s² (downward).</desc>
