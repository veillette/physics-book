<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
<title id="title">Binding energy per nucleon</title>
<desc id="desc">Average binding energy per nucleon, BE/A in MeV, versus mass number A for stable nuclei. It rises steeply from 1.1 MeV for ²H, with a spike at ⁴He (7.07 MeV) above ⁶Li and ⁷Li, to a broad peak of about 8.8 MeV near A = 60 (⁵⁶Fe and ⁶²Ni), then falls slowly to 7.6 MeV at ²³⁸U as Coulomb repulsion grows.</desc>
