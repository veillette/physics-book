<path d="M 352.22 209.55 A 60 60 0 0 0 360 180" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="round"/>
<text x="381.23" y="206.64" font-family="'Times New Roman', Times, serif" font-size="15" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">θ</tspan><tspan font-size="10.5" dy="4.2"><tspan font-style="normal">Au</tspan></tspan><tspan dy="-4.2">​</tspan></text>
</svg>
