<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="730" viewBox="0 0 1160 730" role="img" aria-labelledby="title desc">
<title id="title">Ptolemaic and Copernican models</title>
<desc id="desc">Left: the geocentric Ptolemaic model has Earth at the center, the Moon and Sun on circular paths, and Mercury, Venus, Mars, Jupiter, and Saturn on epicycles whose centers move around Earth. Stars surround the system. Right: the heliocentric Copernican model has the Sun at the center, with Mercury, Venus, Earth and its Moon, Mars, Jupiter, and Saturn orbiting it. Schematic, not to scale.</desc>
