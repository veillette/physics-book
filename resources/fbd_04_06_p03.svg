<svg xmlns="http://www.w3.org/2000/svg" width="320" height="330" viewBox="0 0 320 330" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the high jumper</title>
<desc id="desc">Free-body diagram with +x to the right and +y up: upward force from the ground F, about five times as long as the weight w pointing down; the acceleration points up.</desc>
<rect width="320" height="330" fill="#ffffff"/>
<line x1="40" y1="210" x2="266" y2="210" stroke="#555555" stroke-width="1.5"/><polygon points="275,210 265,214.2 265,205.8" fill="#555555"/>
<line x1="150" y1="305" x2="150" y2="104" stroke="#555555" stroke-width="1.5"/><polygon points="150,95 154.2,105 145.8,105" fill="#555555"/>
<line x1="150" y1="210" x2="150" y2="123" stroke="#b03a2e" stroke-width="3.5"/><polygon points="150,112 155.04,124 144.96,124" fill="#b03a2e"/>
<line x1="150" y1="210" x2="150" y2="223.1" stroke="#b03a2e" stroke-width="3.5"/><polygon points="150,232 145.84,222.1 154.16,222.1" fill="#b03a2e"/>
<line x1="80" y1="170" x2="80" y2="136" stroke="#1e8449" stroke-width="3"/><polygon points="80,125 85.04,137 74.96,137" fill="#1e8449"/>
<circle cx="150" cy="210" r="6" fill="#1f3a5f"/>
<text x="140" y="232" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="end">jumper</text>
<text x="291" y="216" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="150" y="85" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="162" y="131" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">F</tspan></text>
<text x="162" y="231" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan></text>
<text x="92" y="144" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="start" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
</svg>
