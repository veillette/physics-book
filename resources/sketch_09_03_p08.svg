<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the drawbridge with a car, held by the cables</title>
<desc id="desc">The bridge pivots at its hinge (the origin). +x points from the hinge toward the opposite shore and +y up, and counterclockwise torques are positive. The bridge’s weight w_b acts down 1.50 m from the hinge and the car’s weight w_c 3.75 m from it (both clockwise torques). The cable tension T acts 9.00 m from the hinge, 40° above the horizontal and back toward the hinge (counterclockwise torque). The hinge force has components F_hx along +x and F_hy along +y.</desc>
