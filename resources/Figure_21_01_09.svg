<svg xmlns="http://www.w3.org/2000/svg" width="520" height="550" viewBox="0 0 520 550" role="img" aria-labelledby="title desc">
<title id="title">Insulators holding a transmission line on a grounded tower</title>
<desc id="desc">A grounded steel lattice tower with a ground conductor at its peak. A string of ceramic insulators hangs from the end of its cross arm and holds a 240-kV, 500-A transmission line. Each insulator provides a resistance of 1.00 × 10^9 Ω.</desc>
