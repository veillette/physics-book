<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" role="img" aria-labelledby="title desc">
<title id="title">Path of a jogger’s falling hat in two frames</title>
<desc id="desc">Left, in the jogger’s frame: the hat falls straight down from the back of the jogger’s head and lands just behind the heels. Right, as seen by a stationary observer: the jogger runs forward and the hat follows a parabola forward, keeping pace with the jogger, landing behind the jogger’s heels at the jogger’s new position.</desc>
