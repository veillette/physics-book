      <ellipse cx="174" cy="120" rx="9" ry="32" fill="#ffb86e"/>
      <ellipse cx="176" cy="120" rx="5" ry="25" fill="#fff6d5" stroke="none"/>
      <rect x="74" y="132" width="28" height="8" rx="2" fill="#dce3e8" stroke="#5e6770" stroke-width="1.5"/>
    </g>
    <text x="96" y="174" text-anchor="middle" font-size="17">Flashlight</text>
