<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Defining the meter using the speed of light</title>
  <desc id="desc">A flashlight points right along a meter stick marked from 0 to 100 centimeters. In a vacuum, light travels this one-meter distance in exactly 1/299 792 458 of a second. Distance equals speed multiplied by time: 1 meter equals 299 792 458 meters per second multiplied by 1/299 792 458 of a second.</desc>
