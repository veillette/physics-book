    <rect x="569" y="257" width="62" height="26" fill="#fff"/>
    <text x="600" y="277" text-anchor="middle" font-size="23">1 m</text>
    <text x="540" y="316" text-anchor="middle" font-size="23">Travel time = 1/299 792 458 s ≈ 3.34 ns</text>
    <text x="540" y="362" text-anchor="middle" font-size="22">Distance = speed × time = (299 792 458 m/s) × (1/299 792 458 s) = 1 m</text>
