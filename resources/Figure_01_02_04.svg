    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffad68"/>
      <stop offset="0.5" stop-color="#f56a30"/>
      <stop offset="1" stop-color="#c94020"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6d5"/>
      <stop offset="1" stop-color="#ffe392"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fce2b0"/>
      <stop offset="1" stop-color="#e9bd82"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="390" fill="#fff"/>
