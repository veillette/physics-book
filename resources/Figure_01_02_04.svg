<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">The meter and the speed of light</title><desc id="desc">A light pulse crosses one meter in a vacuum in exactly one divided by 299792458 seconds. The displayed transit is greatly slowed down. Animated motion has a static alternative for reduced motion and print.</desc><style>.anim-movie{display:none}@media (prefers-reduced-motion:no-preference){.anim-movie{display:inline}.anim-still{display:none}}#animation-paused:target~.anim-movie{display:none!important}#animation-paused:target~.anim-still{display:inline!important}@media (prefers-reduced-motion:reduce),print{.anim-movie{display:none!important}.anim-still{display:inline!important}}</style><rect width="900" height="380" fill="white"/><defs><clipPath id="animation-diagram-clip"><rect x="20" y="42" width="860" height="282"/></clipPath></defs><g id="animation-paused"/><g class="anim-still"><text x="450" y="27" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222" text-anchor="middle">One meter, defined by the travel time of light</text><g clip-path="url(#animation-diagram-clip)"><line x1="130" y1="210" x2="770" y2="210" stroke="#222222" stroke-width="3"/><line x1="130" y1="200" x2="130" y2="220" stroke="#222222" stroke-width="2"/><text x="130" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">0</text><line x1="194" y1="200" x2="194" y2="220" stroke="#222222" stroke-width="2"/><text x="194" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">10</text><line x1="258" y1="200" x2="258" y2="220" stroke="#222222" stroke-width="2"/><text x="258" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">20</text><line x1="322" y1="200" x2="322" y2="220" stroke="#222222" stroke-width="2"/><text x="322" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">30</text><line x1="386" y1="200" x2="386" y2="220" stroke="#222222" stroke-width="2"/><text x="386" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">40</text><line x1="450" y1="200" x2="450" y2="220" stroke="#222222" stroke-width="2"/><text x="450" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">50</text><line x1="514" y1="200" x2="514" y2="220" stroke="#222222" stroke-width="2"/><text x="514" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">60</text><line x1="578" y1="200" x2="578" y2="220" stroke="#222222" stroke-width="2"/><text x="578" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">70</text><line x1="642" y1="200" x2="642" y2="220" stroke="#222222" stroke-width="2"/><text x="642" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">80</text><line x1="706" y1="200" x2="706" y2="220" stroke="#222222" stroke-width="2"/><text x="706" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">90</text><line x1="770" y1="200" x2="770" y2="220" stroke="#222222" stroke-width="2"/><text x="770" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">100</text><text x="800" y="245" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#222222" text-anchor="middle">cm</text><line x1="130" y1="150" x2="761" y2="150" stroke="#d99a35" stroke-width="2"/><polygon points="770,150 761,154 761,146" fill="#d99a35" stroke="none"/><circle cx="610" cy="150" r="9" fill="#d99a35" opacity="1"/><text x="450" y="95" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="middle">Light in vacuum: c = 299 792 458 m/s</text><text x="450" y="285" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222" text-anchor="middle">1 m / c = 1 / 299 792 458 s ≈ 3.34 ns</text></g><text x="450" y="337" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#657382" text-anchor="middle">The visible pulse is greatly slowed down; the physical transit time is 3.34 ns.</text><text x="450" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#657382" text-anchor="middle">Illustrative motion • slowed down • cycle restarts</text></g><g class="anim-movie" aria-hidden="true"><text x="450" y="27" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222" text-anchor="middle">One meter, defined by the travel time of light</text><g clip-path="url(#animation-diagram-clip)"><line x1="130" y1="210" x2="770" y2="210" stroke="#222222" stroke-width="3"/><line x1="130" y1="200" x2="130" y2="220" stroke="#222222" stroke-width="2"/><text x="130" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">0</text><line x1="194" y1="200" x2="194" y2="220" stroke="#222222" stroke-width="2"/><text x="194" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">10</text><line x1="258" y1="200" x2="258" y2="220" stroke="#222222" stroke-width="2"/><text x="258" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">20</text><line x1="322" y1="200" x2="322" y2="220" stroke="#222222" stroke-width="2"/><text x="322" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">30</text><line x1="386" y1="200" x2="386" y2="220" stroke="#222222" stroke-width="2"/><text x="386" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">40</text><line x1="450" y1="200" x2="450" y2="220" stroke="#222222" stroke-width="2"/><text x="450" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">50</text><line x1="514" y1="200" x2="514" y2="220" stroke="#222222" stroke-width="2"/><text x="514" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">60</text><line x1="578" y1="200" x2="578" y2="220" stroke="#222222" stroke-width="2"/><text x="578" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">70</text><line x1="642" y1="200" x2="642" y2="220" stroke="#222222" stroke-width="2"/><text x="642" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">80</text><line x1="706" y1="200" x2="706" y2="220" stroke="#222222" stroke-width="2"/><text x="706" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">90</text><line x1="770" y1="200" x2="770" y2="220" stroke="#222222" stroke-width="2"/><text x="770" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222222" text-anchor="middle">100</text><text x="800" y="245" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#222222" text-anchor="middle">cm</text><line x1="130" y1="150" x2="761" y2="150" stroke="#d99a35" stroke-width="2"/><polygon points="770,150 761,154 761,146" fill="#d99a35" stroke="none"/><circle cx="130" cy="150" r="9" fill="#d99a35" opacity="1"><animate attributeName="cx" dur="10s" repeatCount="indefinite" calcMode="linear" values="130;142.549;155.098;167.647;180.196;192.745;205.294;217.843;230.392;242.941;255.49;268.039;280.588;293.137;305.686;318.235;330.784;343.333;355.882;368.431;380.98;393.529;406.078;418.627;431.176;443.725;456.275;468.824;481.373;493.922;506.471;519.02;531.569;544.118;556.667;569.216;581.765;594.314;606.863;619.412;631.961;644.51;657.059;669.608;682.157;694.706;707.255;719.804;732.353;744.902;757.451;770;770;770;770;770;770;770;770;770;770"/></circle><text x="450" y="95" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="middle">Light in vacuum: c = 299 792 458 m/s</text><text x="450" y="285" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222" text-anchor="middle">1 m / c = 1 / 299 792 458 s ≈ 3.34 ns</text></g><text x="450" y="337" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#657382" text-anchor="middle">The visible pulse is greatly slowed down; the physical transit time is 3.34 ns.</text><text x="450" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#657382" text-anchor="middle">Illustrative motion • slowed down • cycle restarts</text></g></svg>
