    <path d="M 180,120 H 995" fill="none" stroke="#9a287b" stroke-width="4"/>
    <path d="M 1020,120 L 994,111 L 994,129 Z" fill="#9a287b"/>
    <g fill="url(#body)" stroke="#843f2c" stroke-width="2" stroke-linejoin="round">
