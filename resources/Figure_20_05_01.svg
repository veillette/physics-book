<title id="title">DC and AC voltage and current versus time</title>
<desc id="desc">(a) For a DC source, the voltage V_DC and current I_DC are constant in time. (b) For 60-Hz AC, the voltage oscillates between V0 and −V0 and the current between I0 and −I0; both are sinusoidal and in phase in a simple resistance circuit.</desc>
