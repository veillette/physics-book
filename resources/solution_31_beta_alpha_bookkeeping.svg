<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
<title id="title">Beta processes preserve the nucleon count</title>
<desc id="desc">Beta-minus converts neutron to proton, electron, and electron antineutrino. Beta-plus converts a bound proton to neutron, positron, and electron neutrino. Electron capture converts proton plus electron to neutron and electron neutrino. These preserve A; alpha decay removes helium-4, reducing A by four and Z by two. Energetic conditions still apply.</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172b45"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1763a6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad4d12"/></marker></defs>
<rect width="960" height="550" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<text x="480" y="36" font-size="25" fill="#172b45" text-anchor="middle" font-weight="bold">Beta processes preserve the nucleon count</text>
<text x="480" y="78" font-size="20" fill="#526176" text-anchor="middle" font-weight="normal">Nuclear changes shown below; leptons are written explicitly.</text><rect x="26" y="106" width="908" height="70" rx="4" fill="#edf4fa" stroke="none"/><text x="44" y="149" font-size="21" fill="#172b45" text-anchor="start" font-weight="bold">β⁻ decay</text><text x="265" y="149" font-size="23" fill="#172b45" text-anchor="start" font-weight="normal">n → p + e⁻ + ν̄ₑ</text><text x="661" y="149" font-size="19" fill="#172b45" text-anchor="start" font-weight="normal">A unchanged; Z → Z + 1</text><rect x="26" y="187" width="908" height="70" rx="4" fill="#edf4fa" stroke="none"/><text x="44" y="230" font-size="21" fill="#172b45" text-anchor="start" font-weight="bold">β⁺ decay</text><text x="265" y="230" font-size="23" fill="#172b45" text-anchor="start" font-weight="normal">p → n + e⁺ + νₑ</text><text x="661" y="230" font-size="19" fill="#172b45" text-anchor="start" font-weight="normal">A unchanged; Z → Z − 1</text><rect x="26" y="268" width="908" height="70" rx="4" fill="#edf4fa" stroke="none"/><text x="44" y="311" font-size="21" fill="#172b45" text-anchor="start" font-weight="bold">Electron capture</text><text x="265" y="311" font-size="23" fill="#172b45" text-anchor="start" font-weight="normal">p + e⁻ → n + νₑ</text><text x="661" y="311" font-size="19" fill="#172b45" text-anchor="start" font-weight="normal">A unchanged; Z → Z − 1</text><rect x="26" y="349" width="908" height="70" rx="4" fill="#faf0e7" stroke="none"/><text x="44" y="392" font-size="21" fill="#172b45" text-anchor="start" font-weight="bold">α decay</text><text x="265" y="392" font-size="23" fill="#172b45" text-anchor="start" font-weight="normal">Parent → daughter + ⁴₂He</text><text x="661" y="392" font-size="19" fill="#172b45" text-anchor="start" font-weight="normal">A → A − 4; Z → Z − 2</text><text x="480" y="487" font-size="20" fill="#172b45" text-anchor="middle" font-weight="normal">Beta processes convert one nucleon; alpha decay removes two protons and two neutrons.</text><text x="480" y="520" font-size="18" fill="#526176" text-anchor="middle" font-weight="normal">p → n processes require a suitable parent nucleus and enough available energy.</text>
</g>
</svg>
