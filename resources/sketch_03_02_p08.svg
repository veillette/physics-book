<svg xmlns="http://www.w3.org/2000/svg" width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="title desc">
<title id="title">Sketch of A + B + C and B + C + A</title>
<desc id="desc">Axes with +x and +y, angles measured counterclockwise from +x. A is 10.0 units at 30°, B is 8.0 units at 120°, and C is 6.0 units at 240°. Solid arrows: A, then B, then C, head to tail. Dashed arrows: B, then C, then A. Both chains end at the same point, so the resultant R is the same.</desc>
