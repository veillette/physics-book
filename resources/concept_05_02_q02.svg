<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">Drag force proportional to speed and to speed squared</title>
<desc id="desc">Drag force versus speed. The straight line F = bv (Stokes drag) dominates at low speeds, for small objects, and in viscous fluids, where the flow is smooth (laminar). The parabola F = ½CρAv² grows faster and dominates at high speeds and for large objects, where the flow is turbulent. The two curves cross at one speed; below it the linear law is larger, above it the quadratic law is larger.</desc>
