<svg xmlns="http://www.w3.org/2000/svg" width="620" height="380" viewBox="0 0 620 380" role="img" aria-labelledby="title desc">
<title id="title">AC power as a function of time</title>
<desc id="desc">The power P = I0V0 sin²(2πft) delivered to a resistance by an AC source, versus time t. Because the voltage and current are in phase, the power is never negative: it oscillates between zero and I0V0 at twice the source frequency. The average power, shown dashed, is ½I0V0.</desc>
