<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img" aria-labelledby="title desc">
<title id="title">The greenhouse effect</title>
<desc id="desc">Ultraviolet, visible, and infrared radiation from the Sun passes through the atmosphere and is absorbed by the Earth’s surface. The Earth re-emits energy as infrared radiation, much of which is absorbed in the atmosphere and sent back toward the surface.</desc>
