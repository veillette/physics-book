<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
<title id="title">Probability cloud of hydrogen’s ground state</title>
<desc id="desc">The electron cloud of hydrogen in its ground state (n = 1, ℓ = 0, mℓ = 0), shaded in proportion to the probability density |ψ|², which falls off as e^{−2r/aB} from the nucleus at the center. A dashed circle marks the Bohr radius r1 = aB, the most probable distance of the electron from the nucleus; the electron can be closer or farther, but is very unlikely to be far away.</desc>
