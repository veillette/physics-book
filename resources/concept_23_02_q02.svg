<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc">
<title id="title">Flux and induced voltage as a charged particle passes a coil</title>
<desc id="desc">Top: the magnetic flux through the coil versus time, a symmetric peak centered on the instant the particle passes through the coil. Bottom: the induced voltage versus time, a positive pulse while the flux is rising and an equal negative pulse while it is falling, crossing zero at the instant the particle passes.</desc>
