<title id="title">Cutting the corner increases the turning radius</title>
<desc id="desc">Top view of a left turn. Path 2 follows the road bend. Path 1 starts wide, passes close to the inside edge at the apex, and exits wide. The corner-cutting arc has a larger radius than Path 2, allowing a greater speed for the same available friction.</desc>
