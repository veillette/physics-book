<svg xmlns="http://www.w3.org/2000/svg" width="840" height="770" viewBox="0 0 840 770" role="img" aria-labelledby="title desc">
<title id="title">A battery lighting a headlight</title>
<desc id="desc">A 12 V car battery is wired to a headlight. Negative charge −q leaves the battery’s negative terminal A, travels up the wire, through the headlight, and back down the other wire into the positive terminal B. The positive terminal is at the higher potential.</desc>
