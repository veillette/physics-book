<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-labelledby="title desc">
<title id="title">A subway train slowing to a stop while moving left</title>
<desc id="desc">A train moves to the left, in the negative x direction, so its velocity arrow points left. It is slowing down, so its acceleration arrow points to the right, in the positive x direction: the acceleration is positive.</desc>
<rect width="560" height="220" fill="#ffffff"/>
<rect x="190" y="70" width="200" height="60" rx="10" fill="#cfe3ea" stroke="#222222" stroke-width="2"/>
<rect x="215" y="82" width="34" height="22" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="265" y="82" width="34" height="22" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="315" y="82" width="34" height="22" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<circle cx="225" cy="136" r="9" fill="#222222"/>
<circle cx="355" cy="136" r="9" fill="#222222"/>
<line x1="30" y1="146" x2="530" y2="146" stroke="#222222" stroke-width="2"/>
<line x1="180" y1="52" x2="84" y2="52" stroke="#5e9e1e" stroke-width="4"/>
<polygon points="70,52 85,46 85,58" fill="#5e9e1e"/>
<text x="125" y="35.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#5e9e1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">v<tspan font-size="10.54" font-weight="normal" dx="-9.52" dy="-8.84">→</tspan><tspan dx="-1.02" dy="8.84">​</tspan></tspan><tspan font-style="normal"> (</tspan><tspan font-style="italic">v</tspan><tspan font-style="normal"> &lt; 0)</tspan></text>
<line x1="400" y1="52" x2="486" y2="52" stroke="#6a3d9a" stroke-width="4"/>
<polygon points="500,52 485,58 485,46" fill="#6a3d9a"/>
<text x="450" y="35.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#6a3d9a" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">a<tspan font-size="10.54" font-weight="normal" dx="-9.52" dy="-8.84">→</tspan><tspan dx="-1.02" dy="8.84">​</tspan></tspan><tspan font-style="normal"> (</tspan><tspan font-style="italic">a</tspan><tspan font-style="normal"> &gt; 0)</tspan></text>
<line x1="230" y1="190" x2="341" y2="190" stroke="#333333" stroke-width="1.5"/>
<polygon points="350,190 340,194 340,186" fill="#333333"/>
<text x="358" y="195.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
</svg>
