<svg xmlns="http://www.w3.org/2000/svg" width="420" height="760" viewBox="0 0 420 760" role="img" aria-labelledby="title desc">
<title id="title">Allowed directions of orbital angular momentum</title>
<desc id="desc">An external magnetic field B_ext lies along the z axis. The orbital angular momentum L_orb, of magnitude √6 ħ for ℓ = 2, can point only at angles whose cosines are mℓ/√6 for mℓ = 2, 1, 0, −1 and −2: about 35°, 66°, 90°, 114° and 145° from the field.</desc>
