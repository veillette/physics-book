<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc">
<title id="title">Three readings of an open-tube manometer</title>
<desc id="desc">Each U tube has gas pressure on the left and atmospheric pressure on the right. Equal pressures give equal liquid levels. Positive gauge pressure lowers the left surface; negative gauge pressure raises it. The same horizontal level in connected stationary liquid has the same pressure.</desc>
