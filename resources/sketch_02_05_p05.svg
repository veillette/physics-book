<svg xmlns="http://www.w3.org/2000/svg" width="600" height="269" viewBox="0 0 600 269" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the car entering the freeway</title>
<desc id="desc">A horizontal +x axis points in the direction the car travels, with the origin where the car starts from rest. Start: t = 0, x_0 = 0, v_0 = 0. After 12.0 s: x and v unknown. The acceleration a = +2.40 m/s² points in +x.</desc>
