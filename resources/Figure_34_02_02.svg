<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="515" viewBox="0 0 1000 515" role="img" aria-labelledby="title desc">
<title id="title">Starlight bent by the Sun</title>
<desc id="desc">Light from a distant star passes close to the Sun and is bent toward it on its way to an observer on the Earth. Tracing the arriving ray straight back, the observer sees the star at an apparent position farther from the Sun than its actual position. The distances are not to scale.</desc>
