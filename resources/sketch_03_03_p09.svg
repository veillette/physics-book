<title id="title">Sketch of the flight in standard and rotated axes</title>
<desc id="desc">Axes with +x east and +y north, origin at the start. The displacement R is 32.0 km at 35.0° south of west (215° from +x). (a) Its west and south components lie along −x and −y. (b) Rotated axes, drawn in orange: +x′ points 45.0° south of west and +y′ points 45.0° west of north; R makes 10.0° with +x′, on the +y′ side.</desc>
