<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the balanced seesaw</title>
<desc id="desc">The seesaw pivots at its center (the origin). +x points to the right and +y up, and counterclockwise torques are positive. The 20.0-kg child sits r_1 to the left of the pivot, so the weight m_1 g gives a counterclockwise (positive) torque; the 30.0-kg child sits r_2 to the right, so m_2 g gives a clockwise (negative) torque. The children are 3.00 m apart.</desc>
