<line x1="45" y1="160" x2="555" y2="160" stroke="#a9c2d9" stroke-width="10" stroke-linecap="round"/>
<line x1="45" y1="160" x2="555" y2="160" stroke="#1f3a5f" stroke-width="1.4"/>
<polygon points="330,165 320.9,178 339.1,178" fill="#999999" stroke="#555555" stroke-width="1.2"/>
<text x="330" y="199.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">pivot</tspan></text>
<line x1="60" y1="166" x2="60" y2="268" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="330" y1="166" x2="330" y2="268" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
