<svg xmlns="http://www.w3.org/2000/svg" width="625" height="780" viewBox="0 0 625 780" role="img" aria-labelledby="title desc">
<title id="title">A cold vaporizer</title>
<desc id="desc">A cold vaporizer: a box-shaped base holds a clear water reservoir under a round cap, and vapor rises from the top. An enlarged view of the reservoir shows the circuit inside: an AC voltage source connected to two electrodes that dip into the water, so the current passes through the water itself, which acts as the resistance R.</desc>
