<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">An RC circuit that makes a lamp flash periodically</title>
<desc id="desc">(a) Left, charging: the lamp has a very high resistance, so current from the source flows through R and charges C. Right, discharging: once the capacitor voltage reaches the lamp threshold, the lamp’s resistance drops and the capacitor discharges through it, lighting it. (b) The capacitor voltage rises along a charging curve to the bulb threshold, then repeatedly drops quickly as the lamp flashes and recharges to the threshold, giving a sawtooth.</desc>
