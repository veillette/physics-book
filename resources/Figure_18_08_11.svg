<svg xmlns="http://www.w3.org/2000/svg" width="540" height="300" viewBox="0 0 540 300" role="img" aria-labelledby="title desc">
<title id="title">The Millikan oil-drop experiment</title>
<desc id="desc">A small oil drop carrying charge q0 floats between two horizontal plates, positive on top and negative on the bottom, whose field points down. Because the drop’s excess charge is negative, the electric force on it is upward and can balance its weight. An observer watches the drop through a microscope from the side.</desc>
