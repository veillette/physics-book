<svg xmlns="http://www.w3.org/2000/svg" width="650" height="500" viewBox="0 0 650 500" role="img" aria-labelledby="title desc">
<title id="title">Maxwell–Boltzmann distribution of molecular speeds</title>
<desc id="desc">Probability versus speed v for oxygen molecules at T = 300 K. The curve rises from zero, peaks at the most probable speed v_p ≈ 395 m/s, and falls off in a long tail toward high speeds. The rms speed, v_rms ≈ 484 m/s, lies to the right of the peak.</desc>
