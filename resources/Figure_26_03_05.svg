<title id="title">Edge enhancement in vision</title>
<desc id="desc">Five strips of gray, each uniformly shaded, from black to light gray. Below them, the actual light intensity is a staircase of flat steps. Lowest, the signals from the rods and cones overshoot at each edge, making each strip look darker on its dark side and lighter on its light side.</desc>
