<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">Acceptance angle of a microscope objective</title>
<desc id="desc">(a) Rays from a point P spread to the edges of an objective lens; θ is half the angle of the cone of rays the lens accepts, measured from the axis. The numerical aperture is NA = n sin θ. (b) A cone of light from a specimen enters a microscope objective of diameter D; α is half the acceptance angle.</desc>
