<svg xmlns="http://www.w3.org/2000/svg" width="780" height="700" viewBox="0 0 780 700" role="img" aria-labelledby="title desc">
<title id="title">Two sonic booms from a supersonic aircraft</title>
<desc id="desc">A jet flies to the right faster than sound. Two shock-wave cones trail behind it, one from its nose and one from its tail, drawn as shaded wedges that reach down to the ground behind the plane. The observer on the left, inside both cones, has heard both booms and covers their ears. The observer in the middle has just been reached by the nose boom and throws up their arms. The observer on the right, ahead of both cones, has heard nothing yet and wonders what is happening, even though the plane is already past.</desc>
