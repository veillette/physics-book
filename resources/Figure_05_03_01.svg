<svg xmlns="http://www.w3.org/2000/svg" width="820" height="640" viewBox="0 0 820 640" role="img" aria-labelledby="title desc">
<title id="title">Change in length versus applied force</title>
<desc id="desc">ΔL rises in proportion to F where Hooke’s law is obeyed, then curves; the material returns to its original length anywhere in the elastic region. Beyond that the deformation is permanent, and the curve rises steeply to the fracture point.</desc>
