<svg xmlns="http://www.w3.org/2000/svg" width="520" height="640" viewBox="0 0 520 640" role="img" aria-labelledby="title desc">
<title id="title">Gas molecule striking a wall of its box</title>
<desc id="desc">A small box of gas at the upper left, with one wall enlarged at the right. A molecule strikes the wall: its velocity component v_x, perpendicular to the wall, reverses to v′_x, while its component v_y along the wall is unchanged, v′_y = v_y. The axes show x perpendicular to the wall and y and z along it.</desc>
