<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1100" viewBox="0 0 560 1100" role="img" aria-labelledby="title desc">
<title id="title">Energy output of conventional and nuclear weapons</title>
<desc id="desc">(a) A conventional chemical bomb: 90% blast and 10% thermal. (b) A conventional nuclear bomb: 50% blast, 35% thermal, 10% delayed radiation and 5% prompt radiation. (c) A radiation-enhanced nuclear bomb (neutron bomb): 40% blast, 25% thermal, 5% delayed radiation and 30% prompt radiation.</desc>
