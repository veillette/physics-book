<title id="title">A braced wall in the wind</title>
<desc id="desc">A 17.0 m high wall stands on the ground with a horizontal wind force Fwind pushing on its left face. On the right, a brace runs from a point 8.5 m up the wall down to the ground, making a 35° angle with the wall. There are 10 such braces. Heights are drawn to scale.</desc>
