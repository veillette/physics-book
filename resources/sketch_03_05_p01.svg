<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the flight and the headwind</title>
<desc id="desc">Axes with +x east and +y north. The aircraft’s velocity relative to the Earth, v_p/E = 3.53 m/s, points 45° south of east; the wind’s velocity relative to the Earth, v_a/E = 2.00 m/s, points the opposite way, 45° north of west. Along the line of motion (dashed), the positive direction is the direction of travel, 45° south of east.</desc>
