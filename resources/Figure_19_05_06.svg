<svg xmlns="http://www.w3.org/2000/svg" width="720" height="770" viewBox="0 0 720 770" role="img" aria-labelledby="title desc">
<title id="title">A polarized atom</title>
<desc id="desc">Top: an unpolarized atom, its electron cloud a ring centered on the nucleus. Middle: with a negative external charge on the left and a positive one on the right, the electron cloud is pulled toward the positive charge and the nucleus toward the negative one, so the cloud is thick on the right and thin on the left (exaggerated). Bottom: from far away the polarized atom looks like a positive end facing the negative charge and a negative end facing the positive charge.</desc>
