<svg xmlns="http://www.w3.org/2000/svg" width="880" height="900" viewBox="0 0 880 900" role="img" aria-labelledby="title desc">
<title id="title">Spontaneous one-way processes</title>
<desc id="desc">(a) Heat Q flows by itself from a hot region to a cold one. (b) A car moving with velocity v brakes to a stop, v_f = 0, converting its kinetic energy to heat Q. (c) A puff of air released into an evacuated box spreads out to a uniform distribution. None of these happens in reverse on its own.</desc>
