<line x1="210" y1="150" x2="313.32" y2="198.18" stroke="#b03a2e" stroke-width="3.5"/><polygon points="323.29,202.83 310.28,202.32 314.54,193.19" fill="#b03a2e"/>
<line x1="210" y1="150" x2="161" y2="150" stroke="#b03a2e" stroke-width="3.5"/><polygon points="150,150 162,144.96 162,155.04" fill="#b03a2e"/>
<circle cx="210" cy="150" r="6" fill="#1f3a5f"/>
<text x="222" y="126" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="start">block</text>
