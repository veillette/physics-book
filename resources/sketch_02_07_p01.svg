<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the ball thrown straight up</title>
<desc id="desc">A vertical +y axis points up, with the origin at the point of release. Release: t = 0, y_0 = 0, v_0 = +15.0 m/s. The ball’s position y and velocity v are wanted at t = 0.500, 1.00, 1.50, and 2.00 s (open circles; the last one is on the way down). The acceleration is a = −9.80 m/s² throughout.</desc>
