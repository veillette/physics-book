<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img" aria-labelledby="title desc">
<title id="title">Diffusion from higher to lower concentration</title>
<desc id="desc">A tube of cross-sectional area A holds molecules moving randomly, each with a short arrow showing its direction. Region 1 on the left has a higher concentration C1 than region 2 on the right, C2. Molecules cross the gap Δx between the regions in both directions, but more cross from region 1 to region 2, so the net diffusion is from higher to lower concentration, at a rate proportional to C1 − C2.</desc>
