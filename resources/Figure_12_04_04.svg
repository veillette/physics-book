<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Uniform and parabolic velocity profiles in a tube</title>
<desc id="desc">Two vertical tube cross sections show upward flow. An ideal inviscid uniform-flow model has equal velocity arrows. Fully developed laminar flow of a Newtonian fluid in a circular tube has a parabolic profile with zero speed at both walls, maximum speed at the center, and mean speed equal to half the maximum. Both panels have the same mean speed.</desc>
