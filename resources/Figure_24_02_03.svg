<title id="title">An electromagnetic wave leaving an antenna</title>
<desc id="desc">Part of the electromagnetic wave sent out from an antenna, drawn at one instant along one direction. The electric field E, in blue, oscillates in a vertical plane and the magnetic field B, in magenta, in a horizontal plane. The two are in phase and perpendicular to each other and to the direction of travel, marked c.</desc>
