<title id="title">A rock thrown straight up: velocity and acceleration</title>
<desc id="desc">Three snapshots of a rock thrown straight up, with +y up. On the way up at height h the velocity points up; at the top the velocity is zero; on the way down at the same height h the velocity points down with the same length as on the way up. At all three snapshots the acceleration arrow points down with the same length: a = −g = −9.80 m/s².</desc>
