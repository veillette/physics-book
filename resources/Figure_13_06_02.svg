<title id="title">An air bubble in heated water</title>
<desc id="desc">A beaker of water over a flame at three temperatures. (a) At 20 °C a small bubble sits on the bottom. (b) At 50 °C the bubble is larger. (c) At 100 °C the bubble is larger still and rises toward the surface. An animated companion below illustrates the process; its complete static alternative is shown for reduced motion and print.</desc>
