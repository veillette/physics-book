<svg xmlns="http://www.w3.org/2000/svg" width="320" height="560" viewBox="0 0 320 560" role="img" aria-labelledby="title desc">
<title id="title">Parallel plates accelerating an electron</title>
<desc id="desc">A negatively charged plate on the left and a positively charged plate on the right with a hole in its middle. The field lines run straight from the positive plate to the negative plate, pointing left, and bow outward at the top and bottom ends. An electron e⁻ between the plates is accelerated to the right, toward the hole.</desc>
