<line x1="383.31" y1="171.57" x2="379.14" y2="175.61" stroke="#c62828" stroke-width="2.2"/>
<polygon points="374.69,179.93 377.86,172.85 381.87,176.98" fill="#c62828"/>
<circle cx="220" cy="290" r="4" fill="#c62828"/>
<text x="214" y="316.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">back</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">of</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">head</tspan></text>
