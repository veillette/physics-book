<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
<title id="title">Seeing the back of your head with two mirrors</title>
<desc id="desc">Top view of a person standing between two flat mirrors, one behind the head and one held in front. Light from the back of the head reflects from the rear mirror, travels forward past the head to the front mirror, and reflects back into the eyes, so the person sees an image of the back of their head.</desc>
