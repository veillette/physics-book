<circle cx="260" cy="290" r="40" fill="#f3d2b5" stroke="#222222" stroke-width="2"/>
<polygon points="298,282 312,290 298,298" fill="#f3d2b5" stroke="#222222" stroke-width="1.5"/>
<text x="260" y="354.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">head</tspan><tspan font-style="normal"> (</tspan><tspan font-style="normal">facing</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">right</tspan><tspan font-style="normal">)</tspan></text>
<circle cx="288" cy="264" r="4" fill="#1f77c8"/>
<line x1="120" y1="90" x2="120" y2="390" stroke="#1f77c8" stroke-width="6"/>
<text x="110" y="104.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">rear</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">mirror</tspan></text>
<line x1="495.28" y1="124.73" x2="444.72" y2="50.27" stroke="#1f77c8" stroke-width="6"/>
<text x="430" y="62.05" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">hand</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">mirror</tspan></text>
<line x1="220" y1="290" x2="120" y2="245" stroke="#c62828" stroke-width="2.2"/>
<line x1="175.47" y1="269.96" x2="170.18" y2="267.58" stroke="#c62828" stroke-width="2.2"/>
<polygon points="164.53,265.04 172.28,265.37 169.91,270.62" fill="#c62828"/>
<line x1="120" y1="245" x2="470" y2="87.5" stroke="#c62828" stroke-width="2.2"/>
