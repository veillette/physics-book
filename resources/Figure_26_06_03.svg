<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" role="img" aria-labelledby="title desc">
<title id="title">Spherical aberration</title>
<desc id="desc">Parallel rays at different heights pass through a converging lens with spherical surfaces. Rays through the outer zones of the lens are bent more and cross the axis closer to the lens than rays near the axis, so there is no single focal point.</desc>
