<title id="title">A roller coaster drop</title>
<desc id="desc">A roller coaster car starts from rest (v0 = 0) at the top of a hill. The track drops h = 25 m to its lowest point, then rises to a level finish h = 20 m below the start, where the speed v is unknown. Heights are drawn to scale.</desc>
