<svg xmlns="http://www.w3.org/2000/svg" width="560" height="520" viewBox="0 0 560 520" role="img" aria-labelledby="title desc">
<title id="title">Forces on a simple pendulum</title>
<desc id="desc">A pendulum bob of mass m hangs from a string of length L, displaced by angle θ from the vertical dashed equilibrium line; s is the arc length from equilibrium. The tension T acts along the string toward the pivot and the weight w = mg acts straight down. The component of the weight perpendicular to the string, −mg sin θ, points along the arc toward equilibrium: it is the restoring force.</desc>
