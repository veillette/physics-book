<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Two representations of the field of a positive charge</title>
<desc id="desc">(a) Arrows show the field of a positive charge Q at two distances in eight directions: the arrows point away from Q and are much shorter farther out, since the field falls off as 1/r². (b) The standard representation: continuous field lines radiating from Q, with arrows showing the field direction. The lines are closer together where the field is stronger.</desc>
