<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310" role="img" aria-labelledby="title desc">
<title id="title">Weight resolved into components on an incline</title>
<desc id="desc">On an incline at angle θ, the weight w is split into w∥ = w sin θ = mg sin θ down the slope and w⊥ = w cos θ = mg cos θ into the slope. The tilted axes have x along the incline and y perpendicular to it; the angle between w and w⊥ is θ.</desc>
