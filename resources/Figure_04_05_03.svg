<text x="76" y="286" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">θ</tspan></text>
<line x1="315" y1="100" x2="397.19" y2="46.63" stroke="#222222" stroke-width="1.8"/>
