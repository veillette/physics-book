<line x1="232.78" y1="153.39" x2="315" y2="280" stroke="#d98b84" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="397.22" y1="226.61" x2="315" y2="280" stroke="#d98b84" stroke-width="1.5" stroke-dasharray="6 4"/>
