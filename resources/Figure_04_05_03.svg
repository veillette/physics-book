<text x="336.59" y="179.87" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">θ</tspan></text>
<text x="226.78" y="142.74" font-family="'Times New Roman', Times, serif" font-size="21" fill="#222222" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">w<tspan font-size="13.02" font-weight="normal" dx="-13.57" dy="-8.82">→</tspan><tspan dx="1.59" dy="8.82">​</tspan></tspan><tspan font-size="14.7" dy="5.88"><tspan font-style="normal">∥</tspan></tspan><tspan dy="-5.88">​</tspan></text>
