<text x="329" y="291.35" font-family="'Times New Roman', Times, serif" font-size="21" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">w<tspan font-size="13.02" font-weight="normal" dx="-13.57" dy="-8.82">→</tspan><tspan dx="1.59" dy="8.82">​</tspan></tspan></text>
<text x="485" y="127.35" font-family="'Times New Roman', Times, serif" font-size="21" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">w</tspan><tspan font-size="14.7" dy="5.88"><tspan font-style="normal">∥</tspan></tspan><tspan dy="-5.88">​</tspan><tspan font-style="normal"> = </tspan><tspan font-style="italic">w</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">sin</tspan><tspan font-style="normal">(</tspan><tspan font-style="italic">θ</tspan><tspan font-style="normal">) = </tspan><tspan font-style="italic">mg</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">sin</tspan><tspan font-style="normal">(</tspan><tspan font-style="italic">θ</tspan><tspan font-style="normal">)</tspan></text>
<text x="485" y="157.35" font-family="'Times New Roman', Times, serif" font-size="21" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">w</tspan><tspan font-size="14.7" dy="5.88"><tspan font-style="normal">⊥</tspan></tspan><tspan dy="-5.88">​</tspan><tspan font-style="normal"> = </tspan><tspan font-style="italic">w</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">cos</tspan><tspan font-style="normal">(</tspan><tspan font-style="italic">θ</tspan><tspan font-style="normal">) = </tspan><tspan font-style="italic">mg</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">cos</tspan><tspan font-style="normal">(</tspan><tspan font-style="italic">θ</tspan><tspan font-style="normal">)</tspan></text>
