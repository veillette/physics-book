<circle cx="128" cy="260" r="4.5" fill="#222222"/>
<text x="128" y="247.33" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">steps</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">on</tspan></text>
