<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" role="img" aria-labelledby="title desc">
<title id="title">Elastic energy in an ideal massless diving board</title>
<desc id="desc">Schematic time graph for a massless spring board, k=6000 N/m. Its energy is initially zero, rises to approximately 29 J at the static deflection, then to 270 J at maximum depression of 0.30 m, and falls to zero at separation at zero deflection. This idealized massless board retains no kinetic energy and does not vibrate afterward; a real massive board can.</desc>
