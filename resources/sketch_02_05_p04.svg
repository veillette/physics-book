<polygon points="220,40 207.4,45.04 207.4,34.96" fill="#6a3d9a"/>
<text x="185" y="30.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#6a3d9a" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="italic">a</tspan><tspan font-style="normal">)  </tspan><tspan font-style="italic">a</tspan><tspan font-style="normal"> = +1.35 </tspan><tspan font-style="normal">m/s</tspan><tspan font-size="11.2" dy="-6.4"><tspan font-style="normal">2</tspan></tspan><tspan dy="6.4">​</tspan></text>
<line x1="480" y1="40" x2="421.6" y2="40" stroke="#6a3d9a" stroke-width="3"/>
<polygon points="410,40 422.6,34.96 422.6,45.04" fill="#6a3d9a"/>
<text x="445" y="30.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#6a3d9a" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="italic">b</tspan><tspan font-style="normal">)  </tspan><tspan font-style="italic">a</tspan><tspan font-style="normal"> = −1.65 </tspan><tspan font-style="normal">m/s</tspan><tspan font-size="11.2" dy="-6.4"><tspan font-style="normal">2</tspan></tspan><tspan dy="6.4">​</tspan></text>
<text x="445" y="62.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#6a3d9a" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="italic">c</tspan><tspan font-style="normal">)  </tspan><tspan font-style="italic">a</tspan><tspan font-style="normal"> = ?,  </tspan><tspan font-style="normal">Δ</tspan><tspan font-style="italic">t</tspan><tspan font-style="normal"> = 8.30 </tspan><tspan font-style="normal">s</tspan></text>
</svg>
