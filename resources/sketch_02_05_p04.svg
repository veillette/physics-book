<svg xmlns="http://www.w3.org/2000/svg" width="640" height="248" viewBox="0 0 640 248" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the light-rail train</title>
<desc id="desc">A horizontal +x axis points in the direction the train travels, with the origin where it starts. Start: v_0 = 0. At top speed: v_1 = +80.0 km/h = +22.2 m/s. Stopped: v_2 = 0. Speeding up, a = +1.35 m/s² points in +x. Braking, the acceleration points in −x: a = −1.65 m/s² normally (part b), or unknown when the stop takes 8.30 s (part c).</desc>
<rect width="640" height="248" fill="#ffffff"/>
<line x1="30" y1="122" x2="580" y2="122" stroke="#8d6e63" stroke-width="2.2"/>
<line x1="30" y1="156" x2="560" y2="156" stroke="#555555" stroke-width="1.6"/>
<polygon points="570,156 559,160.4 559,151.6" fill="#555555"/>
<text x="586" y="161.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="570" y="180.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">direction</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">of</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">motion</tspan><tspan font-style="normal">)</tspan></text>
<line x1="80" y1="151" x2="80" y2="161" stroke="#555555" stroke-width="1.6"/>
<text x="80" y="177.9" font-family="'Times New Roman', Times, serif" font-size="14" fill="#555555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">0</tspan></text>
<rect x="60" y="95" width="40" height="22" rx="4" fill="#d6e4f0" stroke="#1f3a5f" stroke-width="2"/>
<text x="80" y="88.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f3a5f" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">train</tspan></text>
<text x="80" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">0</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 0</tspan></text>
<line x1="80" y1="151" x2="80" y2="161" stroke="#555555" stroke-width="1.6"/>
<rect x="230" y="95" width="40" height="22" rx="4" fill="#d6e4f0" stroke="#1f3a5f" stroke-width="2"/>
<line x1="250" y1="72" x2="318.4" y2="72" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="330,72 317.4,77.04 317.4,66.96" fill="#3f8a1e"/>
<text x="290" y="63.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">1</tspan></tspan><tspan dy="-4.48">​</tspan></text>
<text x="250" y="205.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">1</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = +22.2 </tspan><tspan font-style="normal">m/s</tspan></text>
<text x="250" y="226.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(80.0 </tspan><tspan font-style="normal">km/h</tspan><tspan font-style="normal">)</tspan></text>
<line x1="250" y1="151" x2="250" y2="161" stroke="#555555" stroke-width="1.6"/>
