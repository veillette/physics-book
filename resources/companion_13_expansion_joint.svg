<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">A bridge expansion joint closes as the deck warms</title>
<desc id="desc">Two identical bridge sections expand toward a central gap. Dashed outlines show their colder endpoints; outer reference points stay fixed. If each section has initial length L and expands by alpha L delta T, the central gap shrinks by twice that amount. Changes are exaggerated.</desc>
