<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1020" viewBox="0 0 760 1020" role="img" aria-labelledby="title desc">
<title id="title">A heat engine</title>
<desc id="desc">A heat engine, drawn as a circle, takes in heat Q_in (a wide wavy arrow from above), does work W (an arrow to the right), and gives off heat Q_out (a narrower wavy arrow below). Over a cycle ΔU = 0, so W = Q_in − Q_out.</desc>
