<rect x="35" y="70" width="340" height="260" rx="5" fill="#faf4df" stroke="#c7b784" stroke-width="2"/>
<rect x="425" y="70" width="340" height="260" rx="5" fill="#faf4df" stroke="#c7b784" stroke-width="2"/>
