<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img" aria-labelledby="title desc">
<title id="title">An inelastic collision between a disk and a pivoted stick</title>
<desc id="desc">Top views of a frictionless surface. (a) Before: disk m moves right with velocity v toward the upper tip of a stationary stick M of length r, nailed at its lower end. (b) After: the disk adheres to the tip and the stick and disk rotate clockwise together about the nail with angular velocity ω.</desc>
