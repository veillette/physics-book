<svg xmlns="http://www.w3.org/2000/svg" width="560" height="855" viewBox="0 0 560 855" role="img" aria-labelledby="title desc">
<title id="title">Light in an accelerating elevator and on the Earth</title>
<desc id="desc">(a) A person in an elevator accelerating upward shines a flashlight horizontally at the far wall. The beam strikes the wall below the dashed horizontal line through the flashlight, because the elevator accelerates up while the light crosses it. (b) The same happens in a room at rest on the Earth: gravity bends the light downward by the same amount. The bending is greatly exaggerated.</desc>
