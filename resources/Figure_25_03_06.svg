<title id="title">Refraction through an intermediate medium</title>
<desc id="desc">A ray in medium n1 strikes a layer of medium n2 at angle θ1, bends toward the normal to θ2, and then enters medium n3 at angle θ3. A dashed line shows the path the ray would take if medium n2 were not there: it has the same final direction θ3, but the actual ray is displaced sideways by Δx (exaggerated).</desc>
