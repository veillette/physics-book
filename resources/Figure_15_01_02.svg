<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
<title id="title">The first law of thermodynamics</title>
<desc id="desc">A system, drawn as an ellipse, receives heat Q (a wavy arrow in) and does work W (a straight arrow out); its internal energy changes by ΔU = Q − W. At the right: Q is the net heat, Q = Q_in − Q_out, and W is the net work, W = W_out − W_in.</desc>
<rect width="900" height="280" fill="#ffffff"/>
<ellipse cx="250" cy="150" rx="175" ry="108" fill="#ecdca5" stroke="#d9c57f" stroke-width="1.5"/>
