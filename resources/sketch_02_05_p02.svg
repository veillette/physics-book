<svg xmlns="http://www.w3.org/2000/svg" width="600" height="269" viewBox="0 0 600 269" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the ball stopping in the mitt</title>
<desc id="desc">A horizontal +x axis points in the direction the ball travels, with the origin where the ball first touches the mitt. At contact: t = 0, v_0 unknown and positive. Stopped: t = 1.85 ms, v = 0. The acceleration points in −x, against the motion: a = −2.10 × 10⁴ m/s².</desc>
