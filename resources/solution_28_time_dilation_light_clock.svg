<svg xmlns="http://www.w3.org/2000/svg" width="960" height="515" viewBox="0 0 960 515" role="img" aria-labelledby="title desc">
<title id="title">A moving light clock has a longer light path</title>
<desc id="desc">In the clock rest frame light travels vertically between mirrors. In a frame where the clock moves sideways, the emission, reflection, and return positions move right, producing a diagonal round trip. The transverse mirror spacing L is unchanged and the longer path at speed c gives time dilation.</desc>
<defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172b45"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1763a6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad4d12"/></marker></defs>
<rect width="960" height="515" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<text x="480" y="36" font-size="25" fill="#172b45" text-anchor="middle" font-weight="bold">A moving light clock has a longer light path</text>
<text x="480" y="76" font-size="20" fill="#526176" text-anchor="middle" font-weight="normal">One tick is a round trip between mirrors separated transversely by L.</text><text x="240" y="120" font-size="23" fill="#172b45" text-anchor="middle" font-weight="bold">Clock rest frame</text><text x="710" y="120" font-size="23" fill="#172b45" text-anchor="middle" font-weight="bold">Frame in which the clock moves →</text><path d="M155 155L325 155" fill="none" stroke="#526176" stroke-width="6"/><path d="M155 345L325 345" fill="none" stroke="#526176" stroke-width="6"/><path d="M228 336L228 163" fill="none" stroke="#1763a6" stroke-width="3" marker-end="url(#blue)"/><path d="M252 163L252 336" fill="none" stroke="#ad4d12" stroke-width="3" marker-end="url(#orange)"/><text x="135" y="255" font-size="23" fill="#172b45" text-anchor="middle" font-weight="normal">L</text><text x="240" y="389" font-size="24" fill="#172b45" text-anchor="middle" font-weight="normal">Δτ = 2L/c</text><path d="M540 345L680 155" fill="none" stroke="#1763a6" stroke-width="3" marker-end="url(#blue)"/><path d="M680 155L820 345" fill="none" stroke="#ad4d12" stroke-width="3" marker-end="url(#orange)"/><path d="M506 345L574 345" fill="none" stroke="#526176" stroke-width="6"/><path d="M646 155L714 155" fill="none" stroke="#526176" stroke-width="6"/><path d="M786 345L854 345" fill="none" stroke="#526176" stroke-width="6"/><path d="M680 160L680 345" fill="none" stroke="#526176" stroke-width="1" stroke-dasharray="7 6"/><path d="M540 345L820 345" fill="none" stroke="#526176" stroke-width="1" stroke-dasharray="7 6"/><text x="704" y="259" font-size="23" fill="#172b45" text-anchor="start" font-weight="normal">L</text><text x="680" y="389" font-size="20" fill="#172b45" text-anchor="middle" font-weight="normal">Mirror travels v Δt during the tick</text><text x="240" y="430" font-size="20" fill="#172b45" text-anchor="middle" font-weight="normal">Light travels 2L.</text><text x="710" y="430" font-size="20" fill="#172b45" text-anchor="middle" font-weight="normal">Light travels a longer path at the same c.</text><text x="480" y="481" font-size="25" fill="#172b45" text-anchor="middle" font-weight="normal">c²(Δt/2)² = L² + v²(Δt/2)²   ⇒   Δt = γ Δτ</text>
</g>
</svg>
