<svg xmlns="http://www.w3.org/2000/svg" width="470" height="600" viewBox="0 0 470 600" role="img" aria-labelledby="title desc">
<title id="title">Field and equipotential lines between two metal plates</title>
<desc id="desc">Plate A on the left is positive at 100 V and plate B on the right is negative at 0 V. Blue field lines run straight across from A to B, evenly spaced, and bow outward at the ends. Green equipotential lines at 75 V, 50 V and 25 V are straight, evenly spaced, and parallel to the plates, crossing the field lines at right angles.</desc>
