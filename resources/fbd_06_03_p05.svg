<line x1="200" y1="200" x2="200" y2="229" stroke="#b03a2e" stroke-width="3.5"/><polygon points="200,240 194.96,228 205.04,228" fill="#b03a2e"/>
<line x1="270" y1="305" x2="304" y2="305" stroke="#1e8449" stroke-width="3"/><polygon points="315,305 303,310.04 303,299.96" fill="#1e8449"/>
<circle cx="200" cy="200" r="6" fill="#1f3a5f"/>
