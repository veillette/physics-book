<line x1="227.23" y1="347.99" x2="144.41" y2="38.9" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M 257.96 184.47 A 60 60 0 0 0 200 140" fill="none" stroke="#222222" stroke-width="1.5"/>
