<title id="title">Sketch of the forward pass</title>
<desc id="desc">Axes with +x horizontal downfield and +y up, origin at the release point, fixed to the ground. The ball leaves at unknown speed v_0 at 25.0° above +x (relative to the ground) and is caught at the same height at (18.0 m, 0). Its maximum height h above the release point is unknown. The quarterback himself moves backward, in −x, at 2.00 m/s. The acceleration is a_y = −9.80 m/s², a_x = 0.</desc>
