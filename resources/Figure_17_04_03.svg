<svg xmlns="http://www.w3.org/2000/svg" width="700" height="450" viewBox="0 0 700 450" role="img" aria-labelledby="title desc">
<title id="title">Sound waves from a moving source</title>
<desc id="desc">A car drives to the right between two observers, X on the left and Y on the right. Its horn emitted a sound wave at each of the numbered points 1 to 5, and each wave spreads out as a circle centered on the point where it was emitted. The car has since moved on, so the circles are crowded together ahead of it, toward Y, and spread apart behind it, toward X. Y hears a shorter wavelength and a higher frequency, X a longer wavelength and a lower frequency. Faded copies of the car show where it was earlier.</desc>
