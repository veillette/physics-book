<title id="title">Sketch of the bumper car hitting the side rail</title>
<desc id="desc">A horizontal +x axis points toward the rail, the bumper car’s initial direction of motion. Before: v_i = +2.80 m/s. During the 0.200-s contact the rail pushes on the car with F = 4000 N along −x. After: the velocity v_f is unknown (it turns out negative, away from the rail).</desc>
