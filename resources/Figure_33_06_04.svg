<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">Unification of the forces at high energy</title>
<desc id="desc">A schematic of the relative strengths of the four forces versus energy on a logarithmic scale. The electromagnetic and weak forces merge into the electroweak force near 100 GeV. The electroweak and strong forces are proposed to merge (GUT) near 10^15 GeV, and all four, including gravity, might merge (TOE) near 10^19 GeV.</desc>
