<title id="title">Tension components for the tightrope walker</title>
<desc id="desc">Left: the tension TL in the left part of the wire points 5.0° above the −x direction and has components TLx (left) and TLy (up); the tension TR points 5.0° above the +x direction and has components TRx (right) and TRy (up). Right: the free-body diagram of the walker with TLx left, TRx right, TLy and TRy up and the weight W down; the net force in x and in y is zero.</desc>
