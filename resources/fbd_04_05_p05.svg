<svg xmlns="http://www.w3.org/2000/svg" width="460" height="300" viewBox="0 0 460 300" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the point where the perpendicular force is applied</title>
<desc id="desc">Free-body diagram with +x to the right and +y up: two tensions T, one up and to the left and one up and to the right, each at angle theta above the horizontal, with dashed components T cos theta along the x-axis and T sin theta along +y; the applied force F perpendicular points straight down. a = 0.</desc>
