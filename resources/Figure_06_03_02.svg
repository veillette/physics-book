<text x="535" y="393.4" font-family="'Times New Roman', Times, serif" font-size="24" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">f</tspan><tspan font-style="normal"> = </tspan><tspan font-style="italic">F</tspan><tspan font-size="16.8" dy="6.72"><tspan font-style="normal">c</tspan></tspan><tspan dy="-6.72">​</tspan><tspan font-style="normal"> ≤ </tspan><tspan font-style="italic">μ</tspan><tspan font-size="16.8" dy="6.72"><tspan font-style="normal">s</tspan></tspan><tspan dy="-6.72">​</tspan><tspan font-style="normal"> </tspan><tspan font-style="italic">N</tspan></text>
