<polygon points="152,245 248,245 234,221 166,221" fill="#c1dce8" stroke="#222222" stroke-width="1.2"/>
<line x1="200" y1="222" x2="200" y2="245" stroke="#222222" stroke-width="1.2"/>
<polygon points="145,257 157,257 157,275 145,275" fill="#f4ad93" stroke="#222222" stroke-width="1"/>
<polygon points="243,257 255,257 255,275 243,275" fill="#f4ad93" stroke="#222222" stroke-width="1"/>
<polygon points="133,280 267,280 267,288 133,288" fill="#cccccc" stroke="#222222" stroke-width="1"/>
<polygon points="185,262 215,262 215,276 185,276" fill="#f5e3bc" stroke="#222222" stroke-width="1"/>
<line x1="45" y1="310" x2="345" y2="310" stroke="#222222" stroke-width="3"/>
