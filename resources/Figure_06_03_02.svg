<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
<title id="title">Car turning left on level ground</title>
<desc id="desc">Rear view of a car turning left. Normal force balances weight; static friction points left, toward the turn center. The separate free-body diagram shows the same three forces. Static friction is at most μsN.</desc>
