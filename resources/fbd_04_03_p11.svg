<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the accelerating passenger</title>
<desc id="desc">Free-body diagram with +x forward and +y up: seat force F total at angle theta above +x with dashed components Fx along +x and Fy along +y; weight w down; acceleration to the right.</desc>
<rect width="420" height="280" fill="#ffffff"/>
<line x1="30" y1="150" x2="351" y2="150" stroke="#555555" stroke-width="1.5"/><polygon points="360,150 350,154.2 350,145.8" fill="#555555"/>
<line x1="120" y1="255" x2="120" y2="54" stroke="#555555" stroke-width="1.5"/><polygon points="120,45 124.2,55 115.8,55" fill="#555555"/>
<path d="M 190 150 A 70 70 0 0 0 188.64 136.28" fill="none" stroke="#222222" stroke-width="1.5"/>
<line x1="120" y1="150" x2="284" y2="150" stroke="#c0675e" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="295,150 283,155.04 283,144.96" fill="#c0675e"/>
<line x1="120" y1="150" x2="120" y2="126" stroke="#c0675e" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="120,115 125.04,127 114.96,127" fill="#c0675e"/>
<line x1="120" y1="150" x2="283.76" y2="117.28" stroke="#b03a2e" stroke-width="3.5"/><polygon points="294.55,115.12 283.77,122.42 281.79,112.53" fill="#b03a2e"/>
<line x1="120" y1="150" x2="120" y2="174" stroke="#b03a2e" stroke-width="3.5"/><polygon points="120,185 114.96,173 125.04,173" fill="#b03a2e"/>
<line x1="160" y1="65" x2="199" y2="65" stroke="#1e8449" stroke-width="3"/><polygon points="210,65 198,70.04 198,59.96" fill="#1e8449"/>
<circle cx="120" cy="150" r="6" fill="#1f3a5f"/>
<text x="110" y="174" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="end">passenger</text>
<text x="376" y="156" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="120" y="35" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="281" y="172" font-family="'Times New Roman', Times, serif" font-size="20" fill="#c0675e" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">x</tspan><tspan dy="-6"></tspan></text>
<text x="90" y="126" font-family="'Times New Roman', Times, serif" font-size="20" fill="#c0675e" text-anchor="start" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">y</tspan><tspan dy="-6"></tspan></text>
<text x="280.82" y="97.12" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal" font-size="14" dy="6">total</tspan><tspan dy="-6"></tspan></text>
<text x="132" y="180" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan></text>
<text x="205.58" y="147.83" font-family="'Times New Roman', Times, serif" font-size="18" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">θ</tspan></text>
<text x="196" y="53" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
</svg>
