<svg xmlns="http://www.w3.org/2000/svg" width="470" height="330" viewBox="0 0 470 330" role="img" aria-labelledby="title desc">
<title id="title">Two displacements A and B and their sum R</title>
<desc id="desc">A is 12 m at 20° west of north; B is 20 m at 40° south of west, starting at the head of A. The resultant R runs from the origin to the head of B, at angle θ below the −x axis.</desc>
