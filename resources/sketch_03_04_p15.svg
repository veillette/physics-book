<svg xmlns="http://www.w3.org/2000/svg" width="540" height="220" viewBox="0 0 540 220" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the bullet’s path for a gun sighted at 100 m</title>
<desc id="desc">Axes with +x horizontal toward the target and +y up, origin at the muzzle. The barrel points a small angle θ above +x so that, with v_0 = 275 m/s, the bullet returns to y = 0 at x = 100.0 m. At x = 150.0 m the bullet is at unknown y, below the aiming line. The acceleration is a_y = −9.80 m/s², a_x = 0. Angles and heights are greatly exaggerated.</desc>
