<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" role="img" aria-labelledby="title desc">
<title id="title">Two cars colliding on a frictionless surface</title>
<desc id="desc">Before: car m1 (brown) moves right with velocity v1 and momentum p1, catching up to car m2 (tan) moving right more slowly with velocity v2 and momentum p2. The system of interest (both cars) is circled; net F = 0 and p1 + p2 = ptot. After: m1 moves right more slowly with v1′ and p1′, and m2 moves right faster with v2′ and p2′; p1′ + p2′ = ptot.</desc>
