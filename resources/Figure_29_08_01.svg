<title id="title">Wave properties of an electron and a photon</title>
<desc id="desc">Top: an electron e−, a particle with mass, drawn as a sphere containing a wave, moves at speed v. Bottom: a photon, which has no mass, drawn as a wave packet, moves at the speed of light c. Both have wavelengths and both behave as particles.</desc>
