<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc">
<title id="title">Work as the area under a force graph</title>
<desc id="desc">(a) For a constant force component F cos θ acting over a distance d, the work W = Fd cos θ is the area of the rectangle under the graph. (b) For a varying force, the distance is split into small pieces di; each contributes Wi = (F cos θ)i(ave) di, and the total work W = ΣWi is the total area under the curve.</desc>
