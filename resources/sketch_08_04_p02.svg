<line x1="40" y1="86" x2="480" y2="86" stroke="#8d6e63" stroke-width="2.2"/>
<text x="14" y="30.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">before</tspan></text>
<polygon points="145,86 195,86 195,60 145,60" fill="#d6e4f0" stroke="#1f3a5f" stroke-width="2"/>
<text x="170" y="108.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">satellite</tspan><tspan font-style="normal"> 1</tspan></text>
<line x1="140" y1="44" x2="188.4" y2="44" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="200,44 187.4,49.04 187.4,38.96" fill="#3f8a1e"/>
