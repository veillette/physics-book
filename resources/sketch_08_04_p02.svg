<svg xmlns="http://www.w3.org/2000/svg" width="620" height="284" viewBox="0 0 620 284" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the satellites colliding elastically</title>
<desc id="desc">Frame in which satellite 2 is at rest before the collision. A horizontal +x axis points in the direction satellite 1 approaches. Before: satellite 1 (4.00 × 10³ kg) moves at v_1 = +0.250 m/s and satellite 2 (7.50 × 10³ kg) is at rest. After: the velocities v′_1 and v′_2 are unknown; their difference is the final relative velocity.</desc>
