<title id="title">Parallel wires at the corners of a triangle and a square</title>
<desc id="desc">(a) Three parallel wires seen end on at the corners of an equilateral triangle 10.0 cm on a side. The top wire carries 5.00 A out of the page; the bottom left carries 10.0 A into the page and the bottom right 20.0 A into the page. (b) Four parallel wires at the corners of a square 20.0 cm on a side. The top two each carry 10.0 A out of the page; the bottom two each carry 5.00 A into the page.</desc>
