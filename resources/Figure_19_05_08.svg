<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<title id="title">Ion separation across a cell membrane</title>
<desc id="desc">A curved cell membrane separates the outside of a cell, at left, from the inside, at right. Outside there are many sodium ions, Na+, and chloride ions, Cl−; inside there are many potassium ions, K+, with fewer of the others. The membrane is permeable to K+ and Cl− but not to Na+. K+ diffuses out of the cell and Cl− diffuses in, leaving a layer of positive charge on the outer surface of the membrane and negative charge on the inner surface. The resulting Coulomb force opposes further diffusion: it pushes K+ back in and Cl− back out, and it pulls Na+ inward, which the membrane blocks. A voltage is set up across the membrane.</desc>
