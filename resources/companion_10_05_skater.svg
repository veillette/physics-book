<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">A skater modeled by two rotating masses</title><desc id="desc">Two equal masses are pulled inward symmetrically with negligible external torque. Their moment of inertia decreases and angular speed increases, conserving angular momentum while internal work increases kinetic energy. Animated motion has a static alternative for reduced motion and print.</desc><style>.anim-movie{display:none}@media (prefers-reduced-motion:no-preference){.anim-movie{display:inline}.anim-still{display:none}}#animation-paused:target~.anim-movie{display:none!important}#animation-paused:target~.anim-still{display:inline!important}@media (prefers-reduced-motion:reduce),print{.anim-movie{display:none!important}.anim-still{display:inline!important}}</style><rect width="900" height="380" fill="white"/><defs><clipPath id="animation-diagram-clip"><rect x="20" y="42" width="860" height="282"/></clipPath></defs><g id="animation-paused"/><g class="anim-still"><text x="450" y="27" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222" text-anchor="middle">Skater model: conserve angular momentum</text><g clip-path="url(#animation-diagram-clip)"><circle cx="320" cy="185" r="110" fill="none" stroke="#d6dee4"/><circle cx="320" cy="185" r="15" fill="#222222" opacity="1"/><line x1="368.391" y1="229.327" x2="271.609" y2="140.673" stroke="#222222" stroke-width="5"/><circle cx="271.609" cy="140.673" r="12" fill="#1f77c8" opacity="1"/><circle cx="368.391" cy="229.327" r="12" fill="#1f77c8" opacity="1"/><text x="650" y="100" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222" text-anchor="middle">Top view: two masses pulled inward</text><text x="650" y="150" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222" text-anchor="middle">I decreases; ω increases.</text><text x="650" y="205" font-family="Arial, Helvetic