<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title id="title">Velocity and acceleration along a projectile’s path</title>
<desc id="desc">A projectile launched at 20 m/s and 53° above level ground. At five instants the velocity is drawn with its components: the horizontal component is always 12 m/s, while the vertical component goes from +16 m/s at launch to 0 at the top and −16 m/s at landing. The speed is smallest at the top (12 m/s) and largest at launch and landing (20 m/s). The acceleration is g = 9.80 m/s² straight down at every point.</desc>
