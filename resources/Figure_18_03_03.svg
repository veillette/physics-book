<svg xmlns="http://www.w3.org/2000/svg" width="320" height="340" viewBox="0 0 320 340" role="img" aria-labelledby="title desc">
<title id="title">Charge separation in a water molecule</title>
<desc id="desc">The outer electron cloud of a neutral water molecule, shaded, is concentrated around the oxygen atom. The oxygen carries a net charge −2q and each hydrogen a net charge +q; the two O–H bonds make an angle of 104°. Water is therefore a polar molecule.</desc>
