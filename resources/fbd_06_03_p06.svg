<svg xmlns="http://www.w3.org/2000/svg" width="400" height="330" viewBox="0 0 400 330" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the bicycle and rider in a turn</title>
<desc id="desc">Free-body diagram with +x horizontally toward the center of the turn and +y up: normal force N up, friction f along +x toward the center, weight w down. The total ground force F, the sum of N and f, lies along the dashed line tilted theta from the vertical. The acceleration points toward the center.</desc>
<rect width="400" height="330" fill="#ffffff"/>
<line x1="40" y1="180" x2="351" y2="180" stroke="#555555" stroke-width="1.5"/><polygon points="360,180 350,184.2 350,175.8" fill="#555555"/>
<line x1="160" y1="310" x2="160" y2="59" stroke="#555555" stroke-width="1.5"/><polygon points="160,50 164.2,60 155.8,60" fill="#555555"/>
<line x1="160" y1="180" x2="221.25" y2="55" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M 184.2 130.61 A 55 55 0 0 0 160 125" fill="none" stroke="#222222" stroke-width="1.5"/>
<line x1="160" y1="180" x2="160" y2="91" stroke="#b03a2e" stroke-width="3.5"/><polygon points="160,80 165.04,92 154.96,92" fill="#b03a2e"/>
<line x1="160" y1="180" x2="198" y2="180" stroke="#b03a2e" stroke-width="3.5"/><polygon points="209,180 197,185.04 197,174.96" fill="#b03a2e"/>
<line x1="160" y1="180" x2="160" y2="269" stroke="#b03a2e" stroke-width="3.5"/><polygon points="160,280 154.96,268 165.04,268" fill="#b03a2e"/>
<line x1="240" y1="130" x2="274" y2="130" stroke="#1e8449" stroke-width="3"/><polygon points="285,130 273,135.04 273,124.96" fill="#1e8449"/>
<circle cx="160" cy="180" r="6" fill="#1f3a5f"/>
<text x="150" y="206" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="end">bicycle + rider</text>
<text x="376" y="186" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="160" y="40" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="310" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444444" text-anchor="end">toward center →</text>
<text x="172" y="99" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">N</tspan></text>
<text x="195" y="202" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">f</tspan></text>
<text x="172" y="275" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan></text>
<text x="227.25" y="61" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan font-style="normal"> = </tspan><tspan font-style="italic">N</tspan><tspan font-style="normal"> + </tspan><tspan font-style="italic">f</tspan></text>
<text x="175.81" y="117.41" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">θ</tspan></text>
<text x="271" y="118" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
</svg>
