<svg xmlns="http://www.w3.org/2000/svg" width="320" height="330" viewBox="0 0 320 330" role="img" aria-labelledby="title desc">
<title id="title">Free-body diagram of the gymnast on the trampoline</title>
<desc id="desc">Free-body diagram with +x to the right and +y up: normal force N up, about twice as long as the weight w pointing down; the acceleration points up.</desc>
<rect width="320" height="330" fill="#ffffff"/>
<line x1="40" y1="185" x2="261" y2="185" stroke="#555555" stroke-width="1.5"/><polygon points="270,185 260,189.2 260,180.8" fill="#555555"/>
<line x1="150" y1="305" x2="150" y2="69" stroke="#555555" stroke-width="1.5"/><polygon points="150,60 154.2,70 145.8,70" fill="#555555"/>
<line x1="150" y1="185" x2="150" y2="91" stroke="#b03a2e" stroke-width="3.5"/><polygon points="150,80 155.04,92 144.96,92" fill="#b03a2e"/>
<line x1="150" y1="185" x2="150" y2="234" stroke="#b03a2e" stroke-width="3.5"/><polygon points="150,245 144.96,233 155.04,233" fill="#b03a2e"/>
<line x1="80" y1="135" x2="80" y2="101" stroke="#1e8449" stroke-width="3"/><polygon points="80,90 85.04,102 74.96,102" fill="#1e8449"/>
<circle cx="150" cy="185" r="6" fill="#1f3a5f"/>
<text x="160" y="207" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a5f" text-anchor="start">gymnast</text>
<text x="286" y="191" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="150" y="50" font-family="'Times New Roman', Times, serif" font-size="18" fill="#555555" text-anchor="middle" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">y</tspan></text>
<text x="162" y="99" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">N</tspan></text>
<text x="162" y="240" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="start" xml:space="preserve"><tspan font-style="italic">w</tspan></text>
<text x="92" y="109" font-family="'Times New Roman', Times, serif" font-size="20" fill="#1e8449" text-anchor="start" xml:space="preserve"><tspan font-style="italic">a</tspan></text>
</svg>
