<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
<title id="title">R2 and R3 in parallel, in series with R1</title>
<desc id="desc">A 12.0 V source on the left drives current I through R1 = 1.00 ohm on the top wire. The current then splits into I2 through R2 = 6.00 ohms and I3 through R3 = 13.0 ohms, which are in parallel on the right. The voltage V1 across R1 and the voltage Vp = V − V1 across the parallel pair are unknown.</desc>
