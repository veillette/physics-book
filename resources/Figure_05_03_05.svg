<svg xmlns="http://www.w3.org/2000/svg" width="595" height="400" viewBox="0 0 595 400" role="img" aria-labelledby="title desc">
<title id="title">Tensile stress versus strain for a mammalian tendon</title>
<desc id="desc">Tensile stress increases gradually with strain in the toe region, then proportionally in the linear region. In the failure region the stress peaks and falls as fibers tear.</desc>
<rect width="595" height="400" fill="#ffffff"/>
<line x1="58" y1="315" x2="520" y2="315" stroke="#222222" stroke-width="2"/>
<line x1="58" y1="315" x2="58" y2="10" stroke="#222222" stroke-width="2"/>
<text x="22" y="181.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#222222" text-anchor="middle" transform="rotate(-90 22 175)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Tensile</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">stress</tspan></text>
<text x="520" y="320.3" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Strain</tspan></text>
<path d="M 58 315 C 123 315 164 297 196 263 L 370 82 C 390 60 413 51 440 91 C 466 129 499 195 540 200" fill="none" stroke="#222222" stroke-width="3.5" stroke-linejoin="round"/>
<line x1="196" y1="263" x2="196" y2="315" stroke="#222222" stroke-width="2.5" stroke-dasharray="3 3"/>
<line x1="370" y1="82" x2="370" y2="315" stroke="#222222" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="125" y="354.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Toe</tspan></text>
<text x="125" y="380.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">region</tspan></text>
<text x="282" y="361.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Linear</tspan></text>
<text x="282" y="387.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">region</tspan></text>
<text x="440" y="354.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Failure</tspan></text>
<text x="440" y="380.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">region</tspan></text>
</svg>
