<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" role="img" aria-labelledby="title desc">
<title id="title">Stretch versus force for a mammalian tendon</title>
<desc id="desc">In the toe region the tendon stretches easily; in the linear region ΔL grows in proportion to F; in the failure region the curve peaks and falls as fibers tear.</desc>
