<text x="525" y="359" font-family="'Times New Roman', Times, serif" font-size="20" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">F</tspan></text>
<path d="M 58 315 C 68.8 311.25 109.3 297.8 130 290 C 150.7 282.2 172 281 196 263 C 220 245 263.9 197.15 290 170 C 316.1 142.85 353.5 97.45 370 82 C 386.5 66.55 386.5 58.3 400 67 C 413.5 75.7 443.5 119.6 460 140 C 476.5 160.4 498 194 510 203 C 522 212 535.5 200.45 540 200" fill="none" stroke="#222222" stroke-width="3.5" stroke-linejoin="round"/>
<line x1="196" y1="263" x2="196" y2="315" stroke="#222222" stroke-width="2.5" stroke-dasharray="3 3"/>
<line x1="370" y1="82" x2="370" y2="315" stroke="#222222" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="125" y="354.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Toe</tspan></text>
<text x="125" y="380.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">region</tspan></text>
<text x="282" y="361.65" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">Linear</tspan></text>
