<svg xmlns="http://www.w3.org/2000/svg" width="620" height="284" viewBox="0 0 620 284" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the puck bouncing off the goalie</title>
<desc id="desc">A horizontal +x axis points in the puck’s initial direction, toward the goalie. Before: the puck (0.150 kg) moves at v_1 = +35.0 m/s and the goalie (70.0 kg) is at rest. After the elastic collision the puck rebounds (v′_1 negative) and the goalie moves along +x; both velocities are unknown.</desc>
<rect width="620" height="284" fill="#ffffff"/>
<line x1="40" y1="86" x2="480" y2="86" stroke="#8d6e63" stroke-width="2.2"/>
<text x="14" y="30.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">before</tspan></text>
<circle cx="160" cy="79" r="6" fill="#1f3a5f"/>
<text x="160" y="108.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">puck</tspan></text>
<line x1="120" y1="44" x2="188.4" y2="44" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="200,44 187.4,49.04 187.4,38.96" fill="#3f8a1e"/>
<text x="160" y="31.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">1</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = +35.0 </tspan><tspan font-style="normal">m/s</tspan></text>
<polygon points="360,86 400,86 400,60 360,60" fill="#d6e4f0" stroke="#1f3a5f" stroke-width="2"/>
<text x="380" y="108.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">goalie</tspan></text>
<text x="380" y="45.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">2</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = 0</tspan></text>
<line x1="40" y1="198" x2="480" y2="198" stroke="#8d6e63" stroke-width="2.2"/>
<text x="14" y="142.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">after</tspan></text>
<circle cx="260" cy="191" r="6" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<text x="260" y="220.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">puck</tspan></text>
<line x1="300" y1="156" x2="231.6" y2="156" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="220,156 232.6,150.96 232.6,161.04" fill="#3f8a1e"/>
<text x="260" y="143.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-style="normal">′</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">1</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = ?</tspan></text>
<polygon points="370,198 410,198 410,172 370,172" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
<text x="390" y="220.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">goalie</tspan></text>
<line x1="378" y1="156" x2="390.4" y2="156" stroke="#3f8a1e" stroke-width="3"/>
<polygon points="402,156 389.4,161.04 389.4,150.96" fill="#3f8a1e"/>
<text x="390" y="143.6" font-family="'Times New Roman', Times, serif" font-size="16" fill="#3f8a1e" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="italic">v</tspan><tspan font-style="normal">′</tspan><tspan font-size="11.2" dy="4.48"><tspan font-style="normal">2</tspan></tspan><tspan dy="-4.48">​</tspan><tspan font-style="normal"> = ?</tspan></text>
<line x1="40" y1="244" x2="460" y2="244" stroke="#555555" stroke-width="1.6"/>
<polygon points="470,244 459,248.4 459,239.6" fill="#555555"/>
<text x="478" y="249.95" font-family="'Times New Roman', Times, serif" font-size="17" fill="#555555" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">+</tspan><tspan font-style="italic">x</tspan></text>
<text x="478" y="266.38" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444444" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">toward</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">the</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">goalie</tspan><tspan font-style="normal">)</tspan></text>
</svg>
