<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
<title id="title">Forces between two current loops</title>
<desc id="desc">Side view of two horizontal current loops, one above the other. Left: both currents circulate in the same direction; facing segments carry parallel currents and attract, and each loop’s north face (on top) faces the other loop’s south face. Right: currents in opposite directions; facing segments carry antiparallel currents and repel, and the loops’ like poles face each other.</desc>
