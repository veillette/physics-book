<ellipse cx="200" cy="260" rx="110" ry="28" fill="none" stroke="#b8860b" stroke-width="4"/>
<line x1="186" y1="288" x2="203" y2="288" stroke="#1f77c8" stroke-width="3"/>
<polygon points="214,288 202,292.8 202,283.2" fill="#1f77c8"/>
