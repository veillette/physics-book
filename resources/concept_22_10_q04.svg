<text x="12" y="29.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-style="normal">(</tspan><tspan font-style="normal">a</tspan><tspan font-style="normal">) </tspan><tspan font-style="normal">Same</tspan><tspan font-style="normal"> </tspan><tspan font-style="normal">direction</tspan><tspan font-style="normal">: </tspan><tspan font-style="normal">attract</tspan></text>
<ellipse cx="200" cy="110" rx="110" ry="28" fill="none" stroke="#b8860b" stroke-width="4"/>
<line x1="186" y1="138" x2="203" y2="138" stroke="#1f77c8" stroke-width="3"/>
<polygon points="214,138 202,142.8 202,133.2" fill="#1f77c8"/>
