<title id="title">Three parallel wires</title>
<desc id="desc">Three long parallel wires run diagonally across the page. The outer wires carry currents I1 and I3 in opposite directions: I1 toward the lower left and I3 toward the upper right. The middle wire carries current I2, whose direction is not shown.</desc>
