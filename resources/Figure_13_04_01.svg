<text x="177.04" y="211.39" font-family="'Times New Roman', Times, serif" font-size="22" fill="#222222" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" xml:space="preserve"><tspan font-weight="bold" font-style="normal">v<tspan font-size="13.64" font-weight="normal" dx="-12.32" dy="-11.44">→</tspan><tspan dx="-1.32" dy="11.44">​</tspan></tspan><tspan font-style="normal">′</tspan></text>
