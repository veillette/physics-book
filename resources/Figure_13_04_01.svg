<line x1="160.92" y1="243.12" x2="260.74" y2="301.08" stroke="#222222" stroke-width="1.8" stroke-dasharray="7 5"/>
<line x1="139.22" y1="230.52" x2="160.92" y2="243.12" stroke="#222222" stroke-width="1.8"/>
<line x1="227.14" y1="362.26" x2="167.24" y2="254.48" stroke="#7ab32e" stroke-width="2.6"/>
<polygon points="160.92,243.12 172.62,252.64 162.83,258.08" fill="#7ab32e"/>
