<svg xmlns="http://www.w3.org/2000/svg" width="340" height="520" viewBox="0 0 340 520" role="img" aria-labelledby="title desc">
<title id="title">A molecule colliding with a wall</title>
<desc id="desc">A wall seen at an angle. A molecule with velocity v strikes it and leaves with velocity v′: the component of its velocity perpendicular to the wall (the dashed normal) is reversed, while the component along the wall is unchanged. The molecule exerts a force F on the wall, pointing into it.</desc>
