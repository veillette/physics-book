<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="316" viewBox="0 0 1150 316" role="img" aria-labelledby="title desc">
<title id="title">Tire pressure, air, and temperature</title>
<desc id="desc">Three pairs of before-and-after tires, each with a pressure gauge. (a) Adding air to a flat tire inflates it, but the gauge rises only from zero to slightly above zero. (b) Adding air to an inflated tire raises the pressure from half scale to three-quarters. (c) Raising the temperature of an inflated tire raises its pressure from three-quarters to nearly full scale.</desc>
