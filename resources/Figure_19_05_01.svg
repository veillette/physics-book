<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1190" viewBox="0 0 620 1190" role="img" aria-labelledby="title desc">
<title id="title">A parallel-plate capacitor and a rolled capacitor</title>
<desc id="desc">(a) Two tall metal plates of area A stand a distance d apart. Wires connect the left plate to the battery’s positive terminal and the right plate to its negative terminal, so the plates carry charges +Q and −Q. (b) A rolled capacitor: two conducting sheets with insulating gaps between them are wound into a spiral. The outer sheet is wired to the positive terminal and carries +Q; the inner sheet is wired to the negative terminal and carries −Q.</desc>
