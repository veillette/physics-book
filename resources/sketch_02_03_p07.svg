<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
<title id="title">Sketch of the trip from home to the university</title>
<desc id="desc">Axes with +x east and +y north, origin at home. The road (dashed) is 12.0 km long; the straight-line displacement Δx (red) from home to the university is 10.3 km at 25.0° south of east, that is, 25.0° below the +x axis. The return trip ends back at the origin, so the round-trip displacement is zero.</desc>
