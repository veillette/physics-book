<svg xmlns="http://www.w3.org/2000/svg" width="760" height="850" viewBox="0 0 760 850" role="img" aria-labelledby="title desc">
<title id="title">An elastic one-dimensional two-object collision</title>
<desc id="desc">Before: on a frictionless surface, block m1 moves right with velocity v1 and catches up with the larger block m2, which moves right more slowly with velocity v2. Net F = 0 and p1 + p2 = ptot. After: m1 moves left with velocity v1′ and m2 moves right with velocity v2′; p1′ + p2′ = ptot. The collision is elastic, so KE1′ + KE2′ = KE1 + KE2. The arrows are drawn to scale for m2 = 3m1 with v1 = 4 units and v2 = 0.5 unit, which gives v1′ = −1.25 units and v2′ = 2.25 units. Each panel is circled as the system of interest.</desc>
